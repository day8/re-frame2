  jvm-migration-v1-codemod:
    name: JVM migration/from-re-frame-v1/codemod (clojure -M:test)
    needs: detect_changed_surfaces
    if: needs.detect_changed_surfaces.outputs.migration_v1_codemod == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: migration/from-re-frame-v1/codemod
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Clojure CLI
        run: "$GITHUB_WORKSPACE/.github/scripts/install-clojure-cli.sh"

      - name: Cache Maven / gitlibs
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          # No salt is needed to separate the two aliases — one deps.edn
          # declares both, so one cache entry serves both steps. But the
          # `:integration` alias reaches implementation/core through a
          # :local/root, and THAT artefact's own deps are not in this hash:
          # without the second file the key would go stale whenever core's
          # dependencies move, silently restoring a cache that lacks them
          # (rf2-36u96).
          key: ${{ runner.os }}-clj-migration-v1-codemod-${{ hashFiles('migration/from-re-frame-v1/codemod/deps.edn', 'implementation/core/deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-clj-migration-v1-codemod-
            ${{ runner.os }}-clj-

      # rf2-0qzh — the v1 `reg-event-db/-fx/-ctx` → `reg-event` codemod
      # (EP-0018 Slice E): 45 tests, 158 assertions, and the FIRST lane this
      # artefact has ever had. Measured on main before this change, the string
      # `from-re-frame-v1` appeared zero times in this workflow, in
      # .github/scripts/report-changed-surfaces.sh and in
      # scripts/test-jvm-tools.sh, so a codemod-only diff classified to no
      # surface and merged green having executed none of its own tests.
      # `migration/**` does reach docs.yml, but that workflow stages the tree
      # into the site and runs not one line of it.
      #
      # The suite is pure JVM — rewrite-clj over source text, no re-frame2
      # runtime, no npm, no browser — so this is the whole gate, and it is
      # seconds. What it protects is a REWRITER that edits a consumer's own
      # source in place: `rewrite-file!` is the entry the atomic-flip slice
      # calls corpus-wide, and its conservatism — what it declines to touch,
      # and the formatting and comments it must preserve — is exactly the
      # property that has no other witness anywhere in this repo.
      - name: Run JVM tests (from-re-frame-v1 codemod artefact)
        run: clojure -M:test

      # rf2-36u96 — the `:integration` alias landed with rf2-8odvg's chain
      # normalization and was then invoked by NOTHING: not this workflow, not
      # scripts/test-jvm-tools.sh. The PR that added it therefore ran only
      # `clojure -M:test`, leaving the artefact's one runtime proof orphaned.
      #
      # What that proof holds is the half `:test` structurally cannot: `:test`
      # keeps re-frame2 off its classpath on purpose (self-containment, so the
      # codemod runs on a bare JVM against any v1 corpus), which means it can
      # only assert the SHAPE of the emitted text. `:integration` pulls
      # implementation/core via :local/root and evaluates that text against the
      # real v2 `reg-event` contract at namespace load — plus four negative
      # controls (`:rf.error/path-removed`, `/reg-event-bad-middle-slot`,
      # `/inline-interceptor-removed`, `/unregistered-interceptor`) that prove
      # the harness observes registration rather than parsing. A codemod whose
      # output the target rejects is exactly the failure rf2-8odvg was filed
      # for, and shape alone cannot see it.
      #
      # Kept a SEPARATE invocation from the step above so `:test`'s
      # self-contained classpath stays pinned by an actual run of it.
      - name: Run JVM integration tests (emitted output vs. the real v2 reg-event contract)
        run: clojure -M:integration

  node-ssr-node:
    name: Node implementation/ssr-node (bounded SSR service suite)
    # UNCONDITIONAL, and that is the fix rather than a relaxation — rf2-8arzr.9.
    #
    # This job was armed off `ssr_node`, which classifies `implementation/
    # ssr-node/**`. But the suite's absence.test.cjs makes claims about the
    # WHOLE repository — it walks `git ls-files` over implementation/,
    # examples/, tools/, scripts/ and .github/ and requires that nothing out
    # there names this package at a loader position or spells its refusal
    # vocabulary. A control armed only by its own directory cannot catch its
    # own case, and it did not: three commits touching hicasso and the login
    # example broke two rows in five files, the job was skipped on the PR that
    # broke it and on every branch after, and main sat red for days with no
    # signal anywhere. The first branch to arm the job was one editing the
    # classifier, which arms everything.
    #
    # Arming it on the surfaces the witness reads would mean arming it on
    # nearly the whole repo, so run it always. That costs what the comment
    # below already establishes: no `npm ci`, no build, no browser, seconds of
    # ubuntu time. `js-harness-self-tests` — the job this one's steps already
    # cite as the same posture — is ungated for the same reason, as are
    # `verify-readme-links` and `beads-pr-boundary`.
    #
    # `ssr_node` is NOT dead: `jvm-node-crossing` still arms on it.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: implementation
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '24'

      # rf2-n8vp — the ssr-node package's suite (73 rows across 7 files when
      # this lane landed; 104 rows across 9 files at rf2-8arzr.4, after
      # rf2-hic-056's follow-ups and slice B's serve.test.cjs — test/run.cjs
      # lists them, and these counts are a record, not a pin), and the FIRST
      # lane this artefact has ever had. It landed (PR #8028) with no npm script
      # and no job: `ssr-node` appeared in neither implementation/package.json
      # nor .github/workflows/, so the five bounded guarantees the package was
      # built to hold — per-request state isolation, fail-closed allowlists, one
      # in-flight render per isolate, timeout plus hard termination, and a
      # pre-registered latency envelope — were claims rather than gates.
      #
      # NO `npm ci`, and that is the point rather than an omission. The package
      # is plain CommonJS on `node:` builtins and declares no npm dependency of
      # its own (absence.test.cjs asserts it, alongside the absence of any
      # shadow-cljs build or classpath entry reaching the tree), so `npm run`
      # needs nothing installed to execute the runner. Same posture as
      # `js-harness-self-tests` one job over. That is what makes this lane cheap
      # enough to be armed on its own surface: seconds, no build, no browser.
      #
      # The runner spawns each suite in its OWN process, so the exit code below
      # is an aggregate of real exit codes rather than an in-process tally, and
      # a leaked worker thread in one file cannot turn the next file's clean
      # failure into a hang. Its HTTP rows bind port 0 and let the OS pick, so
      # this job reserves no port and cannot collide with a concurrent lane.
      - name: Run the ssr-node suite
        run: npm run test:ssr-node

  node-test-tools-re-frame2-pair-mcp:
    name: Node tools/re-frame2-pair-mcp (shadow-cljs :server-test)
    needs: detect_changed_surfaces
    if: needs.detect_changed_surfaces.outputs.mcp_conformance == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tools/re-frame2-pair-mcp
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Clojure CLI
        run: "$GITHUB_WORKSPACE/.github/scripts/install-clojure-cli.sh"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '24'

      - name: Cache Maven / gitlibs (shadow-cljs deps)
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: ${{ runner.os }}-cljs-tools-re-frame2-pair-mcp-${{ hashFiles('tools/re-frame2-pair-mcp/shadow-cljs.edn', 'tools/re-frame2-pair-mcp/package.json') }}
          restore-keys: |
            ${{ runner.os }}-cljs-tools-re-frame2-pair-mcp-
            ${{ runner.os }}-cljs-

      - name: npm install
        run: npm install

      # tools/re-frame2-pair-mcp ships as a Node binary on npm; its sources are
      # CLJS compiled via shadow-cljs to a self-contained Node script.
      # The artefact is NOT on implementation/shadow-cljs.edn's
      # `:source-paths`, so the consolidated `:node-test` build does
      # not see it. The canonical test entry-point is `npm test`, which
      # compiles the `:server-test` build (shadow-cljs.edn) and runs
      # `out/server-test.js` under Node. The test suite covers the
      # bencode framing helpers (`nrepl_test`), the snapshot reader
      # (`snapshot_test`), and the pull-mode watch surface
      # (`watch_epochs_test`, `watch_until_test`).
      - name: Run shadow-cljs :server-test (tools/re-frame2-pair-mcp artefact)
        run: npm test

      # MCP tool-descriptor manifest drift-check (rf2-sofwv). Compiles the
      # `:descriptor-gen` build and regenerates the committed
      # `tool-descriptors.edn` in memory from the live tool registry,
      # FAILING if it differs. Adding / removing / renaming a re-frame2-pair-mcp
      # tool — or changing a tool's input-key / output? / annotations
      # surface — turns this red until the manifest is regenerated
      # (`npm run gen:descriptors`). Pair-mcp's registry is CLJS-only so
      # the check runs under Node (reuses this job's warmed shadow-cljs);
      # same generate-then-drift-check shape as the api-manifest keystone
      # (rf2-3nbl5.2) + story-mcp's JVM sibling check.
      - name: Assert tool-descriptors.edn matches the registry
        run: npm run check:descriptors

      # stdin-EOF lifecycle regression (rf2-j538f7.32). Compiles the SHIPPED
      # `:server` bundle and drives it over real stdio against a self-contained
      # fake bencode nREPL: a completed app-facing tool opens an idle nREPL
      # socket, then closing stdin must close that socket AND exit the process
      # 0 — with NO out-of-band kill. This is the canonical CI grader for the
      # documented `stdin EOF -> nREPL close -> process exit` contract
      # (spec/001-Wire-Protocol.md, server.cljs lifecycle step 6); the pre-fix
      # server left an orphan process + a live nREPL socket here. The harness
      # is hermetic (no live shadow-cljs), so it runs on both Ubuntu and
      # Windows runners without extra infra.
      - name: Compile re-frame2-pair-mcp server bundle (shadow-cljs :server)
        run: npm run build

      - name: Run stdin-EOF shutdown regression (tools/re-frame2-pair-mcp artefact)
        run: npm run test:stdin-eof-shutdown

