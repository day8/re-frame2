  cljs:
    name: CLJS (shadow-cljs :node-test)
    # rf2-f79t8 — job-level gating (NOT a workflow-trigger path filter:
    # the pull_request trigger stays unfiltered so the
    # `All required checks passed` aggregator is always present). The
    # consolidated :node-test build compiles core + every adapter + every
    # per-feature artefact PLUS the tools/{story,xray}/{src,test} CLJS
    # test trees (shadow-cljs.edn :source-paths). `cljs_node_test` fires
    # on any of those surfaces (and on the build config / fixtures); it is
    # false only on a spec/docs-only PR, where this job skips. The
    # aggregator treats a surface-skip as OK and the nightly full matrix
    # is the safety net.
    needs: detect_changed_surfaces
    if: needs.detect_changed_surfaces.outputs.cljs_node_test == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: implementation
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Clojure CLI
        run: "$GITHUB_WORKSPACE/.github/scripts/install-clojure-cli.sh"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: implementation/package-lock.json

      - name: Cache Maven / gitlibs (shadow-cljs deps)
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: ${{ runner.os }}-cljs-${{ hashFiles('implementation/shadow-cljs.edn', 'implementation/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-cljs-

      # For the Hicasso invariants gate below — pure Python stdlib, no
      # requirements.txt install. Same pinned action and same interpreter
      # version as the two other python-running jobs in this workflow.
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'

      - name: npm install
        run: npm ci

      # THE HICASSO INVARIANTS GATE (rf2-8a6s). rf2-hic-001 established
      # implementation/hicasso/ by copying the measured prototype out of the
      # benchmark tree with namespaces renamed and nothing else changed, and
      # `frozen-sources.edn` pins each donor file by digest so that sentence
      # stays checkable. Until now the check was run BY HAND — the same shape
      # as the bench-lane compile below before rf2-2rtt6.73, and the same
      # failure: a divergence nobody ran the gate for is a divergence nobody
      # notices, and Wave B builds on the false sentence.
      #
      # Two properties, both silent when they break: FROZEN (every donor file
      # still hashes to its pinned digest, every package file the copy
      # produced is still present) and SEALED (nothing under
      # implementation/hicasso/ `:require`s a benchmark-tree namespace, which
      # would make the shipped package depend on a test tree).
      #
      # The step now chains two further static reads of the same artefact, which
      # is why it is no longer called the freeze gate (rf2-ibje): the optional-
      # module reachability check (nothing optional is reachable from the public
      # door) and the complaint-catalogue round trip (rf2-hic-021 — every live
      # diagnostic id is rowed, every reserved spelling is unbuilt). All three
      # are sub-second pure-Python invariants over implementation/hicasso/**,
      # they share this job's one input surface, and a separate npm script for
      # each would need either another workflow step or a declared scheduling
      # hole for the gain of nothing.
      #
      # Hosted in THIS job because its two input surfaces —
      # implementation/hicasso/** (rf2-8a6s's new classifier case) and the
      # freehand bench tree that is the donor — both arm `cljs_node_test` and
      # nothing else in common; it is the same reasoning that put the
      # bench-lane compile here. Early, before the ~10-minute compile: it is a
      # sub-second static read and a divergence should red fast.
      - name: Hicasso invariants gate
        run: npm run test:hicasso-invariants

      - name: Compile and run node-test build (core + reagent)
        run: |
          npx shadow-cljs compile node-test
          node out/node-test.js

      # The consolidated build above intentionally loads every adapter's own
      # tests, so it cannot prove the first-party UI artefact is isolated from
      # the adapter artefacts (all first-class; re-frame.ui ships alongside
      # them per EP-0030). Compile only the focused re-frame.ui closure
      # and inspect Shadow's exact import manifest instead.
      - name: re-frame.ui focused adapter-artifact isolation
        if: needs.detect_changed_surfaces.outputs.ui_gates == 'true'
        run: npm run test:ui-isolation

      # Per-namespace test-isolation gate (rf2-32siq3.44). The consolidated
      # node-test bundle shares ONE runtime, so a test ns whose fixture forgets
      # to install its own substrate adapter is masked: it passes whenever a
      # sibling left an adapter installed (suite ORDERING hides a
      # self-incomplete fixture). This step re-runs the curated EP-0023
      # image/frame runtime-construction namespaces EACH ALONE — a fixture
      # leaning on bundle pollution goes red standalone. Reuses the bundle the
      # step above just compiled (no --compile).
      - name: Per-namespace test-isolation gate self-test
        run: node scripts/check-per-ns-isolation.cjs --self-test

      - name: Per-namespace test-isolation gate
        run: node scripts/check-per-ns-isolation.cjs

      # Hicasso bench-lane compile coverage (rf2-2rtt6.73). NO PR gate compiled
      # this lane. The `:node-test` build above selects `:ns-regexp
      # "cljs-test$"` plus transitive requires and `:browser-test` selects
      # `-dom-cljs-test$` likewise, and nothing test-shaped requires the bench
      # ARMS — measured on the built bundles, `out/node-test.js` contained zero
      # occurrences of `walk_profile_app` and `out/browser-test/` had no such
      # module. The only compiler that ever saw an arm was `:hicasso-bench`,
      # driven BY HAND through a driver that ALSO passed on warnings, so a
      # broken arm could not go red and a worker mutation-proving a change
      # through the lane proved nothing.
      #
      # The arms are deliberately LOCAL COPIES of shipping code (the
      # rf2-2rtt6.32 call-convention discipline, and it is correct), so they
      # drift by construction and a compile is the cheapest thing that
      # notices. One dev-mode `shadow-cljs compile` of all 100 lane
      # namespaces, ~45s, warnings treated as failures. It rides the lane's
      # existing `:hicasso-bench` id via `--config-merge` — no new build id,
      # so no hot-zone edit to shadow-cljs.edn (HD-017).
      #
      # Hosted HERE rather than in cljs-examples-compile because this job's
      # `cljs_node_test` surface includes implementation/core/*, which
      # `examples_compile` deliberately excludes — and a core change is
      # exactly what breaks a local copy of core's calling convention.
      - name: Hicasso bench-lane compile coverage gate
        run: npm run test:hicasso-compile

      # THE HICASSO RELEASE BUILD (rf2-qy1j). rf2-hic-008 added
      # `:hicasso-release` to shadow-cljs.edn — the artefact's first and only
      # `:advanced` / `goog.DEBUG false` compile, entry `re-frame.hicasso.
      # consumer-app` — and correctly stopped there, because package.json and
      # this file were both held. So the build shipped with no npm script and
      # no job: exactly the shape the bench-lane compile above was in before
      # rf2-2rtt6.73 and the invariants gate before rf2-8a6s, and with the same
      # consequence — Phase 0's claim that a clean consumer's application
      # compiles for production could stop being true on main and nothing
      # would say so.
      #
      # WHAT IT CATCHES THAT NOTHING ELSE HERE DOES. Every other compile of
      # these namespaces in the repo is `:none`: `:node-test`, `:browser-test`
      # and the bench-lane step above all run the ClojureScript compiler and
      # never the Closure one. `:advanced` is where renaming, externs
      # inference and DCE-sensitive interop are decided, and a construct only
      # Closure rejects is invisible to all three. Measured rather than
      # assumed — with one bad `js*` form in `re-frame.hicasso`, the SAME
      # build id under `shadow-cljs compile` completed green (162 files, 0
      # warnings) while `shadow-cljs release` failed with a Closure parse
      # error. The dev lanes were the control and they did not notice.
      #
      # NO NEW SURFACE PREDICATE, DELIBERATELY (the rf2-hic-021 lesson). A
      # job gated on a changed-surface condition is correct exactly until the
      # thing it guards grows one more input, and nothing makes anyone revisit
      # the condition then; that is how the complaint-catalogue gate ended up
      # unreachable from three of its four input families. The build's
      # repo-source inputs are three trees and the build-config trio —
      # implementation/core/** (68 namespaces), implementation/adapters/**
      # (the UIx adapter the entry installs), implementation/hicasso/** (src,
      # plus the `consumer-app` entry under test/), and shadow-cljs.edn /
      # package.json / package-lock.json, which declare the build id and pin
      # the Closure version whose output this is. EVERY one of those already
      # arms `cljs_node_test`, so hosting the build here needs no classifier
      # arm of its own and adds no condition to keep in sync. It also cannot
      # silently outgrow one: a new input can only arrive as a `:require`
      # added to `consumer-app` or to something already on those trees, and
      # every `implementation/*` artefact case in the classifier arms this
      # output too, so the surface widens by construction rather than by
      # somebody remembering to widen it.
      #
      # NOT `cljs_prod`, which is the elision / bundle-probe family. The
      # classifier's `implementation/hicasso/*` arm keeps the package off it
      # in terms, and routing this build there would mean widening that arm —
      # a classifier edit — to reach a build whose every input already arms
      # the job it is standing in.
      #
      # LAST in the job because it is the most expensive step here: 36.8s of
      # Closure measured cold on a Windows laptop, on a runner that has
      # already paid for the JVM, the Maven cache and `npm ci`. The
      # sub-second static reads and the node-test lane above red first.
      - name: Hicasso release build (:advanced, goog.DEBUG false)
        run: npm run build:hicasso-release

  js-harness-self-tests:
