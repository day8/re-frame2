  cljs-perf-bundle:
    name: CLJS perf-flag bundle isolation (Spec 009 §Performance instrumentation, bead rf2-du3i)
    # Spec 009 §Production-elision verification states that "the
    # bundle-isolation contract is enforced in CI by `npm run test:perf-bundle`
    # (the dual of `npm run test:elision`)", and this job is that enforcement:
    # it runs the npm script, whose checker is `scripts/check-perf-bundle.cjs`.
    # A spec that promises enforcement no job delivers is worse than an absent
    # gate: the promise is what stops the next person looking.
    #
    # NOT a duplicate of `cljs-elision` above, which is why this is a job and
    # not a step folded into that one. That pair moves `goog.DEBUG` across the
    # SAME entry (`re-frame.elision-probe/run`) and greps dev-only strings;
    # this pair moves `re-frame.performance/enabled?` — a SEPARATE goog-define
    # — across `counter.core/run` and greps `performance.measure` /
    # `clearMeasures` / `"rf:`. The two sentinel sets are disjoint
    # (check-elision.cjs contains neither perf string), so neither gate can red
    # for the other's reason — and folding them into one job would make
    # one failure indistinguishable from the other in the checks UI.
    #
    # The gate builds TWO `:advanced` bundles of the SAME entry differing only
    # in the perf goog-define, then greps both:
    #   - `:examples/counter`      (`enabled?` at its goog-define default,
    #     false): the three sentinels ABSENT — the `mark-and-measure` bracket
    #     folded to `(do body)` and Closure DCE'd the User-Timing calls, so a
    #     shipped binary with the flag off carries zero instrumentation. This
    #     is the claim the perf channel's entire safety argument rests on; it
    #     is compile-time, so only a bundle grep can check it.
    #   - `:examples/counter-perf` (`enabled? true`): the SAME three PRESENT —
    #     the positive control, so a refactor that MOVED the strings out of the
    #     gated branch reds here instead of turning the negative grep into a
    #     vacuous pass.
    #
    # No browser and no Clojure CLI: two shadow-cljs releases plus a string
    # inspection over the emitted bytes, and shadow-cljs.edn resolves through
    # `:dependencies` rather than `:deps`, so the JDK/Node/Maven trio is enough
    # Measured cold
    # at 75s end to end (30.0s + 13.6s of `:advanced` compile plus dependency
    # resolution), which is why this is per-PR and not nightly.
    #
    # Surface-gated on `cljs_prod`, the SAME output as its dual: the macro
    # under test and its bracket call sites live in `implementation/`, and
    # `shadow-cljs.edn` / `package.json` / `implementation/scripts/*` all arm
    # it — the last of those is where `check-perf-bundle.cjs` lives, so the
    # checker's own teeth cannot be softened while avoiding the job that runs
    # them. The one producer `cljs_prod` does NOT arm is `examples/counter`,
    # which is the entry both bundles compile; the sibling `cljs-bundle-
    # isolation` job has the identical blind spot for the identical reason, so
    # widening it is one classifier change for both gates, not this one's to
    # make.
    needs: detect_changed_surfaces
    if: needs.detect_changed_surfaces.outputs.cljs_prod == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: implementation
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: implementation/package-lock.json

      - name: Cache Maven / gitlibs (shadow-cljs deps)
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: ${{ runner.os }}-cljs-${{ hashFiles('implementation/shadow-cljs.edn', 'implementation/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-cljs-

      - name: npm install
        run: npm ci

      - name: Perf-flag bundle isolation (perf-off bundle + perf-on control)
        run: npm run test:perf-bundle

  cljs-schemas-bundle:
    name: CLJS schemas bundle cost (Spec 010 §Bundle cost, bead rf2-v4o7e)
    # `npm run test:schemas-bundle` — a real gate, with a real checker
    # (`implementation/scripts/check-schemas-bundle.cjs`), that this job
    # schedules, so `scripts/check_gate_scheduling.py` has no hole to declare
    # for it.
    #
    # A MARGIN, NEVER AN ABSOLUTE. Spec 010 §Bundle cost budgets a MARGINAL
    # cost, and an ABSOLUTE gzipped ceiling would measure the wrong quantity:
    # `cljs.core` alone is ~186 KB of the probe's ~494 KB optimized bytes, so
    # an absolute number moves with every unrelated framework change — over
    # one measured span the probe grew 44.8 KB, of which the schemas surface
    # was 1.0 KB and `cljs.core` + `re-frame.core` were 43.8 KB. Any
    # re-baselined absolute would be wrong again within a quarter, so the gate
    # has none.
    #
    # WHAT IT RUNS: two `:advanced` + `goog.DEBUG=false` browser builds
    # differing by EXACTLY ONE require — `schemas-bundle-control`
    # (`[re-frame.core]` only) and `schemas-bundle-probe` (`[re-frame.core]` +
    # `[re-frame.schemas]`) — then asserts the gzipped MARGIN between them,
    # two-sided, against Spec 010's marginal budget. The ceiling catches a
    # namespace off the spec's restrict-to-dev/test list reaching the
    # production path; the FLOOR catches the margin collapsing, which is not a
    # saving but a vacuous probe — and specifically catches the schemas
    # facade require being dropped, whose behavioural owner is the JVM test
    # `schemas/test/re_frame/schemas_implies_validation_test.clj` in the
    # `jvm-schemas` lane. Both directions fire on a planted regression.
    #
    # NOT a duplicate of `cljs-bundle-isolation` or `cljs-perf-bundle`. Those
    # two grep emitted bundles for symbols that must be absent; this one
    # measures bytes and owns ONE quantity — what requiring the schemas
    # artefact costs. Its own job so a schemas-margin failure stays
    # distinguishable from an isolation failure in the checks UI.
    #
    # No browser and no Clojure CLI: two shadow-cljs releases plus a gzip of
    # the emitted bytes, and shadow-cljs.edn resolves through `:dependencies`
    # rather than `:deps`, so the JDK/Node/Maven trio is enough — the same step
    # list as `cljs-perf-bundle` above. Measured cold at 47s,
    # against that sibling's 75s, which is why this is per-PR and not nightly.
    #
    # Surface-gated on `cljs_prod`, like its sibling. All four producers that
    # can move this gate's number arm it: `implementation/schemas/*` (the
    # artefact under measurement), `implementation/shadow-cljs.edn` (both
    # builds), `implementation/package.json` (the script) and
    # `implementation/scripts/*` (the checker itself — so the gate's teeth
    # cannot be softened while avoiding the job that runs them).
    needs: detect_changed_surfaces
    if: needs.detect_changed_surfaces.outputs.cljs_prod == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: implementation
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: implementation/package-lock.json

      - name: Cache Maven / gitlibs (shadow-cljs deps)
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: ${{ runner.os }}-cljs-${{ hashFiles('implementation/shadow-cljs.edn', 'implementation/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-cljs-

      - name: npm install
        run: npm ci

      - name: Schemas bundle cost (core-only control + schemas probe, two-sided margin)
        run: npm run test:schemas-bundle

  cljs-bundle-isolation:
    name: CLJS bundle isolation (counter, rf2-51x5)
    needs: detect_changed_surfaces
    if: needs.detect_changed_surfaces.outputs.bundle_isolation == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: implementation
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: implementation/package-lock.json

      - name: Set up Clojure CLI
        run: "$GITHUB_WORKSPACE/.github/scripts/install-clojure-cli.sh"

      - name: Cache Maven / gitlibs (shadow-cljs deps)
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: ${{ runner.os }}-cljs-bundle-isolation-${{ hashFiles('implementation/shadow-cljs.edn', 'implementation/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-cljs-bundle-isolation-
            ${{ runner.os }}-cljs-

      - name: npm install
        run: npm ci

      # Build the counter example (the canonical no-feature app — it
      # imports zero per-feature artefacts) and grep the produced
      # main.js for each per-feature artefact's internal-only sentinel
      # strings. The contract: every per-feature ns (schemas / machines
      # / routing / flows / http / ssr) must be ABSENT from the counter
      # bundle. A small consumer-side allow-list (the late-bind hook
      # keys / fx-case keys core publishes for each artefact) is
      # tracked with explicit expected-hit counts.
      #
      # If a change re-imports a per-feature namespace
      # into core (or any of core's transitive deps), one of the
      # internal sentinels will appear in the bundle and this step will
      # fail. The dual of cljs-elision (Spec 009) for the per-feature
      # split contract.
      - name: Verify counter bundle isolates every per-feature artefact
        run: npm run test:bundle-isolation

  adapter-testbed-smokes:
