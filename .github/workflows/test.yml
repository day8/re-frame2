        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: ${{ runner.os }}-clj-test-quiet-${{ hashFiles('implementation/test-quiet/deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-clj-test-quiet-
            ${{ runner.os }}-clj-

      - name: Run JVM tests (test-quiet contract suite)
        run: clojure -M:test

  # rf2-ipx7h — the Hicasso artefact's JVM lane, and the CI half of a pin that
  # had a local half only.
  #
  # WHAT IT RUNS is one namespace: `re-frame.bench.hicasso.front.slot-cljs-test`,
  # the `.cljc` EQUIVALENCE PIN for the canonical slot rule (rf2-ani6y).
  # Measured: 3 tests, 92 assertions, ~5s. `front/slot.cljc` has exactly one
  # definition of `prop-name`, so the failure it hunts is not "someone edited
  # one copy" — it is the two ways ONE definition still answers two things: a
  # `#?(:clj … :cljs …)` reader conditional inside the rule or anything it
  # calls, and a host-differing primitive (the JVM's `str/upper-case` consults
  # the platform DEFAULT LOCALE, so a Turkish-locale JVM slots `:aria-index` and
  # `:on-input` differently from every browser). Neither is visible to a single
  # host, so the same corpus is asserted TWICE against that one implementation:
  # once by `npm run test:cljs` in Node, once by `clojure -M:test` here. Running
  # one arm does not halve the coverage, it deletes the mechanism.
  #
  # THE HOLE THIS CLOSES. The pin used to live under `implementation/freehand`,
  # whose JVM lane is rostered and required. rf2-0yp7w re-homed the bench
  # harness into `implementation/hicasso/test/`, which was on neither
  # `scripts/test-jvm-implementation.sh` nor this workflow — so the Node arm
  # kept running on every PR and the JVM arm ran only when somebody typed
  # `clojure -M:test` by hand. The roster entry lands in the same commit as this
  # job because `check_jvm_lane_rosters.py` R1/R2 refuse either half alone.
  #
  # UNCONDITIONAL — no `needs: detect_changed_surfaces`, no `if:` — and the
  # reason is a MEASUREMENT, not the precedent of the three hicasso Python jobs
  # above. `implementation_jvm` is the obvious gate and it is the wrong one
  # twice over:
  #
  #   1. IT DOES NOT COVER THIS LANE'S INPUTS. Probed on this tree, the lane's
  #      own definition — `implementation/hicasso/deps.edn`, which decides
  #      whether the pin is discovered at all — measures implementation_jvm
  #      FALSE, as does `implementation/hicasso/test_kit/src/**`, also on the
  #      `:test` classpath. The two files that DO arm it (`slot_cljs_test.cljc`
  #      and its subject `front/slot.cljc`) arm it only INCIDENTALLY, through
  #      `is_route_path_census_input` — a predicate that exists for the routing
  #      route-path census and matches `implementation/hicasso/test/*` `.cljs`/
  #      `.cljc`. Resting this lane on that predicate means the census's roster
  #      silently owns whether the slot pin is gated.
  #   2. ARMING IT WOULD COST 23 JOBS TO SCHEDULE ONE. Measured on this tree,
  #      22 jobs carry `if: … implementation_jvm == 'true'`. A hicasso-only diff
  #      runs none of them today; arming the artefact root would run all 22 plus
  #      this one, on every diff to the repo's most actively developed tree, to
  #      schedule a five-second lane. Unconditional costs one runner.
  #
  # A new classifier output of its own was the third option and is rejected for
  # the reason the budget-ledger and facade-inventory jobs
  # give at length: the defect being repaired IS a surface gate that did not
  # cover a checker's inputs, so a new arm is a fresh chance to make the same
  # mistake and needs re-widening every time the lane learns to read another
  # file.
  #
  # NOT VACUOUS, AND MECHANICALLY SO. The `:test` alias carries no `--probe`, so
  # it takes the quiet runner's test-count floor: a lane that discovers zero
  # tests REDS rather than passing green. That floor is what makes this job's
  # green a verdict rather than a lane that has quietly stopped selecting
  # anything — the failure mode a `--probe` lane wired to a required job would
  # have manufactured on purpose.
  jvm-hicasso:
    name: JVM hicasso (clojure -M:test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: implementation/hicasso
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Clojure CLI
        run: "$GITHUB_WORKSPACE/.github/scripts/install-clojure-cli.sh"

      - name: Cache Maven / gitlibs
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: ${{ runner.os }}-clj-hicasso-${{ hashFiles('implementation/hicasso/deps.edn', 'implementation/core/deps.edn', 'implementation/test-quiet/deps.edn', 'implementation/adapters/uix/deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-clj-hicasso-
            ${{ runner.os }}-clj-

      - name: Run JVM tests (hicasso artefact — the slot-rule equivalence pin)
        run: clojure -M:test

  # rf2-cujx — the REPO-WIDE SOURCE WALKS that live in
  # `implementation/core/test/` but are not core tests, given a lane whose
  # scheduling does not depend on a read-set model of what they walk.
  #
  # THE STANDING RULE, stated once here rather than built into a checker
  # (rf2-n4a2b). A repo-wide walk parked in `implementation/core/test/` joins
  # this lane as ONE MORE STEP. That is the whole policy. Two walks widened
  # without their arming following in a single day — rf2-2cu7f
  # (impl-source-corpus/src-roots) and rf2-n4a2b — and rf2-6ng7 has already
  # REJECTED a universal input-declaration checker as over-engineering; that
  # rejection stands. The cheap answer is this lane, because a step here has no
  # read-set model to be wrong about.
  #
  # THE HOLE. Each of these suites discovers its inputs by `file-seq` over
  # trees OUTSIDE its own artefact, and every one of them ran only in
  # `jvm-core`, which `implementation_jvm` gates:
  #
  #   no-rf-default-floor-lint-test            walks implementation/**/src AND
  #                                            the sibling tools/**/src tree
  #   egress-chokepoint-conformance-test       impl-source-corpus/src-roots —
  #                                            every src root under
  #                                            implementation/, recursively
  #   error-catalogue-channel-conformance-test the same corpus
  #   warn-once-clear-governance-test          file-seq over implementation/
  #   prod-gate-naming-drift-test              every artefact's test/ tree
  #                                            under implementation/ (rf2-n4a2b)
  #   late-bind-drift-test                     every implementation/**/src file,
  #                                            anchored to a classpath resource
  #                                            (rf2-6ng7)
  #   observation-render-law-drift-test        every TRACKED prose-bearing file
  #                                            in the repo, from `git ls-files`
  #                                            (rf2-6ng7)
  #
  # SIX AND SEVEN CAME FROM rf2-6ng7's OWN BOUNDED AUDIT, which is this lane's
  # standing rule paying for itself: neither namespace was selected by any
  # workflow or script, so both ran only inside `jvm-core`. `late-bind-drift`
  # walks `implementation/**/src` — the same corpus as the four above, so the
  # hicasso / ssr-node false arms already measured below are exactly its hole:
  # a `late-bind/set-fn!` published from either tree, or a directory entry
  # orphaned by an edit there, merged green. `observation-render-law-drift` is
  # WIDER than any of them: its census is `git ls-files`, so its domain is the
  # whole tracked corpus, and rf2-61ar armed `implementation_jvm` for only the
  # pinned slice of that prose (nearly all `spec/*`, `docs/machines/*`, three
  # named pages). The rest of `docs/` — `docs/design/hicasso/**` measured —
  # reads FALSE, so retired render-law prose could land there unread.
  #
  # THE FIFTH ARRIVED THE SAME DAY (rf2-n4a2b). rf2-sk5hf widened
  # prod-gate-naming-drift-test from a depth-1 `.listFiles` over one artefact's
  # test tree to a recursive walk from the implementation root, which made it
  # this exact shape; rf2-cujx named four suites and could not take it because
  # the file was fenced behind that PR. Its hole is measured with the probes
  # its OWN domain needs — the walk reads `test/` trees, not `src/`:
  # `implementation/hicasso/test/x_prod_gate_test.clj` and
  # `implementation/ssr-node/test/x_prod_gate_test.clj` both read
  # implementation_jvm FALSE, while `implementation/epoch/test/...` reads true.
  # So a dishonestly-named gate suite landing in hicasso or ssr-node merged
  # green and redded main for the next unrelated implementation PR.
  #
  # Measured on this tree with `.github/scripts/report-changed-surfaces.sh`,
  # `tools/{xray,story,mcp-base}/src`, `implementation/hicasso/src` and
  # `implementation/ssr-node/src` all read implementation_jvm FALSE, while
  # `implementation/core/src` reads true. So a tools/, hicasso or ssr-node
  # change that introduced an `(or frame-kw :rf/default)` floor, an
  # egress-chokepoint violation, an uncatalogued error channel or a
  # warn-once governance breach merged GREEN, and the red landed on main for
  # the next unrelated implementation PR to discover — the rf2-61ar incident
  # shape exactly (PR #8068 left five assertions red on main that way).
  #
  # UNCONDITIONAL, and the reason is a MEASUREMENT that mirrors jvm-hicasso's
  # above. `implementation_jvm` is the obvious gate and it is the wrong one:
  # arming the three missing roots costs ~10 more PRs through the 22-job JVM
  # tier (~21 min each) and STILL leaves the class partly open, because the
  # walks keep widening — rf2-2cu7f has already made `src-roots` recursive and
  # depth-independent, so tomorrow's artefact is walked by construction while
  # any arming list would have to be re-widened by hand. Arming to completion
  # costs ~59 more PRs and puts 92% of all PRs through that tier. This lane
  # costs ONE runner. An unconditional lane has no read-set model to
  # be wrong about, which is the whole point: there is nothing to drift.
  #
  # WHAT THE LANE COSTS, measured (rf2-6ng7) on a clean worktree off main with
  # a warm `~/.m2`, each step its own JVM exactly as CI runs it: 5 / 7 / 13 /
  # 7 / 5 / 61 / 8 seconds for the seven steps in order, ~106s of test time
  # against this job's 10-minute ceiling. `late-bind-drift-test` is 61s of
  # that, and it is the price of the repair rather than a defect to fix here:
  # its producer spot-check re-reads the source corpus per directory entry.
  # Slow, bounded, and still an order of magnitude under the ~21-minute JVM
  # tier that arming these roots would have cost instead.
  #
  # A new classifier output was the third option and is rejected for the
  # reason jvm-hicasso gives at length — the defect being repaired IS a
  # surface gate that did not cover a checker's inputs, so a new arm is a
  # fresh chance to make the same mistake, and rf2-w9ip established that a
  # second output must also be taught to `scripts/test-fast-pr.sh` and held in
  # step with the classifier forever after.
  #
  # WHY ONE STEP PER NAMESPACE AND NOT ONE `-n`-LIST, which is the part that is
  # easy to get wrong. A missing namespace inside a multi-`-n` selector is
  # SILENT: measured on this tree, `-n <valid> -n <does-not-exist>` exits 0
  # having run only the valid one, with no warning. One combined step therefore
  # rests entirely on the quiet runner's TOTAL test-count floor, and these
  # namespaces are lopsided — 1 / 3 / 27 / 1 / 2 / 8 / 5 tests. A total floor cannot tell
  # "the 1-test floor lint stopped selecting" from "the 27-test catalogue
  # gained a test", so the guard would silently stop guarding the moment the
  # big suite grew. Run per namespace and each takes the runner's DEFAULT
  # floor of 1 on its own: a namespace that disappears runs zero tests and
  # REDS (measured: exit 1). That also leaves no calibrated number to
  # maintain, so there is no count here to go stale.
  #
  # These also still run inside `jvm-core`, and that duplication is
  # deliberate: this lane exists to schedule them when `jvm-core` does not.
  jvm-repo-source-walks:
    name: JVM repo-wide source walks (clojure -M:test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: implementation/core
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Clojure CLI
        run: "$GITHUB_WORKSPACE/.github/scripts/install-clojure-cli.sh"

      - name: Cache Maven / gitlibs
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          # Deliberately the SAME cache key as jvm-core — identical classpath,
          # so the two lanes share one entry rather than storing it twice.
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: ${{ runner.os }}-clj-core-${{ hashFiles('implementation/core/deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-clj-core-
            ${{ runner.os }}-clj-

      - name: Absence-repair floor lint for :rf/default (implementation/** + tools/**)
        run: clojure -M:test -n re-frame.no-rf-default-floor-lint-test

      - name: Egress-chokepoint conformance (every implementation/ src root)
        run: clojure -M:test -n re-frame.egress-chokepoint-conformance-test

      - name: Error-catalogue channel conformance (every implementation/ src root)
        run: clojure -M:test -n re-frame.error-catalogue-channel-conformance-test

      - name: Warn-once-clear governance (file-seq over implementation/)
        run: clojure -M:test -n re-frame.warn-once-clear-governance-test

      - name: Production-gate naming drift (every artefact's test/ tree)
        run: clojure -M:test -n re-frame.prod-gate-naming-drift-test

      - name: Late-bind directory drift (every implementation/ src root)
        run: clojure -M:test -n re-frame.late-bind-drift-test

      - name: Observation render-law drift (every tracked prose file, git ls-files)
        run: clojure -M:test -n re-frame.observation-render-law-drift-test

  cljs:
    name: CLJS (shadow-cljs :node-test)
    # rf2-f79t8 — job-level gating (NOT a workflow-trigger path filter:
    # the pull_request trigger stays unfiltered so the
    # `All required checks passed` aggregator is always present). The
    # consolidated :node-test build compiles core + every adapter + every
    # per-feature artefact PLUS the tools/{story,xray}/{src,test} CLJS
    # test trees (shadow-cljs.edn :source-paths). `cljs_node_test` fires
    # on any of those surfaces (and on the build config / fixtures); it is
    # false only on a spec/docs-only PR, where this job skips. The
    # aggregator treats a surface-skip as OK and the nightly full matrix
    # is the safety net.
    needs: detect_changed_surfaces
    if: needs.detect_changed_surfaces.outputs.cljs_node_test == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: implementation
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Clojure CLI
        run: "$GITHUB_WORKSPACE/.github/scripts/install-clojure-cli.sh"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: implementation/package-lock.json

      - name: Cache Maven / gitlibs (shadow-cljs deps)
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: ${{ runner.os }}-cljs-${{ hashFiles('implementation/shadow-cljs.edn', 'implementation/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-cljs-

      # For the Hicasso invariants gate below — pure Python stdlib, no
      # requirements.txt install. Same pinned action and same interpreter
      # version as the two other python-running jobs in this workflow.
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'

      - name: npm install
        run: npm ci

      # THE HICASSO INVARIANTS GATE (rf2-8a6s). A chain of sub-second static
      # reads over implementation/hicasso/**, one npm script because they share
      # this job's one input surface and a separate script for each would need
      # another workflow step or a declared scheduling hole for the gain of
      # nothing. The roster is `test:hicasso-invariants` in
      # implementation/package.json; read it rather than a list here. It opens
      # with the optional-module reachability check — nothing optional is
      # reachable from the public door, and no `src/` namespace requires UIx or
      # the bench tree (the `bench tree` row is what SEALED the package against
      # its own measurement harness after rf2-6c12m.1 moved that harness out to
      # bench/hicasso/ and retired the freeze gate that used to seal it) — then
      # the ledger reads chained after it. (The complaint-catalogue round trip
      # that used to sit between them was retired with its checker under
      # rf2-6c12m.7; the repo-wide keyword-drift gate above already covers
      # every id it reconciled.) It was run BY HAND until rf2-8a6s scheduled it:
      # a divergence nobody ran the gate for is a divergence nobody notices.
      #
      # Hosted in THIS job because its input surface —
      # implementation/hicasso/** (rf2-8a6s's classifier case) — arms
      # `cljs_node_test`, which is what lights this job. Early, before the
      # ~10-minute compile: it is a sub-second static read and a divergence
      # should red fast.
      - name: Hicasso invariants gate
        run: npm run test:hicasso-invariants

      - name: Compile and run node-test build (core + reagent)
        run: |
          npx shadow-cljs compile node-test
          node out/node-test.js

      # Per-namespace test-isolation gate (rf2-32siq3.44). The consolidated
      # node-test bundle shares ONE runtime, so a test ns whose fixture forgets
      # to install its own substrate adapter is masked: it passes whenever a
      # sibling left an adapter installed (suite ORDERING hides a
      # self-incomplete fixture). This step re-runs the curated EP-0023
      # image/frame runtime-construction namespaces EACH ALONE — a fixture
      # leaning on bundle pollution goes red standalone. Reuses the bundle the
      # step above just compiled (no --compile).
      - name: Per-namespace test-isolation gate self-test
        run: node scripts/check-per-ns-isolation.cjs --self-test

      - name: Per-namespace test-isolation gate
        run: node scripts/check-per-ns-isolation.cjs

      # Hicasso modules compile (rf2-2rtt6.73, rf2-okhdf, rf2-peorl; its own
      # script since rf2-6c12m.1). The ONE warnings-fatal compile of what no
      # other gate judges: the optional modules (motion / overlay / forms /
      # native / server — unreachable from the public door by construction,
      # so no door-rooted compile sees them, and their own suites compile them
      # under `:node-test-hicasso` with `:infer-externs false` and under
      # `:browser-test`, which exits 0 on warnings) and the two core
      # attribution instruments under core/test/re_frame/bench/ that nothing
      # test-shaped requires. Measured cost of the hole: four `:infer-warning`s
      # in impl/overlay.cljs lived on main until read off a browser build by
      # hand (rf2-9zz0y). One dev-mode `shadow-cljs compile` on the
      # `:hicasso-modules-compile` id, entries read live off
      # `check_optional_module_reachability.py --module-namespaces` and a
      # two-row roster, every warning a failure.
      #
      # The bench LANE this gate used to compile alongside them is off every
      # per-PR lane by ruling (rf2-6c12m.1): it lives at bench/hicasso/, a
      # hand-run project whose own `npm run check` compiles it the same way.
      #
      # Hosted HERE rather than in cljs-examples-compile because this job's
      # `cljs_node_test` surface includes implementation/core/*, which
      # `examples_compile` deliberately excludes — and a core change is
      # exactly what breaks the instruments' closure.
      - name: Hicasso modules compile gate
        run: npm run test:hicasso-compile

      # THE HICASSO RELEASE BUILD (rf2-qy1j). rf2-hic-008 added
      # `:hicasso-release` to shadow-cljs.edn — the artefact's first and only
      # `:advanced` / `goog.DEBUG false` compile, entry `re-frame.hicasso.
      # consumer-app` — and correctly stopped there, because package.json and
      # this file were both held. So the build shipped with no npm script and
      # no job: exactly the shape the modules compile above was in before
      # rf2-2rtt6.73 and the invariants gate before rf2-8a6s, and with the same
      # consequence — Phase 0's claim that a clean consumer's application
      # compiles for production could stop being true on main and nothing
      # would say so.
      #
      # WHAT IT CATCHES THAT NOTHING ELSE HERE DOES. Every other compile of
      # these namespaces in the repo is `:none`: `:node-test`, `:browser-test`
      # and the modules-compile step above all run the ClojureScript compiler and
      # never the Closure one. `:advanced` is where renaming, externs
      # inference and DCE-sensitive interop are decided, and a construct only
      # Closure rejects is invisible to all three. Measured rather than
      # assumed — with one bad `js*` form in `re-frame.hicasso`, the SAME
      # build id under `shadow-cljs compile` completed green (162 files, 0
      # warnings) while `shadow-cljs release` failed with a Closure parse
      # error. The dev lanes were the control and they did not notice.
      #
      # NO NEW SURFACE PREDICATE, DELIBERATELY (the rf2-hic-021 lesson). A
      # job gated on a changed-surface condition is correct exactly until the
      # thing it guards grows one more input, and nothing makes anyone revisit
      # the condition then; that is how the (since-retired) complaint-catalogue
      # gate ended up unreachable from three of its four input families. The build's
      # repo-source inputs are three trees and the build-config trio —
      # implementation/core/** (68 namespaces), implementation/adapters/**
      # (the UIx adapter the entry installs), implementation/hicasso/** (src,
      # plus the `consumer-app` entry under test/), and shadow-cljs.edn /
      # package.json / package-lock.json, which declare the build id and pin
      # the Closure version whose output this is. EVERY one of those already
      # arms `cljs_node_test`, so hosting the build here needs no classifier
      # arm of its own and adds no condition to keep in sync. It also cannot
      # silently outgrow one: a new input can only arrive as a `:require`
      # added to `consumer-app` or to something already on those trees, and
      # every `implementation/*` artefact case in the classifier arms this
      # output too, so the surface widens by construction rather than by
      # somebody remembering to widen it.
      #
      # NOT `cljs_prod`, which is the elision / bundle-probe family. The
      # classifier's `implementation/hicasso/*` arm keeps the package off it
      # in terms, and routing this build there would mean widening that arm —
      # a classifier edit — to reach a build whose every input already arms
      # the job it is standing in.
      #
      # LAST in the job because it is the most expensive step here: 36.8s of
      # Closure measured cold on a Windows laptop, on a runner that has
      # already paid for the JVM, the Maven cache and `npm ci`. The
      # sub-second static reads and the node-test lane above red first.
      - name: Hicasso release build (:advanced, goog.DEBUG false)
        run: npm run build:hicasso-release

  js-harness-self-tests:
    name: JS harness self-tests (quiet reporters + path policy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: implementation
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '24'

      - name: Run JS harness self-tests
        run: npm run test:scripts

  # ---------------------------------------------------------------------------
  # CLJS browser / prod Playwright jobs (rf2-f79t8 part c).
  #
  # The browser/prod cluster — cljs-browser (:browser-test, dev),
  # cljs-browser-schemas-boundary-prod (:advanced + goog.DEBUG=false),
  # cljs-browser-prod-elision (:advanced + goog.DEBUG=false) — each
  # npm-installs, installs Playwright, and compiles a DISTINCT shadow-cljs
  # build with a distinct ns-regexp + compiler options. A "merge into one
  # job" dedup was rejected as NOT low-risk: (1) the three builds cannot
  # share a compile artifact (one dev, two :advanced with different
  # ns-regexps), so merging would still recompile three bundles; (2)
  # merging serialises three currently-parallel gates onto one runner,
  # lengthening wall-clock on a code PR; (3) it collapses three
  # independently-reported required statuses into one, losing failure
  # locality. The cheap, low-risk win applied instead is the shared
  # Playwright browser-binary cache below: every PR-time Playwright job
  # previously re-downloaded Chromium (~120 MB) on each run; the cache,
  # keyed on the locked Playwright version, removes that redundant
  # download across all browser jobs (and across runs) with zero change
  # to which suites run.
  # ---------------------------------------------------------------------------
  cljs-browser:
    name: CLJS (shadow-cljs :browser-test, headless Chromium)
    needs: detect_changed_surfaces
    if: needs.detect_changed_surfaces.outputs.cljs_browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: implementation
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: implementation/package-lock.json

      - name: Set up Clojure CLI
        run: "$GITHUB_WORKSPACE/.github/scripts/install-clojure-cli.sh"

      - name: Cache Maven / gitlibs (shadow-cljs deps)
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: ${{ runner.os }}-cljs-browser-${{ hashFiles('implementation/shadow-cljs.edn', 'implementation/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-cljs-browser-
            ${{ runner.os }}-cljs-

      - name: npm install
        run: npm ci

      # rf2-f79t8 — cache the Playwright browser binary across runs/jobs.
      # Every PR-time Playwright job previously re-downloaded Chromium
      # (~120 MB) on each run. The binary is keyed on the locked
      # Playwright version (package-lock.json), so the cache is correct by
      # construction: a Playwright bump busts it. On a hit, the install
      # step below still runs `--with-deps` (the apt system libs are not
      # cacheable) but Playwright skips the binary download.
      - name: Cache Playwright browser binary
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('implementation/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright (Chromium + system deps)
        run: timeout -k 10 720 npx playwright install --with-deps chromium || "$GITHUB_WORKSPACE/.github/scripts/playwright-install-failed.sh" $?

      - name: Compile :browser-test, serve, and run Playwright runner
        run: npm run test:browser

  # rf2-9cw850 — the standalone example-compile COVERAGE GATE, split out of
  # the cljs-browser job into its own parallel job.
  #
  # WHY THIS IS A SEPARATE JOB. Live step-timing on PR #4631 showed the
  # `npm run test:examples-compile` step (compile EVERY declared
  # :examples/* shadow-cljs build — rf2-0vav5.1 + rf2-cn6kc.1) was the
  # dominant cost in cljs-browser at ~10 min, while the actual
  # `:browser-test` compile + Playwright runner was only ~1-2 min. The
  # example-compile step was piggybacked into cljs-browser, BEFORE the
  # Playwright install, only to fail fast before the ~120 MB Chromium
  # download. But that serialised ~10 min of example compiles in front of
  # every browser-test run, making cljs-browser the ~12 min long-pole on
  # every core-touching PR. The example-compile gate needs NO browser
  # (it is a pure `shadow-cljs compile` over the example builds — no
  # Playwright, no Chromium), so it has no reason to share the cljs-browser
  # runner. Splitting it into its own job lets the two run in PARALLEL,
  # dropping the cljs-browser long-pole to ~2-3 min while keeping the full
  # coverage guarantee (the example builds are still compiled + warning-
  # checked in CI on the same surface).
  #
  # SURFACE GATING (rf2-gzavkm). Fires on the dedicated `examples_compile`
  # surface: examples, build config, adapters/UI, feature artefacts, and the
  # Story/Xray closure compiled into examples. Core-only changes keep their
  # focused PR gates and rely on the unconditional nightly example compile;
  # they no longer queue this perennial long-tail job on every PR.
  cljs-examples-compile:
    name: CLJS (compile every standalone example build, coverage gate)
    needs: detect_changed_surfaces
    if: needs.detect_changed_surfaces.outputs.examples_compile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: implementation
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: implementation/package-lock.json

      - name: Set up Clojure CLI
        run: "$GITHUB_WORKSPACE/.github/scripts/install-clojure-cli.sh"

      - name: Cache Maven / gitlibs (shadow-cljs deps)
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: ${{ runner.os }}-cljs-examples-compile-${{ hashFiles('implementation/shadow-cljs.edn', 'implementation/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-cljs-examples-compile-
            ${{ runner.os }}-cljs-browser-
            ${{ runner.os }}-cljs-

      - name: npm install
        run: npm ci

      # rf2-0vav5.1 + rf2-cn6kc.1 — compile-coverage gate over EVERY declared
