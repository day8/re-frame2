    # 2026-05-14, and when rf2-a9oic finally ran it cold before scheduling it,
    # it came back RED — which is why it was declared rather than wired, and
    # why it is only being wired now that the gate asserts a claim that holds.
    #
    # THE RED WAS NOT A REGRESSION, and that is the whole reason this job could
    # not simply have been added three months ago with a bigger constant. The
    # gate asserted an ABSOLUTE gzipped ceiling while Spec 010 §Bundle cost
    # budgets a MARGINAL one. `cljs.core` alone is ~186 KB of the probe's ~494
    # KB optimized bytes, so the number moved with every unrelated framework
    # change: the probe grew 44.8 KB between 2026-05-14 and 2026-08-05, of
    # which the schemas surface was 1.0 KB and `cljs.core` + `re-frame.core`
    # were 43.8 KB. Spec 010's normative claim was CONFIRMED by measurement the
    # whole time; only the gate's quantity was wrong. Any re-baselined absolute
    # would have been wrong again within a quarter, so the gate now has none.
    #
    # WHAT IT RUNS: two `:advanced` + `goog.DEBUG=false` browser builds
    # differing by EXACTLY ONE require — `schemas-bundle-control`
    # (`[re-frame.core]` only) and `schemas-bundle-probe` (`[re-frame.core]` +
    # `[re-frame.schemas]`) — then asserts the gzipped MARGIN between them,
    # two-sided, against Spec 010's marginal budget. The ceiling catches a
    # namespace off the spec's restrict-to-dev/test list reaching the
    # production path; the FLOOR catches the margin collapsing, which is not a
    # saving but a vacuous probe — and specifically catches a revert of the
    # rf2-v96fh facade require, whose behavioural owner is the JVM test
    # `schemas/test/re_frame/schemas_implies_validation_test.clj` in the
    # `jvm-schemas` lane. Both directions were made to fire before wiring.
    #
    # NOT a duplicate of `cljs-bundle-isolation` or `cljs-perf-bundle`. Those
    # two grep emitted bundles for symbols that must be absent; this one
    # measures bytes and owns ONE quantity — what requiring the schemas
    # artefact costs. Its own job so a schemas-margin failure stays
    # distinguishable from an isolation failure in the checks UI.
    #
    # No browser and no Clojure CLI: two shadow-cljs releases plus a gzip of
    # the emitted bytes, and shadow-cljs.edn resolves through `:dependencies`
    # rather than `:deps`, so the JDK/Node/Maven trio is enough — the same step
    # list as `cljs-perf-bundle` above. Measured cold at 47s (rf2-a9oic),
    # against that sibling's 75s, which is why this is per-PR and not nightly.
    #
    # Surface-gated on `cljs_prod`, like its sibling. All four producers that
    # can move this gate's number arm it: `implementation/schemas/*` (the
    # artefact under measurement), `implementation/shadow-cljs.edn` (both
    # builds), `implementation/package.json` (the script) and
    # `implementation/scripts/*` (the checker itself — so the gate's teeth
    # cannot be softened while avoiding the job that runs them).
    needs: detect_changed_surfaces
    if: needs.detect_changed_surfaces.outputs.cljs_prod == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: implementation
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: implementation/package-lock.json

      - name: Cache Maven / gitlibs (shadow-cljs deps)
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: ${{ runner.os }}-cljs-${{ hashFiles('implementation/shadow-cljs.edn', 'implementation/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-cljs-

      - name: npm install
        run: npm ci

      - name: Schemas bundle cost (core-only control + schemas probe, two-sided margin)
        run: npm run test:schemas-bundle

  cljs-freehand-evidence-elision:
    name: Freehand evidence production isolation (F4g control-build probe, rf2-drpa3.166)
    # rf2-xwa4n — PR #6880 shipped the probe as `npm run
    # test:freehand-evidence-elision` and nothing invoked it. A gate that never
    # runs is no gate: the next change to the evidence schema, the dev-gated
    # emission seam, the occurrence index behind it, the mounted commit edge
    # that roots the seam, the release entry, the build config or the checker
    # could merge without the proof ever executing.
    #
    # The gate builds TWO `:advanced` bundles of the SAME entry
    # (re-frame.freehand.release-app) differing only in `goog.DEBUG`, then greps
    # both:
    #   - release (goog.DEBUG=false): the two evidence-door sentinels ABSENT
    #     (the dev gate folded to false and Closure DCE'd the branch that
    #     reaches `re-frame.freehand.evidence`), the app survivor PRESENT.
    #   - control (goog.DEBUG=true):  the SAME two sentinels PRESENT — the
    #     positive control, so a probe that stopped rooting the seam fails here
    #     instead of passing vacuously.
    #
    # No browser and no Clojure CLI: two shadow-cljs releases plus a string
    # inspection over the emitted bytes, so the JDK/Node/Maven trio is enough
    # (same shape as cljs-ui-facade-isolation).
    #
    # Surface-gated rather than unconditional: two `:advanced` builds are not
    # worth spending on every PR, and the classifier arms exactly the surfaces
    # that can invalidate the proof. The roster is declared in ONE place —
    # `report-changed-surfaces.sh`'s producer `case`, pinned by
    # `FREEHAND_EVIDENCE_PRODUCERS` in `implementation/scripts/_changed-surfaces.test.cjs`
    # — and this comment deliberately does not restate it: the two previous
    # restatements here both went stale (they omitted `shell.cljs`, then
    # `occurrences.cljc`) while reading as a complete enumeration.
    needs: detect_changed_surfaces
    if: needs.detect_changed_surfaces.outputs.freehand_evidence_elision == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: implementation
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: implementation/package-lock.json

      - name: Cache Maven / gitlibs (shadow-cljs deps)
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: ${{ runner.os }}-cljs-${{ hashFiles('implementation/shadow-cljs.edn', 'implementation/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-cljs-

      - name: npm install
        run: npm ci

      - name: F4g evidence elision probe (release + goog.DEBUG=true control)
        run: npm run test:freehand-evidence-elision

  cljs-freehand-reachability:
    name: Freehand unused-module reachability (B5 control-build probe, rf2-drpa3.52)
    # rf2-zl8ao — PR #6901 shipped the probe as `npm run
    # test:freehand-reachability` and nothing invoked it. The positive-control
    # half exists precisely so the gate REDS when the probe stops probing, and
    # a gate nobody runs cannot red: the next change to the controller doors,
    # the facade edge, either entry, the build config or the checker could
    # merge with the proof never executing.
    #
    # The gate builds TWO `:advanced` bundles with the SAME `goog.DEBUG false`
    # and different ENTRIES, then greps both:
    #   - production (`release-app/-main`): the two `re-frame.freehand.control`
    #     refusal-message doors ABSENT (the app declares no controller, so
    #     Closure removed the module), the app survivor PRESENT.
    #   - control (the same `-main` CALLED, plus one view calling
    #     `v/controller-key`): the SAME two doors PRESENT — the oracle
    #     validation, checked FIRST, so an absence result is never read from an
    #     unvalidated grep.
    #
    # NOT a duplicate of cljs-freehand-evidence-elision above. That pair moves
    # `goog.DEBUG` and holds the app still, proving a DEV-GATED SEAM elides;
    # this pair holds the flag still and moves the APP, proving an UNUSED
    # MODULE elides. The controller strings are absent from the goog.DEBUG=true
    # control too, so that build cannot prove this claim. At 4cdd518035 the
    # control measures 734,264 chars against production's 730,332 — 3,932
    # chars of controller runtime an unusing page does not ship.
    #
    # Read the DELTA, not the absolutes, and read it as a FROM-CLEAN reading.
    # rf2-bl1gp is why it now says so. The figure it replaces (744,100 vs
    # 752,791, 8,691 chars) read as a plain fact and was not one: a
    # shadow-cljs build that compiles fresh in a process where a SIBLING
    # build was served from cache gets different Closure identifier/property
    # renaming (confirmed in #6915), so running the evidence-elision gate
    # first in the same tree moved it — there, far enough to invert the sign.
    # `npm run test:freehand-reachability` now clears both builds' output and
    # compile caches before compiling (`clean:freehand-reachability`, the
    # pattern `build:freehand-matched` established), so the reading is the
    # from-clean one whatever ran before it.
    #
    # The absolutes still drift with ordinary code growth, which is why the
    # revision is named: over the two base revisions this was measured at
    # they moved together by 293 chars while the delta stayed at exactly
    # 3,932. The delta is the claim; the absolutes are provenance.
    #
    # The GATE never depended on any of this:
    # check-freehand-reachability.cjs asserts present/absent, never bytes, and
    # passes 2/2 in every posture measured while wiring the clean step up.
    #
    # No browser and no Clojure CLI: two shadow-cljs releases plus a string
    # inspection over the emitted bytes, so the JDK/Node/Maven trio is enough
    # (same shape as the sibling job above). The two jobs run on separate
    # runners, so they share no compile in CI; locally the clean step means
    # this gate always pays for both `:advanced` builds itself.
    #
    # Surface-gated for the same reason the sibling is: the classifier arms
    # exactly the surfaces that can invalidate the proof — the controller
    # doors, the facade that owns the single production call edge into them,
    # both entries, the build-config trio and the checker itself.
    needs: detect_changed_surfaces
    if: needs.detect_changed_surfaces.outputs.freehand_reachability == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: implementation
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: implementation/package-lock.json

      - name: Cache Maven / gitlibs (shadow-cljs deps)
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: ${{ runner.os }}-cljs-${{ hashFiles('implementation/shadow-cljs.edn', 'implementation/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-cljs-

      - name: npm install
        run: npm ci

      - name: B5 reachability probe (release + superset-app control)
        run: npm run test:freehand-reachability

