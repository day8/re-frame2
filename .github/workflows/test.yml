      - name: npm install
        run: npm ci

      # rf2-f79t8 — cache the Playwright browser binary (see cljs-browser).
      - name: Cache Playwright browser binary
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('implementation/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright (Chromium + system deps)
        run: npx playwright install --with-deps chromium

      # PR-smoke tier (rf2-wa3oo + rf2-og36y). The full feature-load +
      # full Xray matrix + Story static-export sweep sat on the critical
      # path of every Story/Xray PR at ~700s for the THREE GATES
      # TOGETHER — never the Xray matrix alone, which is 154–171s of a
      # 509–564s three-gate nightly total (measured 2026-08-01..05).
      # The identical sweep already runs nightly in expensive-tests.yml,
      # so PR time ran the full matrix twice over. PR time now runs only
      # the high-signal subset:
      #
      #   - Xray feature gate in --smoke mode: every scenario tagged
      #     `smoke: true` in tools/xray/testbeds/feature_matrix/
      #     scenarios.cjs, a set the gate counts and prints on each run.
      #     As at 2026-08-06 that is 5 scenarios (9-tab shell handoff,
      #     freehand-views Views roster, deterministic exceptions →
      #     inline/Trace surfacing, Cmd-K palette, panel-gallery theme
      #     tokens) over 4 staged surfaces, compiling 4 testbed bundles
      #     instead of 12 — ~80s warm (rf2-ano54).
      #   - Story :play-script CI-as-test gate (rf2-3qcxk): drives the
      #     live Story shell over the single counter-with-stories
      #     testbed and runs every variant's :play-script. This is the
      #     gate that renders the assertion-strip, so the rf2-5lw9w
      #     assertion-strip :key fix stays covered on the PR critical
      #     path.
      #
      # The rest of the full sweep (test:xray-feature-gate, test:story-static)
      # still runs nightly in expensive-tests.yml. test:story-feature-load is
      # the exception, and only for the PRs that change it — see the step at
      # the end of this job (rf2-65ajl).
      - name: Run Xray feature browser gate (PR-smoke)
        if: needs.detect_changed_surfaces.outputs.story_xray_browser == 'true'
        run: npm run test:xray-feature-gate:smoke

      # rf2-3qcxk — every Story variant whose body carries a
      # `:play-script` slot doubles as an automated regression test.
      # The runner discovers them via `re-frame.story.play.ci-runner`,
      # drives each through the live shell, and reports a structured
      # pass/fail row per variant. Kept on the PR critical path: it is a
      # single-testbed compile and is the live render path that exercises
      # the assertion-strip (rf2-5lw9w).
      - name: Run Story :play-script CI-as-test gate
        if: needs.detect_changed_surfaces.outputs.story_xray_browser == 'true'
        run: npm run test:story-play-scripts

      # rf2-65ajl — the half of the fix that lives in the job. Arming a
      # changed-surface output is worthless if the job it schedules does not run
      # the changed file, and that was the case here: the two steps above are
      # the only commands this job ran, and NEITHER loads
      # tools/story/test/story_feature_load.cjs or story_browser_scenarios.cjs.
      # Only `npm run test:story-feature-load` does — it compiles the two Story
      # testbeds, serves them, and drives both spec modules through Chromium —
      # and it was nightly-only. #7472 changed story_feature_load.cjs's
      # COVERAGE_MATRIX and said in its body that CI would be the first
      # end-to-end exercise of the demoted row; the job was skipped, and had it
      # run it would have executed neither command that loads the file.
      #
      # Gated on `story_full_gate`, which arms ONLY on the gate's own spec
      # modules and its run/serve orchestration — not on ordinary Story/Xray
      # runtime changes, which keep the cheaper smoke path above. So this adds
      # nothing to the critical path of a normal Story/Xray PR: it runs on the
      # rare PR that edits the runner itself, where it is the only step that
      # exercises the diff at all. Cost when it does run is one extra testbed
      # compile (login-form; counter-with-stories is already compiled by the
      # play-script step, and both share this job's keyed .shadow-cljs cache)
      # plus the two Playwright specs.
      #
      # The nightly sweep in expensive-tests.yml is unchanged and remains the
      # system of record for the full matrix.
      - name: Run the FULL Story feature-load gate (direct-runner change, rf2-65ajl)
        if: needs.detect_changed_surfaces.outputs.story_full_gate == 'true'
        run: npm run test:story-feature-load

      # rf2-9n2cv — the job half of the sibling fix, identical in shape to the
      # step above. `npm run test:story-static` IS
      # `node scripts/check-story-static.cjs`, and no job in this workflow ran
      # it: the three steps above are the only commands this job runs, and
      # none of them loads check-story-static.cjs or story-build.cjs. So a PR
      # editing the static-export gate's own assertions merged with the gate
      # unexercised — the classifier armed five outputs for the file and not
      # one scheduled a job that runs its command.
      #
      # Gated on `story_static_gate`, which arms ONLY on the gate script and
      # the build script it spawns — not on ordinary Story/Xray runtime
      # changes, and not on the rest of implementation/scripts/. So this adds
      # nothing to the critical path of a normal PR: it runs on the rare PR
      # that edits the static gate itself, where it is the only step that
      # exercises the diff at all.
      #
      # It shares this job's keyed .shadow-cljs cache with the steps above, but
      # note it compiles its OWN build target (:story-static/counter-with-
      # stories, the static-export entry point) rather than reusing the
      # play-script step's dev compile — the two are different shadow-cljs
      # builds of the same testbed, which is precisely the point of the gate.
      #
      # The nightly sweep in expensive-tests.yml is unchanged and remains the
      # system of record for the full matrix.
      - name: Run the Story static-export gate (direct-gate change, rf2-9n2cv)
        if: needs.detect_changed_surfaces.outputs.story_static_gate == 'true'
        run: npm run test:story-static

      # rf2-315cf (Option B) — on a RED browser gate, upload the failed-run
      # evidence so the failure is a downloadable, off-CI post-mortem
      # (spec/017 §Failed-run artifacts in CI). Two paths are surfaced:
      #   - implementation/out/story-play-scripts/ — the play-script run
      #     evidence (per-row expected/actual + per-step diagnostics) the
      #     runner persists ONLY when a play deviates from its expected
      #     status (rf2-5x1wt.7 run-evidence projection).
      #   - implementation/out/xray-feature-gate-artifacts/ — the Xray
      #     feature-gate failure screenshots + diagnostics the gate already
      #     writes on a failing scenario.
      # `if: failure()` scopes the upload to a red run; `if-no-files-found:
      # ignore` keeps a partial failure (e.g. the xray step failed before
      # the play-scripts step ran, or vice versa) from turning the upload
      # itself red. The dedicated capability-routed (:pixels / :a11y-engine)
      # browser-tier gate is DEFERRED per Mike's 2026-05-31 ruling — this
      # bead wires ONLY the failed-run artifact upload on the existing gate.
      # Un-defer trigger (rf2-a0t1z5, compound first-of, RULED 2026-07-07):
      # (1) the first COMMITTED authored variant/inline plan — outside tool
      # unit tests / spec / MCP descriptors — that intentionally carries
      # :rf.assert/visual-snapshot (:pixels) or :rf.assert/a11y
      # (:a11y-engine) => wire a NIGHTLY capability-routed browser gate in
      # expensive-tests.yml; (2) the first genuine visual/a11y regression
      # that the structural a11y check + existing Story/Xray browser gates
      # MISS => escalate to a changed-surface PR gate. See TESTING.md
      # (Story-as-test paragraph) for the mirrored prose.
      - name: Upload failed browser-gate run evidence (rf2-315cf)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: story-xray-browser-failed-run-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            implementation/out/story-play-scripts/
            implementation/out/xray-feature-gate-artifacts/
          if-no-files-found: ignore
          retention-days: 14

  cljs-reagent-slim-bundle-isolation:
    name: CLJS Reagent Slim bundle isolation + client-runtime smoke (adapter-owned, rf2-2ppcv + rf2-5v0dg7)
    needs: detect_changed_surfaces
    if: needs.detect_changed_surfaces.outputs.reagent_slim_bundle == 'true'
    runs-on: ubuntu-latest
    # rf2-e6enf — job-level backstop to the step-level Playwright cap below.
    # Without it the job inherits GitHub's 360-min default, so any wedged step
    # (the observed `--with-deps` apt/dpkg-lock hang on #4309) leaves this job
    # — and the required `all-required-passed` aggregator that `needs:` it —
    # open-ended pending, blocking the merge. 20 min gives a cold-Maven-cache
    # run generous headroom while making any genuine hang a fast, re-runnable
    # FAILURE. Mirrors the mcp-conformance-re-frame2-pair job cap.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: implementation
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: implementation/package-lock.json

      - name: Set up Clojure CLI
        run: "$GITHUB_WORKSPACE/.github/scripts/install-clojure-cli.sh"

      - name: Cache Maven / gitlibs (shadow-cljs deps)
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: ${{ runner.os }}-cljs-reagent-slim-bundle-isolation-${{ hashFiles('implementation/shadow-cljs.edn', 'implementation/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-cljs-reagent-slim-bundle-isolation-
            ${{ runner.os }}-cljs-

      - name: npm install
        run: npm ci

      # The S3-008 adapter-owned bundle-isolation contract for day8/reagent-slim
      # (rf2-5lbx). Builds both `examples/counter` (stock-Reagent) and
      # `examples/counter-slim-and-fast` (slim Reagent rewrite) under
      # :advanced, then greps the slim bundle for stock-Reagent
      # impl-namespace fingerprints AND for `react-dom/server` symbols.
      # Both must be absent from the slim bundle. The same sentinels
      # are required to be present in the stock bundle as a methodology
      # sanity check — if a future stock-Reagent upgrade DCEs them out
      # of the stock build too, the script catches the lost signal and
      # the sentinel set is re-derived.
      #
      # Dual contract: stock-Reagent impl + react-dom/server isolation.
      # The slim build's gate-owned entry (counter-slim-and-fast.bundle-
      # isolation-entry, the build's :init-fn) deliberately exercises
      # reagent2.dom.server/render-to-static-markup so the
      # react-dom/server-absence assertion is non-vacuous (the SSR path
      # IS in the slim bundle, just pure-CLJS — per IMPL-SPEC §8 +
      # S3-005). The teaching counter-slim-and-fast.core stays clean of
      # the fixture (rf2-vyl0vt).
      - name: Verify Reagent Slim bundle isolates stock Reagent + react-dom/server
        run: npm run test:reagent-slim:bundle-isolation

      # rf2-5v0dg7 — ARM the reagent-slim CLIENT-RUNTIME browser smoke in PR
      # CI. The dedicated, adapter-owned slim smoke runner
      # (serve-and-run-reagent-slim-smoke.cjs) compiles the slim testbed,
      # serves it, and drives the mount/inject/click path in headless
      # Chromium. Previously only `test:script-policy` proved the npm script
      # EXISTS and this job ran ONLY bundle-isolation — so a regression in
      # the adapter-owned mount/injection/click path, or in the smoke runner
      # itself, could ship green. This step actually executes the gate for
      # reagent_slim_bundle surface changes (which now also fire on edits to
      # the runner + its policy test — report-changed-surfaces.sh).

      # rf2-f79t8 — cache the Playwright browser binary (see cljs-browser).
      # Every other PR Playwright job carries this cache step ahead of the
      # install; rf2-5v0dg7 armed the smoke without it, so this job
      # re-downloaded Chromium (~120 MB) on every run. Keyed on the locked
      # Playwright version (package-lock.json); a bump busts it.
      - name: Cache Playwright browser binary
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('implementation/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      # rf2-e6enf — cap the `--with-deps` Playwright install. `--with-deps`
      # runs `sudo apt-get install` for Chromium's system libraries; on a GHA
      # runner that occasionally blocks indefinitely on the dpkg/apt lock held
      # by the background `unattended-upgrades` job. rf2-5v0dg7 added this step
      # with NO step timeout, so when the lock wedged the slim job sat
      # in_progress forever — never reporting a conclusion — which left the
      # required `all-required-passed` aggregator (it `needs:` this job)
      # perpetually pending and blocked the merge (observed on #4309). A
      # healthy install is ~20s; 5 min covers a slow apt + cold (cache-miss)
      # download while turning the lock-wait into a re-runnable FAILURE
      # instead of an open-ended block. Mirrors the identical step-level cap
      # on the hermetic re-frame2-pair-mcp Playwright install.
      - name: Install Playwright (Chromium + system deps)
        timeout-minutes: 5
        run: npx playwright install --with-deps chromium

      - name: Run Reagent Slim client-runtime browser smoke
        run: npm run test:reagent-slim:smoke

  tenant-switcher-testbed-smoke:
    name: Tenant-switcher testbed browser smoke (rf2-h5e3v7)
    needs: detect_changed_surfaces
    if: needs.detect_changed_surfaces.outputs.tenant_switcher_smoke == 'true'
    runs-on: ubuntu-latest
    # rf2-h5e3v7 — job-level backstop to the step-level Playwright cap below,
    # mirroring the cljs-reagent-slim-bundle-isolation job. A wedged
    # `--with-deps` apt/dpkg-lock would otherwise leave this job — and the
    # required all-required-passed aggregator that `needs:` it — open-ended
    # pending and block the merge. 20 min gives a cold-Maven-cache testbed
    # compile generous headroom while making any genuine hang a fast,
    # re-runnable FAILURE.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: implementation
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: implementation/package-lock.json

      - name: Set up Clojure CLI
        run: "$GITHUB_WORKSPACE/.github/scripts/install-clojure-cli.sh"

      - name: Cache Maven / gitlibs (shadow-cljs deps)
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: ${{ runner.os }}-tenant-switcher-smoke-${{ hashFiles('implementation/shadow-cljs.edn', 'implementation/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-tenant-switcher-smoke-
            ${{ runner.os }}-cljs-

      - name: npm install
        run: npm ci

      # rf2-f79t8 — cache the Playwright browser binary (see cljs-browser).
      - name: Cache Playwright browser binary
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('implementation/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      # rf2-e6enf — cap the `--with-deps` Playwright install (see the slim
      # job for the dpkg/apt-lock-wedge rationale). A healthy install is
      # ~20s; 5 min covers a slow apt + cold download while turning a lock
      # wait into a re-runnable FAILURE instead of an open-ended block.
      - name: Install Playwright (Chromium + system deps)
        timeout-minutes: 5
        run: npx playwright install --with-deps chromium

      # rf2-h5e3v7 — ARM the tenant-switcher testbed browser smoke in PR CI.
      # The dedicated runner (serve-and-run-tenant-switcher-testbed.cjs)
      # compiles the :testbeds/tenant-switcher shadow build, stages the
      # hand-written index.html, serves it under the ownership-token
      # handshake, and drives the colocated testbeds/tenant_switcher/spec.cjs
      # in headless Chromium (failing on any uncaught pageerror). It is the
      # ONLY Playwright smoke that exercises this browser scenario; before
      # this job `npm run test:testbed-tenant-switcher` was defined in
      # package.json but invoked by no workflow, so a regression in the
      # runner / colocated spec / testbed could ship green.
      - name: Run tenant-switcher testbed browser smoke
        run: npm run test:testbed-tenant-switcher

  # ---------------------------------------------------------------------------
  # Per-tool CI jobs (rf2-qq70f).
  #
  # Each `tools/<name>/` artefact ships its own test tree. Some surfaces
  # (the *_cljs_test.cljs / .cljc files under tools/story/ and tools/xray/)
  # are already picked up by the consolidated `:node-test` build above
  # because shadow-cljs.edn lists those source paths. JVM-runnable tests
  # (clojure -M:test) and out-of-consolidated-tree node-test surfaces
  # were the gaps — these per-tool jobs close them.
  #
  # Job naming mirrors the per-artefact `jvm-<name>` / `cljs-*` pattern
  # used above. Like the artefact jobs, none `needs:` another — they run
  # in parallel.
  # ---------------------------------------------------------------------------

  jvm-tools-xray:
    name: JVM tools/xray (clojure -M:test)
    needs: detect_changed_surfaces
    if: needs.detect_changed_surfaces.outputs.tools_jvm == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/xray
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Clojure CLI
        run: "$GITHUB_WORKSPACE/.github/scripts/install-clojure-cli.sh"

      - name: Cache Maven / gitlibs
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: ${{ runner.os }}-clj-tools-xray-${{ hashFiles('tools/xray/deps.edn', 'implementation/core/deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-clj-tools-xray-
            ${{ runner.os }}-clj-

      # Xray ships JVM test files (`config_test.clj`, `trace_bus_test.clj`)
      # alongside its CLJS test trees. The CLJS surfaces are already
      # picked up by the consolidated `:node-test` build (shadow-cljs.edn
      # lists tools/xray/test as a source path); this job closes the
      # JVM-side gap. The test-runner returns non-zero on any failure;
      # the job MUST surface that so the gate is real — no `|| echo`
      # fallback, mirroring `jvm-machines` / `jvm-schemas` above.
      - name: Run JVM tests (tools/xray artefact)
        run: clojure -M:test

  jvm-tools-story:
    name: JVM tools/story (clojure -M:test)
    needs: detect_changed_surfaces
    if: needs.detect_changed_surfaces.outputs.tools_jvm == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/story
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Clojure CLI
        run: "$GITHUB_WORKSPACE/.github/scripts/install-clojure-cli.sh"

      - name: Cache Maven / gitlibs
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: ${{ runner.os }}-clj-tools-story-${{ hashFiles('tools/story/deps.edn', 'implementation/core/deps.edn', 'implementation/adapters/reagent/deps.edn', 'implementation/machines/deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-clj-tools-story-
            ${{ runner.os }}-clj-

      # tools/story ships a substantial JVM test surface
      # (story_test.clj, story_runtime_test.clj, story_assertions_test.clj,
      # story_ui_test.clj, story_share_test.clj, story_play_test.clj,
      # story_source_coords_test.clj, story_scrubber_xref_test.clj,
      # story_layout_debug_test.clj, story_fx_stubs_test.clj). The CLJS
      # surfaces are already covered by the consolidated `:node-test`
      # build above (shadow-cljs.edn lists tools/story/test as a source
      # path); this job closes the JVM-side gap.
      - name: Run JVM tests (tools/story artefact)
        run: clojure -M:test

  jvm-tools-story-mcp:
    name: JVM tools/story-mcp (clojure -M:test)
    needs: detect_changed_surfaces
    if: needs.detect_changed_surfaces.outputs.tools_jvm == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/story-mcp
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Clojure CLI
        run: "$GITHUB_WORKSPACE/.github/scripts/install-clojure-cli.sh"

      - name: Cache Maven / gitlibs
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: ${{ runner.os }}-clj-tools-story-mcp-${{ hashFiles('tools/story-mcp/deps.edn', 'tools/story/deps.edn', 'implementation/core/deps.edn', 'implementation/adapters/reagent/deps.edn', 'implementation/machines/deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-clj-tools-story-mcp-
            ${{ runner.os }}-clj-

      # tools/story-mcp is JVM-only by design (Spec 010 §JVM-only): its
      # tests (`protocol_test.clj`, `tools_test.clj`) exercise the
      # JSON-RPC wire format and the MCP tool registrar. Neither runs
      # under shadow-cljs's consolidated `:node-test`; this is the only
      # PR-time CI surface for this artefact.
      - name: Run JVM tests (tools/story-mcp artefact)
        run: clojure -M:test

      # MCP tool-descriptor manifest drift-check (rf2-sofwv). Regenerates
      # the committed `tool-descriptors.edn` in memory from the live tool
      # registry and FAILS if it differs. Adding / removing / renaming a
      # story-mcp tool — or changing a tool's input-key / output? /
      # annotations surface — turns this red until the manifest is
      # regenerated (`clojure -M:gen`). Pure JVM, reuses the warmed
      # classpath; same generate-then-drift-check shape as the
      # api-manifest keystone (rf2-3nbl5.2).
      - name: Assert tool-descriptors.edn matches the registry
        run: clojure -M:gen --check

  jvm-tools-mcp-base:
    name: JVM tools/mcp-base (clojure -M:test)
    needs: detect_changed_surfaces
    if: needs.detect_changed_surfaces.outputs.tools_jvm == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/mcp-base
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Clojure CLI
        run: "$GITHUB_WORKSPACE/.github/scripts/install-clojure-cli.sh"

      # rf2-80y2h: mcp-base now carries a CLJS test target (shadow-cljs
      # :node-test build) covering the `.cljc` `:cljs` reader-conditional
      # branches the JVM suite cannot reach. Node is required to run it.
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '24'

      - name: Cache Maven / gitlibs
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: ${{ runner.os }}-clj-tools-mcp-base-${{ hashFiles('tools/mcp-base/deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-clj-tools-mcp-base-
            ${{ runner.os }}-clj-

      # tools/mcp-base ships as a `.cljc` library (rf2-vw4sq) shared
      # across the MCP servers (re-frame2-pair-mcp, story-mcp). The
      # algorithmic content (sensitive-filter, diff-encode, args
      # parsers, overflow shape, vocab constants) is platform-agnostic
      # — a JVM round-trip is the cheapest PR-time gate. Pair2-mcp's
      # CLJS-side coverage (under `node-test-tools-re-frame2-pair-mcp` below)
      # exercises the same primitives via the shadow-cljs compile
      # path; story-mcp's `jvm-tools-story-mcp` job covers the JVM
      # consumer.
      - name: Run JVM tests (tools/mcp-base artefact)
        run: clojure -M:test

      # rf2-80y2h: the CLJS test target exercises the three `.cljc`
      # `:cljs`-only branches the JVM suite (Malli always present) can
      # never reach — the `goog-define` `validate-patches?` default, the
      # `:cljs` arm of `resolve-malli-validate`, and the
      # soft-pass-when-Malli-absent no-op in the validation gates. The
      # :cljs-test alias deliberately omits Malli so the soft-pass branch
      # actually runs. Both MCP servers consume mcp-base in CLJS; nothing
      # pinned these paths before.
      - name: Install Node deps (shadow-cljs for the CLJS test build)
        run: npm install

      - name: Run CLJS tests (tools/mcp-base artefact)
        run: npm run test:cljs

  # rf2-wq17m — the two artefacts whose JVM lane existed everywhere EXCEPT here.
  # Both carry a wired `:test` alias and a slot on scripts/test-jvm-tools.sh's
  # roster, so they ran locally and in the nightly sweep, and never at PR time.
  #
  # Both are gated on their OWN classifier output, not on `tools_jvm`. That
  # output gates FOUR of the jvm-tools-* jobs above (xray / story / story-mcp /
  # mcp-base; `jvm-tools-template` is gated on `template_expensive` instead), and
  # none of them runs either artefact — arming it would have fired four unrelated
  # probes and STILL skipped the files. Appending steps to one of those jobs was
  # rejected for the same reason plus a second: it would hang a
  # `tools/machines-viz` step off a job named "JVM tools/xray".
  jvm-tools-machines-viz:
    name: JVM tools/machines-viz (clojure -M:test)
    needs: detect_changed_surfaces
    if: needs.detect_changed_surfaces.outputs.tools_jvm_machines_viz == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/machines-viz
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Clojure CLI
        run: "$GITHUB_WORKSPACE/.github/scripts/install-clojure-cli.sh"

      - name: Cache Maven / gitlibs
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: ${{ runner.os }}-clj-tools-machines-viz-${{ hashFiles('tools/machines-viz/deps.edn', 'implementation/core/deps.edn', 'implementation/machines/deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-clj-tools-machines-viz-
            ${{ runner.os }}-clj-

      # 632 tests / 2537 assertions. Most of the suite double-runs in the CLJS
      # lanes — 29 of its 31 suites are `*_cljs_test.*` and ride the
      # consolidated `:node-test` + `:browser-test` builds. Two do not:
      # `engine_grammar_parity_test.cljc` (the engine<->viz grammar drift
      # ratchet, which is why the `:test` alias carries a TEST-ONLY dep on
      # implementation/machines) and `mermaid_public_smoke_test.cljc`. Their
      # namespaces match neither `cljs-test$` nor `-dom-cljs-test$`, so this job
      # is their only PR-time lane. No `|| echo` fallback — the runner's
      # non-zero exit must surface, same as jvm-machines / jvm-schemas.
      - name: Run JVM tests (tools/machines-viz artefact)
        run: clojure -M:test

  # rf2-odlm3 — the CLJS half of the two suites the job above calls out as
  # JVM-only. Both are `.cljc`, so "JVM-only" was a description of the LANES,
  # not of the files: `engine_grammar_parity_test.cljc` carries `:cljs` reader
  # arms and the grammar it mirrors is compiled for the browser. The
  # consolidated `:node-test` bundle does not contain either namespace — its
  # `cljs-test$` selector never reaches a name ending `-test` — so the always-on
  # `cljs` job is not their lane however green it is.
  #
  # `tools/machines-viz/shadow-cljs.edn` declares the artefact's own
  # `:machines-viz-node-test` build for them: its own bundle, its own classpath,
  # its own exit code, so arming these suites cannot contaminate the shared
  # ~11.5k-test run (the rf2-ezbzvm failure mode). Declaring the build inside
  # tools/machines-viz also moves the ownership line the test-lane bijection
  # gate reads, so rule B2 now holds this tree with no gate change.
  #
  # Its OWN output, like the two jobs either side of it and for the same reason:
  # no existing output gates a job that runs this build.
  #
  # It needs Node as well as the JVM — the bundle is a Node script, and
  # shadow-cljs resolves npm from implementation/node_modules (the one install
  # this repo has; the artefact deliberately gains no second lockfile).
  cljs-tools-machines-viz:
    name: CLJS tools/machines-viz (shadow-cljs :machines-viz-node-test)
    needs: detect_changed_surfaces
    if: needs.detect_changed_surfaces.outputs.tools_cljs_machines_viz == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Clojure CLI
        run: "$GITHUB_WORKSPACE/.github/scripts/install-clojure-cli.sh"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: implementation/package-lock.json

      - name: Cache Maven / gitlibs (shadow-cljs deps)
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: ${{ runner.os }}-cljs-tools-machines-viz-${{ hashFiles('tools/machines-viz/deps.edn', 'tools/machines-viz/shadow-cljs.edn', 'implementation/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-cljs-tools-machines-viz-
            ${{ runner.os }}-cljs-

      # shadow-cljs reads npm packages out of implementation/node_modules
      # (`:js-options :js-package-dirs`), and the emitted bundle resolves the
      # same tree at run time because it lands in implementation/out/.
      - name: npm ci
        working-directory: implementation
        run: npm ci

      - name: Run CLJS tests (tools/machines-viz artefact lane)
        working-directory: implementation
        run: npm run test:tools-machines-viz

  # rf2-8m344 — the read-only viewer PAGE. Third artefact surface in this
  # neighbourhood that existed and that nothing selected, and the one with the
  # largest blast radius, because it faces CONSUMERS rather than contributors.
  #
  # The viewer ships as a page: `tools/machines-viz/public/viewer.html` plus the
  # compiled `viewer.js` beside it. Per DESIGN-RATIONALE Lock #7 nobody deploys
  # it for you — `share/encode-share-url` used to default `:host` to
  # `https://day8.github.io/re-frame2-machines-viz/viewer.html`, which 404s and
  # names a repository that does not exist, so every default share-URL was a
  # dead link that looked correct to whoever copied it. That default is gone and
  # `:host` is now required.
  #
  # What replaced it is a RECIPE: README.md §Building and hosting the viewer
  # page and spec/API.md §Hosting both tell a consumer to run
  # `shadow-cljs release machines-viz-viewer` from implementation/ and copy
  # viewer.html beside the emitted bundle. No workflow, npm script or gate had
  # ever run either command — the `:machines-viz-viewer` build was declared in
  # implementation/shadow-cljs.edn and compiled by nothing. "The page is
  # buildable" was the same unverified, load-bearing promise as the 404 host it
  # replaced, and it would have rotted the first time a namespace or module was
  # renamed.
  #
  # This job IS the documented recipe, plus the assertions that make the pair
  # meaningful: the `<script src>` the page loads names a file the build
  # emitted, and the global the page's boot script CALLS is one the bundle
  # actually installs. Both are derived from the two artefacts, never written
  # down, so a rename that keeps them in step passes.
  #
  # It is a build + staging + coupling gate, not a browser render smoke — the
  # page has no hosted instance to smoke, and its render path is already covered
  # by the artefact's `*-dom-cljs-test` chart suites under `cljs-browser`.
  #
  # Its OWN classifier output, like the two jobs above and for the same reason:
  # no existing output gates a job that builds this bundle.
  machines-viz-viewer-page:
    name: Machines-viz viewer page (release build + stage + coupling)
    needs: detect_changed_surfaces
    if: needs.detect_changed_surfaces.outputs.machines_viz_viewer_page == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Clojure CLI
        run: "$GITHUB_WORKSPACE/.github/scripts/install-clojure-cli.sh"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: implementation/package-lock.json

      - name: Cache Maven / gitlibs (shadow-cljs deps)
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: ${{ runner.os }}-machines-viz-viewer-${{ hashFiles('tools/machines-viz/deps.edn', 'implementation/shadow-cljs.edn', 'implementation/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-machines-viz-viewer-
            ${{ runner.os }}-cljs-

      # The viewer bundle resolves react / @xyflow/react / elkjs out of
      # implementation/node_modules, the one install this repo has.
      - name: npm ci
        working-directory: implementation
        run: npm ci

      # Deliberately the SAME command pair the README hands a consumer, run in
      # the same order, so the gate cannot pass while the documented recipe
      # fails. The self-test runs first, proving the coupling assertion fires on
      # a drifted global rather than being decorative.
      - name: Self-test the viewer-page staging gate
        run: node tools/machines-viz/scripts/stage-viewer-page.cjs --self-test

      - name: Build + stage the viewer page (the documented self-host recipe)
        working-directory: implementation
        run: npm run build:machines-viz-viewer

