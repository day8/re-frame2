  # make different claims and neither substitutes for the other: `jvm-freehand`
  # proves the artefact's behaviour WITH its dev instrumentation, this job
  # proves the semantics that must survive WITHOUT it. Same artefact, same
  # classpath (the `:prod-gate` alias is a modifier composed onto `:test`),
  # same cache key — only the JVM posture differs.
  #
  # THE JOB CANNOT PASS VACUOUSLY. `re-frame.freehand.prod-gate-lane-pin-test`
  # runs inside the lane and asserts unconditionally that `re-frame.debug`
  # reads `"false"` on THIS JVM and that `interop/debug-enabled?` honoured it.
  # If the property ever stops arriving, this job goes RED rather than
  # green-on-the-wrong-posture — which is the failure mode that matters,
  # because the lane's roster is by construction a subset of what already
  # passes in dev posture. The pin was proved to have teeth by INVERSION: the
  # same roster run with `-Dre-frame.debug=true` reds exactly its two deftests
  # and nothing else, so without the pin a lost flag would be invisible.
  #
  # SCOPE. Not the whole suite yet: 8 of 133 test namespaces are red under the
  # real gate (147 failures / 7 errors), in three shapes — the dev-only tooling
  # substrate (occurrence index, evidence seam, tool reads, explain-render, all
  # built only inside `interop/debug-enabled?`), the props-schema closure
  # (dev-only by explicit design at `descriptor.cljc` ~591, the same class as
  # Spec 010's `validate-fx!`), and source-coord elision. The roster and the
  # triage bead (rf2-74a89) live in `scripts/test-freehand-prod-gate.sh`. What
  # runs here today is 125 namespaces / 1159 tests / 7930 assertions, green.
  # The roster is an EXCLUSION list, so a new namespace joins this lane by
  # default and has to be excluded deliberately.
  jvm-freehand-prod-gate:
    name: JVM freehand under the production gate (-Dre-frame.debug=false)
    # Same surface gate as jvm-freehand: it is the same artefact.
    needs: detect_changed_surfaces
    if: needs.detect_changed_surfaces.outputs.implementation_jvm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Clojure CLI
        run: "$GITHUB_WORKSPACE/.github/scripts/install-clojure-cli.sh"

      # Deliberately the SAME cache key as jvm-freehand — identical classpath,
      # so the two jobs warm one cache instead of competing for two.
      - name: Cache Maven / gitlibs
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: ${{ runner.os }}-clj-freehand-${{ hashFiles('implementation/freehand/deps.edn', 'implementation/core/deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-clj-freehand-
            ${{ runner.os }}-clj-

      # The script prints the property, the pin, the roster size and the
      # excluded count before it runs anything, so the job's own log carries
      # the evidence of which posture it ran in.
      - name: Run the Freehand suite under -Dre-frame.debug=false
        run: bash scripts/test-freehand-prod-gate.sh

  jvm-spec-resource:
    name: JVM spec-resource (clojure -M:test)
    # The build-time reader for committed spec/ data
    # (day8/re-frame2-spec-resource) — the ONE resolver for shadow-cljs's
    # recording classpath read, shared by the Freehand fixture loader and
    # the api-manifest CLJS probe.
    #
    # Its suite is the deterministic control for the cold-load race that
    # reader exists to close: `requiring-resolve` resolves BEFORE it takes
    # the require lock, so a second macro-expansion thread can reach a Var
    # its own `def` has interned but not yet bound. The suite holds that
    # window open — a generated namespace whose `def` blocks inside its
    # initializer — and drives two independent resolver sites into it, so
    # the racy shape fails on an assertion rather than on the weather.
    #
    # This job exists because ordinary lanes cannot carry that evidence.
    # The defect shipped twice behind fully green JVM / CLJS / browser
    # suites; a rerun wins the coin toss as often as not. Nothing else in
    # CI goes red when the racy shape returns.
    needs: detect_changed_surfaces
    if: needs.detect_changed_surfaces.outputs.implementation_jvm == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: implementation/spec-resource
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

