  cljs-perf-bundle:
    name: CLJS perf-flag bundle isolation (Spec 009 §Performance instrumentation, bead rf2-du3i)
    # rf2-eegpw — Spec 009 §Production-elision verification states that "the
    # bundle-isolation contract is enforced in CI by `npm run test:perf-bundle`
    # (the dual of `npm run test:elision`)". It was not. The npm script, the
    # checker (`scripts/check-perf-bundle.cjs`) and both builds all existed and
    # NOTHING invoked any of them — no workflow, no TESTING.md row, not the
    # fast-PR spine. A spec that promises enforcement no job delivers is worse
    # than an absent gate: the promise is what stops the next person looking.
