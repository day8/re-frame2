    # rf2-m8dbb9, rf2-6nrk8x, rf2-khecvs), nested-run banner+tally
    # (rf2-8n97n.1/.2/.3), the test-ns-hook fallback (rf2-g92dsm), the
    # central stderr buffer + red-replay (rf2-nrk066), exit-code integrity
