  # under the real gate (217 failures / 1 error) in three shapes —
  # dev-instrumentation assertions written inline with semantics,
  # `data-rf2-source-coord` / `data-rf-view` annotations that are prod-elided
  # at the core `reg-view` boundary, and the error-projection cluster whose
  # status codes depend on the development trace listener (a documented design
  # choice with a real production consequence, held under rf2-rqje9). The
  # roster and the triage bead (rf2-lwtlk) live in
  # `scripts/test-ssr-prod-gate.sh`. What runs here today is 28 namespaces /
  # 247 tests / 1379 assertions, green. The roster is an EXCLUSION list, so a
