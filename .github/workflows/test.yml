      # ring/concurrency_stress_test, ring/streaming_robustness_test), and
      # jvm-ssr does not cover ssr-ring's distinct surface — without this
      # job none of them would run in CI.
      #
      # The ssr-ring artefact is the Ring/Pedestal host adapter (Spec
      # 011 §HTTP response contract). It materialises :response into a
      # Ring map, including cookies (RFC 6265), redirects, and the
      # per-request frame lifecycle. The JVM e2e validator spins up a
      # real Jetty host on an ephemeral port and hits it with
      # java.net.http to observe bytes on the wire. The cognitect
      # test-runner returns non-zero on any failure; this gate
      # surfaces an ssr-ring regression at the ssr-ring artefact's CI
      # step rather than leaving it uncovered.
      - name: Run JVM tests (ssr-ring artefact)
        run: clojure -M:test

  jvm-node-crossing:
    name: JVM->Node->JVM crossing (ssr-ring clojure -M:crossing-test)
    needs: detect_changed_surfaces
    # Fires on either half of the crossing: the JVM adapter and its witness
    # live in implementation/ssr-ring (implementation_jvm), the sidecar it
    # spawns lives in implementation/ssr-node (ssr_node). A change to either
    # can break the crossing, so either re-proves it.
    if: needs.detect_changed_surfaces.outputs.implementation_jvm == 'true' || needs.detect_changed_surfaces.outputs.ssr_node == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: implementation/ssr-ring
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Clojure CLI
        run: "$GITHUB_WORKSPACE/.github/scripts/install-clojure-cli.sh"

      # The sidecar is a Node process — slice B's launcher
      # (implementation/ssr-node/bin/serve.cjs) on `node:` builtins alone, so
      # there is no `npm ci` here for the same reason node-ssr-node has none.
      # Node 24 is the version that lane pins and the manifest's `engines`.
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '24'

      - name: Cache Maven / gitlibs
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          # Deliberately the SAME key as jvm-ssr-ring: the same artefact's
          # classpath, one alias over.
          key: ${{ runner.os }}-clj-ssr-ring-${{ hashFiles('implementation/ssr-ring/deps.edn', 'implementation/ssr/deps.edn', 'implementation/core/deps.edn', 'implementation/schemas/deps.edn', 'implementation/flows/deps.edn', 'implementation/routing/deps.edn', 'implementation/machines/deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-clj-ssr-ring-
            ${{ runner.os }}-clj-

      # The JVM -> Node -> JVM crossing, named for what it is.
      # `re-frame.ssr.ring.node/renderer` is the one non-local implementation
      # of ssr-handler's :renderer seam: it projects the settled
      # request frame under :render-state, POSTs it to the bounded
      # sidecar, and takes back body markup and nothing else. The witness
      # (implementation/ssr-ring/test/re_frame/ssr/ring/node_crossing_test.clj,
      # tagged :crossing) spawns the sidecar launcher on a plain fixture render
      # module on port 0, parses its ready line, and proves the drain-first
      # state crossing, the JVM-owned document around Node's bytes, render-
      # state != payload, the deadline / refusal / unreachable / build-skew
      # arms as distinct projected 5xx codes, frame + sidecar cleanup on
      # success and failure, and prints one observational crossing timing —
      # a number in this log, not a threshold.
      #
      # It is its OWN alias and its OWN job so the ssr-ring `:test` lane one
      # job up stays Node-free: `:test` excludes the tag, `:crossing-test`
      # includes only it, and a JVM developer without Node never runs this.
      - name: Run the JVM->Node->JVM crossing witness (ssr-ring :crossing-test)
        run: clojure -M:crossing-test

  jvm-epoch:
    name: JVM epoch (clojure -M:test)
    needs: detect_changed_surfaces
    if: needs.detect_changed_surfaces.outputs.implementation_jvm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: implementation/epoch
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Clojure CLI
        run: "$GITHUB_WORKSPACE/.github/scripts/install-clojure-cli.sh"

      - name: Cache Maven / gitlibs
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: ${{ runner.os }}-clj-epoch-${{ hashFiles('implementation/epoch/deps.edn', 'implementation/core/deps.edn', 'implementation/schemas/deps.edn', 'implementation/flows/deps.edn', 'implementation/routing/deps.edn', 'implementation/machines/deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-clj-epoch-
            ${{ runner.os }}-clj-

      - name: Run JVM tests (epoch artefact)
        run: clojure -M:test

  # The epoch artefact under the REAL production gate.
  #
  # WHY IT EXISTS. `re-frame.interop/debug-enabled?` is a JVM `def` read ONCE at
  # namespace-load time from `-Dre-frame.debug` / `RE_FRAME_DEBUG`. Without
  # this lane, `implementation/epoch/test/re_frame/
  # epoch_jvm_prod_gate_test.clj`, the suite whose SUBJECT is the production
  # posture, would be executed by no lane under it.
  #
  # WHY IT MATTERS MORE FOR EPOCH THAN FOR THE OTHER PROD-GATE LANES. The
  # gate's whole security rationale is that the epoch ring must NOT
  # retain `:db-before` / `:db-after` / raw `:trace-events` in a production
  # server's heap, and the suite asserting that retention is elided must run
  # under the posture it is about.
  #
  # WHAT `with-redefs` ALREADY COVERED, stated precisely so this job is not
  # oversold. Epoch reads the gate only as `(when interop/debug-enabled? …)`
  # inside fn bodies — a runtime Var deref — so the twelve `with-redefs`
  # deftests do reach epoch's own gated branches. What they cannot reach is what
  # the framework decided while it LOADED under the dev default: top-level
  # registrations, `defonce` initialisation, interceptor chains composed once at
  # load. A total `dispatch-sync` failure under the documented gate lives in
  # exactly that half, and stays green under `with-redefs`. This job
  # executes that half.
  #
  # WHY IT IS A SEPARATE JOB AND NOT A FLAG ON `jvm-epoch`. The two lanes make
  # different claims and neither substitutes for the other: `jvm-epoch` proves
  # epoch's behaviour WITH its instrumentation live, this job proves what must
  # hold WITHOUT it. Same artefact, same classpath (the `:prod-gate` alias is a
  # modifier composed onto `:test`), same cache key — only the JVM posture
  # differs.
  #
  # THE JOB CANNOT PASS VACUOUSLY, and here that guard is load-bearing in a way
  # it is not for the other prod-gate lanes. `re-frame.epoch-prod-gate-lane-pin-test` runs
  # inside the lane and asserts unconditionally that `re-frame.debug` reads
  # `"false"` on THIS JVM and that `interop/debug-enabled?` honoured it. Epoch's
  # runtime is gated throughout, so nearly every assertion this lane makes is an
  # assertion of ABSENCE — no record in the ring, no callback, `restore-epoch!`
  # returning `false`. A lane running in the WRONG posture would fail to observe
  # those things too, for the opposite reason, so a lost flag would not weaken
  # this job's greens, it would INVERT what they mean.
  #
  # SCOPE — and this roster is lopsided for a structural reason, not as debt.
  # Most of epoch's test namespaces are red under the real gate and one does
  # not terminate. That is because epoch's production posture
  # is that the artefact is OFF: a suite exercising epoch's recording, restore,
  # projection or silencing behaviour has no behaviour to exercise here. Unlike
  # the core and routing lanes, whose exclusion lists shrink as
  # dev-instrumentation assertions get split out, this one is not expected to
  # empty. The roster and the reasoning live in
  # `scripts/test-epoch-prod-gate.sh`. The roster
  # is an EXCLUSION list, so a new namespace joins this lane by default and has
  # to be excluded deliberately.
  jvm-epoch-prod-gate:
    name: JVM epoch under the production gate (-Dre-frame.debug=false)
    # Same surface gate as jvm-epoch: it is the same artefact.
    needs: detect_changed_surfaces
    if: needs.detect_changed_surfaces.outputs.implementation_jvm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Clojure CLI
        run: "$GITHUB_WORKSPACE/.github/scripts/install-clojure-cli.sh"

      # Deliberately the SAME cache key as jvm-epoch — identical classpath, so
      # the two jobs warm one cache instead of competing for two.
      - name: Cache Maven / gitlibs
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: ${{ runner.os }}-clj-epoch-${{ hashFiles('implementation/epoch/deps.edn', 'implementation/core/deps.edn', 'implementation/schemas/deps.edn', 'implementation/flows/deps.edn', 'implementation/routing/deps.edn', 'implementation/machines/deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-clj-epoch-
            ${{ runner.os }}-clj-

      # The script prints the property, the pin, the roster size and the
      # excluded count before it runs anything, so the job's own log carries the
      # evidence of which posture it ran in.
      - name: Run the epoch suite under -Dre-frame.debug=false
        run: bash scripts/test-epoch-prod-gate.sh

  jvm-resources:
    name: JVM resources (clojure -M:test)
    # The resources artefact (day8/re-frame2-resources, EP-0003) is on the
    # root CLJS/test classpath (implementation/deps.edn +
    # shadow-cljs.edn) and ships its own JVM `:test` alias (414 tests:
