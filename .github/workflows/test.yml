name: tests

# Cancel older in-flight runs of THIS workflow on the same PR when a
# force-push / rebase lands a new HEAD. Without this, a PR shows roughly
# double its usual check count: the worker rebases onto
# main mid-review, fires a fresh workflow_run on the new SHA, the old
# SHA's run stays in-flight (or completes), and the PR rollup view
# counts both. Up to 2× runner cost on a heavy PR.
#
# Keying: for PRs, group on `pr-<num>` so every push to the same PR
# branch reuses the slot. For pushes to main, group on the run-id so
# each main-tip commit gets its own independent run (we don't want
# successive main pushes to cancel each other — they have distinct
# coverage value). On a manual workflow_dispatch the group is per-ref
# so two manual dispatches to the same branch coalesce.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [main]
    # Push-only filter: docs/site-only pushes are covered by docs.yml and
    # bead-only pushes should run no CI. Pull requests deliberately stay
    # unfiltered so required checks cannot remain permanently pending.
    paths-ignore:
      - '.beads/**'
      - 'docs/**'
      - 'spec/**'
      - 'skills/**/*.md'
      - 'tools/**/*.md'
      - 'mkdocs.yml'
      - 'mkdocs_hooks.py'
      - 'TESTING.md'
      - 'requirements.txt'
      # (`scripts/check_doc_slugs.py` and its fixtures are deliberately NOT
      # ignored here — this workflow runs that gate, so a push touching the
      # checker must run the workflow that runs it.
      # `scripts/check_inject_cofx_residue.py` is absent from this list for
      # the same reason.)
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [main]

# Fast PR spine jobs stay always-on: lockstep drift, skill/MCP drift,
# and JS harness self-tests. These are cheap (no JVM/Node build) and act
# as the always-present minimum so the aggregator never resolves to an
# all-skipped phantom. The heavier core JVM (jvm-core) and CLJS node
# integration (cljs) jobs are job-level gated on the changed-surface
# classifier: they run on every code surface (core /
# adapters / per-feature artefacts / fixtures / build config, and — for
# cljs — the tools/{story,xray} CLJS test trees the consolidated
# :node-test build compiles). A DOCS-ONLY PR IS NOT A GUARANTEED
# SKIP: the classifier also arms implementation_jvm for
# prose that a test.yml suite pins — jvm-core's own comment names which
# prose, and what escapes. Expensive browser, bundle, examples,
# Story/Xray, tool, template, MCP-live, and skill structural jobs are
# likewise guarded. The workflow's pull_request
# trigger stays UNFILTERED so the `All required checks passed` aggregator
# is always present (job-level gating, NOT a trigger path filter — a
# path-filtered trigger would make the required aggregator absent on
# filtered PRs = a phantom-pending trap).
# Skipped surface-gated jobs are not required coverage; the
# nightly/manual workflow carries the rigorous full sweep.

jobs:
  detect_changed_surfaces:
    name: Detect changed test surfaces
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      implementation_jvm: ${{ steps.detect.outputs.implementation_jvm }}
      cljs_node_test: ${{ steps.detect.outputs.cljs_node_test }}
      adapter_diagnostic: ${{ steps.detect.outputs.adapter_diagnostic }}
      # Test-React's own signal. Declared HERE and not only
      # emitted: a job reads `needs.<job>.outputs.<name>`, which resolves to
      # the empty string unless the producing job declares it, so an
      # emitted-but-undeclared output makes every `== 'true'` false — a gate
      # that can never fire, and silently. The Story outputs are pinned
      # against the same never-fires mode.
      test_react_jvm: ${{ steps.detect.outputs.test_react_jvm }}
      cljs_browser: ${{ steps.detect.outputs.cljs_browser }}
      examples_compile: ${{ steps.detect.outputs.examples_compile }}
      cljs_prod: ${{ steps.detect.outputs.cljs_prod }}
      bundle_isolation: ${{ steps.detect.outputs.bundle_isolation }}
      reagent_slim_bundle: ${{ steps.detect.outputs.reagent_slim_bundle }}
      adapter_testbed_smokes: ${{ steps.detect.outputs.adapter_testbed_smokes }}
      tools_jvm: ${{ steps.detect.outputs.tools_jvm }}
      tools_jvm_machines_viz: ${{ steps.detect.outputs.tools_jvm_machines_viz }}
      tools_jvm_testbed_support: ${{ steps.detect.outputs.tools_jvm_testbed_support }}
      tools_cljs_machines_viz: ${{ steps.detect.outputs.tools_cljs_machines_viz }}
      machines_viz_viewer_page: ${{ steps.detect.outputs.machines_viz_viewer_page }}
      template_expensive: ${{ steps.detect.outputs.template_expensive }}
      mcp_conformance: ${{ steps.detect.outputs.mcp_conformance }}
      mcp_live: ${{ steps.detect.outputs.mcp_live }}
      story_xray_browser: ${{ steps.detect.outputs.story_xray_browser }}
      story_full_gate: ${{ steps.detect.outputs.story_full_gate }}
      story_static_gate: ${{ steps.detect.outputs.story_static_gate }}
      tenant_switcher_smoke: ${{ steps.detect.outputs.tenant_switcher_smoke }}
      skills_structural: ${{ steps.detect.outputs.skills_structural }}
      playground: ${{ steps.detect.outputs.playground }}
      migration_fresco_codemod: ${{ steps.detect.outputs.migration_fresco_codemod }}
      fresco_controlled: ${{ steps.detect.outputs.fresco_controlled }}
      fresco_hmr: ${{ steps.detect.outputs.fresco_hmr }}
      migration_v1_codemod: ${{ steps.detect.outputs.migration_v1_codemod }}
      ssr_node: ${{ steps.detect.outputs.ssr_node }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0

      # Hand the classifier the event's ACCEPTED BASE so a
      # MULTI-COMMIT push to main is classified over the WHOLE push rather than
      # over its tip alone. One push produces one run, at the tip, so the
      # script's HEAD^ default would see only the last commit of a
      # rebase-merged PR and commits 1..N-1 would reach main having armed
      # nothing — measured at 5 code-carrying commits in 60.
      # `github.event.before` is the tip main pointed at before this push; it
      # is empty on a pull_request (that branch of the script is correct
      # as it stands) and all-zeros on a first push to a fresh ref, both of
      # which the script folds back to its HEAD^ default.
      #
      # Via `env:`, never interpolated into the run body — portability.yml's
      # rule for the same context value on the ai/ ratchet, so the step is
      # injection-safe whatever the event carries.
      #
      # The `fetch-depth: 0` above is what makes the base resolvable without a
      # fetch: it can be arbitrarily deep. (portability.yml checks out at depth
      # 2 and so must fetch its base by name; this job need not.) GitHub already
      # evaluates this workflow's own push `paths-ignore` filter across the
      # whole push, so the trigger and the classifier agree about what the
      # push changed.
      - name: Classify changed surfaces
        id: detect
        env:
          CHANGED_SURFACES_BASE_REF: ${{ github.event.before }}
        run: ./.github/scripts/report-changed-surfaces.sh

  # PR-time drift detection for the lockstep-version contract.
  # Fast — the script is shared with
  # release.yml's pre-deploy gate so the contract has a single source
  # of truth.
  verify-version-lockstep:
    name: Verify lockstep version contract (rf2-ace2)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      # Check the checkers BEFORE trusting their verdict on the tree. Both of
      # this gate's buildability assertions read EDN structure, because a
      # line-oriented text grep is wrong for both. A runtime git-coordinate
      # grep can only see a coordinate when the library symbol and
      # `{:git/url` sit on the same physical line, so ordinary multiline
      # deps.edn layout produces no finding. A clein `:main` grep asks the
      # WHOLE FILE for a line-initial `:main` rather than the
      # `:aliases -> :clein/build` map it claims to check, so a `:main` in any
      # other alias passes it and a one-line build alias fails it. Either
      # gate's green would be a property of one file's whitespace rather than
      # of the tree. This step pins every layout (plus the comment / `#_`
      # discard / string-literal / alias-scoping cases) so neither can
      # regress quietly.
      - name: Self-test the lockstep gate's own checkers
        run: ./.github/scripts/verify-version-lockstep.sh --self-test

      - name: Verify lockstep version contract
        run: ./.github/scripts/verify-version-lockstep.sh

  # The repo's always-on invariant spine: every `scripts/check_*.py` gate that
  # is pure Python stdlib and cheap enough to run on every PR regardless of
  # which surface it touches. The set spans four families — AI-skill contracts,
  # skill ↔ MCP tool catalogues, spec/impl keyword + namespace catalogues, and
  # retired-spelling / ambient-read source scans — which is why the job is named
  # for the SCOPE rather than for any one checker. Each
  # family's rationale is documented above its own steps.
  #
  # AGGREGATING, NOT SHORT-CIRCUITING. Every checker step below carries
  # `continue-on-error: true` and an `id`; the final "Report every failing
  # invariant check" step decides the job's result and prints EVERY failure.
  # Under plain `bash -e` semantics the job would stop at the first red, so a
  # fix worker would see one broken invariant per full CI cycle and merely
  # move the red. One round-trip reports them all.
  #
  # The job's `name:` is not a required status check — the ruleset requires the
  # `All required checks passed` aggregator, which depends on the job ID
  # `verify-skill-mcp-drift`. Keep that ID stable; the display name is free.
  #
  # Fast — pure Python stdlib, no setup beyond actions/setup-python.
  # check_skill_mcp_drift.py carries a `_BASELINE` set of known drift; trim
  # entries as their drift is resolved.
  verify-skill-mcp-drift:
    name: Repo invariant checks (skills, MCP, catalogues, namespaces)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'

      # PR-time drift detection for the skill ↔ MCP tool-catalogue contract.
      # When an MCP server adds a tool (e.g. re-frame2-pair-mcp's
      # `subscribe`/`unsubscribe`) the consumer skill's `allowed-tools` front-matter
      # doesn't auto-update; the agent host blocks the new tool even though the
      # server advertises it. scripts/check_skill_mcp_drift.py diffs every
      # MCP-server tool catalogue against its consumer skill's allow-list and
      # fails on drift in either direction.
      - name: Diff MCP tool catalogues vs skill allowed-tools
        id: check_skill_mcp_drift
        continue-on-error: true
        run: python scripts/check_skill_mcp_drift.py --verbose --ci

      # Self-test of every axis the checker grades, not only the title-safety
      # one the step name mentions: title-safety, doc-coverage, arg-signature,
      # body-path-identity and single-host. For title-safety it proves the
      # all-consumers gh-issue title-safety backstop actually fires when a
      # consumer's follow-up allowance is removed (and that link-presence
      # consumers stay green) — i.e. each axis is a real check, not a
      # no-op that vacuously passes.
      - name: Self-test the title-safety backstop
        id: check_skill_mcp_drift_selftest
        continue-on-error: true
        run: python scripts/check_skill_mcp_drift.py --self-test --ci

      # Cite-integrity guard: every M-id the re-frame-migration
      # skill cites must name a consistent rule in MIGRATION.md. Catches the
      # id-collision / phantom-cite class (a skill citing an M-id for a rule
      # MIGRATION.md assigns to something else).
      - name: Self-test the cite-integrity guard
        id: check_skill_migration_cites_selftest
        continue-on-error: true
        run: python scripts/check_skill_migration_cites.py --self-test

      - name: Verify skill M-id cites resolve in MIGRATION.md
        id: check_skill_migration_cites
        continue-on-error: true
        run: python scripts/check_skill_migration_cites.py --verbose --ci

      # M-11 / M-13 contract-drift guard. The migration skill + corpus must not
      # carry either of two stale CONTRACT claims the spec/runtime/tests
      # contradict: (M-11) plain Reagent fns "work
      # inside any established frame scope" / "inherit the frame-provider's frame
      # ambiently" — false; a plain fn carries no `:contextType`, so a bare
      # ambient subscribe/dispatch raises `:rf.error/no-frame-context` (EP-0002;
      # only a reg-view'd view reads the provider frame); and (M-13)
      # `reg-event-error-handler` "moved to frame-level `:on-error`" — false;
      # there is no per-frame recovery policy, recovery is
      # framework-owned, observability is `register-error-listener!` /
      # `register-listener!`. Because the skill is the agent's source of truth for
      # what breaks, a stale contract claim produces a wrong migration. The guard
      # fires only on the stale ASSERTION shape (never the corrected negation, and
      # never the unrelated live machine-`:spawn :on-error` / route-`:on-error`
      # surfaces). Self-test first (proves it fires on each stale shape + stays
      # green on the corrected wording), then the live scan asserts the skill +
      # corpus are clean. See scripts/check_skill_migration_contract_drift.py.
      - name: Self-test the M-11/M-13 contract-drift guard
        id: check_skill_migration_contract_drift_selftest
        continue-on-error: true
        run: python scripts/check_skill_migration_contract_drift.py --self-test

      - name: Verify migration skill M-11/M-13 contract wording
        id: check_skill_migration_contract_drift
        continue-on-error: true
        run: python scripts/check_skill_migration_contract_drift.py --verbose --ci

      # O-16 / O-17 router-leaf drift guard. The re-frame-migration
      # skill's O-16 (routing) / O-17 (nested routing) leaves are thin ROUTERS —
      # they resolve the caller to the forced-framed full-owner companion leaf
      # rather than re-teaching the whole surface. If a leaf silently stops being
      # a thin router (drops the redirect, or grows a competing full teaching), or
      # its companion stops being the forced-framed owner, the migration guidance
      # forks. This guard pins the router→companion shape for both pairs.
      # Self-test first
      # (proves it fires on the drift shapes), then the live scan asserts clean.
      - name: Self-test the O-16/O-17 router-leaf drift guard
        id: check_skill_migration_o1617_router_drift_selftest
        continue-on-error: true
        run: python scripts/check_skill_migration_o1617_router_drift.py --self-test

      - name: Verify migration O-16/O-17 leaves stay thin routers
        id: check_skill_migration_o1617_router_drift
        continue-on-error: true
        run: python scripts/check_skill_migration_o1617_router_drift.py --verbose --ci

      # Foundation-order guard: the re-frame2-implementor skill must
      # keep Spec 015 (Data Classification — v1-required, rides the 009 emission
      # boundary) INSIDE the core-complete gate. Catches the drift where an entry
      # point reads "001 -> 002 -> 006 -> 004 -> 009 -> optional" (the first
      # :core/* gate BEFORE Data Classification) — which would let a fresh
      # kickoff-prompt session declare "v1-core-complete" without the required
      # privacy/large-payload elision surface, leaking marked data through
      # observability. The self-test proves the guard fires on the drift shapes
      # (not a vacuous pass) before the live scan asserts the skill is clean.
      - name: Self-test the implementor foundation-order guard
        id: check_skill_implementor_order_selftest
        continue-on-error: true
        run: python scripts/check_skill_implementor_order.py --self-test

      - name: Verify the implementor skill keeps Spec 015 in the core gate
        id: check_skill_implementor_order
        continue-on-error: true
        run: python scripts/check_skill_implementor_order.py --verbose --ci

      # Partition / HTTP-fx / API-name drift guard:
      # the re-frame2-implementor skill is a control surface — API names and
      # contract shapes copied from it become a port author's tests + public
      # surface. This guard fails the build if the skill introduces:
      # `deregister-listener!` (verb is `unregister-listener!`); bare `:http`
      # described as the Spec 014 managed HTTP fx (it is `:rf.http/managed`);
      # public `dispose-adapter!` (the public verb is `destroy-adapter!`,
      # `:dispose-adapter!` is the adapter-spec map's internal slot); or a
      # `reg-machine` line implying top-level `:sensitive` / `:large` keys
      # (machine `:data` is the schema-first `:data-schema` exception). The
      # self-test proves the guard fires on the drift shapes before the live
      # scan asserts the skill is clean.
      - name: Self-test the implementor partition/HTTP/API-name guard
        id: check_skill_implementor_partition_drift_selftest
        continue-on-error: true
        run: python scripts/check_skill_implementor_partition_drift.py --self-test

      - name: Verify the implementor skill partition/HTTP/API-name teaching
        id: check_skill_implementor_partition_drift
        continue-on-error: true
        run: python scripts/check_skill_implementor_partition_drift.py --verbose --ci

      # No-bead-id + verification-posture drift guard for the re-frame2
      # (authoring) skill. The existing no-bead-id guard was scoped to
      # re-frame2-implementor only, so the authoring skill was unprotected. A
      # senior review caught two regressions there: (1) internal `rf2-` tracker
      # ids leaked into user-facing leaves (the skill's own spec/design.md L10
      # bars them); (2) the verification posture drifted to instructing the
      # AGENT to run gates (a Bash test/compile/lint allow-list + a "Verify what
      # you changed" section), contradicting the Q14 / L3 lock that the AUTHOR
      # runs the tests and the skill stops at writing the code. This guard fails
      # the build on either re-introduction across SKILL.md / README.md /
      # examples-map.md / references|patterns|decision-trees/**. The self-test
      # proves it fires on the drift shapes before the live scan asserts clean.
      - name: Self-test the re-frame2 no-bead-id + verify-posture guard
        id: check_skill_re_frame2_drift_selftest
        continue-on-error: true
        run: python scripts/check_skill_re_frame2_drift.py --self-test

      - name: Verify the re-frame2 skill carries no bead-ids / agent-run gates
        id: check_skill_re_frame2_drift
        continue-on-error: true
        run: python scripts/check_skill_re_frame2_drift.py --verbose --ci

      # In-package link-resolution guard: every packaged skill
      # (`package.json` + `.claude-plugin/plugin.json`) ships self-contained,
      # so every intra-package relative link from a shipped doc (SKILL.md /
      # README.md / references/**.md) must resolve to a file the `package.json`
      # `files` allow-list ships — otherwise a packaged install resolves the
      # link to a missing file at exactly the point a user is configuring the
      # skill. Links that escape the package (`../`) are the repo-wide doc-slug
      # gate's surface, not this one's.
      - name: Self-test the skill package-refs guard
        id: check_skill_package_refs_selftest
        continue-on-error: true
        run: python scripts/check_skill_package_refs.py --self-test

      - name: Verify packaged-skill doc links resolve in-package
        id: check_skill_package_refs
        continue-on-error: true
        run: python scripts/check_skill_package_refs.py --verbose --ci

      - name: Verify skill installer behavior in isolated destinations
        id: check_skill_installers
        continue-on-error: true
        run: python scripts/check_skill_installers.py

      # Re-authoring/spec drift guard for skills/re-frame2-pair.
      # The skill's spec/*.md + docs/initial-spec.md are the re-author
      # source material (not loaded during normal operation, so the
      # mcp-drift gate above never reads them) — so they can silently
      # encode a retired tool such as `inject-runtime`, a two-transport /
      # bash-shim-fallback model, or a restore-failure-mode count that
      # disagrees with the live Tool-Pair §Time-travel table. The gate
      # fails when a retired tool/transport name reappears in a
      # live-contract framing, so a future re-author can't regress the
      # MCP-only / default-gated posture.
      - name: Self-test the re-frame2-pair re-authoring drift guard
        id: check_skill_pair_authoring_drift_selftest
        continue-on-error: true
        run: python scripts/check_skill_pair_authoring_drift.py --self-test

      - name: Verify re-frame2-pair re-authoring docs match the MCP-only contract
        id: check_skill_pair_authoring_drift
        continue-on-error: true
        run: python scripts/check_skill_pair_authoring_drift.py --verbose --ci

      # Setup-skill counter/lifecycle drift guard. The
      # re-frame2-setup skill's first-counter success criterion breaks if the
      # event/sub ids its substrate view snippets DISPATCH/SUBSCRIBE drift from
      # the ids it tells the author to INSTALL (an agent combining one leaf's
      # `:counter/inc`/`:count` with another snippet's
      # `:counter/increment`/`:counter/value` gets a nil-rendering, no-op
      # counter). The guard also pins the hot-reload lifecycle (`:init-fn` is the
      # one-time startup hook, `^:dev/after-load` is the reload re-render hook —
      # not "`:init-fn` re-runs each hot reload") and the current Spec 006
      # adapter-key vocabulary (`:make-state-container`, not bare
      # `state-container`). Self-test proves it fires on the drift shapes before
      # the live scan asserts the skill is clean.
      - name: Self-test the setup-skill counter/lifecycle drift guard
        id: check_skill_setup_counter_drift_selftest
        continue-on-error: true
        run: python scripts/check_skill_setup_counter_drift.py --self-test

      - name: Verify re-frame2-setup counter vocabulary + lifecycle wording
        id: check_skill_setup_counter_drift
        continue-on-error: true
        run: python scripts/check_skill_setup_counter_drift.py --verbose --ci

      # Eval-packaging-consistency guard. There is NO repo-wide ship/no-ship
      # policy for a skill's
      # `evals/` dir — both stances coexist and are valid: most skills EXCLUDE
      # it from `package.json` `files` (a repo-maintenance artifact; consumers
      # run the skill, they don't re-run its gate), a minority INCLUDE it so a
      # vendored copy can re-run its own gate. The invariant the gate enforces
      # is PACKAGE/DOCS AGREEMENT: for each packaged skill with an `evals/` dir
      # on disk, its prose (evals/README.md or the README directory-contents
      # block) and its `files` array must not CONTRADICT each other on whether
      # `evals/` ships. Catches that drift class generically without
      # forcing one policy; silence is not a contradiction. The self-test proves
      # the gate fires on both contradiction directions (and stays green on both
      # agree cases + the sibling-mention guard) before the live scan asserts
      # all current skills agree.
      - name: Self-test the eval-packaging-consistency guard
        id: check_skill_eval_packaging_selftest
        continue-on-error: true
        run: python scripts/check_skill_eval_packaging.py --self-test --ci

      - name: Verify skill eval-packaging docs agree with package.json files
        id: check_skill_eval_packaging
        continue-on-error: true
        run: python scripts/check_skill_eval_packaging.py --verbose --ci

      # Eval-docs drift guard. Each packaged
      # skill's eval harness README carries a hand-maintained coverage table,
      # total count, and per-axis breakdowns that silently fall behind evals.json
      # (a README saying "Six evals …" beside a seventh eval). The gate is
      # multi-target — it scans every eval harness.
      # It also runs in the local pre-checkin spine (scripts/test-fast-pr.sh);
      # running it in CI means a contributor skipping the local spine cannot
      # land eval-doc drift. Self-test first (proves it fires on count/name/tally drift),
      # then the live scan asserts each README agrees with its JSON.
      - name: Self-test the eval-docs drift guard
        id: check_skill_eval_docs_selftest
        continue-on-error: true
        run: python scripts/check_skill_eval_docs.py --self-test

      - name: Verify skill eval-docs match evals.json
        id: check_skill_eval_docs
        continue-on-error: true
        run: python scripts/check_skill_eval_docs.py --verbose --ci

      # Xray tab-inventory drift guard. The re-frame2-xray skill
      # enumerates the Dynamic-tab inventory that must match the live tool's tab
      # set; a tab added/removed/renamed in the tool without the skill update (or
      # vice-versa) forks the agent's mental model of the inspector. This guard
      # pins the two in lockstep. Self-test first (proves it fires on the drift shapes),
      # then the live scan asserts the tab inventory is in sync.
      - name: Self-test the Xray tab-inventory drift guard
        id: check_skill_xray_tab_inventory_drift_selftest
        continue-on-error: true
        run: python scripts/check_skill_xray_tab_inventory_drift.py --self-test

      - name: Verify re-frame2-xray tab inventory matches the tool
        id: check_skill_xray_tab_inventory_drift
        continue-on-error: true
        run: python scripts/check_skill_xray_tab_inventory_drift.py --verbose --ci

      # SKILL-REDIRECT.md anchor-coupling guard. SKILL-REDIRECT.md is
      # the single coupling point for deep-dive routing from the AI skills; leaf
      # files cite its bullet labels (e.g. `SKILL-REDIRECT.md -> *EP - Frames
      # (002)*`). A rename/restructure of a bullet label leaves every leaf
      # citation stale silently. This guard asserts every leaf reference resolves
      # to a real bullet label. Its docstring designates it a CI gate.
      # Pure stdlib, no self-test flag (a single
      # bidirectional scan); silent on success.
      - name: Verify SKILL-REDIRECT.md leaf-anchor references resolve
        id: check_skill_redirect_anchors
        continue-on-error: true
        run: python scripts/check_skill_redirect_anchors.py

      # EP-0007 §Enforcement retired-spelling gate. EP-0007 rule 2
      # ("no stable accepted synonyms") gets the no-floor-lint treatment "where
      # shapes allow": a retired spelling appearing in repo source is a CI
      # failure, not a doc note. THREE renames are lintable — the bare
      # `:frame` event-context COEFFECT read (the spelling is
      # `:rf.frame/id`), the `:url` / `:to` redirect-TARGET key on an SSR
      # redirect fx (the key is `:location`), and route metadata
      # `:query-retain` (retired by EP-0037 R5 with no alias). The
      # gate scopes to the retired SHAPES (the coeffect-read accessors; a
      # `:url`/`:to` key in a `:rf.server/(safe-)redirect` form; the
      # `:query-retain` keyword token) so it NEVER fires on the sanctioned
      # public `:frame` opt, the trace `:frame` tag, the fx-handler ctx
      # `:frame`, client-navigation `:url`, or a backticked retirement note.
      # Pure Python stdlib (no extra deps). Self-test first (proves the gate
      # fires on each retired shape + stays green on every sanctioned
      # counterpart), then the live scan asserts the corpus is clean.
      #
      # The live scan covers EVERY Clojure source tree, not just
      # `implementation/`. Both invocations are bare because the roster is
      # declared in the script (`DEFAULT_SCAN_DIRS`), so this one and
      # `scripts/test-fast-pr.sh`'s cannot widen apart. Hosted in this
      # always-on PR-spine python job so a retired spelling blocks the merge
      # regardless of which surface a PR touches. See
      # scripts/check_retired_spellings.py.
      - name: Self-test the EP-0007 retired-spelling gate
        id: check_retired_spellings_selftest
        continue-on-error: true
        run: python scripts/check_retired_spellings.py --self-test --verbose

      - name: Verify framework source carries no retired spelling (EP-0007)
        id: check_retired_spellings
        continue-on-error: true
        run: python scripts/check_retired_spellings.py --verbose

      # EP-0010 §Validation/Conformance ambient-durable-read gate.
      # EP-0010 (Causal World Inputs) makes the frame fold honest: a
      # transition's DURABLE result must be a function of prior frame-state
      # plus explicit causal tokens, never of a host fact read ambiently at
      # the durable write site. The EP's §Validation/Conformance (step 9 of
      # the errata ledger) asks a conforming impl to ship a STATIC LINT that
      # flags direct ambient reads (clock — interop/now-ms, js/Date.now;
      # RNG — rand/random-uuid/getRandomValues; browser facts — location,
      # navigator, localStorage/sessionStorage, media-query) in code paths
      # that can write durable frame-state (resource reducers, work-ledger
      # writers, reply handlers, mutation handlers, restore/hydration
      # installers, machine snapshot writers). A MANUAL stray-read sweep does
      # not regression-protect future code; this gate does. Like the
      # retired-spelling gate it is conservative — it scopes to the exact
      # violating SHAPE (a durable-state field key whose VALUE is a direct
      # ambient read, inside one of the enumerated durable-write namespaces),
      # NOT the bare symbol (which fires on 100+ sanctioned sites: trace
      # stamps, perf probes, timer deadlines, freshness DECISION reads, the
      # transport-boundary causal read). It allowlists trace/perf code,
      # effect interpreters before they dispatch a reply token, timer
      # scheduling, host-transient side tables, diagnostics, and effect-side
      # crypto (Open-Issue 3 rider c). Pure Python stdlib. Self-test first
      # (proves the gate FLAGS each planted ambient durable read + PASSES
      # every sanctioned counterpart), then the live scan asserts the
      # durable-write namespaces are clean. Hosted in this always-on PR-spine
      # python job so an ambient durable read blocks the merge regardless of
      # which surface a PR touches. See scripts/check_ambient_durable_reads.py.
      - name: Self-test the EP-0010 ambient-durable-read gate
        id: check_ambient_durable_reads_selftest
        continue-on-error: true
        run: python scripts/check_ambient_durable_reads.py --self-test --verbose

      - name: Verify durable-write namespaces carry no ambient world read (EP-0010)
        id: check_ambient_durable_reads
        continue-on-error: true
        run: python scripts/check_ambient_durable_reads.py --verbose

      # Thrown-error human-message corpus gate (Spec 009 §The
      # thrown-error shape). A framework thrown-error's `ex-message` is a
      # HUMAN sentence + trailing
      # `[:rf.error/<id>]` token, never the bare stringified discriminator
      # keyword (`:rf.error/id` ex-data is the SOLE machine discriminator). The
      # conformance test (thrown_error_message_conformance_cljs_test)
      # is a CURATED allow-list — it exercises a handful of central sites
      # in-process, so a new `(ex-info ":rf.error/…")` site is
      # invisible to it. This gate covers the
      # corpus: a source scan that fails on ANY framework
      # `(ex-info …)` whose MESSAGE position is a bare `:rf.*` discriminator
      # keyword (literal string, `(str :rf.*)`, `(str error-kw/error-id)`, or
      # `(str (:rf.error/id <map>))`). It scopes to the ex-info FIRST argument,
      # so a `:rf.error/…` keyword as a :reason value / ex-data slot / trace
      # arg never fires; `;`-comments are masked. Pure Python stdlib. Self-test
      # first (proves it FIRES on each bare-keyword shape + stays GREEN on the
      # conformant counterparts), then the live scan asserts implementation/
      # framework source is clean. Hosted in this always-on PR-spine python job
      # so a keyword-only thrown message blocks the merge regardless of which
      # surface a PR touches. See scripts/check_thrown_error_messages.py.
      - name: Self-test the thrown-error human-message gate
        id: check_thrown_error_messages_selftest
        continue-on-error: true
        run: python scripts/check_thrown_error_messages.py --self-test --verbose

      - name: Verify framework source carries no keyword-only thrown message (rf2-vvixub)
        id: check_thrown_error_messages
        continue-on-error: true
        run: python scripts/check_thrown_error_messages.py --verbose

      # Keyword drift gate — the api-manifest pattern applied to
      # KEYWORDS. The public-VAR surface is self-enforcing (the lint.yml
      # api-manifest job); keywords — larger + more contract-critical — need
      # an equivalent, or a constructor minting :rf.error/ids no Spec 009 row
      # covers ships undetected. Two minimal checks (SCOPE-TRIM,
      # no gold-plating): (A) every :rf.error/:rf.warning id LITERAL emitted by
      # implementation source has a Spec 009 catalogue row — TOTALITY, every
      # emitted id is catalogued, no known-debt ledger; (B) every emitted
      # :rf.* namespace is reserved in spec/Conventions.md. Comment + string
      # masked, so only real code keyword forms fire. Pure Python stdlib.
      # Self-test first (proves BOTH checks fire on an injected violation +
      # stay green on the conformant counterparts), then the live scan asserts
      # implementation/ source is clean against the tracked Spec 009 + Conventions.
      # Hosted in this always-on PR-spine python job so keyword-contract drift
      # blocks the merge regardless of which surface a PR touches. See
      # scripts/check_keyword_catalogue_drift.py.
      - name: Self-test the keyword drift gate
        id: check_keyword_catalogue_drift_selftest
        continue-on-error: true
        run: python scripts/check_keyword_catalogue_drift.py --self-test --verbose

      - name: Verify impl keyword contract vs Spec 009 + Conventions (rf2-1nci83)
        id: check_keyword_catalogue_drift
        continue-on-error: true
        run: python scripts/check_keyword_catalogue_drift.py --verbose

      # SSR prop-drop roster drift. `strip-prop?` in
      # implementation/ssr/src/re_frame/ssr/html_helpers.cljc is the SINGLE
      # realisation point for which props are dropped at SSR static-markup
      # emission; two spec pages enumerate that roster in prose, and prose
      # enumerations go stale SILENTLY — a short roster reads exactly like a
      # complete one, even when a new class lands a few hundred lines away in
      # the same file. The gate derives the
      # name sets from `strip-prop?`'s own `(contains? …)` arms — so a new
      # class is graded on arrival rather than silently ignored — and requires
      # every literal member to appear on spec/011-SSR.md and spec/Security.md.
      # Whole-file matching, deliberately:
      # contamination makes it UNDER-report and it can never cry wolf, where
      # section scoping would add a heading-range parser — a second thing that
      # can go stale — to a gate whose whole purpose is catching staleness. A
      # green is therefore a FLOOR ("no literal name is wholly absent"), and it
      # grades four of the six classes; the script's docstring says both in
      # terms. Hosted in this always-on PR-spine python job for the same reason
      # as its neighbours: the drift must block the merge regardless of which
      # surface a PR touches — and it is spec/Security.md understating a
      # security control that clears the bar an ordinary prose-drift gate would
      # not. Self-test first (proves the check fires on the real stale shape,
      # that the parse fails CLOSED on each way the roster can be lost, and
      # that the documented floor is what it says), then the live scan. See
      # scripts/check_ssr_prop_drop_roster_drift.py.
      - name: Self-test the SSR prop-drop roster gate
        id: check_ssr_prop_drop_roster_drift_selftest
        continue-on-error: true
        run: python scripts/check_ssr_prop_drop_roster_drift.py --self-test --verbose

      - name: Verify SSR prop-drop roster vs Spec 011 + Security (rf2-7ntc)
        id: check_ssr_prop_drop_roster_drift
        continue-on-error: true
        run: python scripts/check_ssr_prop_drop_roster_drift.py --verbose

      # Reproduce-command integrity guard. The final "Report every
      # failing invariant check" step below prints, per failing checker, a local
      # "reproduce with" command. Reconstructed from the step id alone, that
      # command would drop the `--self-test` flag for every step whose id ends
      # `_selftest`, so a red self-test would be reported as a live-scan
      # command that could pass — reproducing the wrong mode. The aggregator
      # derives the command from each step's real
      # `run:` line; this guard makes that safe by asserting, over every checker
      # step, that the `run:` is a single-line `python scripts/<name>.py …`
      # invocation the aggregator can parse, that `<name>.py` exists, that the id
      # (minus any `_selftest`) equals the script stem, and that an id ends
      # `_selftest` IFF its real command carries `--self-test` (so both the
      # derived command and the id-only fallback pick the same live-vs-self-test
      # mode). Because the guard exists to protect the aggregation contract, it
      # discovers checker steps INDEPENDENTLY of their id (by their
      # `python scripts/check_*.py` run shape within this job) and additionally
      # requires every one to carry a unique `check_*` id and
      # `continue-on-error: true` — a checker with no id is invisible to
      # `toJSON(steps)` so its failure is unreported (the job goes green), and
      # one missing `continue-on-error` restores short-circuiting so the later
      # invariants never run. Self-test first (proves it fires on the
      # mode-mismatch, no-id, missing-continue-on-error, and drift shapes), then
      # the live scan asserts this workflow is clean. See
      # scripts/check_ci_reproduce_commands.py.
      - name: Self-test the reproduce-command integrity guard
        id: check_ci_reproduce_commands_selftest
        continue-on-error: true
        run: python scripts/check_ci_reproduce_commands.py --self-test --verbose

      - name: Verify each failure's reproduce command matches its checker step
        id: check_ci_reproduce_commands
        continue-on-error: true
        run: python scripts/check_ci_reproduce_commands.py --check --verbose

      # Fast-PR gap map. `scripts/test-fast-pr.sh` is not a superset
      # of the required checks, and without this gate nothing says which ones
      # it omits — so a worker can ship a green spine into a red required
      # check. The map is DERIVED (the
      # three aggregators' `needs:`, then each job's gate steps, then the spine's
      # own invocations), so a new required job or a new step inside an existing
      # one is reported as unrun by construction. What this gate protects is the
      # spine's COVERAGE CLAIMS: a signature in `SPINE_LANES` that stops matching
      # any required step means the spine still claims a lane for a check CI
      # renamed, moved or deleted — a false claim, and red here. It lives in this
      # job rather than the spine alone because a workflow edit is exactly the
      # change that can invalidate it while touching no surface the spine tiers
      # on. Self-test first, then the live audit.
      - name: Self-test the fast-PR gap map
        id: check_fast_pr_gap_selftest
        continue-on-error: true
        run: python scripts/check_fast_pr_gap.py --self-test --verbose

      - name: Verify the fast-PR spine's coverage claims still match the required checks
        id: check_fast_pr_gap
        continue-on-error: true
        run: python scripts/check_fast_pr_gap.py --check

      # Gate-scheduling audit. A gate is DEFINED in implementation/package.json
      # and RUNS in a workflow, and without this checker nothing holds those
      # two in step: a script can do real work, appear in NO workflow, and
      # have its positive control never once executed by CI. This checker
      # closes the CLASS — every `test:*` / `bench:*` / `build:*` command must be reachable
      # from a `npm run` in some workflow (the closure is walked through script
      # bodies, so a chaining script counts for everything it chains) or carry a
      # DISPOSITIONS entry whose premise the checker then verifies:
      # `covered-by` names a script that must itself still be scheduled,
      # `ci-runs-it-directly` names a literal the workflow corpus must still
      # contain. A gate that is neither is a hard failure, so the next
      # unscheduled gate reds on arrival. `build:*` is among the scanned
      # families because the `build:fresco-release` step further down this
      # file is the artefact's only `:advanced` compile, and deleting it must
      # complain to somebody.
      #
      # A ~0.3s pure-Python static check belongs on the PR critical path, and this job
      # is where it belongs specifically — a workflow edit is exactly the change
      # that unschedules a gate while touching no surface the classifier tiers
      # on, so an always-on home is the only one that cannot be skipped past.
      # Self-test first, then the live audit.
      - name: Self-test the gate-scheduling audit
        id: check_gate_scheduling_selftest
        continue-on-error: true
        run: python scripts/check_gate_scheduling.py --self-test --verbose

      - name: Verify every gate command has a scheduled home (rf2-6ckzl)
        id: check_gate_scheduling
        continue-on-error: true
        run: python scripts/check_gate_scheduling.py --verbose

      # Per EP-0017 (recordable coeffects, slice A) there is no `inject-cofx` /
      # `inject-cofx*`, and the dispatch opt is the flat `:rf.cofx` map, not
      # `:rf.world/inputs` — no alias, both hard errors. The runtime throws,
      # but a copy-pasteable teaching example (a live
      # `[(rf/inject-cofx :rf.server/request)]` interceptor entry in a spec
      # pattern page) would not. This guard scans docs/core, docs/api, spec/
      # and skills/ markdown for the retired spellings as LIVE recommended API
      # (inside fenced code blocks) with a narrow file allowlist for the
      # migration surface (the migration guide page / re-frame-migration skill
      # / EP docs) where a v1 "before" snippet is legitimate per
      # docs/core/AUTHORING.md §Delta teaching. Removed-context prose + inline
      # code spans + masked `;` comments never fire.
      #
      # IT LIVES HERE, NOT IN docs.yml. There it would be gated on that
      # workflow's `docs_surface` classifier — a
      # `case` list carrying `docs/*`, `spec/*`, `migration/*`, `testbeds/*`
      # and a dozen named files, but NOT `skills/*`. One of the gate's four
      # scan roots would therefore sit outside its own arming, so a skills-only
      # PR introducing a live `(rf/inject-cofx …)` snippet would run it
      # nowhere: a gate perfectly correct and perfectly scheduled and
      # never fired on part of what it polices. The cheap remedy for a
      # sub-second pure-stdlib check is not a wider surface (that would buy a
      # ~15-minute MkDocs build on every skills PR) but no surface at all —
      # the same remedy as the Fresco guide-sample gate. Self-test first, then
      # the live scan.
      - name: Self-test the inject-cofx residue gate
        id: check_inject_cofx_residue_selftest
        continue-on-error: true
        run: python scripts/check_inject_cofx_residue.py --self-test --verbose

      - name: Validate no live inject-cofx / :rf.world/inputs residue
        id: check_inject_cofx_residue
        continue-on-error: true
        run: python scripts/check_inject_cofx_residue.py --verbose

      # EDN well-formedness for the conformance corpus. Both fixture
      # loaders read a fixture with `clojure.edn/read-string`, which returns the
      # FIRST form and ignores the rest — so a fixture whose expectation block
      # closes one brace early still loads, still runs and still reports as
      # PASSING while every assertion outside that block is discarded: one
      # extra `}` and the assertions after it never execute, green for as long
      # as nobody looks.
      #
      # A STEP HERE RATHER THAN A JOB, and unconditional rather than gated. The
      # classifier's `spec/conformance/fixtures/*` arm sets only
      # implementation_jvm / cljs_node_test / cljs_browser / cljs_prod — four
      # heavy JVM/Node/Chromium lanes, and no cheap flag exists to ride. Buying
      # a whole job (or a wider surface) for a stdlib bracket scan over 247
      # small files, which costs milliseconds, is the same trade the inject-cofx
      # gate above declined for the same reason. Stdlib-only, so it keeps this
      # job's defining dependency-free property intact.
      - name: Self-test the conformance fixture EDN gate
        id: check_conformance_fixture_edn_selftest
        continue-on-error: true
        run: python scripts/check_conformance_fixture_edn.py --self-test --verbose

      - name: Validate every conformance fixture is one well-formed EDN form
        id: check_conformance_fixture_edn
        continue-on-error: true
        run: python scripts/check_conformance_fixture_edn.py --verbose

      # EGRESS-WALKER RESIDUE. There is no facade export
      # `rf/elide-wire-value`: `rf/project-egress` is
      # the one projection door, and the leaf walker is a framework-internal
      # mechanism behind it. The missing export closes the `rf/` spelling, but
      # `re-frame.elision/elide-wire-value` still RESOLVES (the framework's own
      # emit-time chokepoints call it), so nothing else stops a tool reaching
      # past the door — and the failure is silent, because the walker reads no
      # `:rf.egress/profile` and an under-assembled `:rf.egress/*` floor is a
      # perfectly legitimate argument to it. This scan refuses a CALL from
      # `tools/*/src` + `skills/*/preload` only; prose and docstrings naming the
      # mechanism never fire, and the tool TEST trees are deliberately unscanned
      # (mcp-conformance drives the internal walker on purpose, and several tool
      # tests pin the absent `rf/` spelling as a NEGATIVE assertion).
      #
      # A STEP HERE RATHER THAN A JOB, and unconditional rather than gated, for
      # the reason the inject-cofx and conformance-EDN gates above give: the
      # subject is tool SOURCE, which no docs-workflow path filter arms, and a
      # stdlib-only scan over ~400 files costs milliseconds. Self-test first
      # (proves the gate fires on each live shape and stays green on every
      # sanctioned mention), then the live scan.
      - name: Self-test the egress-walker residue gate
        id: check_egress_walker_residue_selftest
        continue-on-error: true
        run: python scripts/check_egress_walker_residue.py --self-test --verbose

      - name: Validate no tool-side call to the internal egress walker
        id: check_egress_walker_residue
        continue-on-error: true
        run: python scripts/check_egress_walker_residue.py --verbose

      # THE WORKFLOW JOB-CAP RATCHET DOES NOT LIVE HERE, AND THE
      # REASON IS THIS JOB'S DEFINING PROPERTY. It parses the workflow
      # documents with PyYAML — which is the whole point of it, a step-level
      # `timeout-minutes` being indistinguishable from a job-level one to a
      # grep — and this job installs no pip packages, so here its import probe
      # would fire and it would exit 3 with "NOT CHECKED ... This is NOT a
      # pass" on every PR. It runs in `verify-readme-links`, the
      # equally unconditional job that installs requirements.txt, for
      # exactly the reason recorded against the doc-slug gate there.
      #
      # Keep this job dependency-free. `check_fast_pr_gap.py` is stdlib-only on
      # purpose for the same reason, and staying free of a `pip install` step is
      # what makes this job cost seconds rather than a minute on every PR.

      # The verdict. Every checker above carries `continue-on-error: true`, so
      # the job never short-circuits and its RESULT is decided only here.
      # `toJSON(steps)` is the map of every step that declared an `id`. Each
      # failing checker's reproduce command is derived from its REAL `run:` line
      # (via `check_ci_reproduce_commands.py --emit`, reading the checked-out
      # workflow), so the printed command IS what the step ran and cannot drift
      # from it — an id-only reconstruction would silently drop the
      # `--self-test` flag for every `_selftest` step, printing the live scan
      # instead. `outcome` is the step's real result (`conclusion` is laundered
      # to success by continue-on-error), so `outcome == 'failure'` is the
      # honest signal. The list goes to the run summary and to `::error::`
      # annotations as well as stdout, so a red build names every broken
      # invariant on the run page — no log fetch.
      - name: Report every failing invariant check
        if: ${{ always() }}
        env:
          STEP_OUTCOMES: ${{ toJSON(steps) }}
        run: |
          failed=$(printf '%s' "$STEP_OUTCOMES" \
            | jq -r 'to_entries[] | select(.value.outcome == "failure") | .key')

          if [ -z "$failed" ]; then
            echo "All repo invariant checks passed."
            echo "All repo invariant checks passed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          count=$(printf '%s\n' "$failed" | wc -l | tr -d ' ')
          echo "::error::$count repo invariant check(s) failed:"
          {
            echo "### Failing repo invariant checks ($count)"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          printf '%s\n' "$failed" | while IFS= read -r id; do
            # Derive the reproduce command from the step's REAL `run:` line so it
            # never drifts from what the step ran.
            cmd=$(python scripts/check_ci_reproduce_commands.py --emit "$id" 2>/dev/null) || cmd=""
            if [ -z "$cmd" ]; then
              # Fallback if the helper cannot parse the step: reconstruct from the
              # id, appending `--self-test` for `_selftest` ids so the live-vs-
              # self-test mode is still correct. The check_ci_reproduce_commands
              # guard step fails the job if any checker ever drifts out of the
              # single-line `run: python scripts/<id-stem>.py …` shape this
              # fallback assumes.
              case "$id" in
                *_selftest) cmd="python scripts/${id%_selftest}.py --self-test" ;;
                *)          cmd="python scripts/${id}.py" ;;
              esac
            fi
            echo "::error::  $id — reproduce with: $cmd"
            echo "- \`$id\` — reproduce with \`$cmd\`" >> "$GITHUB_STEP_SUMMARY"
          done

          echo
          echo "Every checker ran; the list above is complete."
          exit 1

  # PR-time gate for README link drift. It REUSES the docs gate's
  # slugifier (`pymdownx.slugs.slugify(case='lower')`) so the two scripts
  # agree by construction — GitHub slug rules disagree with the project's
  # MkDocs slugifier, and an audit using its own slug rules reports false
  # positives.
  #
  # Scope: every README.md outside the docs/spec/migration/skills/
  # surface (which check_doc_slugs.py already covers) plus tools/*/spec/.
  # Validates internal target files + anchor slugs.  External http(s)
  # URLs are skipped by --ci (third-party outages must not flake the
  # gate; opt in via --check-external for ad-hoc audits).
  #
  # THE JOB CARRIES BOTH HALVES OF THAT SENTENCE.  "Which
  # check_doc_slugs.py already covers" is a claim about that gate's ROSTER,
  # and its REACH is only as wide as the job that runs it: inside docs.yml's
  # `build` job it would cover nothing on a PR docs.yml did not classify
  # in.  So its corpus scan runs HERE, next to the companion that
  # cites it — see the step comment below.  The two gates share a
  # slugifier by construction (check_readme_links.py imports SLUGIFY from
  # check_doc_slugs.py), so they also belong in one environment.
  #
  # Fast — pure Python + pymdown-extensions, no JVM/Node setup.
  verify-readme-links:
    name: Verify markdown link slugs — READMEs + the docs/spec/skills/migration corpus (rf2-br5u7, rf2-v7fui)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      # Only the slugifier dep is strictly required (pymdown-extensions),
      # but installing the full requirements.txt keeps the env identical
      # to docs.yml so a slugifier-version bump there can't silently
      # diverge from the README gate.
      - name: Install pymdown-extensions (slugifier source of truth)
        run: pip install -r requirements.txt

      - name: Self-test the README link validator
        run: python scripts/check_readme_links.py --self-test --verbose

      - name: Validate README links (targets + GitHub-rule anchor slugs)
        run: python scripts/check_readme_links.py --ci

      # The other half of the corpus: intra-repo markdown links and heading
      # anchors across check_doc_slugs.py's DEFAULT_ROOTS — docs, spec,
      # skills, migration — plus tools/*/spec.
      #
      # IT LIVES HERE, NOT IN docs.yml.  There it would be gated on that
      # workflow's `docs_surface` classifier — the same `case` list the
      # inject-cofx gate above stays out of, carrying
      # `docs/*`, `spec/*`, `migration/*`, `testbeds/*` and a dozen named
      # files but NOT `skills/*`.  One of the gate's four scan roots would
      # therefore sit outside its own arming: slug and anchor validation of the
      # markdown files under skills/ would fire NOWHERE at PR time, and a brief
      # nominating this gate for a skills edit would get a green that had
      # opened none of them — a skills-only path lights `docs_surface` false,
      # and arms zero outputs in report-changed-surfaces.sh as well.
      # (test.yml's PUSH filter paths-ignores `skills/**/*.md`, so the
      # post-merge run would not catch it either.  scripts/test-fast-pr.sh
      # runs it, but a local spine is skippable and so is not a mechanism.)
      #
      # A GATE'S ROSTER, ITS SCHEDULE AND ITS REACH ARE THREE DIFFERENT
      # THINGS.  Quoting one as though it settled the others manufactures
      # false confidence, so `--verbose` prints the
      # per-root file counts it actually walked: a run SAYS which trees it
      # inspected instead of leaving a reader to infer reach from roster.
      #
      # WHY THIS JOB AND NOT THE ALWAYS-ON INVARIANT JOB that took the
      # inject-cofx gate: this checker is NOT pure stdlib.  It hard-requires
      # pymdown-extensions for the MkDocs slugifier and exits 2 with an
      # install message when the import fails (check_doc_slugs.py:76-84), so
      # dropping it beside the stdlib checkers — which have no `pip install`
      # step — would red every PR.  This job installs
      # requirements.txt for the very same slugifier, and is likewise
      # unconditional.  Cost is why the corpus scan can ride along at all:
      # measured, this job takes 0.5 min against a 15.2 min longest job, so a
      # corpus scan here is free of the critical path.
      #
      # WHY NOT A WIDER docs_surface: adding `skills/*` there buys a
      # ~15-minute MkDocs build on every skills PR — the argument this file
      # makes for inject-cofx.  docs.yml carries no copy, so there is one
      # scheduled home and no second one to drift.
      # The failure mode that matters ("this PR broke a doc link", not
      # "mkdocs emitted a warning") holds and arrives sooner: here the
      # scan runs without waiting on that job's apt-get and pip install.
      - name: Self-test the doc-slug link validator
        run: python scripts/check_doc_slugs.py --self-test --verbose

      - name: Validate doc links across docs, spec, skills, migration + tools/*/spec
        run: python scripts/check_doc_slugs.py --verbose

      # Flattened nested lists.  Python-Markdown wants exactly four
      # columns per nesting level whatever the parent's marker width, so a
      # two- or three-column child renders as a SIBLING and eight columns
      # under a column-0 parent renders as a CODE BLOCK.  Both are valid
      # markup, which is the whole problem: there is no warning for
      # `mkdocs build --strict` to promote and no broken target for the two
      # gates above to resolve, so such sites accumulate unseen.  Measured on
      # a tree carrying one deliberately flattened item, every other checker
      # exits 0 over it.
      #
      # WHY THIS JOB.  Same reasoning as the doc-slug gate above and not a new
      # one: the checker is NOT pure stdlib — it renders with python-markdown
      # under mkdocs' own loaded config, so it needs requirements.txt, which
      # this job already installs for the slugifier.  Dropping it beside the
      # stdlib checkers in `Repo invariant checks` would red every PR.  Cost
      # measured locally over the full 291-file corpus: 23-35 s, against this
      # job's 0.5 min and a 15.2 min longest job, so it stays off the critical
      # path and no changed-files scoping is needed.
      #
      # Self-test first, then the live scan — the self-test is what makes the
      # green mean anything, and it is exercised in BOTH directions (it must
      # detect a manufactured flattening and a manufactured code block, and
      # must pass a correct reindent).
      - name: Self-test the flattened-list gate
        run: python scripts/check_flattened_lists.py --self-test

      - name: Verify no nested markdown list renders flat
        run: python scripts/check_flattened_lists.py

      # Escaped continuation blocks.  The SIBLING GATE ABOVE CANNOT
      # SEE THIS CLASS, and that false coverage claim is why this exists: it
      # matches list MARKERS and grades consecutive ITEM pairs, so a
      # continuation PARAGRAPH under a bullet — under-indented, and therefore
      # rendered OUTSIDE every `li` — is invisible to it.  Measured: a file
      # whose two-space continuation renders outside its
      # item exits 0 under the gate above while the real render puts the
      # paragraph in a sibling `<p>`.  Same shape as its sibling's own
      # argument: valid markup, no broken target, no anchor, nothing for
      # `mkdocs build --strict` to promote, and nothing on screen says so.
      # (The unit matters: the same surface counts differently in lines and
      # in blocks, so the tool prints lines, blocks and tables separately and
      # never one headline number.)  A zero is only kept at zero by something
      # that checks.
      #
      # WHY THIS JOB.  Identical reasoning to the two gates above, and NOT a new
      # one: it imports the sibling's renderer, so it needs python-markdown and
      # mkdocs' config loader and cannot sit beside the stdlib checkers in
      # `Repo invariant checks`.  Unguarded like its neighbours, because no
      # classifier surface arms for `scripts/**` — all 29 read false — so there
      # is nothing to scope it to.  Cost measured over the same 291-file corpus:
      # 19-24 s, the CHEAPER of this pair, against this job's 0.5 min and a
      # 15.2 min longest job.
      #
      # Self-test first, then the live scan — the self-test is what makes the
      # green mean anything, and it pins BOTH disjuncts of the union rule in
      # opposite directions (depth-only and outside-`li`-only each miss a case
      # the other catches), plus the deliberate non-detection of an escaped
      # FENCE, which is a different instrument's job.
      - name: Self-test the escaped-continuation gate
        run: python scripts/check_escaped_continuations.py --self-test

      - name: Verify no continuation block renders outside its list item
        run: python scripts/check_escaped_continuations.py

      # SKILL.md description-budget gate. Guards
      # the SKILL.md description limits: the portable 1,024 and the Claude 1,536.
      # It hard-fails a description over the 1,024-char Agent Skills packaging cap
      # — the portable contract skills/README.md advertises via `npx skills add` —
      # and escalates that message when the description is ALSO past Claude Code's
      # 1,536-char `skillListingMaxDescChars` hard slice, which cuts mid-word, so
      # the disqualifier a description ends on is the first thing lost. Anything
      # within 1,024 is within 1,536, so the slice is reported on every run rather
      # than separately failed on. Separately, the family's whole listing
      # footprint is hard-failed against a pinned RATCHET rather than the absolute
      # 8,000-char budget — past that budget the planner drops ENTIRE descriptions
      # in ascending priority order, and nine skills each carrying a routing
      # contract cannot fit in 8,000 however they are written (with every
      # description under 1,024 the family sits near 8,900), so failing at
      # the absolute would red the repo with no in-repo remedy. The absolute
      # comparison PRINTS on every run, green or red, so the overshoot is never
      # lost behind a tick.
      #
      # WHY THIS JOB AND NOT THE ALWAYS-ON INVARIANT JOB, where every other
      # check_skill_*.py step lives: this checker is NOT pure stdlib. It reads
      # SKILL.md front-matter with PyYAML and exits 2 with an install message when
      # that import fails, and the invariant job installs no pip packages — so
      # placing it beside its check_skill_* siblings reds every PR — measured
      # rather than assumed: both steps fail with "ERROR: PyYAML is required".
      # That is the reason recorded for the doc-slug gate and the workflow
      # job-cap ratchet in this job. This job installs requirements.txt, which carries PyYAML
      # via mkdocs, and is likewise unconditional and off the critical path.
      #
      # Its scripts/test-fast-pr.sh lanes travel with it: check_fast_pr_gap.py
      # derives the required set from this job too, so a CI half with no local lane
      # is reported as unrun. Self-test first, then the live scan.
      - name: Self-test the SKILL.md description-budget gate
        run: python scripts/check_skill_description_budget.py --self-test

      - name: Verify SKILL.md descriptions fit the listing budget
        run: python scripts/check_skill_description_budget.py --verbose --ci

      # README inventory drift-ratchet gate.
      # check_readme_inventories.py asserts the layout-map <-> disk bijection
      # and the "N <noun>" count-numeral claims in the pair-mcp / story-mcp
      # READMEs. It also runs in the local pre-checkin spine
      # (scripts/test-fast-pr.sh); gating CI means a contributor who skips the
      # local spine cannot land README inventory drift unchecked.
      # Pure Python stdlib — no extra deps over the slugifier install above.
      - name: Self-test the README inventory validator
        run: python scripts/check_readme_inventories.py --self-test --verbose

      - name: Validate README inventories (layout-map <-> disk + count claims)
        run: python scripts/check_readme_inventories.py --verbose

      # Test-lane bijection gate. The per-lane floor reddens a lane that ran
      # ZERO tests; it cannot see a
      # lane that ran SOME of what it should. check_test_lane_bijection.py reads
      # every lane from the file that DEFINES it (each shadow-cljs.edn's
      # `:node-test`/`:browser-test` builds, each artefact's `deps.edn` `:test`
      # alias via the two JVM rosters) and asserts that every file defining a
      # top-level `deftest` is reached by some selector and every selector
      # reaches something. Belongs in this always-on job for the same reason the
      # README inventory ratchet above does: the drift is introduced by a rename
      # or a directory move, which need not touch the tier that owns it, and a
      # gate that only lives in the local spine is skippable. Pure Python
      # stdlib.
      - name: Self-test the test-lane bijection gate
        run: python scripts/check_test_lane_bijection.py --self-test

      - name: Validate test-lane bijection (build files <-> lane selectors)
        run: python scripts/check_test_lane_bijection.py --verbose

      # JVM roster <-> CI required-job bijection. The gate above
      # READS the two JVM rosters (scripts/test-jvm-{implementation,tools}.sh)
      # to discover the JVM lanes, so an artefact absent from a roster is not a
      # violation to it — it is simply not a lane. The gate that finds orphan
      # FILES takes the roster as ground truth, so the roster is exactly what it
      # cannot check. That blind spot lets an artefact sit on the local roster
      # with no CI job at all, or carry a CI job with no local lane, and a
      # hand repair leaves nothing behind that would notice the next one.
      #
      # This gate asserts the two agree in BOTH directions: every rostered
      # artefact is run by a test.yml job listed in all-required-passed's
      # `needs:` (a job absent from that list is advisory, whatever its own gate
      # says), and every required job running `clojure -M:test` has its
      # directory on a roster. It reads this very file, so it belongs in the
      # always-on job — the drift is introduced by adding a job or a roster line
      # and need not touch the tier that owns either. Pure Python stdlib.
      - name: Self-test the JVM roster/CI bijection gate
        run: python scripts/check_jvm_lane_rosters.py --self-test

      - name: Validate JVM roster <-> CI required-job bijection
        run: python scripts/check_jvm_lane_rosters.py --verbose

      # Adapter disposition (source of record EP-0030 §Resolved Decisions):
      # Reagent, reagent-slim, and UIx are first-class, actively-supported
      # adapters. A "frozen compatibility adapters / reagent-slim removed /
      # only taught view layer" shape in a planning, implementor,
      # source-comment, or synthesis authority would lead anyone dispatching
      # from it to remove or downgrade a supported surface. This guard scans a
      # closed roster of ACTIVE authorities for that shape. Pure
      # Python stdlib — no extra deps.
      # The guard scans a fixed cross-repo roster, not the diff, so it runs
      # unconditionally.
      - name: Self-test the adapter-disposition guard (rf2-vxgfnd.290)
        run: python scripts/check_adapter_disposition.py --self-test --verbose

      - name: Guard the current adapter disposition
        run: python scripts/check_adapter_disposition.py --verbose --ci

      # Fast-PR spine tiering + mkdocs-resolution self-test. The harness at
      # scripts/_test_fixtures/test_fast_pr_docs_gate/run-self-test.sh drives
      # the REAL spine in `--plan` mode against disposable git repos and
      # asserts the tier decision and the exact mkdocs command it selected.
      # Run nowhere else in CI, every assertion in it would be local-only,
      # i.e. skippable, i.e. not a gate.
      #
      # Concretely: the spine falls back from
      # a bare `mkdocs` console script to `python -m mkdocs` for the
      # `pip install --user` checkouts where the console script is off PATH.
      # This runner installs requirements.txt, so a bare `mkdocs` IS on PATH
      # here and the host-consulting case takes the console-script branch —
      # deleting the module fallback outright would stay green remotely
      # and open the fail-open on exactly the contributor installs it is
      # written for. The harness carries hermetic cases (AC-AE) that
      # CONSTRUCT a module-only PATH instead of asking this host what it has,
      # and running it here is what makes breaking that fallback red a REQUIRED
      # check.
      #
      # Belongs in this always-on job for the same reason the steps above
      # do: the drift is introduced by editing the spine or its fixtures, which
      # no surface gate covers, and a gate that only lives in the local spine is
      # skippable. Needs bash + git + python, all already present; ~20s.
      - name: Self-test the fast-PR spine's tiering + mkdocs resolution
        run: bash scripts/_test_fixtures/test_fast_pr_docs_gate/run-self-test.sh

      # Workflow job-cap ratchet. A job with no `timeout-minutes`
      # inherits GitHub's 360-minute default, so a wedged runner produces a
      # check that never TERMINATES — not a red check, no check at all for six
      # hours — and this project's merge loop has nothing to read and no remedy
      # but a hand cancel. Uncapped jobs accrete one at a time until they are
      # the house majority, and review does not hold this convention, so it is
      # held here instead, on arrival.
      #
      # IT MUST PARSE, NOT GREP, AND THAT IS THE WHOLE CHECK. A
      # `timeout-minutes` under a STEP is not a job cap — it bounds one step and
      # leaves the job free to hang in any other — yet the two differ only by
      # indentation inside the same text block. This file carries real
      # step-level keys, so the confusion is live here.
      # The checker reads the parsed document, where a job cap is a key on the
      # job and a step cap is a key on an element of its `steps`.
      #
      # Presence only: it never judges the VALUE. What a cap should BE is a
      # per-job measurement question; folding that in would turn a mechanical
      # one-bit check
      # into a heuristic that argues with its reader.
      #
      # WHY THIS JOB AND NOT THE ALWAYS-ON INVARIANT JOB — the same reason the
      # doc-slug gate above gives. Parsing the document means PyYAML, and
      # PyYAML is not stdlib. In `verify-skill-mcp-drift`, which installs no
      # pip packages, both its steps exit 3: "NOT CHECKED ... This is NOT a
      # pass" — the checker refusing to report a green it has not earned,
      # rather than silently vouching for jobs it never opened. This job
      # installs requirements.txt (PyYAML arrives through mkdocs) and
      # is likewise unconditional, so the ratchet gates every PR from here at
      # no extra setup cost, and the invariant job stays dependency-free.
      #
      # ITS PARSE ARM IS LOAD-BEARING BEYOND ITS OWN CHARTER, so do
      # not narrow it. The checker `yaml.safe_load`s every file under
      # `.github/workflows/` and RETURNS 2 on a YAMLError rather than skipping,
      # which makes these two steps also the only place in CI that asserts a
      # workflow even PARSES. `scripts/check_workflow_yaml.py` makes that claim
      # properly — a line number, and every broken file rather than the first —
      # but is scheduled from `scripts/test-fast-pr.sh` only, and a second CI
      # parse of the same files asserting a subset of the same claim would buy
      # nothing but a second thing to keep in step. The four workflow-reading
      # checkers in the always-on invariant job above cannot stand in: they are
      # hand-rolled line readers and, measured with an unmatched quote planted
      # on line 1 of this file, ALL FOUR exit 0.
      #
      # Self-test first — it drives the checker RED on five shapes including a
      # step-only cap and an uncapped job sitting second behind a capped one
      # (the "stopped looking after the first hit" defect) — then the live sweep.
      - name: Self-test the workflow job-cap ratchet
        run: python scripts/check_workflow_job_timeouts.py --self-test --verbose

      - name: Verify every workflow job carries a job-level timeout-minutes
        run: python scripts/check_workflow_job_timeouts.py --verbose



  # The guide-sample gate's own unconditional job.
  #
  # `implementation/fresco/scripts/check_guide_samples.py` reads TWO input
  # families, named at the script by `GUIDE_DIR` and `SOURCE_ROOTS`:
  #
  #   docs/core/fresco/**                          the guide pages whose fenced
  #                                                 blocks it reads for verbs
  #   implementation/fresco/src, .../test_kit/src  the sources it resolves the
  #                                                 fresco verb use-sites against
  #
  # BY SYMBOL AND WITHOUT COUNTS, ON PURPOSE. Line numbers for the symbols
  # and integers for pages, blocks and use-sites would rot with the next edit
  # to the script and send a reader who trusted them to the wrong line. A
  # symbol survives an edit above it where a line number does not, and the
  # counts are not needed here at all: the live run below PRINTS how many pages,
  # blocks and use-sites it covered, which is the one place they cannot go
  # stale.
  #
  # It is chained into `npm run test:fresco-invariants`, whose only hosted
  # invocation is a step of the `cljs` job under
  # `needs.detect_changed_surfaces.outputs.cljs_node_test == 'true'`. ONLY THE
  # SECOND FAMILY ARMS THAT OUTPUT. The guide tree arms NOTHING AT ALL —
  # `.github/scripts/report-changed-surfaces.sh docs/core/fresco/00-installation.md`
  # returns EVERY ONE of its outputs false, exit 0 — so a guide-only PR, which is
  # precisely the edit this gate exists to police and by far the commonest one
  # against a documentation tree, would run the check NOWHERE without this job.
  # It would then next redden on somebody else's source PR, over a block they
  # did not write.
  #
  # UNCONDITIONAL, rather than a classifier output. Arming the EXISTING output
  # from `docs/core/fresco/**` does not fit: `cljs_node_test` is consumed by
  # exactly one job, the ~10-minute node build, so it would schedule that build
  # on a prose typo. And a NEW dedicated output would have to widen every time
  # the checker learns to read another file — it already reads two families
  # across two trees — which is a fresh chance for a surface gate not to cover
  # a checker's inputs, the very failure this job exists to avoid. The work here is
  # sub-second pure Python (measured 0.31s self-test + 0.61s live, no node, no
  # JVM), so there is nothing to gate for.
  #
  # IT STAYS CHAINED INTO `test:fresco-invariants` TOO: that chain is the local
  # spine lane and the artefact's one-command run, and this job is the CI
  # reachability the chain cannot give it. `scripts/check_fast_pr_gap.py` carries
  # a matching `SPINE_LANES` entry so these two steps are not over-reported as a
  # local gap.
  fresco-guide-samples:
    name: Fresco guide samples (rf2-r5iy7)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'

      # Self-test first, then the live run — the order every other pure-Python
      # contract in this workflow uses. It drives each rule red in turn over
      # synthetic inputs, so a green live run below is a verdict rather than a
      # checker that has quietly stopped firing.
      - name: Self-test the guide-sample rules
        run: python implementation/fresco/scripts/check_guide_samples.py --self-test

      # The live run PRINTS what it inspected — how many distinct fresco verbs
      # it resolved, at how many use-sites, across how many guide pages. A gate
      # that cannot say what it covered is how this class of hole survives a
      # green badge. It pins nothing, so there is no roster to regenerate.
      - name: Verify every verb a fenced guide sample names against the sources
        run: python implementation/fresco/scripts/check_guide_samples.py


  # CI arm of the STALE WORKER-SNAPSHOT guard.
  #
  # `.beads/issues.jsonl` is a full-database export that a checkout receives
  # like any other tracked file: an ordinary `bd` write does not regenerate
  # it, and `scripts/beads-checkpoint.sh` is what installs it. So a worker
  # worktree carries a snapshot of the tracker as it stood at the commit that
  # worktree was created from, and the snapshot goes stale as the tracker
  # moves on. Committing it TIME-TRAVELS the tracker: beads closed since the
  # snapshot reopen, beads filed since it vanish. The pre-commit hook refuses
  # it in linked worktrees, but a hook is bypassable with `--no-verify` and inert in any
  # checkout where hooks were never installed, so this job is the enforcement
  # that cannot be skipped.
  #
  # UNCONDITIONAL, by design. No `needs:`, no surface gate, no path filter:
  # the tracker database has no business in ANY pull request, and a
  # branch-name filter would be trivially sidestepped. It is also seconds of
  # runner time, so there is nothing to gate for.
  #
  # THE MAYOR'S CHECKPOINT FLOW IS UNAFFECTED, twice over. The mayor commits
  # `.beads/issues.jsonl` straight to main on every heartbeat and breaking
  # that would be worse than the bug this guards. (1) test.yml's push trigger
  # already carries `paths-ignore: .beads/**`, so a beads-only checkpoint
  # push runs no job here at all. (2) On any push that DOES reach this job,
  # the script's own event branch sees GITHUB_EVENT_NAME != pull_request and
  # exits 0 with an explanatory line. Enforcement is pull_request only.
  # THE KEY IS `beads-pr-boundary`; THE CHECK NAME IS NOT. The key
  # is load-bearing — `all-required-passed`'s `needs:` and the
  # `jobBlock(..., 'beads-pr-boundary')` assertions in
  # `implementation/scripts/_changed-surfaces.test.cjs` address this job by it
  # — so it stays. The DISPLAY name is what GitHub reports as the check, so it
  # names BOTH guards this job runs: two of its three graded surfaces are the
  # AI-attribution guard (the self-test step runs `test-pre-commit.sh` layer
  # 10, and the last step is that guard's CI arm). A beads-shaped name alone
  # would send the reader of an attribution red hunting for a tracker
  # file in a diff touching no `.beads` path. STILL
  # ONE JOB: the attribution arm needs the `fetch-depth: 0` checkout below, so
  # a job of its own would duplicate a full-history clone to change a label and
  # would move the check COUNT the merge criterion is measured against.
  beads-pr-boundary:
    name: PR guards (no tracker database, no AI attribution)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          # The guard diffs from the BRANCH POINT, so the fork
          # commit and both branch tips must be present. A shallow clone
          # frequently lacks the fork; the guard then fails CLOSED rather than
          # passing vacuously, which would turn a missing fetch into a red
          # gate on unrelated PRs. Full history is the cheap, correct answer.
          fetch-depth: 0

      # Self-test before enforce — the shape verify-readme-links already uses
      # for its Python guards. Layer 5 of this harness is the diverged-history
      # regression net for the branch-point selection this job depends on,
      # and it also covers the pre-commit hook's two marker
      # blocks. Sandboxed under $TMPDIR; seconds, no build.
      - name: Self-test the beads + mayor commit guards (rf2-5z20y)
        run: sh scripts/git-hooks/test-pre-commit.sh

      - name: Enforce the beads PR boundary (rf2-3mh2f)
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" != "pull_request" ]; then
            # Let the script print its own "not enforced here" line, so the
            # event policy has exactly one home (the script, not this YAML).
            sh scripts/check-beads-pr-boundary.sh
            exit 0
          fi
          # Pass the BASE BRANCH. The script resolves the branch point itself
          # — do NOT precompute one here, and never substitute
          # `github.event.pull_request.base.sha`, which goes stale the moment
          # main advances under an open PR. Both mistakes have the same
          # consequence in this repo: the mayor checkpoints the tracker to
          # main constantly, so a base newer than the fork makes
          # `.beads/issues.jsonl` appear in the comparison as though this PR
          # had touched it, reddening branches for a file they never edited.
          sh scripts/check-beads-pr-boundary.sh "origin/${GITHUB_BASE_REF}"

      # The AI-attribution guard's CI arm — a STEP in this job, not
      # a job of its own, so it adds nothing to any PR's check rollup and the
      # required-check band the merge criterion is measured against does not
      # move.
      #
      # IT LIVES HERE FOR THE `fetch-depth: 0` ABOVE. The script grades
      # `merge-base(BASE, HEAD)..HEAD` — the commits the branch introduces —
      # and fails CLOSED when it cannot resolve a branch point. In a shallow
      # checkout it would therefore red every PR, and relaxing it to pass on a
      # missing range would make it a checker that inspects nothing and reports
      # the same silent zero as a clean branch. That is why it is NOT in
      # `verify-skill-mcp-drift` with the other repo invariants, whose checkout
      # is deliberately the cheap shallow one. This job already resolves a
      # branch point for exactly the same reason, from exactly this checkout.
      #
      # ONE COMMAND, no event branch: unlike the step above, this script's event
      # policy lives entirely in the script, which checks `GITHUB_EVENT_NAME`
      # BEFORE it looks at the base ref — so on a push it exits 0 with its own
      # explanatory line and never evaluates the empty `origin/`.
      #
      # A BLOCK SCALAR (`run: |`), NOT A PLAIN ONE, and that is load-bearing
      # rather than style. `implementation/scripts/_release-dag-policy.test.cjs`
      # parses these workflows with a hand-rolled reader that rejects a `{` in a
      # plain scalar as an unsupported flow mapping — so `${GITHUB_BASE_REF}` on
      # the `run:` line itself reds the `js-harness-self-tests` job, while the
      # identical text one step above passes because it sits inside a block
      # scalar. Measured on this step. Keep the pipe.
      #
      # TWO SURFACES, ONE STEP. CLAUDE.md forbids the trailers in "commits or
      # PRs", and a git hook can only ever see the first. The second invocation
      # grades the PULL REQUEST BODY, which is where the harness writes the
      # generated-with marker and a bare session URL. Still one step and still
      # no new job, so nothing is
      # added to any PR's check rollup and the required-check band the merge
      # criterion is measured against does not move.
      #
      # DEFAULT ACTIVITY TYPES ONLY. The workflow's `pull_request:` trigger
      # names no `types:`, so it fires on `opened`, `synchronize` and
      # `reopened` — and `opened` is the one that grades what `gh pr create`
      # wrote, which is the injection this closes. `edited` is deliberately NOT
      # added: a hand edit after the push is a mayor read at merge time and is
      # the accepted residual.
      - name: Enforce the no-AI-attribution rule (rf2-2e8f)
        env:
          # THE BODY REACHES THE SHELL AS DATA, NEVER AS TEXT. `${{ }}` is
          # expanded by the workflow renderer BEFORE any shell sees the script,
          # so interpolating the body into the `run:` block below would splice
          # author-controlled prose straight into the source. An `env:` value is
          # handed to the process instead of pasted into it. On a non-
          # pull_request event this is empty and the script exits 0 on its event
          # check before it ever reads stdin.
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          sh scripts/check-commit-attribution.sh "origin/${GITHUB_BASE_REF}"
          printf '%s\n' "$PR_BODY" | sh scripts/check-commit-attribution.sh --pr-body

  jvm-core:
    name: JVM core (clojure -M:test)
    # Job-level gating (NOT a workflow-trigger path filter:
    # the pull_request trigger stays unfiltered so the
    # `All required checks passed` aggregator is always present). The
    # JVM core suite runs on every code surface that touches core, the
    # adapters, the per-feature artefacts, the conformance fixtures, or
    # the build config.
    #
    # A DOCS-ONLY PR DOES NOT IMPLY A SKIP. The classifier
    # also arms `implementation_jvm` for prose that a test.yml suite
    # pins — nearly all of `spec/*` (57 of the 60 tracked `spec/**.md`,
    # via a catch-all), the `docs/machines/*.md` tree, and three named
    # pages (`docs/api/re-frame.adapter.uix.md`,
    # `docs/api/re-frame.ssr.md`,
    # `docs/design/fresco/product/async-routing-recipes.md`).
    #
    # NEARLY all of `spec/*`, not wholesale, and the difference matters
    # to anyone reasoning from this comment: `spec/API.md` is caught
    # FIRST by an earlier arm that sets `cljs_node_test` only. The rest
    # of `docs/` arms nothing.
    #
    # The classifier is the roster and it moves, so measure the path
    # rather than trust this paragraph:
    #   .github/scripts/report-changed-surfaces.sh <path>
    #
    # The aggregator treats a surface-skip as OK and the nightly full
    # matrix is the safety net.
    needs: detect_changed_surfaces
    if: needs.detect_changed_surfaces.outputs.implementation_jvm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: implementation/core
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Clojure CLI
        run: "$GITHUB_WORKSPACE/.github/scripts/install-clojure-cli.sh"

      - name: Cache Maven / gitlibs
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: ${{ runner.os }}-clj-core-${{ hashFiles('implementation/core/deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-clj-core-
            ${{ runner.os }}-clj-

      - name: Run JVM tests (core artefact)
        run: clojure -M:test

  # The core suite under the REAL production gate.
  #
  # WHY IT EXISTS. `SECURITY.md` documents `-Dre-frame.debug=false` (and
  # `RE_FRAME_DEBUG=false`) as the JVM/SSR production setting, and
  # `re-frame.interop/debug-enabled?` reads it ONCE at namespace-load time.
  # Without a lane that sets it, the documented production configuration
  # would be executed by NO suite, anywhere.
  # The suites that call themselves production-gate tests
  # (`jvm_prod_gate_integration_test`, `ep0008_producers_jvm_gate_test`, and
  # friends) rebind the Var with `with-redefs` AFTER the framework has loaded,
  # which cannot reach a decision the gate made at load time — so a
  # `dispatch-sync` running its handler ZERO times under the documented
  # production gate, app-db untouched, would stay green there.
  #
  # WHY IT IS A SEPARATE JOB AND NOT A FLAG ON `jvm-core`. The two lanes make
  # different claims and neither substitutes for the other: `jvm-core` proves
  # the framework's behaviour WITH its dev instrumentation, this job proves the
  # semantics that must survive WITHOUT it. Same artefact, same classpath (the
  # `:prod-gate` alias is a modifier composed onto `:test`), same cache key —
  # only the JVM posture differs.
  #
  # THE JOB CANNOT PASS VACUOUSLY. `re-frame.prod-gate-lane-pin-test` runs
  # inside the lane and asserts unconditionally that `re-frame.debug` reads
  # `"false"` on THIS JVM and that `interop/debug-enabled?` honoured it. If the
  # property ever stops arriving, this job goes RED rather than green-on-the-
  # wrong-posture — which matters more here than anywhere else in the file,
  # because the lane's namespace roster is by construction a subset of what
  # already passes in dev posture, so a lost flag would otherwise be invisible.
  #
  # SCOPE. Not the whole core suite: the namespaces excluded are red under the
  # real gate because they assert dev instrumentation (traces, the `:errors`
  # sink, doc metadata, source coords) inline with semantics. Those are
  # legitimate dev-posture tests, not defects; the roster lives in
  # `scripts/test-core-prod-gate.sh`, which prints its own namespace counts at
  # run time. The roster is an EXCLUSION list, so a
  # new namespace joins this lane by default and has to be excluded
  # deliberately.
  jvm-core-prod-gate:
    name: JVM core under the production gate (-Dre-frame.debug=false)
    # Same surface gate as jvm-core: it is the same artefact.
    needs: detect_changed_surfaces
    if: needs.detect_changed_surfaces.outputs.implementation_jvm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Clojure CLI
        run: "$GITHUB_WORKSPACE/.github/scripts/install-clojure-cli.sh"

      # Deliberately the SAME cache key as jvm-core — identical classpath, so
      # the two jobs warm one cache instead of competing for two.
      - name: Cache Maven / gitlibs
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: ${{ runner.os }}-clj-core-${{ hashFiles('implementation/core/deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-clj-core-
            ${{ runner.os }}-clj-

      # The script prints the property, the pin, the roster size and the
      # excluded count before it runs anything, so the job's own log carries
      # the evidence of which posture it ran in.
      - name: Run the core suite under -Dre-frame.debug=false
        run: bash scripts/test-core-prod-gate.sh

  cljs-fresco-controlled:
    name: CLJS fresco controlled-input correctness (real Chromium + Firefox + WebKit)
    # Invariant I15 in three real engines. This job is what schedules
    # `test:fresco-controlled`; without it scripts/check_gate_scheduling.py
    # would have to declare that gate a KNOWN HOLE rather than leave the
    # absence invisible.
    #
    # THREE engines, and each is load-bearing. The mechanism under test is made
    # of precisely the things engines differ on — caret and selection
    # restoration, composition event carriage, and the order in which a
    # discrete event's work is flushed. Nothing else drives Fresco's
    # element-path converge outside Chromium, and Firefox is launched by no
    # PR gate outside the Fresco jobs.
    #
    # WHY THE WHOLE GATE RUNS PER-PR rather than a one-engine smoke with the
    # rest nightly. The runner does not merely run the same spec three times:
    # it COMPARES its RECORDED rows across engines and reds any divergence no
    # entry in NARROWINGS names, and that comparator is inert below two engines
    # (`if (engines.length < 2) return problems`). A narrowed PR tier would
    # keep the gate's name and silently drop its central claim. So it is
    # changed-surface gated instead — TESTING.md's placement table puts slow
    # essential coverage on exactly that tier.
    needs: detect_changed_surfaces
    if: needs.detect_changed_surfaces.outputs.fresco_controlled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: implementation
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: implementation/package-lock.json

      - name: Cache Maven / gitlibs (shadow-cljs deps)
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: ${{ runner.os }}-cljs-${{ hashFiles('implementation/shadow-cljs.edn', 'implementation/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-cljs-

      - name: npm install
        run: npm ci

      # Its own cache key: this is the only job in the matrix that needs all
      # THREE engines, and it must not be served a two-engine cache under a
      # key that claims to hold them.
      - name: Cache Playwright browser binaries
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-cfw-${{ hashFiles('implementation/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-cfw-
            ${{ runner.os }}-playwright-

      # THE PIN, and the one step in this job to read carefully. `npx` resolves
      # implementation/node_modules/.bin/playwright — the version
      # implementation/package.json pins — because this job's working-directory
      # is `implementation` AND `npm ci` has already run. Those two facts are
      # the entire pin. Run this same line from the repo root, or ahead of
      # `npm ci`, and npx resolves a NEWER Playwright out of its own cache,
      # fetches that release's browser revisions, and PRUNES the pinned WebKit
      # from ~/.cache/ms-playwright — leaving a green job that never launched
      # one of the three engines this gate exists to exercise. Measured while
      # wiring this lane: `playwright --version` reports the pinned 1.59.1
      # inside implementation/ and 1.62.1 one directory up, from the npx cache,
      # so `--no-install` does NOT save you — only the working directory does.
      # Do not move this step out of `implementation`, and do not reorder it
      # before `npm ci`.
      - name: Install pinned Chromium + Firefox + WebKit
        run: timeout -k 10 720 npx playwright install --with-deps chromium firefox webkit || "$GITHUB_WORKSPACE/.github/scripts/playwright-install-failed.sh" $?

      - name: I15 three-engine controlled-input gate
        run: npm run test:fresco-controlled

  cljs-fresco-hmr:
    name: CLJS fresco HMR contract through a real shadow reload (Chromium + Firefox + WebKit)
    # The HMR witness matrix. This job is what invokes `test:fresco-hmr` in
    # CI; without it the gate would have to declare itself `unscheduled` in
    # scripts/check_gate_scheduling.py rather than let the absence go
    # unrecorded.
    #
    # WHY THIS IS A JOB OF ITS OWN and not a step of `cljs-fresco-controlled`,
    # which already has the JDK, the npm install and the same three pinned
    # engines. Because it needs something no other job in this workflow has: a
    # live `shadow-cljs watch` and shadow's OWN `:dev-http` on port 8061. Every
    # other browser gate compiles a bundle and serves it over http-server, and
    # a compiled bundle cannot hot-reload itself — the reload IS the subject
    # here. Sharing the controlled job would also mean a red could not name
    # which of the two contracts broke, and would put a ~30-minute watch on the
    # critical path of a 25-minute gate.
    #
    # WHAT IT ACTUALLY EXECUTES, because a job that merely references a gate is
    # the fail-open this repo keeps finding in its own instruments. The runner
    # starts the watch, rewrites one marked line of a real source file, and
    # waits for the NEW LITERAL to appear on screen before asserting — which is
    # what separates "shadow delivered code" from "an after-load hook fired".
    # 36 real reloads per run, 105 checks per engine. Narrowing the engine set
    # would be the quiet way to keep the name and drop the claim, and there are
    # TWO distinct losses in it — so "the comparator would be inert" is not the
    # whole reason. The comparator's floor is two engines
    # (`if (engines.length < 2) return problems`), and only a ONE-engine run is
    # below it. A TWO-engine narrowing IS still compared; what it drops is one
    # of the three pinned engines — `FRESCO_HMR_ENGINES=chromium,firefox`
    # never starts WebKit, while this job's name goes on promising it. So this
    # job passes NO `FRESCO_HMR_ENGINES` at all, and a classifier regression
    # pins that.
    #
    # PER-PR on its own changed surface rather than nightly, for the reason
    # TESTING.md's placement table gives for slow essential coverage: this is
    # the only lane that can catch drift between `defview` macro expansion and
    # a real shadow reload, or a renderer that fails to run old-generation
    # cleanup on a type replacement. The package's Node HMR suites drive the
    # commit and release seams by hand and can catch neither.
    needs: detect_changed_surfaces
    if: needs.detect_changed_surfaces.outputs.fresco_hmr == 'true'
    runs-on: ubuntu-latest
    # Generous, and deliberately so: one cold `shadow-cljs watch` compile plus
    # 36 incremental recompiles, each awaited to the screen, across three
    # engine sessions against the single watch.
    timeout-minutes: 40
    defaults:
      run:
        working-directory: implementation
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      # The watch is a real shadow-cljs process, so this job needs a JDK where
      # the http-server browser gates do not.
      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: implementation/package-lock.json

      - name: Cache Maven / gitlibs (shadow-cljs deps)
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: ${{ runner.os }}-cljs-${{ hashFiles('implementation/shadow-cljs.edn', 'implementation/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-cljs-

      - name: npm install
        run: npm ci

      # Shares the three-engine cache key with `cljs-fresco-controlled`: the
      # two jobs need the same three browsers at the same pin, and the key
      # names the set so a two-engine cache cannot be served under it.
      - name: Cache Playwright browser binaries
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-cfw-${{ hashFiles('implementation/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-cfw-
            ${{ runner.os }}-playwright-

      # THE PIN — read the same note on `cljs-fresco-controlled` before
      # touching this step. `npx` resolves implementation/node_modules/.bin/
      # playwright, the version package.json pins, ONLY because this job's
      # working-directory is `implementation` AND `npm ci` has already run.
      # Run it from the repo root or ahead of `npm ci` and npx resolves a
      # NEWER Playwright from its own cache, fetches that release's browser
      # revisions and PRUNES the pinned WebKit out of ~/.cache/ms-playwright —
      # a green job that never launched one of the three engines. Do not move
      # this step out of `implementation`, and do not reorder it before
      # `npm ci`.
      - name: Install pinned Chromium + Firefox + WebKit
        run: timeout -k 10 720 npx playwright install --with-deps chromium firefox webkit || "$GITHUB_WORKSPACE/.github/scripts/playwright-install-failed.sh" $?

      - name: HMR contract gate — 36 real shadow reloads in three engines
        run: npm run test:fresco-hmr

  jvm-reagent:
    name: Diagnostic skip-ok JVM reagent-adapter classpath probe
    needs: detect_changed_surfaces
    if: needs.detect_changed_surfaces.outputs.adapter_diagnostic == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: implementation/adapters/reagent
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Clojure CLI
        run: "$GITHUB_WORKSPACE/.github/scripts/install-clojure-cli.sh"

      - name: Cache Maven / gitlibs
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: ${{ runner.os }}-clj-reagent-${{ hashFiles('implementation/adapters/reagent/deps.edn', 'implementation/core/deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-clj-reagent-
            ${{ runner.os }}-clj-

      # The Reagent artefact's :test alias has no JVM-runnable tests of
      # its own (the adapter ns is :cljs-only). The job exists so the
      # artefact's deps + classpath wiring stay green and any future JVM
      # adapter probe lands here. The empty case needs no `|| echo`
      # fallback: the cognitect test-runner returns 0 when there are no
      # test namespaces matching its pattern (verified — `clojure -M:test`
      # here reports "Ran 0 tests" and exits 0). A non-zero exit therefore
      # means a REAL failure — a deps/classpath break or a future failing
      # JVM probe ns — and MUST fail the step, so we do not swallow it.
      - name: Run JVM tests (reagent artefact, classpath probe)
        run: clojure -M:test

  jvm-reagent-slim:
    name: JVM reagent-slim (clojure -M:test)
    needs: detect_changed_surfaces
    if: needs.detect_changed_surfaces.outputs.adapter_diagnostic == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: implementation/adapters/reagent-slim
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Clojure CLI
        run: "$GITHUB_WORKSPACE/.github/scripts/install-clojure-cli.sh"

      - name: Cache Maven / gitlibs
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: ${{ runner.os }}-clj-reagent-slim-${{ hashFiles('implementation/adapters/reagent-slim/deps.edn', 'implementation/core/deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-clj-reagent-slim-
            ${{ runner.os }}-clj-

      # The reagent-slim artefact is a React-19 reimplementation of Reagent.
      # It ships a JVM-runnable test namespace
      # under test/ — reagent2.impl.component-test (the
      # component-shape detection contract). The bulk of its suite is
      # CLJS unit tests run via shadow-cljs's :node-test build (see cljs
      # job), but the JVM surface is real, so the test-runner's non-zero
      # exit MUST surface here — no `|| echo` fallback, or a regression
      # in the component-shape contract would stay green.
      - name: Run JVM tests (reagent-slim artefact)
        run: clojure -M:test

  jvm-uix:
    name: Diagnostic skip-ok JVM uix-adapter guards
    needs: detect_changed_surfaces
    if: needs.detect_changed_surfaces.outputs.adapter_diagnostic == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: implementation/adapters/uix
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Clojure CLI
        run: "$GITHUB_WORKSPACE/.github/scripts/install-clojure-cli.sh"

      - name: Cache Maven / gitlibs
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: ${{ runner.os }}-clj-uix-${{ hashFiles('implementation/adapters/uix/deps.edn', 'implementation/core/deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-clj-uix-
            ${{ runner.os }}-clj-

      # This lane runs REAL JVM tests, not a classpath probe.
      # `test/re_frame/adapter/` carries two JVM namespaces: the
      # `docs/core/testing/views.md` §4 recipe pin, and the clean-consumer
      # guard for the uix.dom dependency recipe. The adapter ns itself is
      # :cljs-only (UIx is a
      # CLJS-only library), so these are JVM-side guards rather than adapter
      # behaviour tests. Accordingly the :test alias does NOT pass `--probe`:
      # it claims coverage and takes the runner's test-count floor,
      # so a run executing zero tests FAILS here rather than
      # exiting 0. `jvm-reagent` above IS a declared probe lane, so its
      # near-identical comment differs on purpose — do not harmonise the two.
      # No `|| echo` fallback: a non-zero exit means a REAL failure — a
      # failing test, or a deps/classpath break — and MUST fail the step, so
      # we do not swallow it.
      # The substrate's smoke-test surface is the browser-side testbed spec —
      # see the adapter-testbed-smokes job below.
      - name: Run JVM tests (uix artefact, classpath probe)
        run: clojure -M:test

  jvm-adapters-test-react:
    name: JVM test-react (clojure -M:test)
    needs: detect_changed_surfaces
    # A DISJUNCTION, and both halves are load-bearing.
    # `adapter_diagnostic` is the REVERSE edge: the fixture depends on core, so
    # a core change must still schedule this job, and the core arm of the
    # classifier is what fires that output. `test_react_jvm` is the forward
    # edge: a change to this artefact's own src/test/deps arms this job
    # WITHOUT arming jvm-adapters-{reagent,reagent-slim,uix}, which stay on
    # `adapter_diagnostic` alone and cannot reach this local-only CLJC fixture.
