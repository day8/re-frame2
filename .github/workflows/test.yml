  story-xray-browser:
    name: Story/Xray browser gates (PR-smoke)
    needs: detect_changed_surfaces
    # Three tiers, three conditions.
    # `story_xray_browser` schedules the PR-smoke steps; `story_full_gate`
    # schedules the full Story feature-load step; `story_static_gate` schedules
    # the Story static-export step. Any one alone must open the job, and each
    # step carries its own tier's condition, so a change to the full-gate
    # runners or to the static gate does not pay for two smoke compiles it
    # cannot affect. An ordinary Story/Xray runtime change keeps
    # the two cheap smokes and also runs the ~90 s static-export step,
    # which is the only PR-time `:advanced` compile of that closure; it stays
    # off the full feature-load tier.
    if: >-
      needs.detect_changed_surfaces.outputs.story_xray_browser == 'true' ||
      needs.detect_changed_surfaces.outputs.story_full_gate == 'true' ||
      needs.detect_changed_surfaces.outputs.story_static_gate == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: implementation
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: implementation/package-lock.json

      - name: Set up Clojure CLI
        run: "$GITHUB_WORKSPACE/.github/scripts/install-clojure-cli.sh"

      - name: Cache Maven / gitlibs (Story/Xray shadow-cljs deps)
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: ${{ runner.os }}-story-xray-browser-${{ hashFiles('implementation/shadow-cljs.edn', 'implementation/package-lock.json', 'tools/story/deps.edn', 'tools/xray/deps.edn', 'implementation/core/deps.edn', 'implementation/adapters/reagent/deps.edn', 'implementation/machines/deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-story-xray-browser-
            ${{ runner.os }}-cljs-

      # Cache the shadow-cljs compile output (.shadow-cljs/
      # incremental state + .cpcache classpath cache) keyed on the build
      # config + every source path the smoke testbeds pull in. The
      # testbed compile (400+ files per bundle) is the dominant cost of
      # this gate; a warm `.shadow-cljs/` cache lets shadow recompile
      # only changed namespaces instead of the whole graph. The key is
      # conservative — any change under the Story/Xray src or testbed
      # trees, the shared implementation source, or the build config
      # busts it, so a stale cache can never serve wrong output. The
      # `restore-keys` prefix still gives a warm partial cache on a miss.
      - name: Cache shadow-cljs compile output (.shadow-cljs / .cpcache)
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            implementation/.shadow-cljs
            implementation/.cpcache
          key: ${{ runner.os }}-story-xray-shadow-${{ hashFiles('implementation/shadow-cljs.edn', 'implementation/deps.edn', 'implementation/package-lock.json', 'implementation/**/deps.edn', 'tools/story/deps.edn', 'tools/xray/deps.edn', 'tools/story/src/**', 'tools/story/testbeds/**', 'tools/xray/src/**', 'tools/xray/testbeds/**', 'implementation/core/src/**') }}
          restore-keys: |
            ${{ runner.os }}-story-xray-shadow-

      - name: npm install
        run: npm ci

      # Cache the Playwright browser binary (see cljs-browser).
      - name: Cache Playwright browser binary
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('implementation/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright (Chromium + system deps)
        run: timeout -k 10 720 npx playwright install --with-deps chromium || "$GITHUB_WORKSPACE/.github/scripts/playwright-install-failed.sh" $?

      # PR-smoke tier. The full feature-load +
      # full Xray matrix + Story static-export sweep would put ~700s for the
      # THREE GATES TOGETHER on the critical path of every Story/Xray PR (the
      # Xray matrix alone is 154–171s of a 509–564s three-gate nightly
      # total). The identical sweep runs nightly in expensive-tests.yml,
      # so PR time runs only the high-signal subset:
      #
      #   - Xray feature gate in --smoke mode: every scenario tagged
      #     `smoke: true` in tools/xray/testbeds/feature_matrix/
      #     scenarios.cjs, a set the gate counts and prints on each run —
      #     read that live pair rather than a count here. It compiles a
      #     few testbed bundles instead of the full matrix's; nine measured
      #     PR-smoke runs at four bundles took 65–85s, mean 79s — a prior,
      #     not a ceiling.
      #   - Story :script CI-as-test gate: drives the
      #     live Story shell over the runner's own testbed roster and
      #     runs every variant's :script. This is the gate that
      #     renders the assertion-strip, so the assertion-strip render path
      #     stays covered on the PR critical path.
      #
      # The rest of the full sweep (test:xray-feature-gate, test:story-static)
      # runs nightly in expensive-tests.yml. test:story-feature-load is
      # the exception, and only for the PRs that change it — see the step at
      # the end of this job.
      - name: Run Xray feature browser gate (PR-smoke)
        if: needs.detect_changed_surfaces.outputs.story_xray_browser == 'true'
        run: npm run test:xray-feature-gate:smoke

      # Every Story variant whose body carries a
      # `:script` slot doubles as an automated regression test.
      # The runner discovers them via `re-frame.story.play.ci-runner`,
      # drives each through the live shell, and reports a structured
      # pass/fail row per variant. Kept on the PR critical path: it
      # compiles the runner's own testbed roster, and it is the live
      # render path that exercises the assertion-strip.
      # WHICH testbeds, and how many, is deliberately not written here:
      # `TESTBEDS` in
      # examples/scripts/serve-and-run-story-play-scripts.cjs is the
      # roster and nothing links a count in this file to that list, so a
      # count here would go stale silently. The runner
      # names each entry as it drives it.
      - name: Run Story :script CI-as-test gate
        if: needs.detect_changed_surfaces.outputs.story_xray_browser == 'true'
        run: npm run test:story-play-scripts

      # Arming a changed-surface output is worthless if the job it schedules
      # does not run the changed file: NEITHER of the two steps above loads
      # tools/story/test/story_feature_load.cjs or story_browser_scenarios.cjs.
      # Only `npm run test:story-feature-load` does — it compiles the two Story
      # testbeds, serves them, and drives both spec modules through Chromium —
      # so without this step a PR editing those files would first be
      # exercised end to end by the nightly sweep.
      #
      # Gated on `story_full_gate`, which arms ONLY on the gate's own spec
      # modules and its run/serve orchestration — not on ordinary Story/Xray
      # runtime changes, which keep the cheaper smoke path above. So this adds
      # nothing to the critical path of a normal Story/Xray PR: it runs on the
      # rare PR that edits the runner itself, where it is the only step that
      # exercises the diff at all. Cost when it does run is one extra testbed
      # compile (login-form; counter-with-stories is already compiled by the
      # play-scripts step, and both share this job's keyed .shadow-cljs cache)
      # plus the two Playwright specs.
      #
      # The nightly sweep in expensive-tests.yml remains the
      # system of record for the full matrix.
      - name: Run the FULL Story feature-load gate (direct-runner change, rf2-65ajl)
        if: needs.detect_changed_surfaces.outputs.story_full_gate == 'true'
        run: npm run test:story-feature-load

      # Identical in shape to the step above. `npm run test:story-static` IS
      # `node scripts/check-story-static.cjs`, and none of the three steps
      # above loads check-story-static.cjs or story-build.cjs. So without this
      # step a PR editing the static-export gate's own assertions would merge
      # with the gate unexercised — the classifier arms outputs for the file,
      # but none would schedule a job that runs its command.
      #
      # Gated on `story_static_gate`, which arms on the gate's own two scripts
      # (above); on Story/Xray runtime source and testbeds, through the SAME
      # predicate as the PR-smoke steps; and on implementation/shadow-cljs.edn,
      # which declares this step's build. It stays off the rest of
      # implementation/scripts/ and off the two npm manifests.
      #
      # It arms on more than the two gate scripts because ARMING THE JOB IS
      # NOT ARMING THE STEP: a change under tools/xray/src that breaks the
      # static export arms `story_xray_browser`, so this job OPENS and its
      # dev-compile smokes pass — and gated on the gate scripts alone, this
      # step would show `skipped`. This is the only PR-time
      # command that compiles Story under `:advanced`, and the release
      # bundle's closure is exactly those source trees.
      #
      # The cost: about 90 s (nightly record 55–91 s) inside a job that was
      # the critical path in 0 of 45 measured runs, so it stays off a normal
      # PR's time-to-green.
      #
      # It shares this job's keyed .shadow-cljs cache with the steps above, but
      # note it compiles its OWN build target (:story-static/counter-with-
      # stories, the static-export entry point) rather than reusing the
      # play-scripts step's dev compile — the two are different shadow-cljs
      # builds of the same testbed, which is precisely the point of the gate.
      #
      # The nightly sweep in expensive-tests.yml remains the
      # system of record for the full matrix.
      - name: Run the Story static-export gate (rf2-9n2cv, rf2-xurxw)
        if: needs.detect_changed_surfaces.outputs.story_static_gate == 'true'
        run: npm run test:story-static

      # On a RED browser gate, upload the failed-run
      # evidence so the failure is a downloadable, off-CI post-mortem
      # (spec/017 §Failed-run artifacts in CI). Two paths are surfaced:
      #   - implementation/out/story-play-scripts/ — the play-scripts run
      #     evidence (per-row expected/actual + per-step diagnostics) the
      #     runner persists ONLY when a play deviates from its expected
      #     status (the run-evidence projection).
      #   - implementation/out/xray-feature-gate-artifacts/ — the Xray
      #     feature-gate failure screenshots + diagnostics the gate already
      #     writes on a failing scenario.
      # `if: failure()` scopes the upload to a red run; `if-no-files-found:
      # ignore` keeps a partial failure (e.g. the xray step failed before
      # the play-scripts step ran, or vice versa) from turning the upload
      # itself red. There is no dedicated capability-routed (:pixels /
      # :a11y-engine) browser-tier gate; this step uploads ONLY the failed-run
      # artifacts of the existing gate. One is wired on whichever of these
      # comes first:
      # (1) the first COMMITTED authored variant/inline plan — outside tool
      # unit tests / spec / MCP descriptors — that intentionally carries
      # :rf.assert/visual-snapshot (:pixels) or :rf.assert/a11y
      # (:a11y-engine) => wire a NIGHTLY capability-routed browser gate in
      # expensive-tests.yml; (2) the first genuine visual/a11y regression
      # that the structural a11y check + existing Story/Xray browser gates
      # MISS => escalate to a changed-surface PR gate. See TESTING.md
      # (Story-as-test paragraph) for the mirrored prose.
      - name: Upload failed browser-gate run evidence (rf2-315cf)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: story-xray-browser-failed-run-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            implementation/out/story-play-scripts/
            implementation/out/xray-feature-gate-artifacts/
          if-no-files-found: ignore
          retention-days: 14

  cljs-reagent-slim-bundle-isolation:
    name: CLJS Reagent Slim bundle isolation + client-runtime smoke (adapter-owned, rf2-2ppcv + rf2-5v0dg7)
    needs: detect_changed_surfaces
    if: needs.detect_changed_surfaces.outputs.reagent_slim_bundle == 'true'
    runs-on: ubuntu-latest
    # Job-level backstop to the step-level Playwright cap below.
    # Without it the job inherits GitHub's 360-min default, so any wedged step
    # (such as a `--with-deps` apt/dpkg-lock hang) would leave this job
    # — and the required `all-required-passed` aggregator that `needs:` it —
    # open-ended pending, blocking the merge. 20 min gives a cold-Maven-cache
    # run generous headroom while making any genuine hang a fast, re-runnable
    # FAILURE. Mirrors the mcp-conformance-re-frame2-pair job cap.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: implementation
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: implementation/package-lock.json

      - name: Set up Clojure CLI
        run: "$GITHUB_WORKSPACE/.github/scripts/install-clojure-cli.sh"

      - name: Cache Maven / gitlibs (shadow-cljs deps)
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: ${{ runner.os }}-cljs-reagent-slim-bundle-isolation-${{ hashFiles('implementation/shadow-cljs.edn', 'implementation/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-cljs-reagent-slim-bundle-isolation-
            ${{ runner.os }}-cljs-

      - name: npm install
        run: npm ci

      # The S3-008 adapter-owned bundle-isolation contract for day8/reagent-slim.
      # Builds `examples/counter` (stock-Reagent),
      # `examples/counter-slim-and-fast` (slim Reagent) and
      # `reagent-slim-ssr-isolation-fixture` (the gate-only SSR twin) under
      # :advanced, then greps the slim bundles for stock-Reagent
      # impl-namespace fingerprints AND for `react-dom/server` symbols.
      # Both must be absent from the slim bundle. The same sentinels
      # are required to be present in the stock bundle as a methodology
      # sanity check — if a future stock-Reagent upgrade DCEs them out
      # of the stock build too, the script catches the lost signal and
      # the sentinel set is re-derived.
      #
      # Dual contract: stock-Reagent impl + react-dom/server isolation.
      # The gate-owned entry (counter-slim-and-fast.bundle-isolation-entry)
      # deliberately exercises reagent2.dom.server/render-to-static-markup
      # so the react-dom/server-absence assertion is non-vacuous (the SSR
      # path IS in that bundle, just pure-CLJS — per IMPL-SPEC §8 + S3-005).
      # The teaching counter-slim-and-fast.core stays clean of the
      # fixture, and so does the teaching BUILD: the entry has a
      # non-runnable build of its own
      # (:reagent-slim-ssr-isolation-fixture). So the runnable example bundle
      # boots core/run and nothing else — Contract 7 greps it to prove that,
      # and Contract 0 pins both :init-fns in shadow-cljs.edn.
      - name: Verify Reagent Slim bundle isolates stock Reagent + react-dom/server
        run: npm run test:reagent-slim:bundle-isolation

      # The reagent-slim CLIENT-RUNTIME browser smoke in PR
      # CI. The dedicated, adapter-owned slim smoke runner
      # (serve-and-run-reagent-slim-smoke.cjs) compiles the slim testbed,
      # serves it, and drives the mount/inject/click path in headless
      # Chromium. `test:script-policy` only proves the npm script
      # EXISTS, so without this step a regression in
      # the adapter-owned mount/injection/click path, or in the smoke runner
      # itself, could ship green. This step executes the gate for
      # reagent_slim_bundle surface changes (which also fire on edits to
      # the runner + its policy test — report-changed-surfaces.sh).

      # Cache the Playwright browser binary (see cljs-browser), as every
      # other PR Playwright job does ahead of the install; without it this
      # job would re-download Chromium (~120 MB) on every run. Keyed on the locked
      # Playwright version (package-lock.json); a bump busts it.
      - name: Cache Playwright browser binary
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('implementation/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      # Cap the `--with-deps` Playwright install. `--with-deps`
      # runs `sudo apt-get install` for Chromium's system libraries; on a GHA
      # runner that occasionally blocks indefinitely on the dpkg/apt lock held
      # by the background `unattended-upgrades` job. With NO step timeout a
      # wedged lock would leave the slim job in_progress forever — never
      # reporting a conclusion — and so leave the required
      # `all-required-passed` aggregator (it `needs:` this job) perpetually
      # pending, blocking the merge. A
      # healthy install is ~20s; 5 min covers a slow apt + cold (cache-miss)
      # download while turning the lock-wait into a re-runnable FAILURE
      # instead of an open-ended block. Mirrors the identical step-level cap
      # on the hermetic re-frame2-pair-mcp Playwright install.
      #
      # DO NOT RAISE THIS NUMBER, and do not thin the apt hop to
      # make it fit. This is the canonical note; the other two capped sites
      # (tenant-switcher-testbed-smoke, mcp-conformance-re-frame2-pair) point
      # here. Every claim below is from a CI log or
      # from `playwright-core` at the pinned version, not from taste:
      #
      #   * THE CAP IS CLEAR OF THIS SITE, BUT NOT BY A WIDE MARGIN. Over a
      #     measured window of every `Install Playwright*` step (377
      #     non-skipped samples, 370 successes, 7 non-successes), the
      #     successes carry a long tail — p50 14s and p90 34s,
      #     but p95 113s, p99 424s, MAX 621s, and four of the 370 finished
      #     ABOVE 300s. Every one of those four sits at a job with no step
      #     cap; across the three step-capped sites the worst success is 164s
      #     over 80 samples, so this cap is 1.8x its own site's worst case.
      #     That is clear, not comfortable, and the trend is
      #     the thing to watch: re-derive before quoting, do not carry the
      #     number forward.
      #
      #     Raising the cap
      #     re-widens the open-ended window it exists to bound, in which a
      #     wedged apt/dpkg lock holds a PR 15-75+ min and blocks the merge
      #     queue. That trade is a regression, not a fix. But the 1.8x is
      #     close enough that raising it is a judgement call rather than an
      #     arithmetic certainty.
      #
      #   * THE APT HOP IS ALREADY MINIMAL. On ubuntu-24.04 the hop reports
      #     `0 upgraded, 9 newly installed, 0 to remove` — invariant across
      #     runner-image versions and
      #     independent jobs. ZERO Chromium shared libraries are installed;
      #     every one of the 21 entries in nativeDeps' `chromium:` list
      #     reports "is already the newest version". The 9 are CJK/Thai/
      #     Cyrillic fonts from the separate `tools:` list plus two
      #     transitive xfonts packages. They cannot be dropped selectively:
      #     `Registry.installDeps` does an unconditional `targets.add("tools")`
      #     (registry/index.js) and `installDependenciesLinux` already passes
      #     `--no-install-recommends` (registry/dependencies.js). The only
      #     lever is dropping `--with-deps` wholesale, which trades a loud,
      #     annotated apt failure for a silent dependency on a runner-image
      #     property nobody here controls — a removed lib would surface as an
      #     unlaunchable Chromium, which is strictly worse than a slow apt.
      #
      #   * SO A BLOW-OUT HERE IS THE MIRROR, NOT THIS WORKFLOW.
      #     A run can spend the whole 5 min inside apt and
      #     never reach the browser download. Those same 21.1 MB of fonts
      #     fetch in 1s at 17-23 MB/s on a healthy run ("Fetched 21.1 MB in
      #     1s (18.9 MB/s)"). In the observed failing
      #     run they came down at a sustained ~52 kB/s — while `apt-get
      #     update`'s own metadata had come off the SAME host seconds earlier
      #     in the SAME step at 7831 kB/s, 150x faster. That is an
      #     azure.archive.ubuntu.com edge degradation. No cap survives it:
      #     21.1 MB at 52 kB/s needs ~405s of download alone.
      #
      #   * THE BROWSER CACHE IS ORTHOGONAL HERE. The cache step
      #     above can score an exact-key hit and the step still blow the cap:
      #     a hit skips the DOWNLOAD; this failure is in the apt hop,
      #     which runs either way.
      #
      # THIS SITE IS ONE OF THE THREE THAT DELIBERATELY KEEP THE BARE FORM.
      # A step the runner guillotines on `timeout-minutes` is
      # killed rather than failing, so the `|| playwright-install-failed.sh`
      # handler never runs. Install stalls do happen, so other sites
      # run `timeout -k 10 720 npx playwright install … || <handler> $?`, and
      # `scripts/check_fast_pr_gap.py`'s `^npx playwright install\b` setup
      # pattern carries a narrow optional `timeout` group so that form fails
      # nothing open.
      #
      # This site keeps the bare form because the gap is not open HERE, and
      # that was measured rather than assumed. A step-cap guillotine
      # posts `The action 'Install Playwright (Chromium + system deps)' has
      # timed out after 5 minutes`, which
      # names the step, so a reader sees provisioning without opening a log.
      # It is the JOB-cap guillotine that says nothing usable: it carries
      # only `The job has exceeded the
      # maximum execution time of 15m0s` and `The operation was canceled.`,
      # with every later step `skipped`. Adding a redundant in-command
      # deadline here would thin the 1.8x margin above to restate an
      # annotation the runner already gives. See the header of
      # .github/scripts/playwright-install-failed.sh for the full derivation.
      - name: Install Playwright (Chromium + system deps)
        timeout-minutes: 5
        run: npx playwright install --with-deps chromium || "$GITHUB_WORKSPACE/.github/scripts/playwright-install-failed.sh"

      - name: Run Reagent Slim client-runtime browser smoke
        run: npm run test:reagent-slim:smoke

  tenant-switcher-testbed-smoke:
    name: Tenant-switcher testbed browser smoke (rf2-h5e3v7)
    needs: detect_changed_surfaces
    if: needs.detect_changed_surfaces.outputs.tenant_switcher_smoke == 'true'
    runs-on: ubuntu-latest
    # Job-level backstop to the step-level Playwright cap below,
    # mirroring the cljs-reagent-slim-bundle-isolation job. A wedged
    # `--with-deps` apt/dpkg-lock would otherwise leave this job — and the
    # required all-required-passed aggregator that `needs:` it — open-ended
    # pending and block the merge. 20 min gives a cold-Maven-cache testbed
    # compile generous headroom while making any genuine hang a fast,
    # re-runnable FAILURE.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: implementation
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: implementation/package-lock.json

      - name: Set up Clojure CLI
        run: "$GITHUB_WORKSPACE/.github/scripts/install-clojure-cli.sh"

      - name: Cache Maven / gitlibs (shadow-cljs deps)
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: ${{ runner.os }}-tenant-switcher-smoke-${{ hashFiles('implementation/shadow-cljs.edn', 'implementation/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-tenant-switcher-smoke-
            ${{ runner.os }}-cljs-

      - name: npm install
        run: npm ci

      # Cache the Playwright browser binary (see cljs-browser).
      - name: Cache Playwright browser binary
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('implementation/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      # Cap the `--with-deps` Playwright install (see the slim
      # job for the dpkg/apt-lock-wedge rationale). A healthy install is
      # ~20s; 5 min covers a slow apt + cold download while turning a lock
      # wait into a re-runnable FAILURE instead of an open-ended block.
      #
      # DO NOT RAISE THIS NUMBER. A run of this job that burns the whole 5 min
      # inside the apt hop without reaching the browser download is an
      # azure.archive.ubuntu.com throughput collapse (~52 kB/s against
      # 17-23 MB/s on a healthy run), not a cap that is too tight. The
      # measurement, the
      # at-source reason the apt hop cannot be thinned, and why the browser
      # cache does not help this path are all set out at the
      # cljs-reagent-slim-bundle-isolation site above.
      - name: Install Playwright (Chromium + system deps)
        timeout-minutes: 5
        run: npx playwright install --with-deps chromium || "$GITHUB_WORKSPACE/.github/scripts/playwright-install-failed.sh"

      # The tenant-switcher testbed browser smoke in PR CI.
      # The dedicated runner (serve-and-run-tenant-switcher-testbed.cjs)
      # compiles the :testbeds/tenant-switcher shadow build, stages the
      # hand-written index.html, serves it under the ownership-token
      # handshake, and drives the colocated testbeds/tenant_switcher/spec.cjs
      # in headless Chromium (failing on any uncaught pageerror). It is the
      # ONLY Playwright smoke that exercises this browser scenario; without
      # this job `npm run test:testbed-tenant-switcher` would be defined in
      # package.json but invoked by no workflow, so a regression in the
      # runner / colocated spec / testbed could ship green.
      - name: Run tenant-switcher testbed browser smoke
        run: npm run test:testbed-tenant-switcher

  # ---------------------------------------------------------------------------
  # Per-tool CI jobs.
  #
  # Each `tools/<name>/` artefact ships its own test tree. Some surfaces
  # (the *_cljs_test.cljs / .cljc files under tools/story/ and tools/xray/)
  # are already picked up by the consolidated `:node-test` build above
  # because shadow-cljs.edn lists those source paths. JVM-runnable tests
  # (clojure -M:test) and out-of-consolidated-tree node-test surfaces
  # are not — these per-tool jobs cover them.
  #
  # Job naming mirrors the per-artefact `jvm-<name>` / `cljs-*` pattern
  # used above. Like the artefact jobs, none `needs:` another — they run
  # in parallel.
  # ---------------------------------------------------------------------------

  jvm-tools-xray:
    name: JVM tools/xray (clojure -M:test)
    needs: detect_changed_surfaces
    if: needs.detect_changed_surfaces.outputs.tools_jvm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/xray
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Clojure CLI
        run: "$GITHUB_WORKSPACE/.github/scripts/install-clojure-cli.sh"

      - name: Cache Maven / gitlibs
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: ${{ runner.os }}-clj-tools-xray-${{ hashFiles('tools/xray/deps.edn', 'implementation/core/deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-clj-tools-xray-
            ${{ runner.os }}-clj-

      # Xray ships JVM test files (`config_test.clj`, `trace_bus_test.clj`)
      # alongside its CLJS test trees. The CLJS surfaces are already
      # picked up by the consolidated `:node-test` build (shadow-cljs.edn
      # lists tools/xray/test as a source path); this job closes the
      # JVM-side gap. The test-runner returns non-zero on any failure;
      # the job MUST surface that so the gate is real — no `|| echo`
      # fallback, mirroring `jvm-machines` / `jvm-schemas` above.
      - name: Run JVM tests (tools/xray artefact)
        run: clojure -M:test

  jvm-tools-story:
    name: JVM tools/story (clojure -M:test)
    needs: detect_changed_surfaces
    if: needs.detect_changed_surfaces.outputs.tools_jvm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/story
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Clojure CLI
        run: "$GITHUB_WORKSPACE/.github/scripts/install-clojure-cli.sh"

      - name: Cache Maven / gitlibs
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: ${{ runner.os }}-clj-tools-story-${{ hashFiles('tools/story/deps.edn', 'implementation/core/deps.edn', 'implementation/adapters/reagent/deps.edn', 'implementation/machines/deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-clj-tools-story-
            ${{ runner.os }}-clj-

      # tools/story ships a substantial JVM test surface
      # (story_test.clj, story_runtime_test.clj, story_assertions_test.clj,
      # story_ui_test.clj, story_share_test.clj, story_play_test.clj,
      # story_source_coords_test.clj, story_scrubber_xref_test.clj,
      # story_layout_debug_test.clj, story_fx_stubs_test.clj). The CLJS
      # surfaces are already covered by the consolidated `:node-test`
      # build above (shadow-cljs.edn lists tools/story/test as a source
      # path); this job closes the JVM-side gap.
      - name: Run JVM tests (tools/story artefact)
        run: clojure -M:test

  jvm-tools-story-mcp:
    name: JVM tools/story-mcp (clojure -M:test)
    needs: detect_changed_surfaces
    if: needs.detect_changed_surfaces.outputs.tools_jvm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/story-mcp
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Clojure CLI
        run: "$GITHUB_WORKSPACE/.github/scripts/install-clojure-cli.sh"

      - name: Cache Maven / gitlibs
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: ${{ runner.os }}-clj-tools-story-mcp-${{ hashFiles('tools/story-mcp/deps.edn', 'tools/story/deps.edn', 'implementation/core/deps.edn', 'implementation/adapters/reagent/deps.edn', 'implementation/machines/deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-clj-tools-story-mcp-
            ${{ runner.os }}-clj-

      # tools/story-mcp is JVM-only by design (Spec 010 §JVM-only): its
      # tests (`protocol_test.clj`, `tools_test.clj`) exercise the
      # JSON-RPC wire format and the MCP tool registrar. Neither runs
      # under shadow-cljs's consolidated `:node-test`; this is the only
      # PR-time CI surface for this artefact.
      - name: Run JVM tests (tools/story-mcp artefact)
        run: clojure -M:test

      # MCP tool-descriptor manifest drift-check. Regenerates
      # the committed `tool-descriptors.edn` in memory from the live tool
      # registry and FAILS if it differs. Adding / removing / renaming a
      # story-mcp tool — or changing a tool's input-key / output? /
      # annotations surface — turns this red until the manifest is
      # regenerated (`clojure -M:gen`). Pure JVM, reuses the warmed
      # classpath; same generate-then-drift-check shape as the
      # api-manifest keystone.
      - name: Assert tool-descriptors.edn matches the registry
        run: clojure -M:gen --check

  jvm-tools-mcp-base:
    name: JVM tools/mcp-base (clojure -M:test)
    needs: detect_changed_surfaces
    if: needs.detect_changed_surfaces.outputs.tools_jvm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/mcp-base
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Clojure CLI
        run: "$GITHUB_WORKSPACE/.github/scripts/install-clojure-cli.sh"

      # mcp-base carries a CLJS test target (shadow-cljs
      # :node-test build) covering the `.cljc` `:cljs` reader-conditional
      # branches the JVM suite cannot reach. Node is required to run it.
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '24'

      - name: Cache Maven / gitlibs
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: ${{ runner.os }}-clj-tools-mcp-base-${{ hashFiles('tools/mcp-base/deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-clj-tools-mcp-base-
            ${{ runner.os }}-clj-

      # tools/mcp-base ships as a `.cljc` library shared
      # across the MCP servers (re-frame2-pair-mcp, story-mcp). The
      # algorithmic content (sensitive-filter, diff-encode, args
      # parsers, overflow shape, vocab constants) is platform-agnostic
      # — a JVM round-trip is the cheapest PR-time gate. re-frame2-pair-mcp's
      # CLJS-side coverage (under `node-test-tools-re-frame2-pair-mcp` below)
      # exercises the same primitives via the shadow-cljs compile
      # path; story-mcp's `jvm-tools-story-mcp` job covers the JVM
      # consumer.
      - name: Run JVM tests (tools/mcp-base artefact)
        run: clojure -M:test

      # The CLJS test target exercises the three `.cljc`
      # `:cljs`-only branches the JVM suite (Malli always present) can
      # never reach — the `goog-define` `validate-patches?` default, the
      # `:cljs` arm of `resolve-malli-validate`, and the
      # soft-pass-when-Malli-absent no-op in the validation gates. The
      # :cljs-test alias deliberately omits Malli so the soft-pass branch
      # actually runs. Both MCP servers consume mcp-base in CLJS, and nothing
      # else pins these paths.
      - name: Install Node deps (shadow-cljs for the CLJS test build)
        run: npm install

      - name: Run CLJS tests (tools/mcp-base artefact)
        run: npm run test:cljs

  # The two artefacts whose JVM lane would otherwise run everywhere EXCEPT at
  # PR time. Both carry a wired `:test` alias and a slot on
  # scripts/test-jvm-tools.sh's roster, so they run locally and in the nightly
  # sweep.
  #
  # Both are gated on their OWN classifier output, not on `tools_jvm`. That
  # output gates FOUR of the jvm-tools-* jobs above (xray / story / story-mcp /
  # mcp-base; `jvm-tools-template` is gated on `template_expensive` instead), and
  # none of them runs either artefact — arming it would fire four unrelated
  # probes and STILL skip the files. Appending steps to one of those jobs fails
  # for the same reason plus a second: it would hang a
  # `tools/machines-viz` step off a job named "JVM tools/xray".
  jvm-tools-machines-viz:
    name: JVM tools/machines-viz (clojure -M:test)
    needs: detect_changed_surfaces
    if: needs.detect_changed_surfaces.outputs.tools_jvm_machines_viz == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/machines-viz
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Clojure CLI
        run: "$GITHUB_WORKSPACE/.github/scripts/install-clojure-cli.sh"

      - name: Cache Maven / gitlibs
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: ${{ runner.os }}-clj-tools-machines-viz-${{ hashFiles('tools/machines-viz/deps.edn', 'implementation/core/deps.edn', 'implementation/machines/deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-clj-tools-machines-viz-
            ${{ runner.os }}-clj-

      # 632 tests / 2537 assertions. Most of the suite double-runs in the CLJS
      # lanes — 29 of its 31 suites are `*_cljs_test.*` and ride the
      # consolidated `:node-test` + `:browser-test` builds. Two do not:
      # `engine_grammar_parity_test.cljc` (the engine<->viz grammar drift
      # ratchet, which is why the `:test` alias carries a TEST-ONLY dep on
      # implementation/machines) and `mermaid_public_smoke_test.cljc`. Their
      # namespaces match neither `cljs-test$` nor `-dom-cljs-test$`, so this job
      # is their only PR-time lane. No `|| echo` fallback — the runner's
      # non-zero exit must surface, same as jvm-machines / jvm-schemas.
      - name: Run JVM tests (tools/machines-viz artefact)
        run: clojure -M:test

  # The CLJS half of the two suites the job above calls out as
  # JVM-only. Both are `.cljc`, so "JVM-only" describes the LANES,
  # not the files: `engine_grammar_parity_test.cljc` carries `:cljs` reader
  # arms and the grammar it mirrors is compiled for the browser. The
  # consolidated `:node-test` bundle does not contain either namespace — its
  # `cljs-test$` selector never reaches a name ending `-test` — so the always-on
  # `cljs` job is not their lane however green it is.
  #
  # `tools/machines-viz/shadow-cljs.edn` declares the artefact's own
  # `:machines-viz-node-test` build for them: its own bundle, its own classpath,
  # its own exit code, so arming these suites cannot contaminate the shared
  # ~11.5k-test run. Declaring the build inside
  # tools/machines-viz also puts it on the ownership line the test-lane
  # bijection gate reads, so rule B2 holds this tree with no gate change.
  #
  # Its OWN output, like the two jobs either side of it and for the same reason:
  # no existing output gates a job that runs this build.
  #
  # It needs Node as well as the JVM — the bundle is a Node script, and
  # shadow-cljs resolves npm from implementation/node_modules (the one install
  # this repo has; the artefact deliberately gains no second lockfile).
  cljs-tools-machines-viz:
    name: CLJS tools/machines-viz (shadow-cljs :machines-viz-node-test)
    needs: detect_changed_surfaces
    if: needs.detect_changed_surfaces.outputs.tools_cljs_machines_viz == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Clojure CLI
        run: "$GITHUB_WORKSPACE/.github/scripts/install-clojure-cli.sh"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: implementation/package-lock.json

      - name: Cache Maven / gitlibs (shadow-cljs deps)
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: ${{ runner.os }}-cljs-tools-machines-viz-${{ hashFiles('tools/machines-viz/deps.edn', 'tools/machines-viz/shadow-cljs.edn', 'implementation/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-cljs-tools-machines-viz-
            ${{ runner.os }}-cljs-

      # shadow-cljs reads npm packages out of implementation/node_modules
      # (`:js-options :js-package-dirs`), and the emitted bundle resolves the
      # same tree at run time because it lands in implementation/out/.
      - name: npm ci
        working-directory: implementation
        run: npm ci

      - name: Run CLJS tests (tools/machines-viz artefact lane)
        working-directory: implementation
        run: npm run test:tools-machines-viz

  # The read-only viewer PAGE. The third artefact surface in this
  # neighbourhood with a job of its own, and the one with the
  # largest blast radius, because it faces CONSUMERS rather than contributors.
  #
  # The viewer ships as a page: `tools/machines-viz/public/viewer.html` plus the
  # compiled `viewer.js` beside it. Per DESIGN-RATIONALE Lock #7 nobody deploys
  # it for you, so `share/encode-share-url` requires `:host` rather than
  # defaulting to a hosted page that does not exist.
  #
  # What a consumer gets instead is a RECIPE: README.md §Building and hosting
  # the viewer page and spec/API.md §Hosting both tell a consumer to run
  # `shadow-cljs release machines-viz-viewer` from implementation/ and copy
  # viewer.html beside the emitted bundle. Without this job the
  # `:machines-viz-viewer` build in implementation/shadow-cljs.edn would be
  # compiled by nothing, and "the page is buildable" would be an unverified,
  # load-bearing promise that rots the first time a namespace or module is
  # renamed.
  #
  # This job IS the documented recipe, plus the assertions that make the pair
  # meaningful: the `<script src>` the page loads names a file the build
  # emitted, and the global the page's boot script CALLS is one the bundle
  # actually installs. Both are derived from the two artefacts, never written
  # down, so a rename that keeps them in step passes.
  #
  # It is a build + staging + coupling gate, not a browser render smoke — the
  # page has no hosted instance to smoke, and its render path is already covered
  # by the artefact's `*-dom-cljs-test` chart suites under `cljs-browser`.
  #
  # Its OWN classifier output, like the two jobs above and for the same reason:
  # no existing output gates a job that builds this bundle.
  machines-viz-viewer-page:
    name: Machines-viz viewer page (release build + stage + coupling)
    needs: detect_changed_surfaces
    if: needs.detect_changed_surfaces.outputs.machines_viz_viewer_page == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Clojure CLI
        run: "$GITHUB_WORKSPACE/.github/scripts/install-clojure-cli.sh"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: implementation/package-lock.json

      - name: Cache Maven / gitlibs (shadow-cljs deps)
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: ${{ runner.os }}-machines-viz-viewer-${{ hashFiles('tools/machines-viz/deps.edn', 'implementation/shadow-cljs.edn', 'implementation/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-machines-viz-viewer-
            ${{ runner.os }}-cljs-

      # The viewer bundle resolves react / @xyflow/react / elkjs out of
      # implementation/node_modules, the one install this repo has.
      - name: npm ci
        working-directory: implementation
        run: npm ci

      # Deliberately the SAME command pair the README hands a consumer, run in
      # the same order, so the gate cannot pass while the documented recipe
      # fails. The self-test runs first, proving the coupling assertion fires on
      # a drifted global rather than being decorative.
      - name: Self-test the viewer-page staging gate
        run: node tools/machines-viz/scripts/stage-viewer-page.cjs --self-test

      - name: Build + stage the viewer page (the documented self-host recipe)
        working-directory: implementation
        run: npm run build:machines-viz-viewer

  jvm-tools-testbed-support:
    name: JVM tools/testbed-support (clojure -M:test)
    needs: detect_changed_surfaces
    if: needs.detect_changed_surfaces.outputs.tools_jvm_testbed_support == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/testbed-support
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: temurin
          java-version: '21'

      # The suite's real-node blocks resolve `require('launch-editor')` from
      # `implementation/`, so this lane needs BOTH node and that package.
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: implementation/package-lock.json

      - name: Set up Clojure CLI
        run: "$GITHUB_WORKSPACE/.github/scripts/install-clojure-cli.sh"

      - name: Cache Maven / gitlibs
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: ${{ runner.os }}-clj-tools-testbed-support-${{ hashFiles('tools/testbed-support/deps.edn', 'implementation/core/deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-clj-tools-testbed-support-
            ${{ runner.os }}-clj-

      # THE STEP THAT ARMS THE PROBES. Without it
      # `launch-editor-installed?` is false and every launch-editor-backed block
      # self-skips: the suite's assertion count drops, and the exit code is
      # 0 either way. Among the skipped blocks would be the column-only
      # refusal, a path no other test reaches.
      #
      # `launch-editor` is a devDependency of implementation/package.json, and
      # the whole lockfile installs in seconds (110 packages, no browser fetch —
      # nothing in this lockfile carries an install script on Linux), so
      # arming it does NOT drag a disproportionate tree in for one small
      # package. Plain `npm ci` from `implementation/`, exactly as this
      # workflow's other node jobs do.
      - name: Install implementation node deps (arms the launch-editor probes)
        working-directory: implementation
        run: npm ci

      # `open_in_editor_server_test.clj`, covering the dev-only open-in-editor
      # server the browser testbeds consume. It is the artefact's whole JVM
      # suite — the sole `.clj` among its four, the other three being the
      # node/browser CLJS suites (`open_in_editor_client_cljs_test.cljs`,
      # `story_host_cljs_test.cljs`, `story_host_dom_cljs_test.cljs`). Being
      # `.clj`, the `:node-test` build that carries this tree on its source
      # paths cannot load it: this job is the artefact's only PR-time JVM
      # lane. Without it the test-lane bijection gate would report an ORPHAN
      # — a fully wired `:test` alias no lane runs.
      #
      # RF2_REQUIRE_NODE_PROBES closes the loop the install alone cannot: the
      # blocks self-skip on a node-less developer box by design, so installing
      # the dependency makes them run today but leaves the job able to go green
      # on a skip tomorrow. With the flag set, a skip FAILS (`skip-or-fail`) and
      # names the missing prerequisite.
      - name: Run JVM tests (tools/testbed-support artefact)
        env:
          RF2_REQUIRE_NODE_PROBES: '1'
        run: clojure -M:test

  jvm-tools-template:
    name: JVM tools/template (clojure -M:test)
    needs: detect_changed_surfaces
    if: needs.detect_changed_surfaces.outputs.template_expensive == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: tools/template
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Clojure CLI
        run: "$GITHUB_WORKSPACE/.github/scripts/install-clojure-cli.sh"

      # Node.js is required for the
      # `emitted_test_run_test.clj` slice (compiles + runs the emitted
      # `events_test.cljs` against the in-repo source tree via
      # `clojure -M:shadow compile test` + `node out/node-test.js`).
      # Gated below behind RF2_TEMPLATE_RUN_EMITTED_TESTS=1 so local
      # fast-loop runs (where Node may be absent) stay green.
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: implementation/package-lock.json

      - name: Cache Maven / gitlibs
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: ${{ runner.os }}-clj-tools-template-${{ hashFiles('tools/template/deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-clj-tools-template-
            ${{ runner.os }}-clj-

      # `npm ci` populates implementation/node_modules so
      # the emitted-app's compiled :node-test bundle can resolve React
      # at runtime. The emitted-test-run slice symlinks (or NODE_PATHs
      # to) this tree rather than `npm install`-ing per substrate.
      - name: npm install (for emitted-test-run smoke)
        working-directory: implementation
        run: npm ci

      # The emitted-tests tier carries ONE Chromium proof: the
      # emitted dev-page boot proof, run for Reagent, UIx and the setup-skill
      # leaf. `npm ci` above installs the playwright PACKAGE but never a
      # browser BINARY, so without this step that driver would hit its
      # `chromium.launch()` catch, exit 2, and the tier would report green
      # with zero browser coverage — a mask under which a BLANK first page
      # on every scaffold variant could ship. Because this job provisions
      # a browser, an unlaunchable Chromium is a HARD FAILURE here rather
      # than an excused skip (`browser-proofs-required?` in
      # `emitted_test_run_test.clj` keys off `CI`).
      #
      # `--with-deps` (not the bare install) because this is a stock
      # ubuntu-latest runner with none of Chromium's shared libraries
      # present and nothing earlier in the job installs them; a
      # half-provisioned browser would red the job, so provision it
      # properly.
      #
      # And cache that binary (see `cljs-browser` for the scheme): the
      # browser DOWNLOAD can fail outright — a Google Cloud Storage 403
      # geo-denial on the Chrome-for-Testing bucket — and a cache hit skips
      # that download.
      # It does NOT skip `--with-deps` — the apt system libraries live outside
      # ~/.cache/ms-playwright and are not cacheable, so the apt hop still runs
      # on every run, hit or miss.
      - name: Cache Playwright browser binary
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('implementation/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright chromium (for the emitted browser proofs)
        working-directory: implementation
        run: timeout -k 10 720 npx playwright install --with-deps chromium || "$GITHUB_WORKSPACE/.github/scripts/playwright-install-failed.sh" $?

      # tools/template is a deps-new template — its tests
      # (`template_test.clj`, `template_emission_test.clj`,
      # `emitted_test_run_test.clj`, `version_lockstep_test.clj`)
      # generate scaffolded apps into a tmp dir and assert the shape,
      # static parse, AND behavioural compile+run. This is the only
      # PR-time CI surface for this artefact.
      #
      # `emitted_test_run_test.clj` compiles + runs the emitted
      # `events_test.cljs` per substrate against the in-repo source
      # tree, with deps rewritten to :local/root. There is no with-story
      # tier: `:substrate` is the only accepted flag, and `template_test.clj`
      # pins `:include-story?` as an unknown-flag error. Gated behind
      # RF2_TEMPLATE_RUN_EMITTED_TESTS=1 — opt-in because the local
      # fast loop may lack Node and the smoke costs ~30–60 s per
      # substrate cold-cache. The `npm ci` step above primes
      # implementation/node_modules so the emitted bundle's React
      # imports resolve at run time.
      #
      # NB: there is deliberately no `clojure -P` deps-resolve probe.
      # The generated deps.edn pins the alpha-channel :mvn/version coords
      # (0.0.1.alpha) which are not published anywhere — re-frame2
      # distributes via git-coord, not Clojars — so a
      # `-P` against the published coords cannot resolve and would always
      # red. The behavioural tier transitively resolves + compiles the
      # full deps tree under the :local/root rewrite, which is the
      # strongest resolve signal achievable pre-publish.
      #
      # Be precise about scope: this proves "generated
      # code compiles + runs against the in-repo framework source", NOT
      # "the emitted deps.edn coords RESOLVE for a real consumer". The
      # local-root rewrite swaps out exactly the coords a published
      # consumer would have to resolve. The published-coord resolve smoke
      # (scaffold via `io.github.day8/re-frame2-template#<tag>` +
      # `clojure -P` / `npm test` WITHOUT the rewrite) is a post-split
      # forward concern — see tools/template/spec/005-Repo-Split.md
      # §3.2 / §3.4 and the pre-split caveat in the template-release.yml
      # GitHub Release body.
      - name: Run JVM tests (tools/template artefact)
        env:
          RF2_TEMPLATE_RUN_EMITTED_TESTS: "1"
        run: clojure -M:test

