  cljs-hicasso-controlled:
    name: CLJS hicasso controlled-input correctness (real Chromium + Firefox + WebKit)
    # rf2-ga8m — invariant I15 in three real engines. The gate itself landed
    # under rf2-hic-016 and could not schedule itself: .github/workflows/** was
    # fenced for rf2-8a6s at the time, so it declared `test:hicasso-controlled`
    # a KNOWN HOLE in scripts/check_gate_scheduling.py rather than leave the
    # absence invisible. This job is the other half; that entry is deleted in
    # the same change, which is what a closed hole looks like.
    #
    # THREE engines, and each is load-bearing. The mechanism under test is made
    # of precisely the things engines differ on — caret and selection
    # restoration, composition event carriage, and the order in which a
    # discrete event's work is flushed. Nothing had ever driven Hicasso's
    # element-path converge outside Chromium; Firefox is here because it is the
    # one major engine this repo had never launched at all.
    #
    # WHY THE WHOLE GATE RUNS PER-PR rather than a one-engine smoke with the
    # rest nightly. The runner does not merely run the same spec three times:
    # it COMPARES its RECORDED rows across engines and reds any divergence no
    # entry in NARROWINGS names, and that comparator is inert below two engines
    # (`if (engines.length < 2) return problems`). A narrowed PR tier would
    # keep the gate's name and silently drop its central claim. So it is
    # changed-surface gated instead — TESTING.md's placement table puts slow
    # essential coverage on exactly that tier, and it is where the nearest
    # sibling already sits: cljs-ui-g8 is the same kind of gate (real-browser
    # controlled-input correctness), runs two engines, and is per-PR only.
    needs: detect_changed_surfaces
    if: needs.detect_changed_surfaces.outputs.hicasso_controlled == 'true'
