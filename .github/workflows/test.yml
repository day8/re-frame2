      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '24'

      - name: Cache Maven / gitlibs (shadow-cljs deps)
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: ${{ runner.os }}-cljs-tools-re-frame2-pair-mcp-${{ hashFiles('tools/re-frame2-pair-mcp/shadow-cljs.edn', 'tools/re-frame2-pair-mcp/package.json') }}
          restore-keys: |
            ${{ runner.os }}-cljs-tools-re-frame2-pair-mcp-
            ${{ runner.os }}-cljs-

      - name: npm install
        run: npm install

      # tools/re-frame2-pair-mcp ships as a Node binary on npm; its sources are
      # CLJS compiled via shadow-cljs to a self-contained Node script.
      # The artefact is NOT on implementation/shadow-cljs.edn's
      # `:source-paths`, so the consolidated `:node-test` build does
      # not see it. The canonical test entry-point is `npm test`, which
      # compiles the `:server-test` build (shadow-cljs.edn) and runs
      # `out/server-test.js` under Node. The test suite covers the
      # bencode framing helpers (`nrepl_test`), the snapshot reader
      # (`snapshot_test`), and the pull-mode watch surface
      # (`watch_epochs_test`, `watch_until_test`).
      - name: Run shadow-cljs :server-test (tools/re-frame2-pair-mcp artefact)
        run: npm test

      # MCP tool-descriptor manifest drift-check. Compiles the
      # `:descriptor-gen` build and regenerates the committed
      # `tool-descriptors.edn` in memory from the live tool registry,
      # FAILING if it differs. Adding / removing / renaming a re-frame2-pair-mcp
      # tool — or changing a tool's input-key / output? / annotations
      # surface — turns this red until the manifest is regenerated
      # (`npm run gen:descriptors`). Pair-mcp's registry is CLJS-only so
      # the check runs under Node (reuses this job's warmed shadow-cljs);
      # same generate-then-drift-check shape as the api-manifest keystone
      # + story-mcp's JVM sibling check.
      - name: Assert tool-descriptors.edn matches the registry
        run: npm run check:descriptors

      # stdin-EOF lifecycle regression. Compiles the SHIPPED
      # `:server` bundle and drives it over real stdio against a self-contained
      # fake bencode nREPL: a completed app-facing tool opens an idle nREPL
      # socket, then closing stdin must close that socket AND exit the process
      # 0 — with NO out-of-band kill. This is the canonical CI grader for the
      # documented `stdin EOF -> nREPL close -> process exit` contract
      # (spec/001-Wire-Protocol.md, server.cljs lifecycle step 6); a server
      # that breaks it leaves an orphan process + a live nREPL socket. The harness
      # is hermetic (no live shadow-cljs), so it runs on both Ubuntu and
      # Windows runners without extra infra.
      - name: Compile re-frame2-pair-mcp server bundle (shadow-cljs :server)
        run: npm run build

      # Hand-rolled JSON-RPC wire probe against the same shipped bundle:
      #
      #   - test/stdio-roundtrip.js — spawns out/server.js with no resolvable
      #     nREPL port, walks initialize → tools/list (pinned to
      #     test/fixtures/tool-names.json plus the snapshot / get-path input
      #     schemas) → tools/call, asserts the degraded
      #     `:rf.error/pair-mcp-nrepl-port-not-found` envelope for eval-cljs,
      #     snapshot and get-path, and the pre-connection `:unknown-tool`
      #     refusal.
      #
      # It is the first spawn of the freshly compiled bundle, so its wait for
      # the server's `ready` banner meets the job's cold start; the harness
      # logs how long that wait took.
      - name: Run stdio-roundtrip integration test (tools/re-frame2-pair-mcp artefact)
        run: node test/stdio-roundtrip.js

      - name: Run stdin-EOF shutdown regression (tools/re-frame2-pair-mcp artefact)
        run: npm run test:stdin-eof-shutdown

  node-test-tools-story-mcp:
    name: Node tools/story-mcp (stdio roundtrip, rf2-h8z5l)
    needs: detect_changed_surfaces
    if: needs.detect_changed_surfaces.outputs.mcp_conformance == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/story-mcp
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Clojure CLI
        run: "$GITHUB_WORKSPACE/.github/scripts/install-clojure-cli.sh"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '24'

      - name: Cache Maven / gitlibs
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: ${{ runner.os }}-node-tools-story-mcp-${{ hashFiles('tools/story-mcp/deps.edn', 'tools/story/deps.edn', 'implementation/core/deps.edn', 'implementation/adapters/reagent/deps.edn', 'implementation/machines/deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-node-tools-story-mcp-
            ${{ runner.os }}-clj-tools-story-mcp-
            ${{ runner.os }}-clj-

      # tools/story-mcp is a JVM artefact (Clojure-side stdio JSON-RPC
      # server) — unlike re-frame2-pair-mcp which is a self-contained Node script
      # compiled via shadow-cljs, story-mcp launches via
      # `clojure -M -m re-frame.story-mcp.server`. The JVM unit tests live
      # in the parallel `jvm-tools-story-mcp` job above; this job adds the
      # hand-rolled JSON-RPC wire probe:
      #
      #   - test/stdio-roundtrip.js — spawns the server, walks initialize
      #     → tools/list → tools/call across the canonical read-side tools,
      #     asserts the gating contract for register-variant, and verifies
      #     -32601 method-not-found for an unknown tool name.
      #
      # The agent-loop write-surface workflow (register → get → preview →
      # run → read → snapshot → unregister) lives in the
      # SDK-driven `mcp-conformance-story` job below (`end-to-end-story.cjs`),
      # which saves this job a second JVM boot.
      #
      # This script spawns a real Clojure subprocess so JVM boot latency
      # is observable from the CI logs; the cold-cache job takes ~20-40s
      # end-to-end. The script's watchdog caps at 60s.
      - name: Run stdio-roundtrip integration test (tools/story-mcp artefact)
        run: node test/stdio-roundtrip.js

  # ---------------------------------------------------------------------------
  # MCP-client conformance jobs.
  #
  # The `node-test-tools-{re-frame2-pair,story}-mcp` jobs above drive each server
  # via hand-rolled JSON-RPC on stdin/stdout. That catches server-side
  # bugs but cannot see protocol-mismatch bugs visible only when a real
  # MCP-aware consumer (Claude Code, Continue, …) attaches via the
  # official `@modelcontextprotocol/sdk` `Client` — that library
  # validates every response against the spec's Zod schemas
  # (InitializeResultSchema, ListToolsResultSchema, CallToolResultSchema,
  # …), so a server response that's "close enough" to fool a hand-rolled
  # probe can still fail the SDK's parse step.
  #
  # The `tools/mcp-conformance/` artefact closes that gap. One script
  # per server, each driving the server through the SDK's
  # StdioClientTransport + Client.connect() + listTools()/callTool()
  # surface, walking one canonical workflow per server. See
  # tools/mcp-conformance/README.md for the full rationale and per-test
  # scope.
  # ---------------------------------------------------------------------------

  mcp-conformance-re-frame2-pair:
    name: MCP conformance tools/re-frame2-pair-mcp (rf2-cum40)
    needs: detect_changed_surfaces
    if: needs.detect_changed_surfaces.outputs.mcp_live == 'true'
    runs-on: ubuntu-latest
    # Hard wall-clock cap on the WHOLE job. A healthy run is
    # < 2 min (Playwright install ~20s, hermetic boot+conformance ~45s).
    # Without this the job inherits GitHub's 360-min default, so when the
    # `--with-deps` Playwright install wedges on the runner's apt/dpkg
    # lock (see the step-level comment below) the gate would sit "hung" for
    # 15-75+ min until a human cancelled, blocking
    # the merge queue. 20 min gives a cold-Maven-cache run (no `~/.m2`
    # restore hit) generous headroom while making any genuine hang a
    # fast, re-runnable FAILURE rather than an open-ended block.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tools/mcp-conformance
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Clojure CLI
        run: "$GITHUB_WORKSPACE/.github/scripts/install-clojure-cli.sh"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '24'

      # Single Maven/gitlibs cache that covers BOTH shadow-cljs boots in
      # this job — the re-frame2-pair-mcp server bundle compile AND the hermetic
      # fixture watch. The fixture at
      # `skills/re-frame2-pair/tests/fixture/` resolves FIVE in-repo
      # artefacts as `:local/root` entries — core, reagent, epoch, schemas
      # and machines (the last two because the shipped preload `:require`s
      # `re-frame.schemas` and `re-frame.machines` directly, per the
      # fixture's own deps.edn) — so a cold-cache run pulls every
      # transitive dep of those five artefacts (Reagent, Malli, …)
      # before shadow-cljs can even write the nREPL port file.
      #
      # On a cold-cache GHA runner that resolve takes >240s and the
      # hermetic orchestrator's `SHADOW_BOOT_TIMEOUT_MS` watchdog fires
      # before the port file lands — "boot failed: nREPL port not
      # found". Hashing the fixture's deps.edn / shadow-cljs.edn and the
      # five local-root deps.edn files into the cache key keeps the
      # cache warm across runs that don't touch those files; the wider
      # `restore-keys` ladder still lets a partial hit land when only
      # one file changes.
      #
      # THE KEY MUST NAME ALL FIVE. A key naming fewer would leave the key
      # unchanged on a schemas or machines dependency bump: the pre-bump
      # entry would keep being restored and — because an exact key hit
      # suppresses the save — never refresh, returning the very
      # cold-resolve cost this key exists to amortise.
      # `re-frame2-pair-fixture-pure` below keys on the same five, and the
      # classifier's reverse edges SCHEDULE this job on a change under
      # implementation/{epoch,schemas,machines}.
      - name: Cache Maven / gitlibs (shadow-cljs deps for re-frame2-pair-mcp build + hermetic fixture)
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: ${{ runner.os }}-mcp-conformance-re-frame2-pair-${{ hashFiles('tools/re-frame2-pair-mcp/shadow-cljs.edn', 'tools/re-frame2-pair-mcp/package.json', 'skills/re-frame2-pair/tests/fixture/deps.edn', 'skills/re-frame2-pair/tests/fixture/shadow-cljs.edn', 'implementation/core/deps.edn', 'implementation/adapters/reagent/deps.edn', 'implementation/epoch/deps.edn', 'implementation/schemas/deps.edn', 'implementation/machines/deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-mcp-conformance-re-frame2-pair-
            ${{ runner.os }}-cljs-tools-re-frame2-pair-mcp-
            ${{ runner.os }}-cljs-

      # The conformance harness drives the re-frame2-pair-mcp Node bundle, so we
      # need to compile that bundle first. Same shadow-cljs entry point
      # as the node-test-tools-re-frame2-pair-mcp job above. We don't run
      # re-frame2-pair-mcp's own tests here — that's the parallel job's
      # responsibility.
      - name: Install re-frame2-pair-mcp deps
        working-directory: tools/re-frame2-pair-mcp
        run: npm install

      - name: Compile re-frame2-pair-mcp server bundle (shadow-cljs :server)
        working-directory: tools/re-frame2-pair-mcp
        run: npx shadow-cljs compile server

      # Lockfile-exact install. tools/mcp-conformance ships a
      # committed package-lock.json, so `npm ci` gives a reproducible,
      # drift-detecting install (fails if package.json + lock diverge)
      # rather than `npm install` resolving semver ranges against the live
      # registry. Matches the posture test:mcp-conformance uses locally.
      - name: Install mcp-conformance deps
        run: npm ci

      # Node unit-regression cluster. Runs the FULL pure-Node
      # unit set from the authoritative inventory in `scripts/test-all.cjs`
      # — every `node --test` row: exec-safety (the
      # trusted-PATH-resolution + symlink-safe-unlink helpers), the runner
      # watchdog teardown, the awaited hermetic cleanup, the bounded
      # setup-command timeout, the symlink-safe port-file read, the
      # dedup-envelope decoder, and the call-coverage / classification
      # ratchets. These are the harness's OWN regression nets, and a
      # regression in any of them must not ship green. `test:unit` DERIVES
      # its set from `test-all.cjs` (the
      # single source of truth), so a new `node --test` row is picked up
      # automatically — no second list to drift. Boots no server / nREPL /
      # clojure / Chromium; whole cluster is ~2-5s. The symlink-rejection
      # branches need a runner that allows symlinkSync — Ubuntu GHA does;
      # Windows would soft-skip them (so they run for real here).
      - name: Run mcp-conformance Node unit-regression cluster
        run: npm run test:unit

      - name: Run re-frame2-pair-mcp end-to-end MCP-client conformance
        run: npm run test:re-frame2-pair

      # Live-runtime variant: exercises the wire-cap
      # `:rf.mcp/overflow` marker under a real over-budget eval. Gated
      # on $SHADOW_CLJS_NREPL_PORT — unset on this step, so it exits 0
      # with a SKIP marker. The script's contract is that an unset gate
      # is a clean SKIP, not a failure; this step still runs so the
      # gating logic is exercised on every CI run and a regression that
      # broke the SKIP path (e.g. crashing on missing env) surfaces
      # here. The hermetic variant below runs the actual live path.
      - name: Run re-frame2-pair-mcp live-overflow conformance (SKIPPED without nREPL)
        run: npm run test:re-frame2-pair-live-overflow

      # Hermetic live-runtime variant: boots shadow-cljs
      # against the re-frame2-pair fixture (`skills/re-frame2-pair/tests/fixture/`
      # — a minimal counter with `re-frame2-pair.runtime` preloaded),
      # launches headless Chromium so the runtime sentinel lands, then
      # runs the same `live-re-frame2-pair-overflow.js` with
      # SHADOW_CLJS_NREPL_PORT set to the spawned port. Tears
      # shadow-cljs + Chromium down on exit. Covers what the SKIP path
      # leaves: cap-trigger threshold drift, marker shape
      # regressions on real payloads, and SDK strict-schema rejection
      # of cap-marker shapes surface on every CI run, not only
      # locally.
      - name: Install implementation deps (for playwright)
        working-directory: implementation
        run: npm install --no-audit --no-fund

      # Cache the Playwright browser binary across runs (same
      # shape as the cljs-browser jobs). On a hit, the install step below
      # skips the ~120 MB Chromium download and only runs `--with-deps`
      # (the apt system libs aren't cacheable). Keyed on the locked
      # Playwright version so a bump busts it.
      - name: Cache Playwright browser binary
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('implementation/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      # Fast-fail the actual hang point. `--with-deps` runs
      # `sudo apt-get install` for Chromium's system libraries; on a GHA
      # runner that occasionally blocks indefinitely on the dpkg/apt lock
      # held by the background `unattended-upgrades` job. The failure is
      # systemic/environmental, not per-diff: a wedged lock can hold this
      # step 15-75+ min on several PRs at once. A healthy install is
      # ~20s; 5 min covers a slow apt + cold (cache-miss) download while
      # turning the lock-wait into a re-runnable FAILURE instead of an
      # open-ended block.
      #
      # DO NOT RAISE THIS NUMBER. A blow-out here is an
      # azure.archive.ubuntu.com throughput collapse that no cap survives.
      # The apt hop cannot be thinned either — it installs zero Chromium
      # libraries and only Playwright's unconditional `tools:` fonts. Full
      # measurement and the at-source citations are at the
      # cljs-reagent-slim-bundle-isolation site above.
      - name: Install Playwright chromium (for hermetic browser preload)
        working-directory: implementation
        timeout-minutes: 5
        run: npx playwright install --with-deps chromium || "$GITHUB_WORKSPACE/.github/scripts/playwright-install-failed.sh"

      # Backstop the orchestrator's own internal watchdog
      # (HERMETIC_TIMEOUT_MS = 9 min in run-re-frame2-pair-live-hermetic-suite.cjs,
      # which `process.exit(2)`s on elapse). 12 min leaves margin for the
      # process-tree teardown after that watchdog fires, so a wedged
      # shadow-cljs JVM or orphaned Chromium can't hold the step open past
      # the orchestrator's own cap.
      - name: Run re-frame2-pair-mcp live conformance suite (HERMETIC — spawns shadow-cljs)
        timeout-minutes: 12
        run: npm run test:re-frame2-pair-live-hermetic-suite

  mcp-conformance-story:
    name: MCP conformance tools/story-mcp (rf2-cum40)
    needs: detect_changed_surfaces
    if: needs.detect_changed_surfaces.outputs.mcp_conformance == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tools/mcp-conformance
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Clojure CLI
        run: "$GITHUB_WORKSPACE/.github/scripts/install-clojure-cli.sh"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '24'

      - name: Cache Maven / gitlibs (story-mcp Clojure deps)
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: ${{ runner.os }}-mcp-conformance-story-${{ hashFiles('tools/story-mcp/deps.edn', 'tools/story/deps.edn', 'implementation/core/deps.edn', 'implementation/adapters/reagent/deps.edn', 'implementation/machines/deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-mcp-conformance-story-
            ${{ runner.os }}-node-tools-story-mcp-
            ${{ runner.os }}-clj-tools-story-mcp-
            ${{ runner.os }}-clj-

      # Resolve story-mcp's classpath HERE, in a step whose name
      # says what it is doing, instead of leaving it to happen inside the
      # server the Node harness spawns. `test:story` / `test:flag-gates` boot
      # `clojure -M -m re-frame.story-mcp.server` (base :deps, no alias — so
      # bare `clojure -P` is the same classpath); when Maven Central 403s the
      # runner under concurrent-PR load, that server dies before it speaks and
      # the harness reports `FAIL: MCP error -32000: Connection closed`, which
      # reads like a code fault. With this
      # step the resolve is warm before the harness starts, and a genuine
      # resolution failure fails here, named, with an ::error:: annotation
      # that says WHICH kind of failure it was — the script classifies the
      # resolver output, and only a recognised transport signature earns the
      # "infrastructure, re-run" verdict. See the script for why caching
      # (configured above) is not enough on its own.
      - name: Pre-resolve story-mcp classpath (a failure here is dependency resolution, before any code runs)
        working-directory: tools/story-mcp
        run: "$GITHUB_WORKSPACE/.github/scripts/resolve-clojure-deps.sh"

      # Lockfile-exact install (committed package-lock.json).
      # See the mcp-conformance-re-frame2-pair job for rationale.
      - name: Install mcp-conformance deps
        run: npm ci

      - name: Run story-mcp end-to-end MCP-client conformance
        run: npm run test:story

      # Cross-MCP operator-opt-in CLI flag-vocabulary conformance
      # Boots story-mcp without / with / with-a-legacy
      # `--allow-writes` spelling and asserts the default-OFF write gate +
      # the hard-rename-rejection rule over the MCP wire. Lives in this
      # job because it needs `clojure` (the JVM story-mcp server), same as
      # `test:story`. The pair-mcp eval-cljs gate wire counterpart
      # (the `--no-eval` opt-out) rides the hermetic
      # live-subscribe path in `mcp-conformance-re-frame2-pair`.
      - name: Run cross-MCP CLI flag-vocabulary conformance
        run: npm run test:flag-gates

  # ---------------------------------------------------------------------------
  # MCP conformance — JVM wire-vocab gates.
  #
  # The three JVM test files under `tools/mcp-conformance/wire-vocab/test/`
  # — `wire_vocab_test.clj` (wire-marker vocabulary),
  # `indicator_field_test.clj` (envelope-slot parity), and
  # `slot_name_test.clj` (tool-arg slot-name parity) — pin
  # the cross-server vocabulary contracts that the artefact exists to
  # enforce. The sibling `mcp-conformance-{re-frame2-pair,story}` jobs run
  # only the Node-side `npm run test:...` scripts, so without this job
  # nothing would run `clojure -M:test` from `wire-vocab/` and the contract
  # gates would fire only when someone ran them locally.
  #
  # Per `wire-vocab/README.md`, total cold-JVM run time is ~3-5s; this
  # job adds near-zero critical-path latency. The Maven cache key
  # hashes `wire-vocab/deps.edn` so a deps bump invalidates correctly;
  # the wider `restore-keys` ladder keeps partial hits warm.
  # ---------------------------------------------------------------------------

  mcp-conformance-wire-vocab:
    name: MCP conformance wire-vocab (rf2-j2z7o + rf2-6m8tq + rf2-zvv65)
    needs: detect_changed_surfaces
    if: needs.detect_changed_surfaces.outputs.mcp_conformance == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/mcp-conformance/wire-vocab
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Clojure CLI
        run: "$GITHUB_WORKSPACE/.github/scripts/install-clojure-cli.sh"

      - name: Cache Maven / gitlibs
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: ${{ runner.os }}-clj-mcp-conformance-wire-vocab-${{ hashFiles('tools/mcp-conformance/wire-vocab/deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-clj-mcp-conformance-wire-vocab-
            ${{ runner.os }}-clj-

      # This lane can take a Maven Central 403 too. It reads more honestly
      # than the story lane's (`Error building classpath`, not "Connection
      # closed"), so what it gains here is the bounded retry: a short throttle
      # window clears inside the run instead of costing a re-run. Splitting the
      # resolve out also keeps the retry off the SUITE — the step below runs
      # exactly once, so a real test failure is never re-rolled.
      - name: Pre-resolve wire-vocab classpath (a failure here is dependency resolution, before any code runs)
        run: "$GITHUB_WORKSPACE/.github/scripts/resolve-clojure-deps.sh -M:test"

      - name: Run JVM wire-vocab conformance gates
        run: clojure -M:test

  skills-structural:
    name: Skills structural tests (changed skill paths only)
    needs: detect_changed_surfaces
    if: needs.detect_changed_surfaces.outputs.skills_structural == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Babashka
        # Resilient Babashka install (same setup-clojure curl-35 /
        # socket-hang-up flake class as the Clojure CLI installs above).
        # Reuses the repo's clj-kondo curl-retry idiom (lint.yml) + a backoff
        # loop; the bb installer pulls from raw.githubusercontent.com, which
        # 429s under rate limiting — hence --retry-all-errors (lint.yml note).
        #
        # The loop follows `.github/scripts/install-clojure-cli.sh` and avoids
        # the two defects a shorter three-attempt loop would carry:
        #
        #   * A ~2 MINUTE ENVELOPE (10s/20s/30s of backoff plus each attempt's
        #     own `--retry 5 --retry-delay 3`) loses by seconds against
        #     github.com 5xx storms measured at 1m48s, and a sleep after the
        #     FINAL attempt wastes time to change nothing.
        #
        #   * AN UNGUARDED FALL-THROUGH to `bb --version` on exhaustion. On a
        #     runner where nothing installed that dies `bb: command not found`,
        #     exit 127 — which stops the job proceeding on a half-installed
        #     toolchain, as intended, but reports a red step INDISTINGUISHABLE
        #     from the structural tests below having failed.
        #
        # This step fetches from the same hosts as its two siblings, so it
        # takes the same policy: six attempts with
        # a jittered 20s/40s/60s/80s/100s backoff — roughly seven minutes, about
        # 3.5x the longest storm observed — and an explicit `::error` annotation
        # in place of the fall-through, so "the gate failed" and "the gate never
        # ran" are distinguishable without opening the raw log. The exit status
        # stays a plain 1, as it is in `install-clojure-cli.sh` and
        # `resolve-clojure-deps.sh`: the annotation is the machine-readable
        # carrier the checks API exposes, and a bespoke code would be a second
        # convention with no consumer. The jitter term comes over unchanged from
        # the sibling — it costs nothing in a loop body, unlike inside a curl
        # flag list, which is why the clj-kondo step in lint.yml does without
        # it. The title carries no comma: `,` separates properties in GitHub's
        # workflow-command grammar, so a comma inside one truncates the title.
        #
        # NOT extracted to `.github/scripts/install-babashka.sh`. The Clojure
        # CLI script pays for itself by serving ~59 call sites of
        # one policy; bb has exactly ONE call site, and a new file plus its
        # shellcheck-roster and mirror-test obligations to own a single caller
        # is not a trade worth making.
        run: |
          set -euo pipefail
          attempts=6
          attempt=0
          while [ "$attempt" -lt "$attempts" ]; do
            attempt=$((attempt + 1))
            curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 -o /tmp/bb-install \
              https://raw.githubusercontent.com/babashka/babashka/master/install \
              && sudo bash /tmp/bb-install && break
            if [ "$attempt" -ge "$attempts" ]; then
              echo "::error title=Babashka install failed — CI infrastructure — not this diff::Downloading and running the official Babashka installer failed ${attempts} times over roughly seven minutes. NO GATE RAN IN THIS JOB: this step provisions bb, so the skills structural tests that would have exercised this change never started, and this red says nothing whatever about the diff. The usual cause is a raw.githubusercontent.com 429 under rate limiting or a github.com 5xx storm; the URL fetched is a literal constant in .github/workflows/test.yml, so no change can affect it UNLESS this PR edits that step, in which case read it first. Otherwise re-run the job."
              exit 1
            fi
            delay=$((attempt * 20 + RANDOM % 10))
            echo "Babashka install attempt ${attempt}/${attempts} failed; retrying in ${delay}s"
            sleep "$delay"
          done
          bb --version

      - name: Run re-frame2-pair structural tests
        working-directory: skills/re-frame2-pair
        run: |
          set -euo pipefail
          bb tests/prompts/prompt_regression_test.clj
          for test_file in tests/runtime/*_test.clj; do
            bb "$test_file"
          done

      # re-frame2-setup structural drift guard (`bb tests/setup_drift_test.clj`
      # from skills/re-frame2-setup/). Without this step what it guards — the
      # build-discipline
      # lockstep framing, the UIx template-pin parity, the CSP dev/prod
      # split, the npx-qualified commands, the substrate-views path, the
      # publication-state coordinate branch, and the pay-as-you-go schema
      # contract — could regress without CI noticing. It also pins that Xray
      # is a next step rather than day-one wiring
      # (`xray-is-a-next-step-not-day-one` /
      # `default-shadow-build-carries-no-devtools-preload` /
      # `skill-carries-no-xray-host-wiring`) and that the skill runs the
      # scaffold itself (`pin-default-is-zero-interview` +
      # `skill-executes-the-scaffold-and-reports-the-url`).
      # Loop every *_test.clj so a future setup-skill test is gated
      # automatically.
      - name: Run re-frame2-setup structural tests
        working-directory: skills/re-frame2-setup
        run: |
          set -euo pipefail
          for test_file in tests/*_test.clj; do
            echo "== $test_file =="
            bb "$test_file"
          done

      # re-frame2-pair-retro command-contract fixture.
      # `tests/duplicate_search_test.clj` pins the all-state duplicate-search
      # contract the skill prescribes: the exact argv is EXTRACTED FROM SKILL.md
      # and checked against a gh state-filter model over a closed-owner /
      # no-match / query-error fixture set. So the test fails when the prose
      # drifts from the contract — which is the drift class that matters here,
      # a retro skill that tells an agent to search only open issues and thereby
      # re-files a bead somebody already closed. Loop every
      # *_test.clj, as the setup step above does, so a future pair-retro test is
      # gated automatically rather than waiting on another wiring PR.
      #
      # `skills/re-frame2-pair-retro/*` arms `skills_structural` in
      # `.github/scripts/report-changed-surfaces.sh`, so a diff
      # confined to this tree does schedule this step. The arm is pinned from
      # both sides in `implementation/scripts/_changed-surfaces.test.cjs`
      # (SKILLS_STRUCTURAL_ONLY_FILES) — including the `-retro` / `pair/`
      # prefix boundary, which is why the tree needs an arm of its own.
      - name: Run re-frame2-pair-retro structural tests
        working-directory: skills/re-frame2-pair-retro
        run: |
          set -euo pipefail
          for test_file in tests/*_test.clj; do
            echo "== $test_file =="
            bb "$test_file"
          done

      # re-frame2-improver structural fixture.
      # `tests/storage_materializer_test.clj` pins the canonical storage
      # materializer in `references/schemaless-events.md` — it discriminates in
      # both directions (restoring the direct `.getItem js/globalThis.localStorage`
      # form fails it with 2 assertions, removing the decode catch fails it with
      # 1). Loop every *_test.clj, as the two steps above do, so
      # a future improver test is gated without another wiring PR.
      #
      # `skills/re-frame2-improver/*` arms `skills_structural` in
      # `.github/scripts/report-changed-surfaces.sh`, so a diff
      # confined to this tree schedules this step; the arm is pinned from both
      # sides in `implementation/scripts/_changed-surfaces.test.cjs`
      # (SKILLS_STRUCTURAL_ONLY_FILES), including the `implementor` / `improver`
      # prefix boundary that is why the tree needs an arm of its own.
      #
      # A FOURTH NAMED STEP RATHER THAN A DERIVED LOOP, and the reason is
      # measured rather than stylistic. The obvious generalisation — loop every
      # package under skills/ that HAS a tests/ directory — is silently wrong
      # for two of the four packages that have one: re-frame2-pair keeps its
      # tests one level deeper (tests/prompts/, tests/runtime/), so a
      # `tests/*_test.clj` glob matches NOTHING there, and reagent-migration's
      # tests/ is a shadow-cljs fixture built by a different job entirely
      # (reagent-migration-fixture-cold-start), not a bb suite. A derived loop
      # would therefore report success having run nothing for the package with
      # the most tests in it — the same fail-open shape this step exists to
      # close. The explicit list cannot do that: a package with no step visibly
      # has no step.
      - name: Run re-frame2-improver structural tests
        working-directory: skills/re-frame2-improver
        run: |
          set -euo pipefail
          for test_file in tests/*_test.clj; do
            echo "== $test_file =="
            bb "$test_file"
          done

  # ---------------------------------------------------------------------------
  # re-frame2-pair SHIPPED-preload pure-core node-test.
  #
  # The `@day8/re-frame2-pair` npm package ships a `preload/` carrying
  # `re_frame2_pair/runtime.cljs`, which delegates its heavy lifting to the
  # PURE `re-frame2-pair.pure` core (cascade / consequence projections, the
  # multi-frame resolver, id-validation, the streaming-queue transforms, the
  # epoch timing + matcher, the snapshot scope resolver, the orient assembler).
  # The fixture at `skills/re-frame2-pair/tests/fixture/` compiles a
  # `:node-test` build (`pure-test`) that exercises those EXACT shipped fns —
  # not a Babashka mirror that could drift from the shipped code.
  # Wired here so a regression in the preload's pure
  # core blocks the PR. Gated on `skills_structural` — the surface that fires
  # for BOTH the preload (`skills/re-frame2-pair/*`) and the fixture
  # (`skills/re-frame2-pair/tests/fixture/*`), so a pure-fn change is covered.
  #
  # `:deps true` routes the fixture's classpath through its deps.edn
  # (core, reagent, epoch, schemas and machines as `:local/root`), so
  # shadow-cljs shells out to
  # `clojure` for classpath resolution — hence JDK + Clojure CLI + Node. The
  # fixture has no package-lock.json (a dev-only fixture, deps pinned exactly
  # in package.json), so `npm install` — not `npm ci` — bootstraps shadow-cljs.
  # ---------------------------------------------------------------------------
  re-frame2-pair-fixture-pure:
    name: re-frame2-pair shipped-preload pure-core node-test (rf2-etsj8p)
    needs: detect_changed_surfaces
    if: needs.detect_changed_surfaces.outputs.skills_structural == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: skills/re-frame2-pair/tests/fixture
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Clojure CLI
        run: "$GITHUB_WORKSPACE/.github/scripts/install-clojure-cli.sh"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '24'

      # The fixture resolves FIVE in-repo artefacts as `:local/root` entries —
      # core, reagent, epoch, schemas and machines (the last two because the
      # shipped preload `:require`s `re-frame.schemas` and `re-frame.machines`
      # directly, per the fixture's own deps.edn) — so a cold-cache run pulls
      # every transitive dep (Reagent, Malli, …) before shadow-cljs can compile.
      #
      # THE KEY MUST NAME ALL FIVE. A key naming fewer would let a schemas or
      # machines dependency bump restore a classpath cache predating that
      # bump, and the job would report green against stale deps — and the
      # classifier's reverse edges SCHEDULE this job on a change under
      # implementation/{epoch,schemas,machines}.
      #
      # `mcp-conformance-re-frame2-pair` above and `mcp-live` in
      # expensive-tests.yml build this same fixture, and all three sites
      # keyed on it name it in full.
      - name: Cache Maven / gitlibs (fixture pure-test deps)
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: ${{ runner.os }}-re-frame2-pair-fixture-${{ hashFiles('skills/re-frame2-pair/tests/fixture/deps.edn', 'skills/re-frame2-pair/tests/fixture/shadow-cljs.edn', 'implementation/core/deps.edn', 'implementation/adapters/reagent/deps.edn', 'implementation/epoch/deps.edn', 'implementation/schemas/deps.edn', 'implementation/machines/deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-re-frame2-pair-fixture-
            ${{ runner.os }}-cljs-

      # No package-lock.json (dev-only fixture) — `npm install` bootstraps the
      # pinned shadow-cljs + react devDeps.
      - name: Install fixture deps (shadow-cljs)
        run: npm install --no-audit --no-fund

      - name: Run shipped-preload pure-core node-test
        run: npm run test:pure

  # ---------------------------------------------------------------------------
  # reagent-migration MIG-23 SSR cold-start node-test.
  #
  # The reagent-migration skill's MIG-23 recipe tells a migrating app how to
  # install an adapter on BOTH cold halves — server render and client mount.
  # `skills/reagent-migration/tests/fixture/` is the executable evidence that
  # the recipe is right: a `:node-test` build whose negative controls prove a
  # never-initialized process raises `:rf.error/no-adapter-installed` at both
  # recipe entry points (`re-frame.fresco.server/render` and `rf/make-frame`),
  # and whose positive controls prove ONE `rf/init!` per process boot fixes
  # both. Like its pair sibling it exercises the real in-repo artefacts, not a
  # Babashka mirror that could drift from them.
  #
  # Without this job a change to core's adapter lifecycle, to ssr, to fresco's
  # server render, or to the recipe itself could regress the documented cold
  # start with nothing to catch it. Wired here for the same reason the pair
  # fixture is.
  #
  # `:deps true` routes the fixture's classpath through its deps.edn (core +
  # ssr + fresco + the stock Reagent adapter as `:local/root`), so shadow-cljs
  # shells out to `clojure` for classpath resolution — hence JDK + Clojure CLI +
  # Node. The fixture has no package-lock.json (dev-only, deps pinned exactly in
  # package.json), so `npm install` — not `npm ci` — bootstraps shadow-cljs.
  #
  # GATED ON `skills_structural`, which two directions arm. The skill tree
  # itself (`skills/reagent-migration/*`) covers a change to the
  # RECIPE. The fixture's four `:local/root` artefacts — core, ssr, fresco and
  # the stock Reagent adapter, at `src/*` + `deps.edn` — cover a change to the
  # SUBSTRATE the recipe is pinned against. Without that second
  # edge this job would be skipped on exactly the adapter-lifecycle, SSR or
  # server-render change it exists to witness, and a skipped job is an accepted
  # result, so the aggregator could not tell. Both directions are pinned in
  # `implementation/scripts/_changed-surfaces.test.cjs`.
  # ---------------------------------------------------------------------------
  reagent-migration-fixture-cold-start:
    name: reagent-migration MIG-23 SSR cold-start node-test (rf2-vpdrf)
    needs: detect_changed_surfaces
    if: needs.detect_changed_surfaces.outputs.skills_structural == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: skills/reagent-migration/tests/fixture
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Clojure CLI
        run: "$GITHUB_WORKSPACE/.github/scripts/install-clojure-cli.sh"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '24'

      # The fixture resolves core + ssr + fresco + reagent as `:local/root`
      # entries, so a cold-cache run pulls every transitive dep (Reagent, Malli,
      # …) before shadow-cljs can compile. Same cache shape as
      # re-frame2-pair-fixture-pure.
      - name: Cache Maven / gitlibs (MIG-23 cold-start fixture deps)
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: ${{ runner.os }}-reagent-migration-fixture-${{ hashFiles('skills/reagent-migration/tests/fixture/deps.edn', 'skills/reagent-migration/tests/fixture/shadow-cljs.edn', 'implementation/core/deps.edn', 'implementation/ssr/deps.edn', 'implementation/fresco/deps.edn', 'implementation/adapters/reagent/deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-reagent-migration-fixture-
            ${{ runner.os }}-cljs-

      # No package-lock.json (dev-only fixture) — `npm install` bootstraps the
      # pinned shadow-cljs + react devDeps.
      - name: Install fixture deps (shadow-cljs)
        run: npm install --no-audit --no-fund

      - name: Run MIG-23 SSR cold-start node-test
        run: npm run test:cold-start

  # ---------------------------------------------------------------------------
  # docs/cljs live-cell playground.
  #
  # docs/tools/playground is the roll-your-own CM6 + Scittle + re-frame2-SCI
  # live-cell engine that backs the docs/cljs reading guide and the
  # interactive guide chapters. Without this job its smoke (a real
  # headless-Chromium run of both PRODUCTION bundles) would be wired to no CI
  # gate, so a source change that was not re-bundled, or a re-bundle that
  # regressed, would ship to the live docs undetected.
  #
  # The two bundles have DIFFERENT version-control policies, and the gate shape
  # follows from that:
  #   - the esbuild bootstrap (playground.js/.css) stays COMMITTED. It is
  #     byte-deterministic across platforms, so a strict `git diff --exit-code`
  #     against a fresh build catches un-rebundled source edits / hand-edits.
  #   - the shadow-cljs SCI bundle (playground-rf2.js) is NOT committed.
  #     It is a Closure :advanced build that bakes in re-frame2
  #     core + reagent-slim + machines + flows + react@19, so committing it
  #     would make EVERY PR touching any of those regenerate the same ~15 MB
  #     binary, and any two such PRs conflict on it. It is generated at each
  #     consumption boundary instead: here at PR time, and in docs.yml on
  #     deploy. Being generated in-run, it cannot be stale — it is gated by the
  #     headless-Chromium smoke (which renders it live) plus a structural
  #     validity check on the emitted artefact. See the gate steps below.
  # ---------------------------------------------------------------------------

  tools-playground:
    name: docs/cljs playground (smoke + bundle-drift, rf2-ee38b.22)
    needs: detect_changed_surfaces
    if: needs.detect_changed_surfaces.outputs.playground == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: docs/tools/playground
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      # The re-frame2 SCI bundle (sci/) is a shadow-cljs :advanced build over
      # the re-frame2 core + reagent-slim :local/root artefacts — it needs a
      # JVM + the Clojure CLI, the same toolchain the other CLJS jobs use.
      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '24'

      - name: Set up Clojure CLI
        run: "$GITHUB_WORKSPACE/.github/scripts/install-clojure-cli.sh"

      - name: Cache Maven / gitlibs (playground SCI bundle deps)
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: ${{ runner.os }}-playground-${{ hashFiles('docs/tools/playground/sci/deps.edn', 'docs/tools/playground/sci/shadow-cljs.edn', 'implementation/core/deps.edn', 'implementation/adapters/reagent-slim/deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-playground-
            ${{ runner.os }}-cljs-

      # `npm ci` installs from the committed lockfile so the
      # bundle build is reproducible — required for the drift gate below.
      - name: npm ci (bootstrap deps)
        run: npm ci

      # Cache the Playwright browser binary. This job's
      # working-directory is docs/tools/playground, so `npx` resolves THAT
      # tree's Playwright (^1.60.0 → 1.60.0), not implementation's pinned
      # 1.59.1 — so the key hashes the playground's own lockfile. Keying it on
      # implementation/package-lock.json would bust this cache on a bump it
      # does not care about and leave it stale across the bump that matters.
      # No bare `-playwright-` restore fallback here, so an implementation
      # browser tree is never restored into this job. (The reverse can happen
      # on an implementation-lock bump; it is harmless — the install step
      # always runs, and Playwright only ever uses the exact revision
      # directory its own version asks for.) On a hit that install still runs
      # `--with-deps`: the apt system libraries live outside
      # ~/.cache/ms-playwright and are not cacheable. Only the browser
      # DOWNLOAD is skipped — which is the hop that can fail outright (a
      # Chrome-for-Testing 403).
      - name: Cache Playwright browser binary
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-playground-${{ hashFiles('docs/tools/playground/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-playground-

      - name: Install Playwright (Chromium + system deps)
        run: timeout -k 10 720 npx playwright install --with-deps chromium || "$GITHUB_WORKSPACE/.github/scripts/playwright-install-failed.sh" $?

      # Build BOTH bundles from source — the committed esbuild bootstrap
      # (playground.js + playground.css) and the untracked, generated
      # shadow-cljs re-frame2 SCI bundle (playground-rf2.js).
      # `npm run build:rf2` runs `npm install` inside sci/ (resolving from
      # sci/package-lock.json) for react/react-dom + shadow-cljs.
      - name: Build both bundles
        run: npm run build

      # Headless-Chromium smoke against the freshly built PRODUCTION bundles:
      # all plain-eval cell assertions + the live re-frame2 (v2) render cell.
      - name: Run playground smoke
        run: npm run smoke

      # Bundle-drift gate (esbuild artefacts only). docs/cljs/playground.js +
      # playground.css are committed, vendored prebuilts and KEEP that policy
      # (only the SCI bundle is generated). esbuild's minifier
      # is byte-deterministic ACROSS platforms (verified: a Windows-committer
      # build and a Linux-CI rebuild are byte-identical, EOL-pinned via
      # .gitattributes), so a strict byte-diff here is robust: it fails only
      # when a source edit was not re-bundled, or someone hand-edited a bundle.
      - name: Verify committed esbuild bundles match fresh build (no drift)
        working-directory: .
        run: |
          if ! git diff --exit-code -- docs/cljs/playground.js docs/cljs/playground.css; then
            echo "::error::Committed docs/cljs/playground.{js,css} are stale — run 'npm run build:bootstrap' in docs/tools/playground and commit the rebuilt bundles."
            exit 1
          fi

      # Structural gate on the FRESHLY-GENERATED SCI bundle. We
      # deliberately do NOT byte-diff docs/cljs/playground-rf2.js — it is a
      # Google Closure :advanced build whose minified-symbol ALLOCATION is not
      # byte-stable across build environments (Windows JVM vs Linux-CI JVM emit
      # different identifiers — fa<->ea, property-mangle suffixes, helper
      # extraction order — for byte-identical source + locked deps; the build is
      # per-machine deterministic but not cross-machine reproducible). There is
      # also no committed snapshot to diff AGAINST: the bundle is .gitignored
      # and generated at each consumption boundary, so no baked-input PR has
      # to regenerate the same binary.
      #
      # What proves freshness — generated-vs-inputs INSIDE this one run:
      #   1. The build step above compiled the bundle from THIS checkout. There
      #      is no snapshot that can lag the source, so "stale" is not a
      #      reachable state at PR time; it is fresh by construction.
      #   2. The smoke step above ran a real headless-Chromium render of that
      #      freshly-built bundle (live re-frame2 reg-sub / dispatch / re-render
      #      plus both machine cells). That is the runtime half: if current
      #      source no longer COMPOSES into a working bundle, this job is red.
      #   3. This step asserts the emitted artefact is itself a valid, non-empty
      #      re-frame2 SCI bundle (right shape + export markers + size floor), so
      #      a build that "succeeded" while emitting a wrong or truncated file
      #      still fails the PR rather than shipping a dead live-cell engine.
      - name: Verify the generated SCI bundle is a valid re-frame2 build
        working-directory: .
        run: |
          f=docs/cljs/playground-rf2.js
          if [ ! -s "$f" ]; then
            echo "::error::$f missing or empty after 'npm run build' — the SCI bundle build emitted nothing."
            exit 1
          fi
          # An :advanced shadow-cljs browser bundle for this build always
          # carries the shadow module loader + the rf2sci/renderLast export the
          # bootstrap + smoke depend on. Missing either => wrong artefact.
          if ! grep -q "shadow\$provide" "$f"; then
            echo "::error::$f does not look like a shadow-cljs :advanced bundle (no shadow\$provide) — the build emitted a wrong artefact."
            exit 1
          fi
          if ! grep -q "rf2sci" "$f"; then
            echo "::error::$f does not export rf2sci — the build emitted a wrong artefact."
            exit 1
          fi
          # Guard against a regression in size (a truncated/partial bundle):
          # the real bundle is hundreds of KB. 200000 bytes is a generous floor.
          bytes=$(wc -c < "$f")
          if [ "$bytes" -lt 200000 ]; then
            echo "::error::$f is suspiciously small (${bytes} bytes) — the build emitted a truncated artefact."
            exit 1
          fi
          echo "Generated SCI bundle OK (${bytes} bytes; built from this checkout and smoke-validated above)."

  # ---------------------------------------------------------------------------
  # Required-checks aggregator.
  #
  # ONE stable status context that is ALWAYS present on every PR and that
  # passes iff every gating job that actually ran also passed. This is the
  # single context the branch ruleset should require — it lets the
  # conservative changed-surface classifier above SKIP expensive jobs on
  # unrelated PRs (a skipped job is OK; it contributed no signal) while
  # still blocking a merge the moment any job that DID run reports
  # `failure` or `cancelled`.
  #
  # Why this exists: a ruleset requiring contexts that NO job emits leaves
  # every PR permanently pending, mergeable only via maintainer --admin —
  # and then a genuinely RED real gate (jvm-core, cljs,
  # bundle-isolation, …) merges identically, because none of the real
  # gates is actually required. Pointing the ruleset at this aggregator
  # makes the real matrix enforceable through one always-present
  # context.
  #
  # `needs:` must list EVERY gating job in this workflow — GitHub `needs:`
  # only spans the same workflow file, so this aggregator covers test.yml
  # jobs only. `if: always()` is mandatory: without it the aggregator
  # would itself be skipped whenever any upstream job skips, and a skipped
  # required check never satisfies the ruleset. The pass/fail decision
  # reads `needs.*.result`: `success` and `skipped` are acceptable;
  # `failure` and `cancelled` are not.
  # ---------------------------------------------------------------------------
  all-required-passed:
    name: All required checks passed
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - detect_changed_surfaces
      - verify-version-lockstep
      - verify-skill-mcp-drift
      - verify-readme-links
      # Required, not advisory: the guide tree this gate reads
      # arms NO classifier output at all. A job absent from this list is
      # advisory whatever its
      # own gate says, which would leave the pinned samples policed only on
      # PRs that happen to touch fresco source — i.e. on somebody other than
      # the author of the drift.
      - fresco-guide-samples
      # The .beads guard's CI arm. Required, so the tracker
      # database cannot ride a PR past a `--no-verify` or an uninstalled hook.
      - beads-pr-boundary
      - jvm-core
      # Required, so the lane that executes the documented core
      # production configuration (`-Dre-frame.debug=false`) cannot be broken by
      # a merge that never ran it. Advisory would make it a gate nobody's
      # merge waits on.
      - jvm-core-prod-gate
      # Required, not advisory. This is the only lane that
      # witnesses I15's caret and composition clauses, and the caret is the
      # only observable in a real browser that separates this runtime from
      # plain React (React's own end-of-event restore repairs value-level
      # misconduct inside the same discrete event, so the value assertions
      # stay green under regressions these rows catch). Advisory would leave
      # the evidence one `if:` away from running nowhere.
      - cljs-fresco-controlled
      # Required, not advisory, and for a reason narrower than
      # "it is a good gate". This is the ONLY lane in the repo that drives a
      # real hot reload: the package's Node HMR suites call
      # `collector/mint-view!` directly and drive the commit and release seams
      # by hand, so they can catch neither drift between `defview` macro
      # expansion and a real shadow reload nor a renderer that fails to run
      # old-generation cleanup on a type replacement. Advisory would leave the
      # HMR contract one `if:` away from running nowhere.
      - cljs-fresco-hmr
      - jvm-reagent
      - jvm-reagent-slim
      - jvm-uix
      # Required, not advisory. The suite is REAL JVM coverage of the adapter
      # lifecycle contract, and a job
      # absent from this list is advisory whatever its own gate says.
      - jvm-adapters-test-react
      - jvm-schemas
      - jvm-machines
      - jvm-routing
      # Required for the same reason `jvm-core-prod-gate` is, and
      # for a claim core's lane cannot make: routing's
      # `:routing/route-sub-egress-path` is a sub-classification egress that
      # runs in PRODUCTION, i.e. a privacy invariant. Advisory
      # would make it a gate nobody's merge waits on.
      - jvm-routing-prod-gate
      - jvm-flows
      - jvm-http
      - jvm-ssr
      # Required. SSR is the artefact that actually runs on a JVM
      # under `-Dre-frame.debug=false` in production, and
      # `payload-policy/project-routing-egress` decides what leaves the server
      # inside a hydration payload. A merge that never ran this lane must not
      # be possible.
      - jvm-ssr-prod-gate
      - jvm-security
      - jvm-ssr-ring
      # Required. The crossing witness is the ONLY gate on the
      # JVM->Node adapter (the ssr-ring `:test` lane deliberately excludes it,
      # and node-ssr-node never dials it), so a job absent from this list would
      # leave the adapter advisory — one `if:` from running nowhere.
      - jvm-node-crossing
      - jvm-epoch
      # Required for the same reason `jvm-core-prod-gate` is, and
      # with a sharper motive than any of its siblings. Epoch's ring is the
      # structure the production gate exists to empty:
      # `:db-before` / `:db-after` / raw `:trace-events` must not sit in a
      # production server's heap, and this is the only lane that runs the
      # suite asserting that elision under the posture it is about. Advisory
      # would make it a gate nobody's merge waits on.
      - jvm-epoch-prod-gate
      - jvm-resources
      - jvm-spec-resource
      - jvm-reply-conformance
      - jvm-derivation-conformance
      - jvm-event-conformance
      - jvm-test-quiet
      # Required, and `check_jvm_lane_rosters.py` R1 will not accept
      # the roster entry without this line: a job absent from this list is
      # advisory whatever its own gate says. What it carries is the JVM ARM of
      # the slot-rule equivalence pin, which is only a mechanism while BOTH arms
      # run — the Node arm alone cannot see a reader conditional or a
      # locale-sensitive primitive inside the one definition they share.
      - jvm-fresco
      # Required. This lane is the ONLY scheduling for the
      # repo-wide source walks on a diff that touches tools/,
      # implementation/fresco or implementation/ssr-node, none of which arm
      # `implementation_jvm` and so none of which run `jvm-core`. Advisory
      # would leave the hole open — a job absent from this
      # list is advisory whatever its own gate says — with the added cost of
      # looking shut.
      - jvm-repo-source-walks
      - cljs
      - js-harness-self-tests
      - cljs-browser
      - cljs-examples-compile
      - cljs-browser-schemas-boundary-prod
      - cljs-browser-prod-elision
      - cljs-elision
      # Required, so the perf-flag bundle-isolation proof cannot be
      # invalidated by a merge that never ran it. Spec 009 CLAIMS CI
      # enforcement, and a job absent from
      # this list is advisory whatever its own gate says.
      - cljs-perf-bundle
      # Required. A gate that runs nowhere is a gate whose numbers nothing
      # contradicts, and a job absent from this list is advisory whatever its
      # own gate says.
      - cljs-schemas-bundle
      - cljs-bundle-isolation
      - adapter-testbed-smokes
      - story-xray-browser
      - cljs-reagent-slim-bundle-isolation
      - tenant-switcher-testbed-smoke
      - jvm-tools-xray
      - jvm-tools-story
      - jvm-tools-story-mcp
      - jvm-tools-mcp-base
      # Required, so the machines-viz grammar-parity ratchet and the
      # testbed-support server suite cannot be broken by a merge that never ran
      # them. A job absent from this list is advisory, whatever its own gate says.
      - jvm-tools-machines-viz
      - jvm-tools-testbed-support
      # Required for the CLJS half of the same ratchet: the parity
      # suite is `.cljc`, and this is the only lane that runs its `:cljs` arms.
      - cljs-tools-machines-viz
      # Required, so the self-hosting recipe the machines-viz
      # README and spec/API.md document cannot be broken by a merge that never
      # built the page. An unbuildable page would be a false promise to every
      # consumer who follows the recipe.
      - machines-viz-viewer-page
      - jvm-tools-template
      # Required, so the codemod's golden corpus cannot be
      # broken by a merge that never ran it; advisory would leave it one `if:`
      # away from running nowhere.
      - jvm-migration-fresco-codemod
      # Required for the same reason, and it is the stronger case
      # of the two: this codemod REWRITES a consumer's own source in place, so
      # the conservatism its tests pin is a promise made to somebody else's
      # repository. Advisory would leave it one `if:` from running nowhere.
      - jvm-migration-v1-codemod
      # Required, not advisory. A job absent from this list is
      # advisory whatever its own gate says, and advisory is one `if:` from
      # running nowhere. What it holds is not
      # incidental either: per-request state isolation and a fail-closed module
      # allowlist are the two properties that decide whether one tenant's render
      # can observe another's, so a merge that never ran this lane must not be
      # possible.
      - node-ssr-node
      - node-test-tools-re-frame2-pair-mcp
      - node-test-tools-story-mcp
      - mcp-conformance-re-frame2-pair
      - mcp-conformance-story
      - mcp-conformance-wire-vocab
      - skills-structural
      - re-frame2-pair-fixture-pure
      # Required, mirroring its pair sibling above. What it holds is
      # the reagent-migration skill's MIG-23 cold-start promise: that ONE
      # `rf/init!` per process boot arms both the server render and the client
      # mount. That promise is made to somebody else's migrating repository, and
      # advisory would leave it one `if:` from running only on demand.
      - reagent-migration-fixture-cold-start
      - tools-playground
    steps:
      # `needs.*.result` is the spread of every dependency's final result.
      # `success` and `skipped` (a surface-gated job that did not run) are
      # both acceptable. `failure` and `cancelled` are not — but they are
      # NOT the same thing, and reporting them in the same words is what
      # makes a transient read as a defect.
      #
      # A FAILURE is a verdict: a job ran and said no. A CANCELLATION is the
      # ABSENCE of a verdict: the job was stopped — by a superseding push, by
      # a re-run joining the same cancel-in-progress concurrency group, by an
      # infra blip — and produced no signal at all.
      #
      # Both still BLOCK, and that is deliberate: no signal is not a pass,
      # and this aggregator is the one context the branch ruleset requires,
      # so a cancelled `beads-pr-boundary` reading green would let a tracker
      # database ride a PR onto main. What changes is what the operator is
      # told. "Incomplete, re-run" is an instruction; "failed" is an
      # accusation, and an accusation that turns out to be spurious twice in
      # a day teaches people to wave the check away — which is how a real
      # violation eventually gets waved away too.
      #
      # Order matters: a real failure is reported in preference to a
      # cancellation, so a run containing both is never described as merely
      # incomplete.
      - name: Blocked — a required job FAILED
        if: ${{ contains(needs.*.result, 'failure') }}
        run: |
          echo "::error::A required test.yml job FAILED — blocking merge. This is a real red: open the failing job and read its log. Re-running will not clear it."
          echo "needs results: ${{ join(needs.*.result, ', ') }}"
          exit 1

      - name: Blocked — a required job was CANCELLED (incomplete, not failed)
        if: ${{ contains(needs.*.result, 'cancelled') }}
        run: |
          echo "::error::A required test.yml job was CANCELLED — INCOMPLETE, not failed. No required job reported failure; a cancelled job produced no signal at all, so this run cannot be called green either. Re-run the workflow ONCE, then leave it alone: for pull_request events this workflow's concurrency group is cancel-in-progress, so a second re-run cancels the attempt still in flight and the job can never finish."
          echo "needs results: ${{ join(needs.*.result, ', ') }}"
          exit 1

      - name: All required jobs passed or were skipped
        run: echo "All gating jobs that ran passed (skipped surface-gated jobs are OK)."
