            ~/.gitlibs
            ~/.deps.clj
          key: ${{ runner.os }}-ui-scaffold-smoke-${{ hashFiles('examples/ui/minimal-counter/deps.edn', 'implementation/freehand/deps.edn', 'implementation/core/deps.edn') }}
          restore-keys: |
