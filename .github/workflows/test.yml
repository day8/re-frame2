            ${{ runner.os }}-clj-

      - name: Run JVM tests (test-quiet contract suite)
        run: clojure -M:test

  # The Fresco artefact's JVM lane: the CI half of the slot-rule equivalence
  # pin.
  #
  # WHAT IT RUNS is one namespace: `re-frame.fresco.slot-cljs-test`,
  # the `.cljc` EQUIVALENCE PIN for the canonical slot rule.
  # Measured: 3 tests, 92 assertions, ~5s. `impl/slot.cljc` has exactly one
  # definition of `prop-name`, so the failure it hunts is not "someone edited
  # one copy" — it is the two ways ONE definition still answers two things: a
  # `#?(:clj … :cljs …)` reader conditional inside the rule or anything it
  # calls, and a host-differing primitive (the JVM's `str/upper-case` consults
  # the platform DEFAULT LOCALE, so a Turkish-locale JVM slots `:aria-index` and
  # `:on-input` differently from every browser). Neither is visible to a single
  # host, so the same corpus is asserted TWICE against that one implementation:
  # once by `npm run test:cljs` in Node, once by `clojure -M:test` here. Running
  # one arm does not halve the coverage, it deletes the mechanism.
  #
  # WHY IT IS A REQUIRED JOB. Without it the Node arm would run on every PR
  # and the JVM arm only when somebody typed `clojure -M:test` by hand. The
  # artefact's entry on `scripts/test-jvm-implementation.sh` and this job move
  # together, because `check_jvm_lane_rosters.py` R1/R2 refuse either half
  # alone.
  #
  # UNCONDITIONAL — no `needs: detect_changed_surfaces`, no `if:` — and the
  # reason is a MEASUREMENT, not precedent. `implementation_jvm` is the
  # obvious gate and it is the wrong one twice over:
  #
  #   1. IT DOES NOT COVER THIS LANE'S INPUTS. Probed on this tree, the lane's
  #      own definition — `implementation/fresco/deps.edn`, which decides
  #      whether the pin is discovered at all — measures implementation_jvm
  #      FALSE, as does `implementation/fresco/test_kit/src/**`, also on the
  #      `:test` classpath. The one file that DOES arm it (`slot_cljs_test.cljc`;
  #      its subject `impl/slot.cljc` is under `src/` and arms nothing) does so
  #      only INCIDENTALLY, through
  #      `is_route_path_census_input` — a predicate that exists for the routing
  #      route-path census and matches `implementation/fresco/test/*` `.cljs`/
  #      `.cljc`. Resting this lane on that predicate means the census's roster
  #      silently owns whether the slot pin is gated.
  #   2. ARMING IT WOULD SCHEDULE THE WHOLE JVM TIER TO SCHEDULE ONE LANE.
  #      Over twenty jobs carry `if: … implementation_jvm == 'true'`. A
  #      fresco-only diff runs none of them; arming the artefact root would run
  #      all of them plus this one, on every diff to the repo's most actively
  #      developed tree, to schedule a five-second lane. Unconditional costs
  #      one runner.
  #
  # A new classifier output of its own does not fit either: a surface gate
  # that fails to cover a checker's inputs is exactly the failure this lane
  # avoids, so a new arm is a fresh chance to make that mistake and needs
  # re-widening every time the lane learns to read another file.
  #
  # NOT VACUOUS, AND MECHANICALLY SO. The `:test` alias carries no `--probe`, so
  # it takes the quiet runner's test-count floor: a lane that discovers zero
  # tests REDS rather than passing green. That floor is what makes this job's
  # green a verdict rather than a lane that has quietly stopped selecting
  # anything — the failure mode a `--probe` lane wired to a required job would
  # manufacture on purpose.
  jvm-fresco:
    name: JVM fresco (clojure -M:test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: implementation/fresco
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Clojure CLI
        run: "$GITHUB_WORKSPACE/.github/scripts/install-clojure-cli.sh"

      - name: Cache Maven / gitlibs
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: ${{ runner.os }}-clj-fresco-${{ hashFiles('implementation/fresco/deps.edn', 'implementation/core/deps.edn', 'implementation/test-quiet/deps.edn', 'implementation/adapters/uix/deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-clj-fresco-
            ${{ runner.os }}-clj-

      - name: Run JVM tests (fresco artefact — the slot-rule equivalence pin)
        run: clojure -M:test

  # The REPO-WIDE SOURCE WALKS that live in
  # `implementation/core/test/` but are not core tests, given a lane whose
  # scheduling does not depend on a read-set model of what they walk.
  #
  # THE STANDING RULE, stated once here rather than built into a checker.
  # A repo-wide walk parked in `implementation/core/test/` joins
  # this lane as ONE MORE STEP. That is the whole policy. Walks widen
  # without their arming following, and a universal input-declaration
  # checker would be over-engineering. The cheap answer is this lane, because
  # a step here has no read-set model to be wrong about.
  #
  # THE HOLE. Each of these suites discovers its inputs by `file-seq` over
  # trees OUTSIDE its own artefact, and `jvm-core`, the only other lane that
  # runs them, is gated by `implementation_jvm`:
  #
  #   no-rf-default-floor-lint-test            walks implementation/**/src AND
  #                                            the sibling tools/**/src tree
  #   egress-chokepoint-conformance-test       impl-source-corpus/src-roots —
  #                                            every src root under
  #                                            implementation/, recursively
  #   error-catalogue-channel-conformance-test the same corpus
  #   warn-once-clear-governance-test          file-seq over implementation/
  #   prod-gate-naming-drift-test              every artefact's test/ tree
  #                                            under implementation/
  #   late-bind-drift-test                     every implementation/**/src file,
  #                                            anchored to a classpath resource
  #   observation-render-law-drift-test        every TRACKED prose-bearing file
  #                                            in the repo, from `git ls-files`
  #
  # `late-bind-drift`
  # walks `implementation/**/src` — the same corpus as the four above, so the
  # fresco / ssr-node false arms measured below are exactly its hole:
  # a `late-bind/set-fn!` published from either tree, or a directory entry
  # orphaned by an edit there, would merge green. `observation-render-law-drift` is
  # WIDER than any of them: its census is `git ls-files`, so its domain is the
  # whole tracked corpus, and `implementation_jvm` is armed for only the
  # pinned slice of that prose (nearly all `spec/*`, `docs/machines/*`, three
  # named pages). The rest of `docs/` — `docs/design/fresco/**` measured —
  # reads FALSE, so render-law prose that breaks the law could land there
  # unread.
  #
  # prod-gate-naming-drift-test is a recursive walk from the implementation
  # root, and its hole is measured with the probes
  # its OWN domain needs — the walk reads `test/` trees, not `src/`:
  # `implementation/fresco/test/x_prod_gate_test.clj` and
  # `implementation/ssr-node/test/x_prod_gate_test.clj` both read
  # implementation_jvm FALSE, while `implementation/epoch/test/...` reads true.
  # So a dishonestly-named gate suite landing in fresco or ssr-node would merge
  # green and red main for the next unrelated implementation PR.
  #
  # Measured with `.github/scripts/report-changed-surfaces.sh`,
  # `tools/{xray,story,mcp-base}/src`, `implementation/fresco/src` and
  # `implementation/ssr-node/src` all read implementation_jvm FALSE, while
  # `implementation/core/src` reads true. So a tools/, fresco or ssr-node
  # change that introduced an `(or frame-kw :rf/default)` floor, an
  # egress-chokepoint violation, an uncatalogued error channel or a
  # warn-once governance breach would merge GREEN, and the red would land on
  # main for the next unrelated implementation PR to discover.
  #
  # UNCONDITIONAL, and the reason is a MEASUREMENT that mirrors jvm-fresco's
  # above. `implementation_jvm` is the obvious gate and it is the wrong one:
  # arming the three missing roots costs ~10 more PRs through the JVM tier of
  # over twenty jobs (~21 min each) and STILL leaves the class partly open,
  # because the walks keep widening — `src-roots` is recursive and
  # depth-independent, so tomorrow's artefact is walked by construction while
  # any arming list would have to be re-widened by hand. Arming to completion
  # costs ~59 more PRs and puts 92% of all PRs through that tier. This lane
  # costs ONE runner. An unconditional lane has no read-set model to
  # be wrong about, which is the whole point: there is nothing to drift.
  #
  # WHAT THE LANE COSTS, measured on a clean worktree off main with
  # a warm `~/.m2`, each step its own JVM exactly as CI runs it: 5 / 7 / 13 /
  # 7 / 5 / 61 / 8 seconds for the seven steps in order, ~106s of test time
  # against this job's 10-minute ceiling. `late-bind-drift-test` is 61s of
  # that, and it is the price of the check rather than a defect to fix here:
  # its producer spot-check re-reads the source corpus per directory entry.
  # Slow, bounded, and still an order of magnitude under the ~21-minute JVM
  # tier that arming these roots would cost instead.
  #
  # A new classifier output does not fit either, for the reason jvm-fresco
  # gives — a new arm is a fresh chance for a surface gate not to cover a
  # checker's inputs — and a second output must also be taught to
  # `scripts/test-fast-pr.sh` and held in step with the classifier forever
  # after.
  #
  # WHY ONE STEP PER NAMESPACE AND NOT ONE `-n`-LIST, which is the part that is
  # easy to get wrong. A missing namespace inside a multi-`-n` selector is
  # SILENT: measured on this tree, `-n <valid> -n <does-not-exist>` exits 0
  # having run only the valid one, with no warning. One combined step therefore
  # rests entirely on the quiet runner's TOTAL test-count floor, and these
  # namespaces are lopsided — several carry a single test while the
  # error-catalogue suite carries dozens. A total floor cannot tell "a
  # single-test lint stopped selecting" from "the big catalogue suite gained
  # a test", so the guard would silently stop guarding the moment that suite
  # grew. Run per namespace and each takes the runner's DEFAULT
  # floor of 1 on its own: a namespace that disappears runs zero tests and
  # REDS (measured: exit 1). That also leaves no calibrated number to
  # maintain, so there is no count here to go stale. Do not quote
  # per-namespace test counts here either: nothing would enforce them, and
  # they would drift unnoticed.
  #
  # These also still run inside `jvm-core`, and that duplication is
  # deliberate: this lane exists to schedule them when `jvm-core` does not.
  jvm-repo-source-walks:
    name: JVM repo-wide source walks (clojure -M:test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: implementation/core
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Clojure CLI
        run: "$GITHUB_WORKSPACE/.github/scripts/install-clojure-cli.sh"

      # The ESSENTIAL-SETUP MARKER the seven walks below gate on. It carries
      # GitHub's default step condition (`success()`) and nothing else, so it
      # reaches `success` only when the checkout, the JDK install and the
      # Clojure CLI install ALL succeeded — a step skipped by a failure ahead of
      # it reports `skipped`, not `success`, so one id covers all three. The
      # walks name `steps.setup.outcome` rather than `.conclusion` so that a
      # `continue-on-error:` could not launder a failure into a success.
      # `_changed-surfaces.test.cjs` pins this step: delete it and
      # `steps.setup.outcome` reads null, which SKIPS all seven walks on a
      # GREEN job. A separate step rather than an `id:` on the installer step
      # above, whose exact two-line shape is pinned across ~50 call sites.
      #
      # It sits ABOVE the Maven cache deliberately: a cache miss or a
      # cache-service error is not a reason to skip the walks, only to run them
      # slower.
      - name: Essential setup complete
        id: setup
        run: echo "checkout, JDK 21 and the Clojure CLI all installed"

      - name: Cache Maven / gitlibs
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          # Deliberately the SAME cache key as jvm-core — identical classpath,
          # so the two lanes share one entry rather than storing it twice.
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: ${{ runner.os }}-clj-core-${{ hashFiles('implementation/core/deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-clj-core-
            ${{ runner.os }}-clj-

      # The seven walks below are INDEPENDENT — they share only the JDK and the
      # Maven cache — so each carries
      #     if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
      # and runs even when an earlier WALK has failed. Without a condition,
      # GitHub's default step condition (`success()`) makes the first failing
      # walk SKIP the six behind it. That does not admit a bad merge — the job
      # reds either way — but it is badly misread: "the lane is red because of
      # step 1" hides that the six behind it were never EVALUATED, so the green
      # after the fix is the first time they have run at all and looks identical
      # to one that was passing all along.
      # It bites hardest on a prose-only PR, where `implementation_jvm` is false,
      # `jvm-core` never runs, and this lane is the only place those walks
      # execute anywhere.
      #
      # BOTH CONJUNCTS ARE LOAD-BEARING, and the condition guarantees exactly
      # this much: a walk runs when essential setup succeeded and the run has
      # not been cancelled, whatever the six walks beside it did.
      #
      # `!cancelled()` rather than `always()`, so a cancelled run stops burning
      # the lane instead of grinding through seven more walks.
      #
      # `steps.setup.outcome == 'success'` is what keeps a failed PREREQUISITE
      # from selecting all seven. A status-check function REPLACES the implicit
      # `success()` rather than adding to it
      # (https://docs.github.com/en/actions/reference/workflows-and-actions/expressions#status-check-functions),
      # and `cancelled()` reports cancellation, never a preceding failure — so
      # `!cancelled()` ALONE runs the walks after a failed checkout or a failed
      # Clojure CLI install, turning one honest setup failure into seven
      # missing-tool ones. Leaving the setup steps at their own default
      # `success()` does not restore that prerequisite on the steps behind them;
      # only naming it does.
      - name: Absence-repair floor lint for :rf/default (implementation/** + tools/**)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: clojure -M:test -n re-frame.no-rf-default-floor-lint-test

      - name: Egress-chokepoint conformance (every implementation/ src root)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: clojure -M:test -n re-frame.egress-chokepoint-conformance-test

      - name: Error-catalogue channel conformance (every implementation/ src root)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: clojure -M:test -n re-frame.error-catalogue-channel-conformance-test

      - name: Warn-once-clear governance (file-seq over implementation/)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: clojure -M:test -n re-frame.warn-once-clear-governance-test

      - name: Production-gate naming drift (every artefact's test/ tree)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: clojure -M:test -n re-frame.prod-gate-naming-drift-test

      - name: Late-bind directory drift (every implementation/ src root)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: clojure -M:test -n re-frame.late-bind-drift-test

      - name: Observation render-law drift (every tracked prose file, git ls-files)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: clojure -M:test -n re-frame.observation-render-law-drift-test

  cljs:
    name: CLJS (shadow-cljs :node-test)
    # Job-level gating (NOT a workflow-trigger path filter:
    # the pull_request trigger stays unfiltered so the
    # `All required checks passed` aggregator is always present). The
    # consolidated :node-test build compiles core + every adapter + every
    # per-feature artefact PLUS the tools/{story,xray}/{src,test} CLJS
    # test trees (shadow-cljs.edn :source-paths). `cljs_node_test` fires
    # on any of those surfaces (and on the build config / fixtures); it is
    # false only on a spec/docs-only PR, where this job skips. The
    # aggregator treats a surface-skip as OK and the nightly full matrix
    # is the safety net.
    needs: detect_changed_surfaces
    if: needs.detect_changed_surfaces.outputs.cljs_node_test == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: implementation
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Clojure CLI
        run: "$GITHUB_WORKSPACE/.github/scripts/install-clojure-cli.sh"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: implementation/package-lock.json

      - name: Cache Maven / gitlibs (shadow-cljs deps)
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: ${{ runner.os }}-cljs-${{ hashFiles('implementation/shadow-cljs.edn', 'implementation/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-cljs-

      # For the Fresco invariants gate below — pure Python stdlib, no
      # requirements.txt install. Same pinned action and same interpreter
      # version as the two other python-running jobs in this workflow.
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'

      - name: npm install
        run: npm ci

      # THE FRESCO INVARIANTS GATE. A chain of sub-second static
      # reads over implementation/fresco/**, one npm script because they share
      # this job's one input surface and a separate script for each would need
      # another workflow step or a declared scheduling hole for the gain of
      # nothing. The roster is `test:fresco-invariants` in
      # implementation/package.json; read it rather than a list here. It opens
      # with the optional-module reachability check — nothing optional is
      # reachable from the public door, and no `src/` namespace requires UIx or
      # the bench tree (the `bench tree` row is what seals the package against
      # its own measurement harness, which lives at bench/fresco/) — then the
      # guide-sample check chained after it. It is scheduled here because a
      # divergence nobody runs the gate for is a divergence nobody notices.
      #
      # Hosted in THIS job because its input surface —
      # implementation/fresco/** (the classifier's fresco case) — arms
      # `cljs_node_test`, which is what lights this job. Early, before the
      # ~10-minute compile: it is a sub-second static read and a divergence
      # should red fast.
      - name: Fresco invariants gate
        run: npm run test:fresco-invariants

      # THE WRAPPER, NOT A BARE `npx shadow-cljs compile`. The difference is
      # not cosmetic: `implementation/scripts/compile-node-test.cjs` is the ONLY
      # thing that reads shadow's own `Build completed. (… N warnings …)` tally
      # and reds on it, so a bare compile would never run this lane's
      # warnings-fatal gate. The defect it exists to catch would otherwise
      # merge green: a bare `"` inside a deftest docstring closes the string
      # early, the words after it become bare symbols, and in JavaScript those
      # compile to `undefined` and evaluate harmlessly — so the namespace stays
      # in the build, the suite prints IDENTICAL test and assertion counts, and
      # the run exits 0. The only number that moves is the warning tally.
      #
      # The local spine (scripts/test-fast-pr.sh) runs `npm run
      # test:cljs`, so a bare compile here would make the two lanes disagree
      # about the same tree: the spine would refuse what this job merged. That
      # is also why `scripts/check_fast_pr_gap.py`'s
      # `cljs-node-test` lane is anchored on THIS command — it claims the spine
      # runs what CI runs, and the claim is only true while both spell it the
      # same way.
      #
      # It also unlinks out/node-test.js before compiling, so an
      # aborted compile leaves NO bundle rather than the previous one for the
      # two isolation steps below — which deliberately do not recompile — to
      # re-run as though it were fresh.
      - name: Compile and run node-test build (core + every adapter + every feature artefact + the tools CLJS test trees)
        run: npm run test:cljs

      # Per-namespace test-isolation gate. The consolidated
      # node-test bundle shares ONE runtime, so a test ns whose fixture forgets
      # to install its own substrate adapter is masked: it passes whenever a
      # sibling left an adapter installed (suite ORDERING hides a
      # self-incomplete fixture). This step re-runs the curated EP-0023
      # image/frame runtime-construction namespaces EACH ALONE — a fixture
      # leaning on bundle pollution goes red standalone. Reuses the bundle the
      # step above just compiled (no --compile).
      - name: Per-namespace test-isolation gate self-test
        run: node scripts/check-per-ns-isolation.cjs --self-test

      - name: Per-namespace test-isolation gate
        run: node scripts/check-per-ns-isolation.cjs

      # THE MANUAL-ONLY EPOCH-DELIVERY WITNESS. Same family as the two
      # isolation steps above
      # — a claim about what a GRAPH loads, which the consolidated bundle
      # cannot make. `:node-test-xray-manual-epoch` compiles ONE namespace
      # whose require list reaches `re-frame.epoch` through
      # `day8.re-frame2-xray.install` and nowhere else, then proves a manual
      # `core/init!` alone receives a dispatched event's assembled epoch.
      #
      # Its ASSERTIONS already ride the consolidated bundle above (the
      # namespace ends `-cljs-test`, so `:node-test`'s `cljs-test$` selects
      # it). What runs ONLY here is the dependency-graph half: that bundle
      # also loads `day8.re-frame2-xray.preload`, which carries the identical
      # anchor, so the assertions pass whether or not `install.cljs` still
      # spells its `[re-frame.epoch]` require. That is why the gate is not
      # declared `covered-by: test:cljs` in scripts/check_gate_scheduling.py
      # — a cover that reads true and grades nothing is the class that
      # checker exists to refuse.
      #
      # A STEP IN THIS JOB RATHER THAN A JOB OF ITS OWN, for the reason the
      # release build below gives at length. Every input that can change this
      # build's output — tools/xray/{src,test}/**.{cljs,cljc} and
      # implementation/shadow-cljs.edn — already arms `cljs_node_test`
      # (measured against the classifier, not assumed), so it needs no
      # classifier arm of its own and adds no condition to keep in sync. A
      # dedicated job would pay a second JDK + Clojure CLI + `npm ci` +
      # Maven-cache setup for one focused compile, and would add a required
      # check to the rollup to buy nothing this step does not already buy.
      # Cheap enough to sit here rather than last: one namespace and its
      # closure, against the ~10-minute consolidated compile above.
      - name: Xray manual-only epoch-delivery witness (graph isolation)
        run: npm run test:xray-manual-epoch

      # Fresco modules compile. The ONE warnings-fatal compile of what no
      # other gate judges: the optional modules (motion / overlay / forms /
      # native / server — unreachable from the public door by construction,
      # so no door-rooted compile sees them, and their own suites compile them
      # under `:node-test-fresco` with `:infer-externs false` and under
      # `:browser-test`, which exits 0 on warnings) and the two core
      # attribution instruments under core/test/re_frame/bench/ that nothing
      # test-shaped requires. Without it an `:infer-warning` in an optional
      # module would live on main until somebody read it off a browser build
      # by hand. One dev-mode `shadow-cljs compile` on the
      # `:fresco-modules-compile` id, entries read live off
      # `check_optional_module_reachability.py --module-namespaces` and a
      # two-row roster, every warning a failure.
      #
      # The bench lane is off every per-PR lane: it lives at bench/fresco/, a
      # hand-run project whose own `npm run check` compiles it the same way.
      #
      # Hosted HERE rather than in cljs-examples-compile because this job's
      # `cljs_node_test` surface includes implementation/core/*, which
      # `examples_compile` deliberately excludes — and a core change is
      # exactly what breaks the instruments' closure.
      - name: Fresco modules compile gate
        run: npm run test:fresco-compile

      # THE FRESCO RELEASE BUILD. `:fresco-release` in shadow-cljs.edn is the
      # artefact's only `:advanced` / `goog.DEBUG false` compile, entry
      # `re-frame.fresco.consumer-app`. Without this step the claim that a
      # clean consumer's application compiles for production could stop being
      # true on main and nothing would say so.
      #
      # WHAT IT CATCHES THAT NOTHING ELSE HERE DOES. Every other compile of
      # these namespaces in the repo is `:none`: `:node-test`, `:browser-test`
      # and the modules-compile step above all run the ClojureScript compiler and
      # never the Closure one. `:advanced` is where renaming, externs
      # inference and DCE-sensitive interop are decided, and a construct only
      # Closure rejects is invisible to all three. Measured rather than
      # assumed — with one bad `js*` form in `re-frame.fresco`, the SAME
      # build id under `shadow-cljs compile` completed green (162 files, 0
      # warnings) while `shadow-cljs release` failed with a Closure parse
      # error. The dev lanes are the control, and they do not notice.
      #
      # NO NEW SURFACE PREDICATE, DELIBERATELY. A
      # job gated on a changed-surface condition is correct exactly until the
      # thing it guards grows one more input, and nothing makes anyone revisit
      # the condition then, so the gate ends up unreachable from the input
      # families it grew. The build's
      # repo-source inputs are three trees and the build-config trio —
      # implementation/core/**, implementation/adapters/**
      # (the UIx adapter the entry installs), implementation/fresco/** (src,
      # plus the `consumer-app` entry under test/), and shadow-cljs.edn /
      # package.json / package-lock.json, which declare the build id and pin
      # the Closure version whose output this is. EVERY one of those already
      # arms `cljs_node_test`, so hosting the build here needs no classifier
      # arm of its own and adds no condition to keep in sync. It also cannot
      # silently outgrow one: a new input can only arrive as a `:require`
      # added to `consumer-app` or to something already on those trees, and
      # every `implementation/*` artefact case in the classifier arms this
      # output too, so the surface widens by construction rather than by
      # somebody remembering to widen it.
      #
      # NOT `cljs_prod`, which is the elision / bundle-probe family. The
      # classifier's `implementation/fresco/*` arm keeps the package off it
      # in terms, and routing this build there would mean widening that arm —
      # a classifier edit — to reach a build whose every input already arms
      # the job it is standing in.
      #
      # LAST in the job because it is the most expensive step here: 36.8s of
      # Closure measured cold on a Windows laptop, on a runner that has
      # already paid for the JVM, the Maven cache and `npm ci`. The
      # sub-second static reads and the node-test lane above red first.
      - name: Fresco release build (:advanced, goog.DEBUG false)
        run: npm run build:fresco-release

  js-harness-self-tests:
    name: JS harness self-tests (quiet reporters + path policy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: implementation
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '24'

      - name: Run JS harness self-tests
        run: npm run test:scripts

  # ---------------------------------------------------------------------------
  # CLJS browser / prod Playwright jobs.
  #
  # The browser/prod cluster — cljs-browser (:browser-test, dev),
  # cljs-browser-schemas-boundary-prod (:advanced + goog.DEBUG=false),
  # cljs-browser-prod-elision (:advanced + goog.DEBUG=false) — each
  # npm-installs, installs Playwright, and compiles a DISTINCT shadow-cljs
  # build with a distinct ns-regexp + compiler options. They stay separate
  # jobs because merging them is NOT low-risk: (1) the three builds cannot
  # share a compile artifact (one dev, two :advanced with different
  # ns-regexps), so merging would still recompile three bundles; (2)
  # merging would serialise three parallel gates onto one runner,
  # lengthening wall-clock on a code PR; (3) it would collapse three
  # independently-reported required statuses into one, losing failure
  # locality. What they share instead is the Playwright browser-binary
  # cache below: keyed on the locked Playwright version, it saves each
  # PR-time Playwright job re-downloading Chromium (~120 MB) on every run,
  # across all browser jobs and across runs, with zero change to which
  # suites run.
  # ---------------------------------------------------------------------------
  cljs-browser:
    name: CLJS (shadow-cljs :browser-test, headless Chromium)
    needs: detect_changed_surfaces
    if: needs.detect_changed_surfaces.outputs.cljs_browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: implementation
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: implementation/package-lock.json

      - name: Set up Clojure CLI
        run: "$GITHUB_WORKSPACE/.github/scripts/install-clojure-cli.sh"

      - name: Cache Maven / gitlibs (shadow-cljs deps)
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: ${{ runner.os }}-cljs-browser-${{ hashFiles('implementation/shadow-cljs.edn', 'implementation/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-cljs-browser-
            ${{ runner.os }}-cljs-

      - name: npm install
        run: npm ci

      # Cache the Playwright browser binary across runs/jobs, so a PR-time
      # Playwright job does not re-download Chromium (~120 MB) on each run.
      # The binary is keyed on the locked
      # Playwright version (package-lock.json), so the cache is correct by
      # construction: a Playwright bump busts it. On a hit, the install
      # step below still runs `--with-deps` (the apt system libs are not
      # cacheable) but Playwright skips the binary download.
      - name: Cache Playwright browser binary
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('implementation/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright (Chromium + system deps)
        run: timeout -k 10 720 npx playwright install --with-deps chromium || "$GITHUB_WORKSPACE/.github/scripts/playwright-install-failed.sh" $?

      - name: Compile :browser-test, serve, and run Playwright runner
        run: npm run test:browser

  # The standalone example-compile COVERAGE GATE, in a job of its own that
  # runs parallel to cljs-browser.
  #
  # WHY THIS IS A SEPARATE JOB. The `npm run test:examples-compile` step
  # (compile EVERY declared :examples/* and :testbeds/* shadow-cljs build)
  # takes ~10 min, while the `:browser-test` compile + Playwright runner
  # takes ~1-2 min. Inside cljs-browser it would serialise ~10 min of
  # example compiles in front of every browser-test run, making
  # cljs-browser a ~12 min long-pole on every core-touching PR. The
  # example-compile gate needs NO browser
  # (it is a pure `shadow-cljs compile` over the example builds — no
  # Playwright, no Chromium), so it has no reason to share the cljs-browser
  # runner. As its own job the two run in PARALLEL, keeping the
  # cljs-browser long-pole at ~2-3 min with the full coverage guarantee
  # (the example builds are compiled + warning-checked in CI on the same
  # surface).
  #
  # SURFACE GATING. Fires on the dedicated `examples_compile`
  # surface: examples, build config, adapters/UI, feature artefacts, and the
  # Story/Xray closure compiled into examples. Core-only changes keep their
  # focused PR gates and rely on the unconditional nightly example compile,
  # so they do not queue this long-tail job on every PR.
  cljs-examples-compile:
    name: CLJS (compile every standalone example build, coverage gate)
    needs: detect_changed_surfaces
    if: needs.detect_changed_surfaces.outputs.examples_compile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: implementation
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: implementation/package-lock.json

      - name: Set up Clojure CLI
        run: "$GITHUB_WORKSPACE/.github/scripts/install-clojure-cli.sh"

      - name: Cache Maven / gitlibs (shadow-cljs deps)
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: ${{ runner.os }}-cljs-examples-compile-${{ hashFiles('implementation/shadow-cljs.edn', 'implementation/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-cljs-examples-compile-
            ${{ runner.os }}-cljs-browser-
            ${{ runner.os }}-cljs-

      - name: npm install
        run: npm ci

      # Compile-coverage gate over EVERY declared
      # standalone :examples/* and :testbeds/* shadow-cljs build (the list is
      # derived from shadow-cljs.edn, so a newly-declared build is swept
      # automatically). Without it an example build declared as a browser
      # target that no other gate compiles would ship a ns / init-fn /
      # :require / form regression GREEN until a human ran it by hand. This
      # `compile` (not release) step fails on any compile warning too
      # (a typo'd init-fn surfaces as an :undeclared-var warning, and
      # `compile` exits 0 on warnings). No Playwright/Chromium needed — a
      # pure `shadow-cljs compile`, which is exactly why it runs in its
      # own parallel job instead of serialising in front of cljs-browser.
      - name: Compile every declared standalone example build (coverage gate)
        run: npm run test:examples-compile

