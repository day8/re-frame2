name: expensive tests

on:
  schedule:
    - cron: "17 15 * * *"
  workflow_dispatch:

jobs:
  browser-bundle-and-story-gates:
    name: Browser, bundle, examples, Story/Xray gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: implementation
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Clojure CLI
        run: "$GITHUB_WORKSPACE/.github/scripts/install-clojure-cli.sh"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: implementation/package-lock.json

      - name: Cache Maven / gitlibs
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: ${{ runner.os }}-expensive-implementation-${{ hashFiles('implementation/shadow-cljs.edn', 'implementation/package-lock.json', 'implementation/**/deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-expensive-implementation-
            ${{ runner.os }}-cljs-

      # rf2-og36y: same keyed shadow-cljs compile cache as the PR-smoke
      # gate (.shadow-cljs incremental state + .cpcache classpath cache).
      # Restoring the warm cache here keeps the nightly-full sweep fast
      # AND keeps the cache primed for the PR-smoke gate (which shares the
      # `<os>-story-xray-shadow-` restore-keys prefix), so the first PR
      # of the day still lands a warm partial cache.
      - name: Cache shadow-cljs compile output (.shadow-cljs / .cpcache)
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            implementation/.shadow-cljs
            implementation/.cpcache
          key: ${{ runner.os }}-story-xray-shadow-${{ hashFiles('implementation/shadow-cljs.edn', 'implementation/deps.edn', 'implementation/package-lock.json', 'implementation/**/deps.edn', 'tools/story/deps.edn', 'tools/xray/deps.edn', 'tools/story/src/**', 'tools/story/testbeds/**', 'tools/xray/src/**', 'tools/xray/testbeds/**', 'implementation/core/src/**') }}
          restore-keys: |
            ${{ runner.os }}-story-xray-shadow-

      - name: npm install
        run: npm ci

      # rf2-gzavkm — core-only PRs no longer queue the all-examples compile.
      # Keep that transitive safety net unconditional in the nightly/manual
      # full sweep, before the browser download so compile failures stay cheap.
      - name: Compile every standalone example build (nightly coverage net)
        run: npm run test:examples-compile

      # rf2-169n — cache the Playwright browser binary (see `cljs-browser` in
      # test.yml for the scheme). On a hit the install below still runs
      # `--with-deps`; only the browser download is skipped.
      - name: Cache Playwright browser binary
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('implementation/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright (Chromium + system deps)
        run: npx playwright install --with-deps chromium || "$GITHUB_WORKSPACE/.github/scripts/playwright-install-failed.sh"

      # rf2-wh5to — the eleven gates below used to be ONE unnamed
      # `set -euo pipefail` step. That structure is why the
      # 2026-07-08..07-21 nightly outage cost fourteen red nights and TWO
      # repair rounds instead of one:
      #
      #   - A `set -e` chain aborts at the FIRST failing gate, so every
      #     later gate is simply not run. `test:story-feature-load` broke
      #     on 07-08 and `test:story-static` broke on 07-13, but the
      #     second was invisible until the first was fixed on 07-21 —
      #     the 07-21 nightly then went red on a bug that had been live
      #     for eight nights, costing another day of the alpha clock.
      #   - The blob was also a single step-level result, so nothing —
      #     not the Actions UI, not the jobs API — recorded WHICH gate
      #     failed. Finding that out meant reading a 2000-line step log.
      #     (`gh run view --log-failed` prints `UNKNOWN STEP` against
      #     every line either way; that is a `gh` limitation, not
      #     something this restructure fixes.)
      #
      # One named step per gate, each `if: ${{ !cancelled() }}`, so a red
      # night names the failing gate in the Actions UI and in
      # `gh api repos/<o>/<r>/actions/runs/<id>/jobs`, and reports EVERY
      # broken gate in that one night. The gates are independent (each
      # builds and tears down its own artefacts and servers), the job
      # still fails if any one of them fails, and nothing here is
      # skipped, retried, softened or allow-listed — only the reporting
      # changes. The extra CI minutes are spent only on already-red
      # nightly runs.
      - name: Gate — browser tests (test:browser)
        if: ${{ !cancelled() }}
        run: npm run test:browser

      - name: Gate — schemas boundary, production build (test:browser-schemas-boundary-prod)
        if: ${{ !cancelled() }}
        run: npm run test:browser-schemas-boundary-prod

      - name: Gate — production elision, browser (test:browser-prod-elision)
        if: ${{ !cancelled() }}
        run: npm run test:browser-prod-elision

      - name: Gate — production elision probe (test:elision)
        if: ${{ !cancelled() }}
        run: npm run test:elision

      # rf2-xwa4n — the nightly superset of the PR-time
      # `cljs-freehand-evidence-elision` job. That job is surface-gated on the
      # Freehand producer surfaces (evidence schema / dev-gated seam / release
      # entry / build-config trio / the checker), which is the right PR-time
      # cost. This unconditional run is the safety net for everything OUTSIDE
      # that arm — a core `interop/debug-enabled?` change, an adapter change, a
      # toolchain bump — that can break the elision without touching Freehand.
      - name: Gate — Freehand evidence production isolation (test:freehand-evidence-elision)
        if: ${{ !cancelled() }}
        run: npm run test:freehand-evidence-elision

      # rf2-zl8ao — the nightly superset of the PR-time
      # `cljs-freehand-reachability` job, and the backstop that keeps that
      # job's NARROW arm honest. The PR gate fires on the controller doors,
      # the facade edge, the two entries, the build-config trio and the
      # checker; the evidence gate's narrowness is underwritten by a JVM
      # sole-requirer law, and this one has no such law yet, so a NEW
      # production edge into `re-frame.freehand.control` from anywhere else in
      # the tree — or a core/toolchain change that defeats Closure's DCE —
      # would be caught here rather than not at all.
      - name: Gate — Freehand unused-module reachability (test:freehand-reachability)
        if: ${{ !cancelled() }}
        run: npm run test:freehand-reachability

      - name: Gate — tools must not leak into production bundles (test:bundle-isolation)
        if: ${{ !cancelled() }}
        run: npm run test:bundle-isolation

      - name: Gate — reagent-slim bundle isolation (test:reagent-slim:bundle-isolation)
        if: ${{ !cancelled() }}
        run: npm run test:reagent-slim:bundle-isolation

      - name: Gate — per-adapter mount/dispatch smokes (test:adapter-smokes)
        if: ${{ !cancelled() }}
        run: npm run test:adapter-smokes

      - name: Gate — Story feature-load (test:story-feature-load)
        if: ${{ !cancelled() }}
        run: npm run test:story-feature-load

      - name: Gate — Story play scripts (test:story-play-scripts)
        if: ${{ !cancelled() }}
        run: npm run test:story-play-scripts

      - name: Gate — Xray feature matrix (test:xray-feature-gate)
        if: ${{ !cancelled() }}
        run: npm run test:xray-feature-gate

      - name: Gate — Story static export (test:story-static)
        if: ${{ !cancelled() }}
        run: npm run test:story-static

      # rf2-a9oic — a build NAMED for the nightly that was in no nightly.
      # `:node-test-perf-nightly` selects `-emit-nightly-test$`, which the
      # consolidated `:node-test` build's `cljs-test$` does not match, so the
      # two `*_emit_nightly_test.cljs` namespaces (core's
      # performance_emit_nightly_test, freehand's
      # render_measure_emit_nightly_test) run in this lane ALONE — and the lane
      # ran nowhere. `check_test_lane_bijection.py` could not see it: the lane
      # has a selector and the selector reaches files, so the bijection holds.
      # What nothing asserted until rf2-6ckzl's audit is that the lane is ever
      # RUN.
      #
      # NIGHTLY rather than per-PR on the build's own documented grounds, not
      # on cost: shadow-cljs.edn says these User-Timing assertions are "noisy
      # under per-PR CI runners; nightly cadence reduces false negatives from
      # runner load". The defect was the missing schedule, not the tier. Cost
      # is not the constraint either way — measured cold at 32s (10.8s of
      # compile), 12 tests / 37 assertions green.
      - name: Gate — perf User-Timing emission, nightly lane (test:cljs-perf-emit-nightly)
        if: ${{ !cancelled() }}
        run: npm run test:cljs-perf-emit-nightly

      # rf2-a9oic — `check-ui-warm-watch.cjs` was referenced by its npm script
      # and by nothing else in the repo, so the whole re-frame.ui warm-edit
      # proof ran nowhere.
      #
      # Despite the name this is NOT a watch-mode developer command: it DRIVES
      # a real Shadow warm watch and one live emitted runtime through eight
      # scripted passes (cold accept, zero-declaration, declaration-shrink,
      # same-namespace file move, rename, delete, failed-compile, retry) plus a
      # daemon restart proving disk-cache reuse, then terminates with a verdict.
      # It is the only gate that exercises real file delete/rename/move against
      # the `:build-sources` graph delta and the live runtime ledger; the JVM
      # fixtures beside it hand-build build state and cannot.
      #
      # NIGHTLY rather than per-PR: measured cold at 48s, so cost would allow
      # either, but it spawns two Shadow watch daemons and a live node child,
      # edits tracked fixture sources in place, and drives everything through
      # 50ms polling loops under a 120s internal timeout. That is the
      # process-orchestration class every other gate in this job belongs to,
      # and the class most prone to false negatives under per-PR runner load.
      # Green cold on 2026-08-05: all eight passes + WARM-CACHE REUSE PROVEN.
      - name: Gate — re-frame.ui warm-watch harvest topology (test:ui-warm-watch)
        if: ${{ !cancelled() }}
        run: npm run test:ui-warm-watch

  template-emitted-app:
    name: Template emitted-app smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/template
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Clojure CLI
        run: "$GITHUB_WORKSPACE/.github/scripts/install-clojure-cli.sh"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: implementation/package-lock.json

      - name: Cache Maven / gitlibs
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: ${{ runner.os }}-expensive-template-${{ hashFiles('tools/template/deps.edn', 'implementation/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-expensive-template-
            ${{ runner.os }}-clj-

      - name: npm install (for emitted-test-run smoke)
        working-directory: implementation
        run: npm ci

      # rf2-qa5ty — `npm ci` installs the playwright PACKAGE but no browser
      # BINARY, so both Chromium proofs in this tier (the SSR DOM-adoption
      # proof and the emitted dev-page boot proof) used to exit 2 = skipped
      # and this job reported green having loaded no page in any browser.
      # With a browser provisioned, that skip is now a HARD FAILURE under CI
      # (`browser-proofs-required?` in `emitted_test_run_test.clj`).
      # `--with-deps` because the runner carries none of Chromium's shared
      # libraries and nothing earlier in this job installs them.
      #
      # rf2-169n — and cache that binary (see `cljs-browser` in test.yml for
      # the scheme). A hit skips the browser download but NOT `--with-deps`:
      # the apt system libraries are not cacheable, which is exactly why the
      # flag stays.
      - name: Cache Playwright browser binary
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('implementation/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright chromium (for the emitted browser proofs)
        working-directory: implementation
        run: npx playwright install --with-deps chromium || "$GITHUB_WORKSPACE/.github/scripts/playwright-install-failed.sh"

      - name: Run template emitted-app smoke
        env:
          RF2_TEMPLATE_RUN_EMITTED_TESTS: "1"
        run: clojure -M:test

  mcp-live:
    name: MCP live and client conformance
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/mcp-conformance
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Clojure CLI
        run: "$GITHUB_WORKSPACE/.github/scripts/install-clojure-cli.sh"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '24'

      - name: Cache Maven / gitlibs
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: ${{ runner.os }}-expensive-mcp-live-${{ hashFiles('tools/re-frame2-pair-mcp/shadow-cljs.edn', 'tools/re-frame2-pair-mcp/package.json', 'tools/mcp-conformance/package.json', 'tools/story-mcp/deps.edn', 'skills/re-frame2-pair/tests/fixture/deps.edn', 'skills/re-frame2-pair/tests/fixture/shadow-cljs.edn') }}
          restore-keys: |
            ${{ runner.os }}-expensive-mcp-live-
            ${{ runner.os }}-cljs-tools-re-frame2-pair-mcp-
            ${{ runner.os }}-clj-

      - name: Install re-frame2-pair-mcp deps
        working-directory: tools/re-frame2-pair-mcp
        run: npm install

      - name: Compile re-frame2-pair-mcp server bundle
        working-directory: tools/re-frame2-pair-mcp
        run: npx shadow-cljs compile server

      - name: Install mcp-conformance deps
        run: npm install

      - name: Run MCP client conformance
        # rf2-mw1c0: previously had `npm run test:xray` here, a stale
        # leftover from the rf2-3pdp9 Xray rename (PR #2067; from the tool's pre-rename name). The
        # underlying pre-rename npm test script was deleted a week earlier
        # in rf2-bu21t (the tool-MCP drop) so the rename mechanically
        # produced a reference to a script that has never existed. The
        # Xray MCP server isn't built yet — there is nothing to invoke
        # here. Remove the line; revisit if/when an Xray MCP conformance
        # entry-point is added to tools/mcp-conformance/package.json.
        run: |
          set -euo pipefail
          npm run test:exec-safety
          npm run test:re-frame2-pair
          npm run test:story

      - name: Install implementation deps (for Playwright)
        working-directory: implementation
        run: npm install --no-audit --no-fund

      # rf2-169n — cache the Playwright browser binary (see `cljs-browser` in
      # test.yml for the scheme). Keyed on implementation/package-lock.json
      # because the install step below runs under `implementation`, which is
      # what pins the Playwright `npx` resolves. On a hit the install still
      # runs `--with-deps`; only the browser download is skipped.
      - name: Cache Playwright browser binary
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('implementation/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright chromium (for hermetic browser preload)
        working-directory: implementation
        run: npx playwright install --with-deps chromium || "$GITHUB_WORKSPACE/.github/scripts/playwright-install-failed.sh"

      - name: Run re-frame2-pair live conformance suite (hermetic)
        run: npm run test:re-frame2-pair-live-hermetic-suite

  jvm-slow-tests:
    # rf2-bv2qqm — the heavy `^:slow` / `^:stress` JVM tests (the SSR
    # 2000-request teardown load test, the ssr-ring multi-thread Jetty
    # burst tests, and the core/machines/routing/flows 5000-iter × 8-thread
    # concurrency-stress suites) are EXCLUDED from the PR/local `:test`
    # gate (`-e :slow -e :stress` in each artefact's deps.edn). This nightly
    # job runs them via the per-artefact `:slow-test` alias
    # (`-i :slow -i :stress`) so the coverage moved off the PR critical path
    # is NOT lost. `:test` (PR) + `:slow-test` (here) partition the suite:
    # every test runs exactly once across the two. Local mirror:
    # `scripts/test-rigorous-local.sh`.
    name: JVM slow/stress tests (clojure -M:slow-test)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        artefact:
          - core
          - machines
          - routing
          - flows
          - ssr
          - ssr-ring
    defaults:
      run:
        working-directory: implementation/${{ matrix.artefact }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Clojure CLI
        run: "$GITHUB_WORKSPACE/.github/scripts/install-clojure-cli.sh"

      - name: Cache Maven / gitlibs
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: ${{ runner.os }}-expensive-slow-${{ matrix.artefact }}-${{ hashFiles('implementation/**/deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-expensive-slow-${{ matrix.artefact }}-
            ${{ runner.os }}-clj-

      - name: Run JVM slow/stress tests
        # rf2-g2ytj — the routing `popstate-mid-push-stress` suite defaults
        # to 5000 iters × 8 threads (~60s on an unstarved box), but the
        # loaded nightly runner starves it ~8× so all 8 threads finish only
        # ~650/5000 iters before the test's 120s per-future deref bound and
        # the run TIMES OUT (a CPU-starvation wall-clock timeout, NOT a
        # concurrency race — the correctness invariants are unchanged and
        # still assert). Lower JUST the nightly routing run to 500 iters via
        # the test's `RF2_KSBUR_STRESS_ITERS` override so it completes well
        # within the bound; 500 × 8 threads still exercises the invariants
        # meaningfully. The default (5000) is unchanged — the local rigorous
        # sweep (`scripts/test-rigorous-local.sh`) still runs full strength.
        # Scoped to `routing`; the other matrix artefacts never read this var.
        env:
          RF2_KSBUR_STRESS_ITERS: ${{ matrix.artefact == 'routing' && '500' || '' }}
        run: clojure -M:slow-test

  # THE GATE-SCHEDULING AUDIT USED TO LIVE HERE, AND NO LONGER DOES (rf2-k78o2).
  # It asserts that every `test:*` / `bench:*` / `build:*` command in
  # implementation/package.json is either reachable from a workflow or carries a
  # declared, machine-CHECKED disposition saying why not. It landed in this
  # nightly for one reason only: .github/workflows/test.yml was fenced off by an
  # open PR (rf2-eegpw / #7530) the day it was written. That fence is gone, the
  # check measures ~0.3s including interpreter start, and a PR that adds an
  # unscheduled gate should learn so in three minutes rather than twenty-four
  # hours — so it is now `scripts/check_gate_scheduling.py`, running always-on
  # in test.yml's `verify-skill-mcp-drift` repo-invariant job and in
  # scripts/test-fast-pr.sh.
  #
  # It is NOT also kept here. A per-PR always-on gate means main cannot carry a
  # violation for a night, so a nightly arm would re-prove a property already
  # proven on every merge — and a second copy is a second thing to keep in step.

  # rf2-6sg25 — until this job existed, a red nightly told NOBODY. Of the
  # thirty runs ending 2026-08-04, eighteen failed and 2026-07-09..07-21 was
  # thirteen consecutive red nights; the only way to find out was to open the
  # Actions tab. Multiple gates are deliberately nightly-only BECAUSE this
  # workflow is treated as the system of record (TESTING.md), so a system of
  # record that can be red for a fortnight unseen is an instrument that reports
  # nothing and is believed anyway.
  #
  # It alerts on a CHANGE OF FAILURE SIGNATURE, not on failure: at an 18-in-30
  # failure rate a per-run alert would have been muted inside a week, and a
  # muted alert is the original fail-open in a new suit. The thresholds were
  # measured against that real history rather than guessed — see the module
  # docstring of .github/scripts/nightly_failure_alert.py, and reproduce the
  # measurement with its `--replay 30` mode. Over those thirty runs: eighteen
  # red nights, EIGHT notifications, none of them a restatement.
  nightly-result:
    name: Nightly result -> tracking issue
    # ALWAYS, and on green as well as red. `if: failure()` was the obvious
    # shape and is wrong twice over: closing the tracking issue when the
    # nightly recovers is half the contract, and a run cancelled or skipped
    # part-way still has a verdict worth recording.
    #
    # Restricted to the DEFAULT BRANCH so that a `workflow_dispatch` of this
    # workflow from a worker branch — which is exactly how a worker verifies a
    # change to it — cannot file an issue about that branch's own breakage.
    if: ${{ always() && github.ref_name == github.event.repository.default_branch }}
    needs:
      - browser-bundle-and-story-gates
      - template-emitted-app
      - mcp-live
      - jvm-slow-tests
    runs-on: ubuntu-latest
    permissions:
      issues: write     # open / edit / close the single tracking issue
      actions: read     # read this run's per-step conclusions
      contents: read    # checkout
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      # A wired alert nobody has ever seen fire is the arming-not-catching
      # pattern one tier up. This arm proves the decision layer still
      # distinguishes a new failure from a known one, a shrinking failure set
      # from a growing one, and a genuine recovery from a flake — every night,
      # before it is trusted to decide anything.
      #
      # `continue-on-error` + the re-raise step at the bottom, rather than a
      # plain failing step, and the reason is this job's own fail-open: a
      # self-test step that ABORTS the job takes the notification down with it,
      # so a broken alerter would be reported by nothing — the exact circularity
      # rf2-6sg25 is about. Ordering it this way means a red self-test still
      # lets the live arm try (a signature is derived from data, not from the
      # arithmetic under test), and the job still ends red so the failure is on
      # the record.
      - name: Alerting self-test (the alert can still fire, and still go quiet)
        id: alert_self_test
        continue-on-error: true
        run: python3 .github/scripts/nightly_failure_alert.py --self-test --verbose

      - name: Open, edit or close the nightly tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/nightly_failure_alert.py \
            --repo "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" \
            --assignee mike-thompson-day8

      - name: Fail the job if the alerting self-test failed
        if: ${{ steps.alert_self_test.outcome == 'failure' }}
        run: |
          echo "The nightly alerting self-test FAILED — the issue this run"
          echo "opened or edited may be wrong. Reproduce with:"
          echo "  python3 .github/scripts/nightly_failure_alert.py --self-test --verbose"
          exit 1
