name: expensive tests

on:
  schedule:
    - cron: "17 15 * * *"
  workflow_dispatch:

jobs:
  browser-bundle-and-story-gates:
    name: Browser, bundle, examples, Story/Xray gates
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: implementation
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Clojure CLI
        run: "$GITHUB_WORKSPACE/.github/scripts/install-clojure-cli.sh"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: implementation/package-lock.json

      - name: Cache Maven / gitlibs
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: ${{ runner.os }}-expensive-implementation-${{ hashFiles('implementation/shadow-cljs.edn', 'implementation/package-lock.json', 'implementation/**/deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-expensive-implementation-
            ${{ runner.os }}-cljs-

      # rf2-og36y: same keyed shadow-cljs compile cache as the PR-smoke
      # gate (.shadow-cljs incremental state + .cpcache classpath cache).
      # Restoring the warm cache here keeps the nightly-full sweep fast
      # AND keeps the cache primed for the PR-smoke gate (which shares the
      # `<os>-story-xray-shadow-` restore-keys prefix), so the first PR
      # of the day still lands a warm partial cache.
      - name: Cache shadow-cljs compile output (.shadow-cljs / .cpcache)
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            implementation/.shadow-cljs
            implementation/.cpcache
          key: ${{ runner.os }}-story-xray-shadow-${{ hashFiles('implementation/shadow-cljs.edn', 'implementation/deps.edn', 'implementation/package-lock.json', 'implementation/**/deps.edn', 'tools/story/deps.edn', 'tools/xray/deps.edn', 'tools/story/src/**', 'tools/story/testbeds/**', 'tools/xray/src/**', 'tools/xray/testbeds/**', 'implementation/core/src/**') }}
          restore-keys: |
            ${{ runner.os }}-story-xray-shadow-

      - name: npm install
        run: npm ci

      # rf2-gzavkm — core-only PRs no longer queue the all-examples compile.
      # Keep that transitive safety net unconditional in the nightly/manual
      # full sweep, before the browser download so compile failures stay cheap.
      - name: Compile every standalone example build (nightly coverage net)
        run: npm run test:examples-compile

      # rf2-169n — cache the Playwright browser binary (see `cljs-browser` in
      # test.yml for the scheme). On a hit the install below still runs
      # `--with-deps`; only the browser download is skipped.
      - name: Cache Playwright browser binary
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('implementation/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright (Chromium + system deps)
        run: timeout -k 10 720 npx playwright install --with-deps chromium || "$GITHUB_WORKSPACE/.github/scripts/playwright-install-failed.sh" $?

      # rf2-wh5to — the eleven gates below used to be ONE unnamed
      # `set -euo pipefail` step. That structure is why the
      # 2026-07-08..07-21 nightly outage cost fourteen red nights and TWO
      # repair rounds instead of one:
      #
      #   - A `set -e` chain aborts at the FIRST failing gate, so every
      #     later gate is simply not run. `test:story-feature-load` broke
      #     on 07-08 and `test:story-static` broke on 07-13, but the
      #     second was invisible until the first was fixed on 07-21 —
      #     the 07-21 nightly then went red on a bug that had been live
      #     for eight nights, costing another day of the alpha clock.
      #   - The blob was also a single step-level result, so nothing —
      #     not the Actions UI, not the jobs API — recorded WHICH gate
      #     failed. Finding that out meant reading a 2000-line step log.
      #     (`gh run view --log-failed` prints `UNKNOWN STEP` against
      #     every line either way; that is a `gh` limitation, not
      #     something this restructure fixes.)
      #
      # One named step per gate, each `if: ${{ !cancelled() }}`, so a red
      # night names the failing gate in the Actions UI and in
      # `gh api repos/<o>/<r>/actions/runs/<id>/jobs`, and reports EVERY
      # broken gate in that one night. The gates are independent (each
      # builds and tears down its own artefacts and servers), the job
      # still fails if any one of them fails, and nothing here is
      # skipped, retried, softened or allow-listed — only the reporting
      # changes. The extra CI minutes are spent only on already-red
      # nightly runs.
      - name: Gate — browser tests (test:browser)
        if: ${{ !cancelled() }}
        run: npm run test:browser

      - name: Gate — schemas boundary, production build (test:browser-schemas-boundary-prod)
        if: ${{ !cancelled() }}
        run: npm run test:browser-schemas-boundary-prod

      - name: Gate — production elision, browser (test:browser-prod-elision)
        if: ${{ !cancelled() }}
        run: npm run test:browser-prod-elision

      - name: Gate — production elision probe (test:elision)
        if: ${{ !cancelled() }}
        run: npm run test:elision

      - name: Gate — tools must not leak into production bundles (test:bundle-isolation)
        if: ${{ !cancelled() }}
        run: npm run test:bundle-isolation

      - name: Gate — reagent-slim bundle isolation (test:reagent-slim:bundle-isolation)
        if: ${{ !cancelled() }}
        run: npm run test:reagent-slim:bundle-isolation

      - name: Gate — per-adapter mount/dispatch smokes (test:adapter-smokes)
        if: ${{ !cancelled() }}
        run: npm run test:adapter-smokes

      - name: Gate — Story feature-load (test:story-feature-load)
        if: ${{ !cancelled() }}
        run: npm run test:story-feature-load

      - name: Gate — Story play scripts (test:story-play-scripts)
        if: ${{ !cancelled() }}
        run: npm run test:story-play-scripts

      - name: Gate — Xray feature matrix (test:xray-feature-gate)
        if: ${{ !cancelled() }}
        run: npm run test:xray-feature-gate

      - name: Gate — Story static export (test:story-static)
        if: ${{ !cancelled() }}
        run: npm run test:story-static

      # rf2-a9oic — a build NAMED for the nightly that was in no nightly.
      # `:node-test-perf-nightly` selects `-emit-nightly-test$`, which the
      # consolidated `:node-test` build's `cljs-test$` does not match, so the
      # two `*_emit_nightly_test.cljs` namespaces (core's
      # performance_emit_nightly_test, and the hicasso bench tree's
      # render_measure_emit_nightly_test) run in this lane ALONE — and the lane
      # ran nowhere. `check_test_lane_bijection.py` could not see it: the lane
      # has a selector and the selector reaches files, so the bijection holds.
      # What nothing asserted until rf2-6ckzl's audit is that the lane is ever
      # RUN.
      #
      # NIGHTLY rather than per-PR on the build's own documented grounds, not
      # on cost: shadow-cljs.edn says these User-Timing assertions are "noisy
      # under per-PR CI runners; nightly cadence reduces false negatives from
      # runner load". The defect was the missing schedule, not the tier. Cost
      # is not the constraint either way — measured cold at 32s (10.8s of
      # compile), 12 tests / 37 assertions green.
      - name: Gate — perf User-Timing emission, nightly lane (test:cljs-perf-emit-nightly)
        if: ${{ !cancelled() }}
        run: npm run test:cljs-perf-emit-nightly

      # ==================================================================
      # rf2-mvq7 — THE NARROW-ARMED GATES, given the arm against main they
      # never had. From the rf2-2uy8 B+ ruling: TESTING.md calls this sweep a
      # strict superset of the surface-armed PR gates, and for the expensive
      # browser class it is. It was not for the gates below. Each runs only
      # when `detect_changed_surfaces` arms it at PR time, and none had any
      # arm that ever ran against main — so a CROSS-SURFACE regression in one
      # sits green on main until some PR happens to touch its narrow surface.
      # That is the rf2-8yyd shape one tier down: the gate is not red and not
      # green, it is absent, and a rollup cannot tell absent from passing.
      #
      # Every one of these rides setup this job already does (npm ci under
      # `implementation`, JDK, Clojure CLI, pinned Chromium), which is what
      # makes them cheap enough to be unconditional here. Each is its own
      # NAMED step rather than a block, because `nightly_failure_alert.py`
      # keys its failure signature on the step name (rf2-wh5to): one newly-red
      # gate must become one new signature in the tracking issue, not a
      # reshuffle of a shared step's.
      #
      # `if: !cancelled()` matches every gate above: a red gate must not
      # suppress the ones after it, or the first failure of the night hides
      # the rest.
      - name: Gate — bounded Node SSR service suite (test:ssr-node)
        if: ${{ !cancelled() }}
        run: npm run test:ssr-node

      - name: Gate — perf-flag bundle isolation (test:perf-bundle)
        if: ${{ !cancelled() }}
        run: npm run test:perf-bundle

      - name: Gate — schemas bundle cost, two-sided margin (test:schemas-bundle)
        if: ${{ !cancelled() }}
        run: npm run test:schemas-bundle

      - name: Gate — Reagent Slim client-runtime smoke (test:reagent-slim:smoke)
        if: ${{ !cancelled() }}
        run: npm run test:reagent-slim:smoke

      - name: Gate — tenant-switcher testbed smoke (test:testbed-tenant-switcher)
        if: ${{ !cancelled() }}
        run: npm run test:testbed-tenant-switcher

      - name: Gate — tools/machines-viz CLJS lane (test:tools-machines-viz)
        if: ${{ !cancelled() }}
        run: npm run test:tools-machines-viz

      - name: Gate — machines-viz viewer page build + stage (build:machines-viz-viewer)
        if: ${{ !cancelled() }}
        run: npm run build:machines-viz-viewer

      # ------------------------------------------------------------------
      # rf2-mvq7 — DECLARED HOLES. These four narrow-armed gates are NOT in
      # this sweep, and the omission is a decision rather than an oversight.
      # The idiom is `check_gate_scheduling.py`'s `unscheduled` kind: a hole
      # that is named costs a reader one paragraph; a hole that is not costs
      # them the belief that the sweep is a superset.
      #
      #   test:hicasso-controlled  — three engines. Needs Firefox AND WebKit,
      #   test:hicasso-hmr           which this job does not install; the HMR
      #                              gate additionally needs a live
      #                              `shadow-cljs watch` and its own
      #                              `:dev-http` origin on 8061, and drives 36
      #                              real reloads per engine. Two more engine
      #                              downloads plus a watch daemon is not the
      #                              "few minutes of nightly runtime" the
      #                              rf2-2uy8 ruling budgeted, and the
      #                              process-orchestration class is the one
      #                              most prone to false negatives here.
      #                              ACCEPTED EXPOSURE: a cross-surface break
      #                              of the caret/composition or HMR contracts
      #                              sits on main until a PR touches
      #                              `implementation/hicasso/**`, the gates'
      #                              own launchers, or the build-config trio
      #                              (the `implementation/ui/**` arm named
      #                              here retired with that tree, rf2-0yp7w.6,
      #                              which NARROWS the surface that catches
      #                              such a break). Reconsider when
      #                              this job needs Firefox or WebKit for some
      #                              other reason and the marginal cost is a
      #                              step rather than an install.
      #
      #   test:re-frame2-pair-live-overflow — would run VACUOUSLY. Without
      #   `$SHADOW_CLJS_NREPL_PORT` it exits 0 on a SKIP marker (TESTING.md),
      #   and a gate that cannot fail is worse here than an absent one: it
      #   would report green nightly and read as coverage. Its real coverage
      #   is the hermetic suite in the `mcp-live` job below, which IS in this
      #   sweep.
      #
      #   test:cljs (tools/mcp-base) — NO cross-surface input to miss.
      #   `tools/mcp-base/deps.edn` states the artefact's own rule: runtime
      #   sources "must not depend on implementation/" and it carries no
      #   external runtime dependency beyond Clojure. Its suite exercises that
      #   artefact's reader-conditional branches, which is exactly the surface
      #   `tools_jvm` arms on — so the PR arm is complete rather than narrow,
      #   and a nightly arm would buy nothing. This one is listed because a
      #   census that omits it looks like an oversight.
      # ==================================================================

  template-emitted-app:
    name: Template emitted-app smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: tools/template
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Clojure CLI
        run: "$GITHUB_WORKSPACE/.github/scripts/install-clojure-cli.sh"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: implementation/package-lock.json

      - name: Cache Maven / gitlibs
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: ${{ runner.os }}-expensive-template-${{ hashFiles('tools/template/deps.edn', 'implementation/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-expensive-template-
            ${{ runner.os }}-clj-

      - name: npm install (for emitted-test-run smoke)
        working-directory: implementation
        run: npm ci

      # rf2-qa5ty — `npm ci` installs the playwright PACKAGE but no browser
      # BINARY, so this tier's Chromium proof (the emitted dev-page boot
      # proof) used to exit 2 = skipped and this job reported green having
      # loaded no page in any browser.
      # With a browser provisioned, that skip is now a HARD FAILURE under CI
      # (`browser-proofs-required?` in `emitted_test_run_test.clj`).
      # `--with-deps` because the runner carries none of Chromium's shared
      # libraries and nothing earlier in this job installs them.
      #
      # rf2-169n — and cache that binary (see `cljs-browser` in test.yml for
      # the scheme). A hit skips the browser download but NOT `--with-deps`:
      # the apt system libraries are not cacheable, which is exactly why the
      # flag stays.
      - name: Cache Playwright browser binary
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('implementation/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright chromium (for the emitted browser proofs)
        working-directory: implementation
        run: timeout -k 10 720 npx playwright install --with-deps chromium || "$GITHUB_WORKSPACE/.github/scripts/playwright-install-failed.sh" $?

      - name: Run template emitted-app smoke
        env:
          RF2_TEMPLATE_RUN_EMITTED_TESTS: "1"
        run: clojure -M:test

  mcp-live:
    name: MCP live and client conformance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tools/mcp-conformance
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Clojure CLI
        run: "$GITHUB_WORKSPACE/.github/scripts/install-clojure-cli.sh"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '24'

      # This job's hermetic step (`test:re-frame2-pair-live-hermetic-suite`,
      # below) boots shadow-cljs against `skills/re-frame2-pair/tests/fixture/`,
      # so this cache covers the fixture's classpath as well as the two MCP
      # servers'. That fixture resolves FIVE in-repo artefacts as `:local/root`
      # entries — core, reagent, epoch, schemas and machines (the last two
      # because the shipped preload `:require`s `re-frame.schemas` and
      # `re-frame.machines` directly, per the fixture's own deps.edn).
      #
      # THE KEY MUST NAME ALL FIVE (rf2-cd0zz). It named NONE of them, so any
      # artefact dependency bump left the key unchanged: the pre-bump entry
      # kept being restored and — because an exact key hit suppresses the
      # save — never refreshed, returning the cold-resolve cost this key
      # exists to amortise, against an orchestrator that fails the job when
      # its `SHADOW_BOOT_TIMEOUT_MS` watchdog beats the nREPL port file.
      # Same roster as `mcp-conformance-re-frame2-pair` and
      # `re-frame2-pair-fixture-pure` in test.yml (rf2-nsb3e widened the
      # latter). The tools/* entries stay — they key the server bundles.
      - name: Cache Maven / gitlibs
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: ${{ runner.os }}-expensive-mcp-live-${{ hashFiles('tools/re-frame2-pair-mcp/shadow-cljs.edn', 'tools/re-frame2-pair-mcp/package.json', 'tools/mcp-conformance/package.json', 'tools/story-mcp/deps.edn', 'skills/re-frame2-pair/tests/fixture/deps.edn', 'skills/re-frame2-pair/tests/fixture/shadow-cljs.edn', 'implementation/core/deps.edn', 'implementation/adapters/reagent/deps.edn', 'implementation/epoch/deps.edn', 'implementation/schemas/deps.edn', 'implementation/machines/deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-expensive-mcp-live-
            ${{ runner.os }}-cljs-tools-re-frame2-pair-mcp-
            ${{ runner.os }}-clj-

      - name: Install re-frame2-pair-mcp deps
        working-directory: tools/re-frame2-pair-mcp
        run: npm install

      - name: Compile re-frame2-pair-mcp server bundle
        working-directory: tools/re-frame2-pair-mcp
        run: npx shadow-cljs compile server

      - name: Install mcp-conformance deps
        run: npm install

      - name: Run MCP client conformance
        # rf2-mw1c0: previously had `npm run test:xray` here, a stale
        # leftover from the rf2-3pdp9 Xray rename (PR #2067; from the tool's pre-rename name). The
        # underlying pre-rename npm test script was deleted a week earlier
        # in rf2-bu21t (the tool-MCP drop) so the rename mechanically
        # produced a reference to a script that has never existed. The
        # Xray MCP server isn't built yet — there is nothing to invoke
        # here. Remove the line; revisit if/when an Xray MCP conformance
        # entry-point is added to tools/mcp-conformance/package.json.
        run: |
          set -euo pipefail
          npm run test:exec-safety
          npm run test:re-frame2-pair
          npm run test:story

      - name: Install implementation deps (for Playwright)
        working-directory: implementation
        run: npm install --no-audit --no-fund

      # rf2-169n — cache the Playwright browser binary (see `cljs-browser` in
      # test.yml for the scheme). Keyed on implementation/package-lock.json
      # because the install step below runs under `implementation`, which is
      # what pins the Playwright `npx` resolves. On a hit the install still
      # runs `--with-deps`; only the browser download is skipped.
      - name: Cache Playwright browser binary
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('implementation/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright chromium (for hermetic browser preload)
        working-directory: implementation
        run: timeout -k 10 720 npx playwright install --with-deps chromium || "$GITHUB_WORKSPACE/.github/scripts/playwright-install-failed.sh" $?

      - name: Run re-frame2-pair live conformance suite (hermetic)
        run: npm run test:re-frame2-pair-live-hermetic-suite

      # rf2-mvq7 — three more narrow-armed gates given an arm against main.
      # `test:unit` and `test:flag-gates` are `mcp-conformance`'s own Node
      # cluster and the cross-MCP CLI flag-vocabulary gate; `test:stdin-eof-
      # shutdown` is the re-frame2-pair-mcp shutdown regression. All three run
      # only when the classifier arms `mcp_conformance` / `mcp_live` at PR
      # time, and this sweep already carried their siblings
      # (`test:re-frame2-pair`, `test:story`, `test:exec-safety`) and not
      # them. Each is its own NAMED step, not an addition to the conformance
      # block above, so a newly-red one becomes its own failure signature for
      # `nightly_failure_alert.py` (rf2-wh5to). Both installs they need are
      # already done by this job.
      - name: Gate — mcp-conformance Node unit-regression cluster (test:unit)
        if: ${{ !cancelled() }}
        run: npm run test:unit

      - name: Gate — cross-MCP CLI flag-vocabulary conformance (test:flag-gates)
        if: ${{ !cancelled() }}
        run: npm run test:flag-gates

      - name: Gate — re-frame2-pair-mcp stdin-EOF shutdown (test:stdin-eof-shutdown)
        if: ${{ !cancelled() }}
        working-directory: tools/re-frame2-pair-mcp
        run: npm run test:stdin-eof-shutdown

  mcp-live-windows:
    name: MCP live hermetic suite on WINDOWS (two consecutive runs)
    # rf2-hhw6, closing rf2-kzbf's AC4. THE ONLY WINDOWS RUNNER IN THIS REPO,
    # and it exists because the mechanism it covers cannot execute anywhere
    # else. `makeShadowTreeReaper` — the owned-descendant teardown rf2-kzbf
    # shipped, in
    # `tools/mcp-conformance/scripts/run-re-frame2-pair-live-hermetic-suite.cjs`
    # — opens `if (platform !== 'win32') return inert;`. Every other job that
    # runs the hermetic suite is ubuntu-latest (`mcp-live` above, and
    # test.yml's `mcp-conformance-re-frame2-pair`), so on both of them that
    # entire code path is the identity function and a green rollup is SILENT
    # about it. The unit tests in `test/runner-cleanup.test.cjs` model the
    # process table; this is the only place the real one is read.
    #
    # WHY NIGHTLY RATHER THAN PER-PR. Three reasons, in order of weight.
    #
    #   1. THE DEFECT'S BLAST RADIUS IS THE NEXT RUN ON THE SAME MACHINE. A
    #      shadow-cljs JVM that survives teardown goes on holding the fixture's
    #      port 8030. GitHub-hosted runners are a fresh VM per job, so CI is
    #      structurally immune to the leak — the party who actually suffers it
    #      is a developer running the hermetic suite twice on one Windows
    #      workstation. That makes this a regression net for a mechanism no
    #      contributor's PR can plausibly break in passing, which is the
    #      nightly's job description and not the per-PR gate's.
    #
    #   2. COST. A Windows runner (billed at twice a Linux minute) booting a
    #      JDK, a Clojure CLI, a cold shadow-cljs resolve over five
    #      `:local/root` artefacts, a Chromium download, and then the whole
    #      hermetic suite TWICE. Charging that to every contributor on every
    #      push buys none of them anything.
    #
    #   3. BAND. A job added to test.yml moves the per-PR check-count band the
    #      merge criterion measures every open PR against. A nightly job does
    #      not. This change adds no job key to test.yml.
    runs-on: windows-latest
    # Two full hermetic runs plus a cold toolchain. The per-step caps below are
    # the real bounds; this is the circuit breaker that keeps a wedged runner
    # from producing no verdict at all (rf2-rsn1e).
    timeout-minutes: 60
    defaults:
      run:
        working-directory: tools/mcp-conformance
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: temurin
          java-version: '21'

      # NOT `.github/scripts/install-clojure-cli.sh`, and NOT the setup-clojure
      # action. Both exclusions are forced rather than chosen:
      #
      #   * The shared installer — rf2-e7ja9's single owner of this policy —
      #     fetches the official `linux-install.sh` and runs it under `sudo`.
      #     Neither half exists here, so it is structurally unusable on this
      #     platform rather than merely awkward.
      #   * The setup-clojure action is refused repo-wide by
      #     `implementation/scripts/_changed-surfaces.test.cjs` ("no workflow
      #     carries an inline Clojure installer body or setup-clojure"), for
      #     the un-retried curl rf2-9sgj8 removed.
      #
      # So: deps.clj, the single-binary drop-in for the Clojure CLI, pinned by
      # version AND verified against the SHA-256 its release publishes, with
      # Invoke-WebRequest's own retry supplying the resilience the shared
      # installer gets from its curl/backoff loop. This IS a second owner of
      # Clojure-install policy, which rf2-e7ja9 exists to prevent; the
      # difference is that it owns one job on the one platform the shared
      # script cannot reach, not 59 copies of a reachable one.
      #
      # `deps.exe` is COPIED to `clojure.exe` because shadow-cljs on win32
      # shells out as `powershell -command clojure ...` (the `win32` branch of
      # `shadow-cljs/cli/dist.js`): it needs `clojure` resolvable as a command,
      # not `deps`. Verified at this exact version on a Windows 11 developer
      # machine — `powershell -NoProfile -command clojure -Spath` resolved a
      # real classpath and exited 0.
      - name: Install the Clojure CLI for Windows (deps.clj)
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '1.12.6.1673'
          $expected = '826e2f52657483471bb98013797d9d01df2ddac850ca7182792936cd6b31c834'
          $url = "https://github.com/borkdude/deps.clj/releases/download/v$version/deps.clj-$version-windows-amd64.zip"
          $zip = Join-Path $env:RUNNER_TEMP 'deps-clj.zip'
          $bin = Join-Path $env:RUNNER_TEMP 'clojure-bin'
          Invoke-WebRequest -Uri $url -OutFile $zip -MaximumRetryCount 5 -RetryIntervalSec 10
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            Write-Host "::error title=deps.clj download does not match its published SHA-256 - CI infrastructure - not this diff::expected $expected, got $actual. NO GATE RAN IN THIS JOB: this step provisions the toolchain, so the hermetic suite never started and this red says nothing about the change."
            exit 1
          }
          Expand-Archive -LiteralPath $zip -DestinationPath $bin -Force
          Copy-Item -LiteralPath (Join-Path $bin 'deps.exe') -Destination (Join-Path $bin 'clojure.exe')
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '24'

      # The SAME key roster as `mcp-live` above, deliberately unaltered: rf2-cd0zz
      # is the record of what happens when this key omits an artefact the fixture
      # resolves — the pre-bump entry keeps being restored and, because an exact
      # key hit suppresses the save, never refreshes. `runner.os` is `Windows`
      # here, so this can never collide with the Linux entry.
      #
      # `~/AppData/Local/Apps/clojure` is deps.clj's own tools directory, the
      # Windows analogue of `~/.deps.clj` (confirmed as its `:install-dir` in
      # `clojure -Sdescribe` output). Caching it keeps the night's first
      # `clojure` invocation off download.clojure.org.
      - name: Cache Maven / gitlibs / deps.clj tools
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/AppData/Local/Apps/clojure
          key: ${{ runner.os }}-expensive-mcp-live-windows-${{ hashFiles('tools/re-frame2-pair-mcp/shadow-cljs.edn', 'tools/re-frame2-pair-mcp/package.json', 'tools/mcp-conformance/package.json', 'tools/story-mcp/deps.edn', 'skills/re-frame2-pair/tests/fixture/deps.edn', 'skills/re-frame2-pair/tests/fixture/shadow-cljs.edn', 'implementation/core/deps.edn', 'implementation/adapters/reagent/deps.edn', 'implementation/epoch/deps.edn', 'implementation/schemas/deps.edn', 'implementation/machines/deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-expensive-mcp-live-windows-

      # Its own named step so that a failure here is its own signature for
      # `nightly_failure_alert.py`. deps.clj downloads the official Clojure
      # tools on its first invocation; without this, a failure in THAT download
      # would surface six steps later as an unexplained shadow-cljs boot
      # timeout, which is the misattribution rf2-xsfr's `::error` annotation
      # exists to delete on the Linux side.
      - name: Verify the Clojure CLI answers
        run: clojure -Sdescribe

      - name: Install re-frame2-pair-mcp deps
        working-directory: tools/re-frame2-pair-mcp
        run: npm install

      - name: Compile re-frame2-pair-mcp server bundle
        working-directory: tools/re-frame2-pair-mcp
        run: npx shadow-cljs compile server

      # `npm ci` rather than `npm install`: tools/mcp-conformance ships a
      # committed package-lock.json, so this is lockfile-exact and fails on
      # package.json/lock drift (rf2-vtp2er's posture, matching test.yml's
      # `mcp-conformance-re-frame2-pair`).
      - name: Install mcp-conformance deps
        run: npm ci

      # ---- Pre-warm what the orchestrator's own watchdogs would otherwise
      # have to absorb ------------------------------------------------------
      #
      # The orchestrator caps its whole run at HERMETIC_TIMEOUT_MS (9 min) and
      # the shadow boot at SHADOW_BOOT_TIMEOUT_MS (6 min), and it will itself
      # `npm install` the fixture and cold-resolve its classpath INSIDE those
      # windows. On a cold-cache Windows runner that resolve is the single
      # slowest thing in the job, and paying it inside a watchdog turns a slow
      # night into a red one for a reason that has nothing to do with teardown.
      # Both pre-warms are ordinary job setup, identical for both runs below,
      # and each is its own named step so a failure in either is legible as
      # itself rather than as a boot timeout.
      - name: Pre-warm the fixture's Clojure classpath (keeps the cold resolve out of the boot watchdog)
        working-directory: skills/re-frame2-pair/tests/fixture
        timeout-minutes: 15
        run: clojure -P

      - name: Pre-warm the fixture's npm deps
        working-directory: skills/re-frame2-pair/tests/fixture
        run: npm install --no-audit --no-fund

      # The hermetic orchestrator resolves `playwright` from
      # tools/mcp-conformance or implementation/, and only the latter declares
      # it as a dependency.
      - name: Install implementation deps (for Playwright)
        working-directory: implementation
        run: npm install --no-audit --no-fund

      # `~/AppData/Local/ms-playwright` is Playwright's browser cache on
      # Windows — the platform's own location, not the `~/.cache/ms-playwright`
      # the Linux jobs name.
      - name: Cache Playwright browser binary
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: ~/AppData/Local/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('implementation/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      # No `--with-deps`: that flag apt-installs Chromium's system libraries and
      # is Ubuntu-only. No `timeout -k ... || playwright-install-failed.sh`
      # either — both are bash/coreutils and the shell here is pwsh; the step
      # cap does that job.
      - name: Install Playwright chromium (for hermetic browser preload)
        working-directory: implementation
        timeout-minutes: 10
        run: npx playwright install chromium

      # ---- The thing this job exists for ----------------------------------
      #
      # TWO CONSECUTIVE RUNS, and the second is deliberately NOT handed a
      # cleaned tree. Wiping `.shadow-cljs`, `public/out` and the nREPL port
      # file between them would test LESS, not more: the whole claim under test
      # is that run 2 — "the next run on the same machine" — is unharmed by
      # whatever run 1's teardown left behind. Leaving the tree alone is what
      # actually exercises the orchestrator's stale-port-file wipe
      # (`wipeStalePortFileCandidate`) and its stale-bundle removal, rather
      # than assuming them. rf2-kzbf AC3.
      - name: Run re-frame2-pair-mcp live conformance suite (HERMETIC, run 1 of 2)
        timeout-minutes: 15
        run: npm run test:re-frame2-pair-live-hermetic-suite

      # `!cancelled()` on this and every step below: a run that FAILED is
      # exactly the case where a leaked listener matters most, so the assertion
      # must still be taken. A missing `Get-NetTCPConnection` fails CLOSED here
      # — under `$ErrorActionPreference = 'Stop'` an unresolvable command
      # terminates the step even with `-ErrorAction SilentlyContinue` on it
      # (measured), so this can go red but it cannot go vacuously green.
      - name: Assert nothing holds fixture port 8030 after run 1
        if: ${{ !cancelled() }}
        run: |
          $ErrorActionPreference = 'Stop'
          $listeners = @(Get-NetTCPConnection -LocalPort 8030 -State Listen -ErrorAction SilentlyContinue)
          if ($listeners.Count -gt 0) {
            Write-Host "::error title=Hermetic teardown leaked the fixture port after run 1::$($listeners.Count) process(es) still LISTENING on 8030. The owned-descendant reap did not drain the shadow-cljs subtree (rf2-kzbf / rf2-hhw6)."
            foreach ($l in $listeners) {
              $owner = Get-Process -Id $l.OwningProcess -ErrorAction SilentlyContinue
              $name = if ($owner) { $owner.ProcessName } else { '<already exited>' }
              $exe = if ($owner) { $owner.Path } else { '' }
              Write-Host ("  pid={0} name={1} path={2}" -f $l.OwningProcess, $name, $exe)
            }
            exit 1
          }
          Write-Host 'port 8030 is free - run 1 left no listener behind.'

      - name: Run re-frame2-pair-mcp live conformance suite (HERMETIC, run 2 of 2 - tree deliberately NOT cleaned)
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        run: npm run test:re-frame2-pair-live-hermetic-suite

      - name: Assert nothing holds fixture port 8030 after run 2
        if: ${{ !cancelled() }}
        run: |
          $ErrorActionPreference = 'Stop'
          $listeners = @(Get-NetTCPConnection -LocalPort 8030 -State Listen -ErrorAction SilentlyContinue)
          if ($listeners.Count -gt 0) {
            Write-Host "::error title=Hermetic teardown leaked the fixture port after run 2::$($listeners.Count) process(es) still LISTENING on 8030. The owned-descendant reap did not drain the shadow-cljs subtree (rf2-kzbf / rf2-hhw6)."
            foreach ($l in $listeners) {
              $owner = Get-Process -Id $l.OwningProcess -ErrorAction SilentlyContinue
              $name = if ($owner) { $owner.ProcessName } else { '<already exited>' }
              $exe = if ($owner) { $owner.Path } else { '' }
              Write-Host ("  pid={0} name={1} path={2}" -f $l.OwningProcess, $name, $exe)
            }
            exit 1
          }
          Write-Host 'port 8030 is free - run 2 left no listener behind.'

  jvm-slow-tests:
    # rf2-bv2qqm — the heavy `^:slow` / `^:stress` JVM tests (the SSR
    # 2000-request teardown load test, the ssr-ring multi-thread Jetty
    # burst tests, and the core/machines/routing/flows 5000-iter × 8-thread
    # concurrency-stress suites) are EXCLUDED from the PR/local `:test`
    # gate (`-e :slow -e :stress` in each artefact's deps.edn). This nightly
    # job runs them via the per-artefact `:slow-test` alias
    # (`-i :slow -i :stress`) so the coverage moved off the PR critical path
    # is NOT lost. `:test` (PR) + `:slow-test` (here) partition the suite:
    # every test runs exactly once across the two. Local mirror:
    # `scripts/test-rigorous-local.sh`.
    name: JVM slow/stress tests (clojure -M:slow-test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        artefact:
          - core
          - machines
          - routing
          - flows
          - ssr
          - ssr-ring
    defaults:
      run:
        working-directory: implementation/${{ matrix.artefact }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Clojure CLI
        run: "$GITHUB_WORKSPACE/.github/scripts/install-clojure-cli.sh"

      - name: Cache Maven / gitlibs
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: ${{ runner.os }}-expensive-slow-${{ matrix.artefact }}-${{ hashFiles('implementation/**/deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-expensive-slow-${{ matrix.artefact }}-
            ${{ runner.os }}-clj-

      - name: Run JVM slow/stress tests
        # rf2-g2ytj — the routing `popstate-mid-push-stress` suite defaults
        # to 5000 iters × 8 threads (~60s on an unstarved box), but the
        # loaded nightly runner starves it ~8× so all 8 threads finish only
        # ~650/5000 iters before the test's 120s per-future deref bound and
        # the run TIMES OUT (a CPU-starvation wall-clock timeout, NOT a
        # concurrency race — the correctness invariants are unchanged and
        # still assert). Lower JUST the nightly routing run to 500 iters via
        # the test's `RF2_KSBUR_STRESS_ITERS` override so it completes well
        # within the bound; 500 × 8 threads still exercises the invariants
        # meaningfully. The default (5000) is unchanged — the local rigorous
        # sweep (`scripts/test-rigorous-local.sh`) still runs full strength.
        # Scoped to `routing`; the other matrix artefacts never read this var.
        env:
          RF2_KSBUR_STRESS_ITERS: ${{ matrix.artefact == 'routing' && '500' || '' }}
        run: clojure -M:slow-test

  # THE GATE-SCHEDULING AUDIT USED TO LIVE HERE, AND NO LONGER DOES (rf2-k78o2).
  # It asserts that every `test:*` / `bench:*` / `build:*` command in
  # implementation/package.json is either reachable from a workflow or carries a
  # declared, machine-CHECKED disposition saying why not. It landed in this
  # nightly for one reason only: .github/workflows/test.yml was fenced off by an
  # open PR (rf2-eegpw / #7530) the day it was written. That fence is gone, the
  # check measures ~0.3s including interpreter start, and a PR that adds an
  # unscheduled gate should learn so in three minutes rather than twenty-four
  # hours — so it is now `scripts/check_gate_scheduling.py`, running always-on
  # in test.yml's `verify-skill-mcp-drift` repo-invariant job and in
  # scripts/test-fast-pr.sh.
  #
  # It is NOT also kept here. A per-PR always-on gate means main cannot carry a
  # violation for a night, so a nightly arm would re-prove a property already
  # proven on every merge — and a second copy is a second thing to keep in step.

  # rf2-6sg25 — until this job existed, a red nightly told NOBODY. Of the
  # thirty runs ending 2026-08-04, eighteen failed and 2026-07-09..07-21 was
  # thirteen consecutive red nights; the only way to find out was to open the
  # Actions tab. Multiple gates are deliberately nightly-only BECAUSE this
  # workflow is treated as the system of record (TESTING.md), so a system of
  # record that can be red for a fortnight unseen is an instrument that reports
  # nothing and is believed anyway.
  #
  # It alerts on a CHANGE OF FAILURE SIGNATURE, not on failure: at an 18-in-30
  # failure rate a per-run alert would have been muted inside a week, and a
  # muted alert is the original fail-open in a new suit. The thresholds were
  # measured against that real history rather than guessed — see the module
  # docstring of .github/scripts/nightly_failure_alert.py, and reproduce the
  # measurement with its `--replay 30` mode. Over those thirty runs: eighteen
  # red nights, EIGHT notifications, none of them a restatement.
  nightly-result:
    name: Nightly result -> tracking issue
    # ALWAYS, and on green as well as red. `if: failure()` was the obvious
    # shape and is wrong twice over: closing the tracking issue when the
    # nightly recovers is half the contract, and a run cancelled or skipped
    # part-way still has a verdict worth recording.
    #
    # Restricted to the DEFAULT BRANCH so that a `workflow_dispatch` of this
    # workflow from a worker branch — which is exactly how a worker verifies a
    # change to it — cannot file an issue about that branch's own breakage.
    if: ${{ always() && github.ref_name == github.event.repository.default_branch }}
    needs:
      - browser-bundle-and-story-gates
      - template-emitted-app
      - mcp-live
      - mcp-live-windows
      - jvm-slow-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write     # open / edit / close the single tracking issue
      actions: read     # read this run's per-step conclusions
      contents: read    # checkout
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      # A wired alert nobody has ever seen fire is the arming-not-catching
      # pattern one tier up. This arm proves the decision layer still
      # distinguishes a new failure from a known one, a shrinking failure set
      # from a growing one, and a genuine recovery from a flake — every night,
      # before it is trusted to decide anything.
      #
      # `continue-on-error` + the re-raise step at the bottom, rather than a
      # plain failing step, and the reason is this job's own fail-open: a
      # self-test step that ABORTS the job takes the notification down with it,
      # so a broken alerter would be reported by nothing — the exact circularity
      # rf2-6sg25 is about. Ordering it this way means a red self-test still
      # lets the live arm try (a signature is derived from data, not from the
      # arithmetic under test), and the job still ends red so the failure is on
      # the record.
      - name: Alerting self-test (the alert can still fire, and still go quiet)
        id: alert_self_test
        continue-on-error: true
        run: python3 .github/scripts/nightly_failure_alert.py --self-test --verbose

      - name: Open, edit or close the nightly tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/nightly_failure_alert.py \
            --repo "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" \
            --assignee mike-thompson-day8

      - name: Fail the job if the alerting self-test failed
        if: ${{ steps.alert_self_test.outcome == 'failure' }}
        run: |
          echo "The nightly alerting self-test FAILED — the issue this run"
          echo "opened or edited may be wrong. Reproduce with:"
          echo "  python3 .github/scripts/nightly_failure_alert.py --self-test --verbose"
          exit 1
