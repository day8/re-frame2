# Builds and publishes the re-frame2 docs site (rf2-h09k).
#
# Source: docs/core/ (narrative) + spec/ (normative) + spec/API.md (reference).
# Sink:   https://day8.github.io/re-frame2/
#
# PREREQUISITE: the repository's Pages source must be set to "GitHub Actions"
# (Settings → Pages → Build and deployment → Source). If it is still set to
# "Deploy from a branch" the deploy-pages step below will fail.
#
# On `main`, this workflow triggers on docs-affecting pushes (the deploy job
# publishes the site). On pull requests the trigger is UNFILTERED so the
# `Docs required` aggregator posts a status context on EVERY PR (see
# REQUIRED-CHECK SHAPE below); the heavy MkDocs build is re-gated job-side
# to the docs surface. The first publish is a deliberate manual step (run
# via the Actions tab once Pages is configured) — see PR description for
# rf2-h09k.

name: docs

on:
  push:
    branches: [main]
    # Trigger only on paths that actually feed the staged docs site or the
    # link-validator's own fixtures. `skills/**/*.md` and `tools/**/*.md`
    # are deliberately NOT listed — neither tree is copied into docs_dir
    # (see mkdocs_hooks.py: tools/ and skills/ internals are rewritten to
    # GitHub blob URLs precisely because they don't exist in the staged
    # site). The per-skill summary pages that DO render live at
    # docs/skills/X.md and are already covered by `docs/**` (rf2-8k7vm).
    paths:
      - 'docs/**'
      - 'spec/**'
      - 'migration/**'
      - 'mkdocs.yml'
      - 'mkdocs_hooks.py'
      - 'TESTING.md'
      # rf2-2c8zq6 — root-support surfaces the retired-composition gate now
      # scans (README/CHANGELOG/SKILL-REDIRECT/AGENTS/CLAUDE + the JVM gate
      # scripts). Listed so a drift there triggers the gate. (TESTING.md above
      # is already on the surface.)
      - 'README.md'
      - 'CHANGELOG.md'
      - 'SKILL-REDIRECT.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'scripts/test-jvm-implementation.sh'
      - 'scripts/test-jvm-tools.sh'
      - 'scripts/test-fast-pr.sh'
      - 'scripts/test-rigorous-local.sh'
      - 'requirements.txt'
      # (`scripts/check_doc_slugs.py` and its fixtures left this list with the
      # gate itself — rf2-v7fui moved the corpus scan to test.yml's
      # unconditional `verify-readme-links` job, where it needs no path filter
      # to run. Same move, and the same reason, as
      # `scripts/check_inject_cofx_residue.py` below.)
      # rf2-kqac1 — the provenance-pin gate reads docs/design/hicasso/**, which
      # `docs/**` above already arms; this line arms it on its own source, so a
      # change to the checker cannot ship without the checker running.
      - 'scripts/check_provenance_pins.py'
      - 'scripts/check_runtime_subsystem_grading.py'
      # (`scripts/check_inject_cofx_residue.py` and its fixtures left this list
      # with the gate itself — rf2-6ng7 moved it to test.yml's always-on
      # invariant job, where it needs no path filter to run.)
      # rf2-2oqj59 — the failure-corpus co-edit invariant gate scans
      # errors.md + the testbeds tree for a live retired failure spelling
      # (`:where :cofx`). A drift in either the gate, its fixtures, or the
      # testbeds it scans must trigger the docs workflow.
      - 'scripts/check_failure_corpus_residue.py'
      - 'scripts/_test_fixtures/check_failure_corpus_residue/**'
      - 'testbeds/**'
      - 'scripts/check_retired_composition_vocab.py'
      - 'scripts/_test_fixtures/check_retired_composition_vocab/**'
      - 'scripts/check_retired_image_keys.py'
      - 'scripts/_test_fixtures/check_retired_image_keys/**'
      # rf2-yptjt — the warm-allocation non-claim scan reads README/CHANGELOG +
      # docs/** (already armed above) and uses docs/design/** as its positive
      # control. This line arms it on its OWN source, so a change to the gate —
      # including one that loosens the claim pattern until it matches nothing —
      # cannot ship without the gate running. (It builds its fixtures in a
      # throwaway git tree, so there is no fixture directory to arm.)
      - 'scripts/check_allocation_non_claim.py'
      # rf2-lq99wc — the retired-composition gate now scans the per-tool spec
      # trees too; a drift there must trigger the gate.
      - 'tools/**/spec/**'
      # rf2-tzy13 — the live `cljs-rf2` cells run on docs/cljs/playground-rf2.js,
      # which is no longer committed: this workflow BUILDS it (below) and ships
      # what it built. The bundle bakes in re-frame2 core + reagent-slim +
      # machines + flows, so a push touching any of them changes the deployed
      # live-cell engine and must republish. (docs/tools/playground/** — the
      # bundle's own source and build config — is already inside docs/**.)
      - 'implementation/core/**'
      - 'implementation/adapters/reagent-slim/**'
      - 'implementation/machines/**'
      - 'implementation/flows/**'
      - '.github/workflows/docs.yml'
  # PR trigger is intentionally UNFILTERED (see REQUIRED-CHECK SHAPE
  # below). The docs surface is re-applied job-side via the `detect` job.
  pull_request:
    branches: [main]
  workflow_dispatch:

# Two DIFFERENT concurrency concerns share this workflow, so the group is
# event-scoped (rf2-k8l1m).
#
#   push / workflow_dispatch -> group `pages`, never cancel in progress.
#     These are the deploy path. Pages must publish one artifact at a time,
#     so every main push serializes in the single `pages` group exactly as
#     before. A newer main push may still supersede an older PENDING main
#     push — that is correct, because the newer commit contains the older
#     one's history and will deploy it.
#
#   pull_request -> group `docs-pr-<number>`, cancel in progress.
#     PR runs are a build-only regression check: the `deploy` job is gated
#     `if: github.event_name == 'push'`, so a PR run never publishes. Each
#     PR therefore gets its own group, and a new push to that PR supersedes
#     its own older run (the repo-wide idiom — cf. test.yml / lint.yml).
#
# WHY the split, not just a rename: the pull_request trigger above is
# deliberately UNFILTERED, so EVERY open PR entered the `pages` group. GitHub
# keeps at most one running plus one pending run per group and cancels the
# older PENDING run when a newer one arrives — even with
# cancel-in-progress: false. A routine PR docs check could therefore cancel a
# queued main-push DEPLOYMENT before any job started, and because main's push
# trigger is paths-filtered the next commit often did not re-trigger a
# deploy at all. That is exactly how the live playground bundle went stale
# after #6329 (main run 29638598705 cancelled by PR #6330's run 29638609140).
#
# WHAT IS NEWLY PARALLEL: PR docs builds — against each other, and against a
# main deploy. Nothing else. Two Pages deployments still CANNOT overlap: the
# `deploy` job exists only on `push`, and all pushes remain in the single
# uncancelled `pages` group. A PR run's `upload-pages-artifact` is scoped to
# its own run and is never consumed by `deploy-pages`.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('docs-pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Lightweight changed-surface gate (rf2-aemyt). On a pull_request this
  # diffs HEAD against the merge base and lights `docs_surface` only when a
  # path that feeds the staged site changed; on push / dispatch it always
  # lights so the build runs unconditionally (push is already path-filtered
  # above, and a manual dispatch always wants a build). The heavy MkDocs
  # build keys its `if:` on this output, while the always-present aggregator
  # does not — so a docs-irrelevant PR runs only this ~5-second job plus the
  # rollup, and the build skips.
  detect:
    name: Detect docs surface
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      docs_surface: ${{ steps.detect.outputs.docs_surface }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0

      # On a PR, classify the changed-file list against the docs surface.
      # On any non-PR event (push/dispatch) light the gate so the build
      # always runs. Mirrors the git-diff classifier shape used by
      # .github/scripts/report-changed-surfaces.sh in test.yml.
      #
      # This path set is DELIBERATELY NARROWER than the `push.paths` filter
      # above (rf2-tzy13). push.paths gained the four baked-in implementation
      # surfaces so a core/reagent-slim/machines/flows merge republishes the
      # regenerated live-cell bundle; this PR-side classifier must NOT, or every
      # core PR would run a duplicate ~15-minute MkDocs build on top of the
      # tools-playground job in test.yml that already builds + smokes the bundle
      # at PR time. Deploy-time coverage here, PR-time coverage there.
      - name: Classify changed files against the docs surface
        id: detect
        run: |
          if [ "${GITHUB_EVENT_NAME}" != "pull_request" ]; then
            echo "docs_surface=true" >> "$GITHUB_OUTPUT"
            echo "Non-PR event (${GITHUB_EVENT_NAME}): running MkDocs build unconditionally."
            exit 0
          fi
          # Fetch the base branch BY NAME, with no depth cap (rf2-ihfw). Two
          # things make that the right shape. First, this fetch is load-bearing
          # even under the `fetch-depth: 0` checkout above: a pull_request
          # checkout fetches `+<sha>:refs/remotes/pull/N/merge` and never
          # creates refs/remotes/origin/<base>, so this is what puts that name
          # in scope for the three-dot diff below — and it costs almost nothing,
          # because the objects are already local from that checkout.
          # Second, a `--depth` cap here would not merely fetch too little, it
          # would DESTROY history: `git fetch --depth=N` converts a COMPLETE
          # clone into a shallow one, grafting the base branch at N and
          # discarding exactly what `fetch-depth: 0` just paid for. A merge base
          # past that graft then dies `fatal: no merge base` (measured: exit
          # 128). That fails CLOSED — the diff below is unswallowed, so the job
          # reds rather than misclassifying the PR as docs-irrelevant — but a
          # spurious red on a long-lived branch is still worth not having.
          # `provenance-pins` below fetches this same base the same uncapped way.
          git fetch --no-tags origin "${GITHUB_BASE_REF}" >/dev/null 2>&1 || true
          files="$(git diff --name-only "origin/${GITHUB_BASE_REF}...HEAD")"
          docs_surface=false
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              docs/*|spec/*|migration/*|mkdocs.yml|mkdocs_hooks.py|TESTING.md|README.md|CHANGELOG.md|SKILL-REDIRECT.md|AGENTS.md|CLAUDE.md|scripts/test-jvm-implementation.sh|scripts/test-jvm-tools.sh|scripts/test-fast-pr.sh|scripts/test-rigorous-local.sh|requirements.txt|scripts/check_provenance_pins.py|scripts/check_runtime_subsystem_grading.py|scripts/check_failure_corpus_residue.py|scripts/_test_fixtures/check_failure_corpus_residue/*|testbeds/*|testbeds/*/*|scripts/check_retired_composition_vocab.py|scripts/_test_fixtures/check_retired_composition_vocab/*|scripts/check_allocation_non_claim.py|tools/*/spec/*|tools/*/spec/*/*|.github/workflows/docs.yml)
                docs_surface=true ;;
            esac
          done <<< "$files"
          echo "docs_surface=${docs_surface}" >> "$GITHUB_OUTPUT"
          echo "docs_surface=${docs_surface}"

  build:
    name: MkDocs build
    needs: detect
    if: needs.detect.outputs.docs_surface == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      # --- SCI-bundle build-on-publish (rf2-ssxvg1; sole source as of rf2-tzy13)
      #
      # The docs' live `cljs-rf2` cells run on docs/cljs/playground-rf2.js — a
      # shadow-cljs :advanced bundle that bakes in re-frame2 core + reagent-slim
      # + machines + flows + react@19 (the eval engine for every `cljs-rf2`
      # cell). rf2-ssxvg1 made this workflow rebuild it fresh on every publish,
      # because deploying the committed snapshot verbatim let the LIVE cells run
      # stale re-frame2 while main moved on.
      #
      # rf2-tzy13 finished the job: the bundle is no longer committed at all. It
      # is .gitignored and generated at each consumption boundary — here on
      # deploy, and in test.yml's tools-playground job at PR time. The committed
      # snapshot existed only for clean-checkout local convenience, and it cost a
      # repo-wide write lock: every PR touching a baked-in surface had to
      # regenerate the same binary, and two such PRs always conflicted on it.
      # Source/config/locks are now the single authority.
      #
      # THIS BUILD IS THE ONLY SOURCE OF THE DEPLOYED BUNDLE. Nothing is checked
      # out to fall back on, so the steps below must not just build it but prove
      # the built artefact works — see the smoke step.
      #
      # The build needs a JVM + Clojure CLI + Node (the shadow-cljs toolchain),
      # the same setup the tools-playground job in test.yml uses. The esbuild
      # bootstrap bundle (playground.js/.css) is byte-deterministic; the
      # shadow-cljs SCI bundle (playground-rf2.js) is the one that drifts.
      - name: Set up JDK 21 (SCI bundle build)
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js (SCI bundle build)
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '24'

      - name: Set up Clojure CLI (SCI bundle build)
        run: "$GITHUB_WORKSPACE/.github/scripts/install-clojure-cli.sh"

      - name: Cache Maven / gitlibs (playground SCI bundle deps)
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: ${{ runner.os }}-playground-${{ hashFiles('docs/tools/playground/sci/deps.edn', 'docs/tools/playground/sci/shadow-cljs.edn', 'implementation/core/deps.edn', 'implementation/adapters/reagent-slim/deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-playground-
            ${{ runner.os }}-cljs-

      # Rebuild both playground bundles from the checked-out main and overwrite
      # the working-tree docs/cljs/playground*.js. `npm ci` installs from the
      # committed lockfile (reproducible); `npm run build` runs the esbuild
      # bootstrap + the sci/ shadow-cljs :advanced re-frame2 bundle (`build:rf2`
      # runs `npm install` inside sci/ for react/react-dom + shadow-cljs). The
      # rebuilt files land before the "Stage spec/ + migration/" + "Build site
      # (strict)" steps below, so MkDocs copies the FRESH bundle into site/.
      - name: Rebuild playground bundles fresh from main
        working-directory: docs/tools/playground
        run: |
          npm ci
          npm run build

      # Fast structural pre-check on the freshly-built SCI bundle before the
      # (heavier) Chromium smoke below. A build that "succeeded" but emitted a
      # wrong/empty artefact would otherwise ship a dead live-cell engine.
      - name: Verify freshly-built SCI bundle is a valid re-frame2 build
        run: |
          f=docs/cljs/playground-rf2.js
          if [ ! -s "$f" ]; then
            echo "::error::$f missing or empty after build — the SCI bundle build failed."
            exit 1
          fi
          if ! grep -q "rf2sci" "$f"; then
            echo "::error::$f does not export rf2sci after build — wrong artefact."
            exit 1
          fi
          echo "Freshly-built SCI bundle OK ($(wc -c < "$f") bytes)."

      # --- Smoke the artefact that actually ships (rf2-tzy13 amendment) --------
      #
      # This is the deploy path's runtime gate, and it is NOT redundant with the
      # PR-time tools-playground job:
      #
      #   - PRs merge by REBASE, so PR CI validated the pre-rebase tree, not the
      #     tree that lands on main. Runtime composition of the merged tree was
      #     only ever proven by the post-merge canary, which rf2-tzy13 retires.
      #   - the structural pre-check above is a non-empty + rf2sci grep. It
      #     cannot catch a bundle that is well-formed but throws at render (the
      #     EP-0024 / rf2-qhu72t class, where a renamed frame provider made the
      #     mount shape invalid against current core).
      #   - expensive-tests.yml runs no playground job at all.
      #
      # Running the smoke HERE, after the build and before `mkdocs build` stages
      # site/, means the artifact that ships is the artifact that was smoked —
      # the invariant lives at the exact consumption boundary. Scoped to non-PR
      # events: on a PR the docs build is a regression check that never deploys,
      # and tools-playground already smokes the bundle at PR time. This also
      # keeps main-push CI at ONE heavy bundle build instead of two.
      #
      # rf2-169n — cache the Playwright browser binary. This step runs under
      # docs/tools/playground, so `npx` resolves THAT tree's Playwright
      # (^1.60.0 → 1.60.0), not implementation's pinned 1.59.1 — so the key
      # hashes the playground's own lockfile. Keying it on
      # implementation/package-lock.json would bust this cache on a bump it
      # does not care about and leave it stale across the bump that matters.
      # No bare `-playwright-` restore fallback here, so an implementation
      # browser tree is never restored into this job. (The reverse can happen
      # on an implementation-lock bump; it is harmless — the install step
      # always runs, and Playwright only ever uses the exact revision
      # directory its own version asks for.) On a hit that install still runs
      # `--with-deps`: the apt system libraries live outside
      # ~/.cache/ms-playwright and are not cacheable. Only the browser
      # DOWNLOAD is skipped — which is the hop that failed in rf2-swos.
      # Same `if:` as the install step it fronts, so PR runs neither restore
      # nor save a cache for a smoke they do not run.
      - name: Cache Playwright browser binary
        if: github.event_name != 'pull_request'
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-playground-${{ hashFiles('docs/tools/playground/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-playground-

      - name: Install Playwright (Chromium + system deps)
        if: github.event_name != 'pull_request'
        working-directory: docs/tools/playground
        run: npx playwright install --with-deps chromium || "$GITHUB_WORKSPACE/.github/scripts/playwright-install-failed.sh"

      - name: Smoke the built bundles under headless Chromium
        if: github.event_name != 'pull_request'
        working-directory: docs/tools/playground
        run: npm run smoke

      # Stale-bootstrap detection on the POST-REBASE tree (rf2-tzy13). The
      # esbuild bootstrap (playground.js/.css) is still committed and is
      # byte-deterministic across platforms, so after the rebuild above a
      # non-empty diff means the committed bootstrap does not match its source —
      # a drift that PR CI could miss because it validated the pre-rebase tree.
      # The SCI bundle is deliberately NOT diffed: it is untracked and
      # .gitignored, and its Closure symbol allocation is not cross-machine
      # reproducible anyway.
      - name: Verify committed esbuild bootstrap matches the fresh build
        if: github.event_name != 'pull_request'
        run: |
          if ! git diff --exit-code -- docs/cljs/playground.js docs/cljs/playground.css; then
            echo "::error::Committed docs/cljs/playground.{js,css} are stale on main — run 'npm run build:bootstrap' in docs/tools/playground and commit the rebuilt bundles."
            exit 1
          fi
          echo "Committed esbuild bootstrap matches a fresh build."

      # Cairo + Pango system libraries for Material's `social` plugin (rf2-orxjj).
      # The plugin's image backend (CairoSVG, pulled in by material[imaging] in
      # requirements.txt) links against these native libs to rasterise the
      # OpenGraph/Twitter cards. Without them card generation throws at build
      # time. This is the load-bearing CI change — it is what lets `CI=true`
      # actually generate cards (the `social.cards: !ENV [CI, false]` gate in
      # mkdocs.yml). Package list per Material's "Setting up social cards" docs.
      - name: Install imaging system libraries (Cairo + Pango)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libcairo2-dev libfreetype6-dev libffi-dev libjpeg-dev \
            libpng-dev libz-dev libpango-1.0-0 libpangocairo-1.0-0

      - name: Install MkDocs + plugins
        run: pip install -r requirements.txt

      # THE MARKDOWN LINK + ANCHOR VALIDATOR IS NO LONGER HERE (rf2-v7fui).
      # `scripts/check_doc_slugs.py` validates that every in-repo markdown
      # link resolves — target .md file (rf2-unge8) and heading-slug anchor
      # (rf2-sefq) — across docs, spec, SKILLS and migration.  It ran in this
      # job, behind `docs_surface`, whose case list does not carry `skills/*`;
      # so one of its four scan roots sat outside its own arming and a
      # skills-only PR ran it nowhere.  It now runs UNCONDITIONALLY in
      # test.yml's `verify-readme-links` job, beside the companion gate that
      # shares its slugifier and already installs pymdown-extensions for it.
      # Moved, not copied: two scheduled homes would be two things to drift.
      #
      # Nothing is lost here.  The failure mode this job wanted — "this PR
      # broke a doc link", not "mkdocs emitted a warning" — still holds, and
      # arrives EARLIER, because the unconditional job does not wait on the
      # apt-get and pip install above.  Strict mode likewise survives the move
      # (rf2-ftkz swept the 26 broken anchors main carried at landing, so the
      # gate is fail-loud wherever it runs).

      # docs/EP/README.md restates each EP's `Status:` line in its index
      # table; the two drift by hand (EP-0001 sat at `accepted` while the
      # index still said `proposal`). This guard fails the build when an
      # index status no longer matches its EP. It already runs in the PR-gate
      # spine (scripts/test-fast-pr.sh); this mirrors that here so CI enforces
      # it too (rf2-bxsnp7). See scripts/check_ep_status_sync.py.
      - name: Validate EP README status-sync
        run: python scripts/check_ep_status_sync.py --verbose

      # EP-0006's Runtime Subsystem Contract pins every reserved `:rf.runtime/*`
      # subsystem key (spec/Conventions.md §Reserved runtime-db keys) to a
      # complete five-clause grading subsection in spec/Runtime-Subsystems.md
      # §Grading table. The two surfaces drift by hand (PR #3817 had to hand-add
      # the `:rf.runtime/mutations` grading row after the key was reserved). This
      # guard fails the build on a missing/extra key, an omitted/out-of-order
      # clause, or an ungraded clause. It runs in the PR-gate spine
      # (scripts/test-fast-pr.sh); this mirrors it in CI (rf2-ba5acq). Self-test
      # first (proves the guard fires on each drift shape), then the live scan.
      - name: Self-test the runtime-subsystem grading validator
        run: python scripts/check_runtime_subsystem_grading.py --self-test --verbose

      - name: Validate runtime-subsystem grading-table coherence
        run: python scripts/check_runtime_subsystem_grading.py --verbose

      # THE inject-cofx RESIDUE GATE MOVED OUT OF THIS JOB (rf2-6ng7). It
      # scanned `docs/core`, `docs/api`, `spec/` AND `skills/` — and `skills/`
      # is not on this workflow's documentation surface, in either the
      # `push.paths` filter or the PR-side `detect` classifier, so a skills-only
      # edit reintroducing a live `(rf/inject-cofx …)` snippet ran the gate
      # nowhere. Widening the surface to `skills/**` would have bought that with
      # a ~15-minute MkDocs build on every skills PR; the gate is instead
      # unconditional in test.yml's `verify-skill-mcp-drift` job, where its
      # ~0.3s of pure-Python stdlib cannot be skipped past at all. Same remedy
      # as the hicasso complaint-catalogue and budget-ledger gates before it.
      # See `.github/workflows/test.yml`, step id `check_inject_cofx_residue`.

      # rf2-2oqj59 — the failure corpus (docs/core/errors.md + the
      # failure testbeds) is a TEACHING corpus for the Spec 009 error
      # catalogue. Spec 009 binds the catalogue ROWS to the feature specs by
      # a co-edit invariant; this gate widens that invariant to the corpus by
      # firing when a KNOWN-RETIRED failure spelling (`:where :cofx`, retired
      # in EP-0017 for the halting `:rf.error/cofx-value-invalid`) reappears
      # as LIVE teaching (a fenced markdown value, or live testbed source —
      # removed-context prose, inline spans, `;` comments, and docstrings are
      # masked). Self-test first (proves the gate fires on each live shape +
      # stays green on every removed-context counterpart), then the live scan.
      # See scripts/check_failure_corpus_residue.py.
      - name: Self-test the failure-corpus residue gate
        run: python scripts/check_failure_corpus_residue.py --self-test --verbose

      - name: Validate no live retired failure spelling in the corpus
        run: python scripts/check_failure_corpus_residue.py --verbose

      # EP-0023 (image-loaded frames) retired the EP-0013 app/realm/module
      # construction + install + inspection vocabulary from the public facade
      # in favour of image -> frame -> event stream. The `pl97nd` epic scrubbed
      # it repo-wide (facade exports, spec/API rows, doc/skill teaching
      # surface). This guard keeps the scrub done: it scans docs/core,
      # docs/EP, spec/, and skills/ markdown for the retired symbols as LIVE
      # copy-pasteable public API (inside fenced code blocks), and (rf2-2c8zq6)
      # the root-support surfaces the dir scan misses — README.md, TESTING.md,
      # CHANGELOG.md, SKILL-REDIRECT.md, AGENTS.md, CLAUDE.md, and the JVM gate
      # scripts (scripts/test-*.sh) — for the retired ARCHITECTURE prose phrases
      # "event[- ]program" / "realm[- ]routing" (removed-context mentions stay
      # green). rf2-lq99wc extends the scan to the per-tool spec trees
      # (tools/*/spec) and adds a DELETED-SUBSTRATE-as-live prose family — a
      # "retained internal substrate" claim or a deleted-namespace read
      # (re-frame.realm/* / re-frame.app-value/* / re-frame.migration/migration-map)
      # named as a current seam (removed-context mentions stay green; the Xray/
      # Story panel `install!` convention is exempted on the tool-spec surface).
      # All with a narrow
      # self-documenting file allowlist for the historical / internal surface
      # (the EP docs, the migration skill, the implementor/Pair/Xray tooling
      # skills that reference the now-deleted realm/app/module substrate
      # (EP-0024 removed it in full), and the spec
      # meta-docs that map the removal). Removed-context prose + inline code
      # spans + masked `;` comments never fire; a `re-frame.*/`-qualified
      # internal read or an app's own `counter/install!` hook is not the retired
      # `rf/` facade and never fires. Self-test first (proves the gate fires on
      # each live shape + stays green on every sanctioned counterpart + the
      # allowlist exemption), then the live scan. See
      # scripts/check_retired_composition_vocab.py.
      - name: Self-test the retired composition-vocabulary gate
        run: python scripts/check_retired_composition_vocab.py --self-test --verbose

      - name: Validate no live retired app/realm/module composition vocabulary
        run: python scripts/check_retired_composition_vocab.py --verbose

      # EP-0026 (rf2-dlvmpc) RETIRED five EP-0023 image source keys + the three
      # image-capability surfaces with fail-loud rejection. The public rf/image
      # value now accepts only :id / :select-ns / :registrations; composition
      # resolves by image order; standards are protected; image-declared host
      # capabilities are removed end-to-end. This guard keeps the retirement
      # done: it scans the doc/teaching markdown (fenced code) AND the Clojure
      # source (implementation/tools/examples/skills, string literals + comments
      # masked) for the EXACT retired spellings — :include-ns / :exclude-ns /
      # :replace / :replace-standard / :rf.image/requires / :rf.gen/requires /
      # make-frame :capabilities — as LIVE, copy-pasteable API. It is SCOPED to
      # those exact tokens and NEVER matches the bare word "capability": the
      # :rf.capability/* host-service vocabulary, conformance capability ids, and
      # tool capability flags (incl. describe-image's :include-ns tool ARG) are
      # untouched. Removed-context prose + inline spans + masked docstrings/
      # comments never fire; :include-ns/:exclude-ns/:replace fire only in
      # image/make-frame proximity. docs/EP/** is the allowlisted historical
      # record. Self-test first (proves each live shape fires + every sanctioned
      # counterpart stays green), then the live scan. See
      # scripts/check_retired_image_keys.py.
      - name: Self-test the retired EP-0026 image-key gate
        run: python scripts/check_retired_image_keys.py --self-test --verbose

      - name: Validate no live retired EP-0026 image keys
        run: python scripts/check_retired_image_keys.py --verbose

      # The warm-allocation NON-CLAIM scan (rf2-hic-072, wired by rf2-yptjt).
      # specification.md section 6 registers one sentence — "no allocation claim
      # publishes until a fitted series clears the registered quality floor" —
      # and this gate is that sentence, executable. No fitted series clears it
      # (rf2-2rtt6.139, rf2-2rtt6.140, rf2-e9wr each measured a different leg of
      # why), so the obligation is NEGATIVE and the failure it catches is
      # somebody reaching for one of those refused figures to fill a cell that
      # wants a number. It shipped unwired because .github/workflows/** was held
      # when it landed, and present-but-unenforced is the WEAKEST of the three
      # states — worse than absent, because it reads as covered.
      #
      # IT BELONGS IN THIS JOB rather than beside the provenance-pin gate below,
      # and the two are less alike than they look: that one needs `fetch-depth:
      # 0` and reads docs/design/hicasso, which is why it is a job of its own,
      # while this one derives its corpus from `git ls-files` and reads the
      # PUBLICATION surface — root README/CHANGELOG plus docs/** OUTSIDE
      # docs/design. Its real siblings are the four repo-wide markdown scans
      # directly above, which is why it sits with them: same shape, same
      # self-test-then-live pair, no extra runner, ~0.4s.
      #
      # NEITHER STEP MAY BE SOFTENED, and this gate is unusually easy to defeat
      # by kindness. It fires on a per-write BYTE FIGURE rather than on the word
      # "allocation", because a word-scan is a gate authors reword their way
      # around; it PASSES a figure whose own paragraph carries the refusal, so
      # the rule is "no claim without its qualification" and not "no digits"; it
      # uses the design record as a POSITIVE CONTROL and reds if the pattern
      # matches nothing there, because an absence check over a corpus it never
      # really read is a green that means nothing; and it FAILS ON ITS OWN
      # PREMISE — if budgets.md's S7 row or evidence-baseline.md's warm-
      # allocation row stops recording the floor as unmet, the scan reds asking
      # for re-authorisation, because a guard enforcing a retired rule is worse
      # than no guard. That last property is a RETIREMENT SIGNAL wearing a red,
      # so a `continue-on-error` here would hide precisely the message the gate
      # exists to raise. The self-test proves each of those behaviours in a
      # throwaway git tree, naming its cases as it runs; running it first is
      # what stops the live scan's green from meaning "the pattern no longer
      # matches anything". HOW MANY cases is deliberately not written here, for
      # rf2-93u6's reason — a count kept in this file is linked to nothing that
      # would update it, so the next correction is already scheduled.
      - name: Self-test the warm-allocation non-claim scan
        run: python scripts/check_allocation_non_claim.py --self-test

      - name: Validate no unqualified warm-allocation claim on the publication surface
        run: python scripts/check_allocation_non_claim.py

      # Stage the spec/ + migration/ trees under docs/ so MkDocs (which
      # requires docs_dir to be a child of the config file) can see them.
      # The local equivalent is `cp -r spec docs/spec && cp -r migration
      # docs/migration` before `mkdocs build`. The staged copies are
      # .gitignored — never commit them.
      - name: Stage spec/ + migration/ into docs/
        run: |
          rm -rf docs/spec
          cp -r spec docs/spec
          rm -rf docs/migration
          cp -r migration docs/migration

      # --strict escalates MkDocs WARNINGs to a non-zero exit (rf2-eq90w):
      # nav entries pointing at missing files (nav.not_found), unresolved
      # internal links MkDocs can see, and plugin warnings now fail the
      # build instead of slipping through. This is complementary to the
      # check_doc_slugs.py gate above, which validates markdown-link
      # target+anchor drift the WARNING set does not cover.
      - name: Build site (strict)
        run: mkdocs build --strict

      - name: Upload Pages artifact
        # v5 (transitively pins actions/upload-artifact to a SHA, which v3 did not — see rf2-xmmh).
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site/

  # ---------------------------------------------------------------------------
  # Provenance pins (rf2-kqac1), following rf2-owq6p's census.
  #
  # This repo rebase-merges, which mints a new SHA for every commit on the
  # branch, so a Hicasso page that pins a measurement to the SHA it was authored
  # at is stranded the moment its own PR lands: the object is reachable from no
  # ref and is absent from a fresh clone, and the page's verifiability claim
  # fails without saying so.  The rule is ACCOMPANIMENT — a cited authored head
  # must share its block with a SHA that IS an ancestor of origin/main — and
  # deliberately not "no authored heads", which would red the pages that retain
  # the head on purpose beside a landed one.
  #
  # It is a JOB OF ITS OWN because it needs `fetch-depth: 0`, and for a reason
  # that is easy to get wrong: the gate asks `merge-base --is-ancestor` about
  # SHAs months old, so a shallow or depth-limited clone would answer "not an
  # ancestor" for pins that are perfectly landed and red the whole corpus.  The
  # MkDocs build next door does not need that history and should not pay for it.
  #
  # SCOPED TO CHANGED PAGES on purpose, and the reason has CHANGED once already
  # — so read this paragraph as two reasons, one expired and one standing.
  #
  # THE EXPIRED ONE was cost of entry: the corpus still carried the stranded
  # pins the census catalogued and left standing, so a full-corpus gate would
  # have been red on main from the day it landed.  rf2-g7m6y worked that backlog
  # off (PR #8246); the full run is now exit 0 over the whole corpus, so that
  # objection no longer holds and is no longer why this job is scoped.
  #
  # THE STANDING ONE is blast radius.  Full-corpus HERE would couple every
  # future hardening of the checker to a corpus-wide repair — and the gate
  # refuses to re-pin by design, so each repair needs a human.  That is the
  # "punish the careful ones and be routed around within a week" pressure the
  # checker's own docstring names, and it would red docs PRs on pages they did
  # not touch.  Cost was never the discriminator (a full run measures ~50s).
  #
  # WHAT COVERS THE REST.  Scoping cannot see a page nobody edits, and the
  # checker gains rules often — each one reclassifying the whole corpus.  So the
  # full-corpus run is SCHEDULED rather than dropped: `.github/workflows/lint.yml`
  # runs `python scripts/check_provenance_pins.py` (no flag) on its nightly cron
  # and on push to main (rf2-qpk2l).  Locally, that same command is the audit.
  provenance-pins:
    name: Provenance pins
    needs: detect
    if: needs.detect.outputs.docs_surface == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          # Full history: see the note above — a truncated one makes landed
          # pins look stranded.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'

      - name: Self-test the provenance-pin checker
        run: python scripts/check_provenance_pins.py --self-test --verbose

      - name: Check provenance pins on changed pages
        run: |
          set -euo pipefail
          if [ -z "${GITHUB_BASE_REF:-}" ]; then
            # A push build has no base branch, so "the pages this change
            # touches" is undefined.  The self-test above still ran, so this
            # job is not a no-op; say so rather than implying a corpus verdict.
            echo "No base ref (${GITHUB_EVENT_NAME}) — the changed-page gate is a"
            echo "pull-request check. Self-test above covered the checker itself."
            exit 0
          fi
          git fetch --no-tags origin "${GITHUB_BASE_REF}"
          python scripts/check_provenance_pins.py \
            --changed-since "origin/${GITHUB_BASE_REF}" --verbose

  deploy:
    # Only deploy from main pushes — PRs run build only (catch regressions) but don't deploy.
    if: github.event_name == 'push'
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5.0.0

  # ---------------------------------------------------------------------------
  # Required-checks aggregator (rf2-aemyt).
  #
  # ONE stable status context — `Docs required` — that is ALWAYS present on
  # every PR (the workflow's pull_request trigger is unfiltered) and that
  # passes iff the MkDocs build job either passed or was surface-skipped.
  # This is the single docs context the branch ruleset should require: a
  # docs-irrelevant PR skips the build (no signal, OK), but the moment the
  # build reports `failure`/`cancelled` the aggregator goes red and blocks
  # the merge — so a broken link or a strict-mode MkDocs warning can no
  # longer slip in on a PR that happens to touch docs paths.
  #
  # `if: always()` is mandatory — without it the aggregator would itself be
  # skipped whenever the build skips, and a skipped required check never
  # satisfies the ruleset. The pass/fail decision reads `needs.*.result`:
  # `success` and `skipped` are acceptable; `failure` and `cancelled` are
  # not. The `deploy` job is deliberately NOT in `needs:` — it runs only on
  # push, never on a PR, so it carries no PR-time signal.
  # ---------------------------------------------------------------------------
  docs-required:
    name: Docs required
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - detect
      - build
      # rf2-kqac1 — a gate nothing aggregates is a gate nobody has to pass.
      - provenance-pins
    steps:
      - name: Fail if the docs build failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "::error::A required docs.yml job reported failure or cancelled — blocking merge."
          echo "needs results: ${{ join(needs.*.result, ', ') }}"
          exit 1

      - name: Docs build passed or was skipped
        run: echo "The MkDocs build that ran passed (a surface-skipped build is OK)."
