name: freehand bench

# The B-spine's scheduled/release lane (D021).
#
# WHY THIS IS NOT A PULL-REQUEST WORKFLOW
#
# D021 splits the harness's own work in two, and the split maps onto two
# different CI shapes:
#
#   - the DETERMINISTIC part — the harness's two-way falsifiability proof —
#     is stable, sub-second, needs no browser and no pinned hardware. It is
#     the "small smoke subset on pull requests if stable" the decision
#     allows, and it is already required on every PR WITHOUT a job here:
#     it ships as ordinary tests in implementation/freehand/test, which the
#     required `JVM freehand (clojure -M:test)` job and the required `cljs`
#     node-test job both run. A second workflow asserting the same thing
#     would be a duplicate that can only ever be advisory — `needs:` cannot
#     span workflow files, so a job here is unreachable from
#     `all-required-passed`. That is the exact trap the standalone
#     freehand-artefact.yml fell into and was deleted for.
#
#   - the NOISY part — running workloads and publishing their wall-clock and
#     byte distributions — is what this workflow owns. D021: "Run noisy full
#     B1–B5 timing on a pinned scheduled/release worker." Nothing here gates
#     a merge, because nothing here is allowed to: timing and byte
#     distributions are published evidence with no automatic numeric
#     pass/fail.
#
# AND YET THIS FILE IS LOAD-BEARING FOR THE MERGE GATE (rf2-vyqq). Nothing in
# it gates a merge; DELETING it reds something that does, and the file said so
# nowhere. `scripts/check_gate_scheduling.py` requires every `test:` / `bench:`
# / `build:` script in `implementation/package.json` to be reachable from an
# executable `run:` in some workflow, or to carry a checked `DISPOSITIONS`
# entry. FOUR are reachable from here and from nowhere else:
#
#   bench:freehand-browser   the browser lane's run step
#   bench:freehand-node      the ClojureScript lane's run step
#   build:freehand-matched   B5's matched-pair build
#   test:freehand            B5's capture step
#
# `test.yml` NAMES the last two in prose, which is precisely what that checker
# stopped counting under rf2-6ckzl — a `run:` deleted while its paragraph stays
# put is how a gate loses its home in the first place. A fifth script,
# `clean:freehand-matched`, is sole-homed here too and goes unremarked only
# because its prefix is outside the scanned families.
#
# That checker runs as a step of `test.yml`'s `verify-skill-mcp-drift` job,
# which is a `needs:` of `all-required-passed` — and `All required checks
# passed` is one of the three status contexts the branch ruleset on `main`
# requires. Read off the ruleset rather than off a PR rollup, where every
# workflow that ran appears whether required or not: `gh api
# repos/day8/re-frame2/rules/branches/main` returns that context, `Lint
# required` and `Docs required`, and `gh api
# repos/day8/re-frame2/branches/main/protection` returns 404, so no classic
# branch protection adds a fourth. This workflow's own job names are NOT among
# them and cannot be — `needs:` does not span workflow files, as the bullet
# above says. The coupling is the file's EXISTENCE, not its results.
#
# So a PR deleting this file and nothing else reds a required check the moment
# it lands on main, and blocks every open PR until it is fixed. Loud, not
# silent — but discovered on CI rather than here, which is the only reason this
# paragraph exists.
#
# A RETIREMENT PR THEREFORE REMOVES THIS FILE AND THOSE SCRIPTS TOGETHER, in
# one commit, and two more things travel with them: the `bench:hicasso`
# disposition in that same checker gives its reason as "its sibling
# `bench:freehand-browser` DOES yield a verdict, which is why that one is
# scheduled (freehand-bench.yml)" — a bare `not-a-gate` declaration, so it rots
# rather than reddens — and `implementation/scripts/
# _rigorous-local-inventory.test.cjs` pins three claims about this file being
# those commands' sole scheduled home.
#
# AND THE BUILD ID GOES TOO, or the removal trades one red for another.
# `implementation/scripts/_browser-dom-lane-partition.test.cjs` holds
# `:browser-test-freehand-bench` to having an executor (rf2-j8os), and
# `bench:freehand-browser` IS that executor. That red is deliberate: the seven
# `re-frame.freehand.bench.*` DOM suites run in a browser HERE and nowhere else
# in CI, because `:browser-test` excludes them by negative lookahead
# (rf2-mf4uy), so retiring their runner without deciding what becomes of them
# is the one outcome nothing else would have announced. The staged order lives
# in rf2-8z9q; this comment does not authorise any part of it.
#
# THE PIN. `runs-on` names an explicit runner image rather than
# `ubuntu-latest`, and `RF2_HARDWARE_CLASS` names the class the numbers may
# be compared within. Successive results are only comparable because both
# are held still; a floating image would silently re-baseline the evidence
# under the same name. The class is CONFIGURED here and DETECTED otherwise
# (re-frame.freehand.bench.provenance/detect-hardware-class) — a result
# record never carries a literal naming one machine.
#
# WHAT RUNS TODAY. B1–B5 are separate slices and each registers its
# workloads when the implementation that can run them lands, so the suite
# grows as the programme does. The falsifiability proof runs here too — not
# as a duplicate of the PR gate but because a harness whose gate direction
# has rotted would otherwise publish evidence nobody should trust.
#
# THREE LANES, ONE HARNESS. `clojure -M:bench` is a JVM process and reaches
# every `.cljc` workload; the React arm measures the interpreted React
# emitter, which is ClojureScript-only; and B2's mounted storm, B4's latency
# row and B5's initial-mount reading only exist in a real browser. So there
# are three jobs below running the same registry, the same provenance record
# and the same gate/evidence split, each uploading what it published. They
# are separate artefacts because they are separate hosts — a result record
# names its own `:host` and `:build`, and pooling a Chromium number with a
# V8 `:none` one or a JIT-warmed JVM one would be the pooling D021 forbids
# — but ONE harness, because a second report shape is a second place a
# threshold could be added. The ClojureScript lane uploads two: its standing
# registry run, and B5's matched-build row, whose subject is three
# `:advanced` bundles rather than the process measuring them.
#
# WHAT THE BROWSER CANNOT READ. A page has no environment and no git, so
# every environment-derived provenance field a mounted workload publishes
# has to arrive at BUILD time, through the closure-defines
# `re-frame.freehand.bench.provenance` documents. Two fields do:
# `RF2_REVISION` (which commit the bundle was compiled from) and
# `RF2_HARDWARE_CLASS` (which class its numbers may be compared within).
# The browser lane's build reads BOTH via `#shadow/env`; this workflow sets
# the first to `github.sha` and the second to the same class the sibling
# lanes configure. Setting them in a job's `env:` alone configures the
# RUNNER, not the page — which is exactly how this lane's first run
# published thirteen correctly-revisioned records that all named
# `:developer-workstation`.
#
# So the lane asserts on WORDS, never on numbers: a record that cannot name
# its revision, or that names a machine class the lane is not, has failed
# at the one job evidence has. A distribution that moved has not.

on:
  schedule:
    # 05:41 UTC, comfortably clear of the 15:17 expensive-tests cron so the
    # two never contend for the same shared-runner capacity.
    - cron: "41 5 * * *"
  workflow_dispatch:

concurrency:
  group: freehand-bench-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  evidence:
    name: Freehand B-spine evidence (pinned worker)
    # PINNED, deliberately. See THE PIN above.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: implementation/freehand
    env:
      # The class these numbers may be compared within — configured, not
      # detected, because this runner is the pinned one.
      RF2_HARDWARE_CLASS: release-worker
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Clojure CLI
        run: "$GITHUB_WORKSPACE/.github/scripts/install-clojure-cli.sh"

      - name: Cache Maven / gitlibs
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: ${{ runner.os }}-clj-freehand-${{ hashFiles('implementation/freehand/deps.edn', 'implementation/core/deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-clj-freehand-
            ${{ runner.os }}-clj-

      # The harness's own gate, and the ONLY thing in this workflow that may
      # fail it. Both directions of D021's asymmetry, asserted about exit
      # codes rather than about milliseconds.
      - name: Prove the gate/evidence asymmetry both ways
        run: clojure -M:bench --prove

      # Evidence. Stdout is valid EDN (the human summary rides as `;;`
      # comments), so the artefact and the thing a reviewer reads are the
      # same bytes. A violated DETERMINISTIC property still reds this step —
      # that is what a gate is — but no distribution can, however far it
      # moves.
      - name: Run the evidence suite and publish the result records
        run: |
          mkdir -p out
          clojure -M:bench > out/freehand-bench.edn
          cat out/freehand-bench.edn

      - name: Upload the result records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: freehand-bench-${{ github.sha }}
          path: implementation/freehand/out/freehand-bench.edn
          if-no-files-found: error
          retention-days: 90

  # The ClojureScript half of the same suite. See THREE LANES, ONE HARNESS
  # above: this job adds a host, not a harness.
  #
  # It carries TWO Node readings. The first is the standing registry run
  # (`bench:freehand-node`). The second is B5's MATCHED BUILD row
  # (rf2-x4jda): three `:advanced` release bundles measured for bytes and
  # parse/compile, plus the byte delta between the interpreted and compiled
  # shapes. Those bundles are artefacts nothing else in CI builds, and the
  # two B5 Node tests SKIP when they are absent — so until this job built
  # them the matched figures existed only in a developer's terminal and a
  # pull-request body, which is not a durable publication with provenance.
  react-evidence:
    name: Freehand B-spine evidence — ClojureScript lane (pinned worker)
    # PINNED for the same reason the JVM lane is. See THE PIN above.
    runs-on: ubuntu-24.04
    # Room for three `:advanced` compiles on top of the two Node runs.
    timeout-minutes: 35
    defaults:
      run:
        working-directory: implementation
    env:
      # The same configured class, so the two lanes' records are labelled
      # with the same comparability claim about the machine — the HOST
      # difference between them stays visible in `:host`, where it belongs.
      RF2_HARDWARE_CLASS: release-worker
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: implementation/package-lock.json

      - name: Cache Maven / gitlibs (shadow-cljs deps)
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: ${{ runner.os }}-cljs-${{ hashFiles('implementation/shadow-cljs.edn', 'implementation/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-cljs-

      - name: npm install
        run: npm ci

      # `--silent` and the script's own `>&2` keep npm's banner and the
      # shadow-cljs compile chatter off stdout, so the redirected bytes are
      # the EDN artefact and nothing else. The lane refuses to publish at
      # all if the ClojureScript-only workloads stopped registering.
      - name: Run the ClojureScript evidence lane and publish its result records
        run: |
          mkdir -p out
          npm run --silent bench:freehand-node > out/freehand-bench-node.edn
          cat out/freehand-bench-node.edn

      - name: Upload the ClojureScript result records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: freehand-bench-node-${{ github.sha }}
          path: implementation/out/freehand-bench-node.edn
          if-no-files-found: error
          retention-days: 90

      # B5's build row: TWO MATCHED ARMS and one REPRESENTATIVE mixed bundle,
      # which is D021's B5 row read as written ("representative interpreted,
      # compiled, and mixed production bundles", plus a per-promoted-view
      # delta). Only the pair is matched — one source in two states, same
      # `:advanced`, same `goog.DEBUG` — and the delta is taken over the pair
      # alone, because a delta needs two arms held still against each other and
      # never needed three. `:freehand-release` is the SHIPPED-COST artefact,
      # built from its own entry with its own ids: measured here for the
      # headline absolute, deliberately not byte-matched, and
      # `interpreted < mixed < compiled` is NOT a lowering series (rf2-rhg4q).
      #
      # What the pair's delta is attributable to depends on the encoding, and
      # the published fixture says so per encoding rather than claiming "only
      # lowering" across the board: raw is exact (the arms' identity tokens are
      # the same length, and the measurement test proves the raw delta
      # invariant under renaming them), gzip is exact to within a handful of
      # bytes, and brotli is identity-sensitive at the hundred-byte scale. See
      # re-frame.freehand.bench.b5/causal-isolation.
      #
      # Through the npm script, not a bare `npx shadow-cljs release` over the
      # three ids: the script clears the three shapes' build caches and output
      # dirs first, which is what pins the posture the published delta is
      # measured under (re-frame.freehand.bench.b5/matched-build-posture,
      # rf2-hce4p). This runner has no .shadow-cljs cache to clear, so the
      # clearing is a no-op here — which is the point. CI's figure used to be
      # stable only because of that, an unstated property of this job's cache
      # configuration; now it is stable because the entry point says so, and
      # a local re-measurement gets the same number instead of a different one.
      - name: Build the matched pair and the mixed shipped-cost bundle
        run: npm run build:freehand-matched

      # `test:freehand` is the artefact here: the B5 rows publish their
      # records to stdout as `;;`-headed EDN, exactly as the sibling lanes
      # do, and the transcript around them is the run that produced them.
      - name: Measure the matched bundles and capture the B5 records
        env:
          # Node can read this one at run time, unlike the browser lane —
          # set explicitly so the record does not depend on GITHUB_SHA
          # happening to be exported.
          RF2_REVISION: ${{ github.sha }}
        run: |
          status=0
          npm run test:freehand > out/freehand-bench-b5.log 2>&1 || status=$?
          grep -A1 '^;; B5' out/freehand-bench-b5.log || true
          tail -5 out/freehand-bench-b5.log
          exit $status

      # PROVENANCE, not numbers — the same law the browser lane keeps. Two
      # ways this row can quietly publish nothing, and both red here: a run
      # that could not name its revision (every record prints NOT CITABLE),
      # and a run where the bundles were not built (both B5 tests SKIP, the
      # log is green, and no matched figure exists). The second is exactly
      # what happened before this job built them, so the floor counts the
      # three shapes rather than trusting the exit code.
      - name: Refuse to publish unattributable or absent B5 evidence
        run: |
          log=out/freehand-bench-b5.log
          if grep -q 'NOT CITABLE' "$log"; then
            echo "The B5 row published unattributable evidence:" >&2
            grep -n 'NOT CITABLE' "$log" >&2
            echo "RF2_REVISION was '${RF2_REVISION}'." >&2
            exit 1
          fi
          shapes=$(grep -c 'B5 release shape' "$log" || true)
          if [ "$shapes" -ne 3 ]; then
            echo "Expected 3 release-shape records, found ${shapes}. The B5" >&2
            echo "matched-build test SKIPS unless all three bundles are on" >&2
            echo "disk, so a green suite with no records means the release" >&2
            echo "builds above did not produce them." >&2
            exit 1
          fi
          for label in 'B5 shipped-cost evidence' 'B5 per-promotion byte delta'; do
            if ! grep -F "$label" "$log" | grep -q 'citable$'; then
              echo "No citable record for: ${label}" >&2
              exit 1
            fi
          done
          echo "Published 3 release shapes, the shipped-cost row and the"
          echo "matched-pair promotion delta at ${RF2_REVISION}."

      - name: Upload the B5 matched-build records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: freehand-bench-b5-${{ github.sha }}
          path: implementation/out/freehand-bench-b5.log
          if-no-files-found: error
          retention-days: 90

  # The BROWSER half of the same suite (rf2-drpa3.147, rf2-drpa3.52). See
  # THREE LANES, ONE HARNESS and THE REVISION above: this job adds a host and
  # the revision that host cannot otherwise learn.
  #
  # B2's mounted storm, B4's contended-latency row and B5's initial-mount
  # reading each mount real components over `react-dom/client` and publish a
  # result record from inside the page. Neither lane above runs them: a JVM
  # has no DOM and Node has no browser, so before this job existed the three
  # rows were asserted on every PR and their evidence was never captured
  # anywhere.
  #
  # AND SINCE rf2-mf4uy THIS JOB IS THE ONLY BROWSER THAT RUNS THEM. It used to
  # be a second run of suites the per-PR `:browser-test` gate already covered,
  # adding a revision rather than coverage. It is not any more: those seven
  # namespaces were 71% of that gate's wall clock in 5% of its namespaces — one
  # of them, `bench.b10-two-clock`, 49% on its own — and a benchmark charged
  # against a correctness gate's timeout budget makes every conversation about
  # that budget a conversation about the benchmark. The gate now excludes them
  # by `:ns-regexp`, and `implementation/scripts/_browser-dom-lane-partition.
  # test.cjs` proves on every PR that the two selectors partition the repo's
  # `*_dom_cljs_test` namespaces, so nothing can fall between them unnoticed.
  #
  # The cadence for the mounted rows is therefore this workflow's — scheduled
  # and dispatchable, not per-PR — which is the cadence D021 asked for anyway.
  # What did NOT move: the deterministic rows in those same files that carry no
  # `(browser?)` guard (the fixture arithmetic, the two-arms/two-lowerings
  # checks, the published-record field census) still match `:node-test`'s
  # `cljs-test$` and still gate on every PR.
  #
  # THE ARTEFACT IS THE CONSOLE. A browser has no stdout, so the records are
  # published to the console as EDN (`;;`-prefixed headers, exactly the
  # comment convention the other two lanes' stdout artefacts use). The
  # Playwright runner buffers every console line and flushes it under
  # RF2_VERBOSE_TESTS=1, so the lane asks for the trail and keeps it verbatim
  # — the artefact and the thing a reviewer reads are the same bytes.
  browser-evidence:
    name: Freehand B-spine evidence — browser lane (pinned worker)
    # PINNED for the same reason the other two lanes are. See THE PIN above.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: implementation
    env:
      # The same configured class as the sibling lanes; the HOST difference
      # stays visible in each record's `:host`, where it belongs. Unlike the
      # sibling lanes, setting it here is not enough on its own — the
      # :browser-test-freehand-bench build reads it at COMPILE time through
      # `#shadow/env` into the provenance namespace's `build-hardware-class`
      # define, because the page it ends up in cannot read this environment.
      RF2_HARDWARE_CLASS: release-worker
      # What makes a mounted record CITABLE. Read at compile time by the
      # :browser-test-freehand-bench build's `#shadow/env`, baked into the
      # bundle as the provenance namespace's `build-revision` define, and
      # answered by `detect-revision` in a page that has no git and no
      # environment of its own.
      RF2_REVISION: ${{ github.sha }}
      # The runner buffers the browser console and flushes it only on failure
      # or under this flag. Here the console IS the evidence, so it is always
      # wanted.
      RF2_VERBOSE_TESTS: '1'
      # This lane used to pin BROWSER_TEST_TIMEOUT_MS=300000, because it
      # mounts B2's storm at two scales through four arms, B4's contended row
      # and B5's sampled mounts, and 300s was room against a 120s default.
      # The runner's default is now 360s (rf2-15047), so the pin had become
      # an inversion — a bench lane held to a SHORTER budget than an ordinary
      # one. Dropped rather than re-tuned: the inherited default already
      # covers this page, and one number is easier to keep honest than two.
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: implementation/package-lock.json

      - name: Cache Maven / gitlibs (shadow-cljs deps)
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: ${{ runner.os }}-cljs-${{ hashFiles('implementation/shadow-cljs.edn', 'implementation/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-cljs-

      - name: npm install
        run: npm ci

      # Keyed on the locked Playwright version, so a Playwright bump busts it
      # — the same cache the PR-time browser gates use.
      - name: Cache Playwright browser binary
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('implementation/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright (Chromium + system deps)
        run: npx playwright install --with-deps chromium || "$GITHUB_WORKSPACE/.github/scripts/playwright-install-failed.sh"

      # The buffered console arrives on stderr; stdout carries the runner's
      # one-line summary. The log is kept whatever the exit code, so a red
      # run's trail is still uploaded, and the runner's own status is what
      # this step exits with.
      - name: Mount the browser workloads and capture the published records
        run: |
          mkdir -p out
          status=0
          npm run bench:freehand-browser 2> out/freehand-bench-browser.log || status=$?
          cat out/freehand-bench-browser.log
          exit $status

      # The one thing this lane is allowed to fail on, and it is not a
      # number. D021 forbids an automatic numeric pass/fail, and nothing here
      # asserts a millisecond or a byte. What it asserts is PROVENANCE: a
      # record that cannot name its revision, or that names the wrong
      # machine, is not evidence anyone may cite — so a lane that published
      # only unattributable or mislabelled records did not do its job.
      #
      # BOTH environment-derived provenance fields are checked, because both
      # cross the same compile-time boundary and either can be dropped in
      # silence. A page cannot read `process.env`: setting RF2_HARDWARE_CLASS
      # in this job's `env:` configures the RUNNER, and only the build's
      # `#shadow/env` define carries it into the page. The first time this
      # lane ran it published thirteen records with the right revision and
      # `:developer-workstation` for the class — certified by
      # `provenance/result`, because the ledger asks for a keyword and got
      # one. A wrong keyword is what the ledger cannot see and this step can.
      - name: Refuse to publish unattributable or mislabelled evidence
        run: |
          log=out/freehand-bench-browser.log
          if grep -q 'NOT CITABLE' "$log"; then
            echo "This lane published unattributable evidence:" >&2
            grep -n 'NOT CITABLE' "$log" >&2
            echo "RF2_REVISION was '${RF2_REVISION}'. It is read at COMPILE time by" >&2
            echo "the :browser-test-freehand-bench build and reaches the page as the" >&2
            echo "provenance namespace's build-revision define." >&2
            exit 1
          fi
          citable=$(grep -c 'citable$' "$log" || true)
          if [ "$citable" -eq 0 ]; then
            echo "This lane published no result records at all — the workloads" >&2
            echo "either did not run or stopped publishing. An empty evidence" >&2
            echo "artefact is worse than a red one, because it looks green." >&2
            exit 1
          fi
          wrong=$(grep -o ':hardware-class :[A-Za-z0-9_-]*' "$log" \
                  | grep -v ":hardware-class :${RF2_HARDWARE_CLASS}\$" | sort -u || true)
          if [ -n "$wrong" ]; then
            echo "This lane published records naming a hardware class it is not:" >&2
            echo "$wrong" >&2
            echo "RF2_HARDWARE_CLASS was '${RF2_HARDWARE_CLASS}'. It is read at COMPILE" >&2
            echo "time by the :browser-test-freehand-bench build and reaches the page as" >&2
            echo "the provenance namespace's build-hardware-class define — a browser" >&2
            echo "cannot read this job's environment, so the define is the only route." >&2
            exit 1
          fi
          classed=$(grep -c ":hardware-class :${RF2_HARDWARE_CLASS}" "$log" || true)
          if [ "$classed" -eq 0 ]; then
            echo "No record named a hardware class at all — the :host provenance" >&2
            echo "field stopped being published, so the 'no wrong class' check above" >&2
            echo "passed vacuously." >&2
            exit 1
          fi
          echo "Published $citable citable result record(s) at ${RF2_REVISION},"
          echo "$classed of them naming hardware class ${RF2_HARDWARE_CLASS}."

      - name: Upload the browser result records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: freehand-bench-browser-${{ github.sha }}
          path: implementation/out/freehand-bench-browser.log
          if-no-files-found: error
          retention-days: 90
