name: lint

# Multi-linter CI gate.
#
# Three complementary linters run as parallel jobs — two over the Clojure
# trees, one over the JavaScript ones:
#
#   - clj-kondo: bug-class linter (unresolved symbols, arity mismatches,
#     redefined vars, unused bindings). The `.clj-kondo/config.edn` at
#     repo root is the shared source of truth — editor integrations
#     (Calva, CIDER, Cursive) read the same file. The job runs with
#     `--fail-level error`, so an introduced ERROR blocks the PR while
#     warnings remain informational for triage.
#
#   - Splint (noahtheduke/splint): style-shape linter inspired by the
#     Clojure Style Guide. Catches idiomatic-Clojure smells that
#     kondo's lexical analysis is not designed to surface. Per-project
#     config lives in `.splint.edn` at repo root. The job runs with
#     `--fail-on-errors`, so an introduced ERROR (a file Splint cannot
#     parse — `splint/parsing-error` and friends) blocks the PR while
#     style warnings stay informational — the same shape as the
#     clj-kondo job's `--fail-level error`.
#
#   - ESLint (rf2-2rtt6.78): bug-class linter over every
#     AUTHOR-MAINTAINED `.cjs` / `.mjs` / `.js` file — bench drivers,
#     gate runners, browser harnesses, MCP conformance suites — which
#     until it landed were checked by NOTHING, so a syntax error or a
#     typo'd `require` surfaced the first time somebody ran the file.
#     AUTHOR-MAINTAINED, not "every TRACKED": `docs/cljs/playground.js`
#     is tracked and is a minified generated bundle, one of the
#     generated trees `eslint.config.mjs` ignores on purpose, so the
#     stronger phrasing would claim coverage the config deliberately
#     withholds (rf2-93u6). Config lives in
#     `eslint.config.mjs` at repo root, alongside `.clj-kondo/config.edn`
#     and `.splint.edn`, and its rule set is deliberately hand-picked
#     rather than `js.configs.recommended`: only rules that answer "what
#     bug does this catch?", nothing about quoting, spacing, semicolons,
#     import order or formatting. Everything in it is an error, so the
#     job blocks on any finding while ESLint's own unused-disable-
#     directive warnings stay informational — the same shape as the two
#     jobs above. It landed green with zero suppressions in the tree and
#     must stay that way: fix a finding, or file a bead naming it, but
#     never silence it with a disable comment.
#
# Lint surface: implementation/, tools/ (minus template/resources/),
# examples/, testbeds/. Generated trees (.shadow-cljs/, target/,
# node_modules/, .beads/, ai/) are excluded by virtue of the explicit
# `--lint` paths below. The `tools/template/resources/` deps-new
# template tree is excluded explicitly — those `.cljs` files carry
# `{{placeholder}}` substitutions and are not valid Clojure (see
# tools/deps.edn for the matching shadow-cljs exclusion rationale).
#
# REQUIRED-CHECK SHAPE (rf2-aemyt). The `pull_request` trigger is
# deliberately UNFILTERED so the `Lint required` aggregator below posts a
# status context on EVERY PR — a path-filtered workflow skips entirely on
# an unrelated PR and emits NO context, which means a required-but-absent
# context would sit permanently pending (the phantom trap rf2-dtvmb hit).
# The expensive clj-kondo + Splint jobs are instead gated job-side on a
# tiny `detect` job that diffs the PR's changed files against the lint
# surface, so they still skip on PRs that touch no lint paths while the
# aggregator stays present and green (all-skipped ⇒ pass). The exact
# display name `Lint required` is the string the branch ruleset requires.

on:
  push:
    branches: [main]
    paths:
      - 'implementation/**'
      - 'tools/**'
      - 'examples/**'
      - 'testbeds/**'
      - '.clj-kondo/**'
      # Splint reads its per-project config from `.splint.edn` at repo root
      # (rf2-nlnd9y.3). A push that changes ONLY `.splint.edn` — including
      # broken syntax, disabled rules, or a missing exclude — must run the
      # lint workflow so the Splint gate validates the new config.
      - '.splint.edn'
      - '.github/workflows/lint.yml'
      # (rf2-2rtt6.78) The ESLint gate's own surface. `eslint.config.mjs`
      # is the rule set; the root `package.json` + `package-lock.json`
      # pin the linter version the job installs, so a bump there must
      # re-run the gate. The JS files themselves live under the trees
      # already named here plus `scripts/` and `docs/tools/`, which
      # nothing else in this filter reaches.
      - 'eslint.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**'
      - 'docs/tools/**'
      # Public-API manifest drift-check surface (rf2-3nbl5.2).
      - 'spec/API.md'
      - 'spec/api-manifest.edn'
      - 'spec/api-manifest-metadata.edn'
      # Secondary projection drift-check surfaces (rf2-gkp0t): the skills +
      # doc-guide are manifest projections; a var rename there must run the
      # api-manifest job. (tools/story/spec + tools/xray/spec already ride
      # the tools/** entry above.)
      - 'skills/**'
      - 'docs/core/**'
      # Per-capability CONCEPT docs (rf2-earvtz): the #4961 reorg moved each
      # capability's concept doc to docs/<cap>/concepts.md; doc-guide-check now
      # scans them, so a PR touching only one must run the api-manifest job.
      - 'docs/*/concepts.md'
      # Human-doc API-reference projection surfaces (rf2-vzupmg): the three
      # API-reference trees the doc-api-check scans are manifest projections
      # too; a PR touching them must run the api-manifest job's doc-api-check
      # so a removed/renamed public surface goes RED. (spec/Privacy.md rides
      # the spec/ entries the classifier already lights; the push filter
      # names it explicitly for the same reason API.md is named above.)
      - 'spec/Privacy.md'
      - 'docs/core/api/**'
      - 'docs/story/api/**'
      # API reference: one doc per namespace under docs/api/; doc-api-check
      # scans them, so a PR touching one must run the api-manifest job.
      - 'docs/api/**'
  # PR trigger is intentionally UNFILTERED (see REQUIRED-CHECK SHAPE
  # above). The lint surface is re-applied job-side via the `detect` job.
  pull_request:
    branches: [main]
  # Nightly run keeps the gate honest even when no lint-surface file
  # changes (e.g. a dep bump in another tree might silently break kondo
  # via :lint-as). 03:30 UTC sits below the 04:00 UTC `expensive-tests`
  # window so the lint gate's signal lands before the deeper sweep.
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lightweight changed-surface gate (rf2-aemyt). On a pull_request this
  # diffs HEAD against the merge base and lights `lint_surface` only when a
  # path in the lint surface changed; on push / schedule / dispatch it
  # always lights so the linters run unconditionally. The heavy clj-kondo +
  # Splint jobs key their `if:` on this output, while the always-present
  # aggregator does not — so an unrelated PR runs only this ~5-second job
  # plus the rollup, and both linters skip.
  #
  # `js_surface` (rf2-2rtt6.78) is the same idea for the ESLint job, and is
  # classified SEPARATELY because the two surfaces are not nested: a PR
  # touching only `scripts/*.mjs` lints under ESLint but has no Clojure to
  # lint, and a PR touching only `spec/api-manifest.edn` is the reverse.
  detect:
    name: Detect lint surface
    runs-on: ubuntu-latest
    outputs:
      lint_surface: ${{ steps.detect.outputs.lint_surface }}
      js_surface: ${{ steps.detect.outputs.js_surface }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0

      # On a PR, classify the changed-file list against the lint surface.
      # On any non-PR event (push/schedule/dispatch) light the gate so the
      # linters always run. Mirrors the git-diff classifier shape used by
      # .github/scripts/report-changed-surfaces.sh in test.yml.
      - name: Classify changed files against the lint surface
        id: detect
        run: |
          if [ "${GITHUB_EVENT_NAME}" != "pull_request" ]; then
            echo "lint_surface=true" >> "$GITHUB_OUTPUT"
            echo "js_surface=true" >> "$GITHUB_OUTPUT"
            echo "Non-PR event (${GITHUB_EVENT_NAME}): running linters unconditionally."
            exit 0
          fi
          git fetch --no-tags --depth=100 origin "${GITHUB_BASE_REF}" >/dev/null 2>&1 || true
          files="$(git diff --name-only "origin/${GITHUB_BASE_REF}...HEAD")"
          lint_surface=false
          js_surface=false
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              implementation/*|tools/*|examples/*|testbeds/*|.clj-kondo/*|.github/workflows/lint.yml)
                lint_surface=true ;;
              # `.splint.edn` is the Splint gate's per-project config
              # (rf2-nlnd9y.3): a PR that changes ONLY it — broken syntax,
              # disabled rules, a removed exclude — must run the Splint job so
              # the config is validated. Without this the detect classifier
              # left lint_surface=false and Splint skipped, letting a config
              # change ship unverified behind a green `Lint required`.
              .splint.edn)
                lint_surface=true ;;
              # spec/ feeds the public-API manifest drift-check (the
              # api-manifest job below): API.md, the curated sidecar, and
              # the generated manifest all live under spec/. A pure-spec PR
              # that touches them must still run the drift-check (rf2-3nbl5.2).
              spec/API.md|spec/api-manifest.edn|spec/api-manifest-metadata.edn)
                lint_surface=true ;;
              # The skills + doc-guide are secondary manifest projections
              # (rf2-gkp0t): a var rename there is caught by the api-manifest
              # job's skills-check / doc-guide-check. A pure-skills or
              # pure-doc-guide PR must still run the drift-check. The
              # per-capability concept docs (docs/<cap>/concepts.md from the
              # #4961 reorg) are scanned by doc-guide-check now too (rf2-earvtz).
              skills/*|docs/core/*|docs/*/concepts.md)
                lint_surface=true ;;
              # The three human-doc API-reference trees are manifest
              # projections too (rf2-vzupmg): a removed/renamed public surface
              # named there is caught by the api-manifest job's doc-api-check.
              # A pure-doc PR touching them must still run the drift-check. The
              # per-capability API docs (docs/<cap>/api.md from the #4961 reorg)
              # are scanned by doc-api-check now too (rf2-earvtz).
              spec/Privacy.md|docs/api/*|docs/story/api/*)
                lint_surface=true ;;
            esac
            # (rf2-2rtt6.78) The ESLint surface gets its OWN `case` rather than
            # another arm above, and the reason is load-bearing: `case` is
            # first-match-wins, so `implementation/scripts/foo.cjs` is claimed
            # by the `implementation/*` arm and would never reach a JS arm
            # placed after it. ESLint classifies by EXTENSION wherever the file
            # lives, plus the gate's own config and root manifest — a linter
            # bump in the lockfile has to re-run the linter.
            case "$file" in
              *.cjs|*.mjs|*.js|eslint.config.mjs|package.json|package-lock.json)
                js_surface=true ;;
            esac
          done <<< "$files"
          echo "js_surface=${js_surface}" >> "$GITHUB_OUTPUT"
          echo "js_surface=${js_surface}"
          echo "lint_surface=${lint_surface}" >> "$GITHUB_OUTPUT"
          echo "lint_surface=${lint_surface}"

  clj-kondo:
    name: clj-kondo (fail on errors, warnings informational)
    needs: detect
    if: needs.detect.outputs.lint_surface == 'true'
    runs-on: ubuntu-latest
    # The job runs with `--fail-level error` so an introduced ERROR
    # blocks the PR. Warnings stay informational and surface in the
    # job log for triage.
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      # Install the official binary directly — the published GitHub
      # Actions for clj-kondo are either unmaintained (DeLaGuardo's runs
      # on node12, deprecated by GitHub) or community-forked.
      - name: Install clj-kondo
        # Fetch the pinned release archive ourselves rather than delegating
        # to upstream's `install-clj-kondo` script (rf2-rkl9). The script is
        # the documented path, but it fetches that archive with a bare
        # `curl -o "$filename" -sL` — no `-f`, no retry — and THAT hop is
        # where this gate actually dies. PR #7881's job logged one line,
        # `Downloading …/clj-kondo-2026.04.15-linux-static-amd64.zip to
        # /tmp`, then exit 35 (curl's SSL-connect error) 0.24s in, with no
        # lint output anywhere. A transient install failure wearing the
        # costume of a RED LINT GATE is the worst possible disguise: the
        # natural response is to hunt the diff for an error that does not
        # exist, and that is exactly what it cost.
        #
        # Retry-hardening the fetch of the SCRIPT (rf2-cq0s2j, below) was
        # right in intent but one hop short of reach, and pre-fetching the
        # archive in front of the script cannot close the gap either — the
        # script `rm -rf`s the archive immediately before downloading it, so
        # a warm copy is discarded unread. Fetching it directly is the only
        # placement where the retry policy covers the download that fails,
        # and it drops this step from two network hops to one.
        #
        # `--retry 5 --retry-all-errors --retry-delay 3` retries transient
        # failures with a 3s base backoff — the SSL-connect drop above, and
        # the CDN HTTP-429 that `-f` alone treats as fatal (rf2-cq0s2j; cost
        # a fix-worker cycle on #5304). GNU curl on ubuntu-24.04 runners
        # supports `--retry-all-errors` (since 7.71). `-f` additionally means
        # an error page can never be mistaken for an archive.
        #
        # The platform triple is written out rather than probed: this job is
        # `runs-on: ubuntu-latest`, i.e. linux/amd64, for which upstream
        # publishes the `-static` build. Were the runner ever to change, the
        # URL 404s and `-f` fails the step outright rather than installing
        # something else. `/usr/local/bin` is on $PATH and is where the
        # upstream script installs too, so the run step below is unchanged.
        run: |
          version=2026.04.15
          dir="$(mktemp -d)"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 \
            -o "$dir/clj-kondo.zip" \
            "https://github.com/clj-kondo/clj-kondo/releases/download/v${version}/clj-kondo-${version}-linux-static-amd64.zip"
          unzip -qq "$dir/clj-kondo.zip" clj-kondo -d "$dir"
          sudo install -m 0755 "$dir/clj-kondo" /usr/local/bin/clj-kondo
          clj-kondo --version

      # Cache the kondo classpath / project-analysis under
      # ~/.clj-kondo so subsequent runs reuse the type info. The cache
      # key is keyed on every `deps.edn` in the lint surface so a dep
      # bump invalidates the cache.
      - name: Cache clj-kondo analysis
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.clj-kondo
            .clj-kondo/.cache
          key: ${{ runner.os }}-kondo-${{ hashFiles('.clj-kondo/config.edn', 'implementation/**/deps.edn', 'tools/**/deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-kondo-

      # `tools/template/resources/` is excluded — those `.cljs` files
      # ship deps-new placeholders (`{{top/ns}}`) and are not valid
      # Clojure (see tools/deps.edn → "Why template is NOT in the base
      # :deps map" for the matching shadow-cljs exclusion). `tools/`
      # subdirs are listed explicitly to skip resources/ while keeping
      # tools/template/{src,test}.
      #
      # `--parallel` fans out file analysis across cores. `--fail-level
      # error` makes kondo exit non-zero only when an ERROR-level
      # finding is reported (warnings still print to the log for
      # triage). The `continue-on-error` job-level flag was removed
      # alongside the trailing `|| true` so a kondo error genuinely
      # blocks the PR.
      - name: Run clj-kondo
        run: |
          clj-kondo \
            --parallel \
            --fail-level error \
            --lint implementation \
            --lint examples \
            --lint testbeds \
            --lint tools/xray \
            --lint tools/machines-viz \
            --lint tools/mcp-base \
            --lint tools/mcp-conformance \
            --lint tools/re-frame2-pair-mcp \
            --lint tools/story \
            --lint tools/story-mcp \
            --lint tools/template/src \
            --lint tools/template/test

      # THE FIXTURE WITNESS FOR HICASSO'S LINT EXPORT (rf2-hic-022).
      #
      # The step above loads that export's hooks against current repository
      # code, which proves they LOAD and stay quiet. It cannot prove they still
      # CATCH: every check could stop firing and this job would stay green,
      # because silence is what it is looking for. That is a gate reporting
      # success over a case it never exercises — the defect class this repo
      # keeps finding in its own instruments — so the positive fixtures have to
      # execute somewhere required, and this is the only required job that
      # already has clj-kondo installed at the pin.
      #
      # It costs about a second: pure Python driving the binary above over two
      # fixture files. No JDK, no Node modules, no shadow-cljs. `--self-test`
      # runs first: it mutates the shipped export — at the hook and at the
      # positive fixture — requires each mutation to turn the gate RED, and
      # restores every one in a `finally`; then the gate itself runs.
      #
      # HOW MANY mutations is deliberately not written here (rf2-93u6), and
      # the history is the whole argument. rf2-zzdg corrected "three" to
      # "four" (#7813); #7818 added another case one tick later, so the
      # correction was stale before it was a day old; #7829 adds more still.
      # Nothing links a count kept in THIS file to a case list kept in ANOTHER
      # one, and nothing ever will, so the next correction is already
      # scheduled and the one after that. The only fix that holds is to stop
      # writing the number down — which is why this paragraph names no current
      # value, and why adding one back would re-open the defect rather than
      # tidy it. The self-test names its own cases as it runs, which is the
      # copy that cannot drift; `check_lint_export.py`
      # dropped the count from its docstring for the same reason, and its
      # `EXPECTED` table pins fixture ROWS rather than a total on exactly this
      # reasoning — a check that fires the right NUMBER of times in the wrong
      # PLACE is the collapse a count cannot see.
      - name: Hicasso lint export — fixture witness
        working-directory: implementation
        run: npm run test:hicasso-lint

  splint:
    name: Splint (fail on errors, warnings informational)
    needs: detect
    if: needs.detect.outputs.lint_surface == 'true'
    runs-on: ubuntu-latest
    # The job runs with `--fail-on-errors` so an introduced ERROR (a
    # file Splint cannot parse) blocks the PR. Style warnings still
    # print to the log for triage but never fail the gate — the same
    # shape as the clj-kondo job above.
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Clojure CLI
        run: "$GITHUB_WORKSPACE/.github/scripts/install-clojure-cli.sh"

      - name: Cache Maven / gitlibs
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: ${{ runner.os }}-splint-${{ hashFiles('implementation/deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-splint-
            ${{ runner.os }}-clj-

      # Splint is JVM-only and lives on the `:splint` alias of the
      # top-level coordinator. Running from `implementation/` keeps the
      # alias next to the artefacts it lints; the explicit path args
      # widen the surface to tools/ + examples/ + testbeds/.
      #
      # The alias entry-point is `re-frame.splint-main` (a thin
      # cross-platform shim around Splint's own runner — see
      # implementation/deps.edn). Its `--fail-on-errors` flag makes the
      # process exit non-zero ONLY when an error-class diagnostic is
      # present (a file Splint could not parse). Style warnings still
      # print to the log but never fail the run — matching the kondo
      # job's `--fail-level error`. No `|| true` / continue-on-error:
      # an introduced parse-error genuinely blocks the PR.
      - name: Run Splint
        working-directory: implementation
        run: |
          clojure -M:splint \
            --fail-on-errors \
            ../implementation \
            ../tools \
            ../examples \
            ../testbeds

  # ---------------------------------------------------------------------------
  # ESLint over the JS corpus (rf2-2rtt6.78).
  #
  # The Clojure counterpart of the two jobs above, for the tracked
  # `.cjs` / `.mjs` / `.js` files that no gate looked at before this landed.
  # Everything about the rule set — what it catches, what it deliberately
  # refuses to police, and why it is not `js.configs.recommended` — is
  # documented in `eslint.config.mjs` at repo root rather than repeated here.
  #
  # This is the cheapest job in the workflow by a wide margin: the root
  # `package.json` carries ESLint and `globals` and NOTHING else (the CLJS
  # build toolchain lives in `implementation/package.json` and is not
  # installed here), so `npm ci` resolves in a few seconds and the lint pass
  # over the whole corpus takes a few more.
  #
  # No `|| true`, no `continue-on-error`, and no `--max-warnings` override:
  # every rule in the config is an error, so any finding fails the job, while
  # ESLint's own unused-disable-directive reports stay warnings for triage —
  # the same errors-block / warnings-informational shape as clj-kondo's
  # `--fail-level error` and Splint's `--fail-on-errors`.
  # ---------------------------------------------------------------------------
  eslint:
    name: ESLint (fail on errors, warnings informational)
    needs: detect
    if: needs.detect.outputs.js_surface == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '24'
          cache: npm
          # Named explicitly: several `package-lock.json` files live in this
          # repo (implementation/, tools/mcp-conformance/, the docs
          # playground) and the cache must key on the ROOT one, which is the
          # only lockfile this job installs from.
          cache-dependency-path: package-lock.json

      # `npm ci` from the committed root lockfile, so the linter version the
      # gate runs is byte-identical to the one pinned in `package.json` —
      # a floating `npx eslint@latest` would let a rule change red unrelated
      # PRs with nothing in the diff to explain it.
      - name: Install ESLint
        run: npm ci

      - name: Run ESLint
        run: npm run lint:js

  # ---------------------------------------------------------------------------
  # Public-API manifest drift-check (rf2-3nbl5.2 — API-governance keystone).
  #
  # Regenerates the machine-readable public-API manifest from the LIVE public
  # vars (core + every optional artefact + Story + the MCP support
  # namespaces) joined against the curated tier/owner/status sidecar, then
  # FAILS if the result differs from the committed `spec/api-manifest.edn`.
  # Adding / removing / renaming ANY public var — or leaving it unclassified
  # in `spec/api-manifest-metadata.edn` — turns this red until the manifest +
  # sidecar are regenerated. A second step validates the `spec/API.md`
  # projection: every API.md var-row's Tier must match the manifest.
  #
  # Surface-gated on the same `detect` job as the linters (the manifest can
  # only drift when implementation/, tools/, or spec/ changes); the
  # `Lint required` aggregator below includes it so a drift goes red and
  # blocks the merge. Fast + deterministic: pure JVM `ns-publics`
  # introspection, no shadow-cljs build.
  # ---------------------------------------------------------------------------
  api-manifest:
    name: Public-API manifest drift-check
    needs: detect
    if: needs.detect.outputs.lint_surface == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Clojure CLI
        run: "$GITHUB_WORKSPACE/.github/scripts/install-clojure-cli.sh"

      - name: Cache Maven / gitlibs
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: ${{ runner.os }}-api-manifest-${{ hashFiles('implementation/**/deps.edn', 'tools/**/deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-api-manifest-
            ${{ runner.os }}-clj-

      # The generator + both checks live on a self-contained classpath
      # (implementation/scripts/api-manifest/deps.edn) that pulls core +
      # every optional artefact + Story + mcp-base onto one JVM classpath.
      - name: Regenerate manifest + assert no drift
        working-directory: implementation/scripts/api-manifest
        run: clojure -M -m re-frame.api-manifest.gen --check

      # The re-frame.ui AI context sheet (rf2-u53yy.8). Its compile-rejection
      # roster is GENERATED from the compiler's own env/fail! / env/warn!
      # didactic messages in analyze.cljc; this check regenerates the sheet in
      # memory and reds until skills/re-frame2-ui/references/ui-context.md is
      # regenerated — so a reworded / added / removed compiler diagnostic can
      # never silently drift the sheet.
      - name: Regenerate re-frame.ui context sheet + assert no drift
        working-directory: implementation/scripts/api-manifest
        run: clojure -M -m re-frame.api-manifest.ui-context --check

      - name: Assert spec/API.md projection matches the manifest
        working-directory: implementation/scripts/api-manifest
        run: clojure -M -m re-frame.api-manifest.api-md-check

      # (rf2-udl74a: the public-facade manifest-hygiene gate was RETIRED with the
      # atomic re-frame.realm/migration removal — its disposition source
      # (re-frame.migration/migration-map) and the superseded EP-0013 facade
      # names it tracked no longer exist. The doc-surface retired-vocab grep
      # (scripts/check_retired_composition_vocab.py) remains the live guard.)

      # Secondary projection drift-checks (rf2-gkp0t). Each validates a
      # surface's public-var references against the same manifest the way
      # api-md-check validates spec/API.md: Story API spec, Xray API spec
      # (report-only — the spec file is owned elsewhere; the check flags
      # drift), the skills, and the doc-guide. Each goes RED on a renamed /
      # removed / never-manifested var the surface still names.
      - name: Assert tools/story/spec/API.md projection matches the manifest
        working-directory: implementation/scripts/api-manifest
        run: clojure -M -m re-frame.api-manifest.story-spec-check

      - name: Assert tools/xray/spec/API.md projection matches the manifest
        working-directory: implementation/scripts/api-manifest
        run: clojure -M -m re-frame.api-manifest.xray-spec-check

      - name: Assert skills/ projection matches the manifest
        working-directory: implementation/scripts/api-manifest
        run: clojure -M -m re-frame.api-manifest.skills-check

      - name: Assert docs/core/ projection matches the manifest
        working-directory: implementation/scripts/api-manifest
        run: clojure -M -m re-frame.api-manifest.doc-guide-check

      # Human-doc API-reference projection drift-check (rf2-vzupmg). Extends
      # the call-position discipline to the three human-facing API-reference
      # trees the keystone + the checks above left uncovered:
      # spec/Privacy.md + docs/core/api/** + docs/story/api/**. Goes RED on a
      # call-position `(rf/<var>` / `(story/<var>` reference to a renamed /
      # removed / never-manifested public surface (the EP-graduation
      # doc-drift class that previously passed every CI check).
      - name: Assert spec/Privacy + docs/core/api + docs/story/api projection matches the manifest
        working-directory: implementation/scripts/api-manifest
        run: clojure -M -m re-frame.api-manifest.doc-api-check

      # Pure-reconciler regression contracts (rf2-4v79f). The `:test` alias
      # carries the unit tests that lock the reconcilers the check-mains
      # above drive: the api-md-check qualifier-resolution contract
      # (rf2-41j0a — a fully-qualified symbol must match its EXACT [ns var],
      # never merely share a bare var name) and the xray-spec-check contract
      # (rf2-0u8kz). The check-mains go RED on real drift, but these unit
      # contracts pin the reconciler logic itself; gating them here closes
      # the local-only-dev-net hole.
      - name: Run api-manifest reconciler regression tests
        working-directory: implementation/scripts/api-manifest
        run: clojure -M:test

  # ---------------------------------------------------------------------------
  # Required-checks aggregator (rf2-aemyt).
  #
  # ONE stable status context — `Lint required` — that is ALWAYS present on
  # every PR (the workflow's pull_request trigger is unfiltered) and that
  # passes iff every lint job that actually ran also passed. This is the
  # single lint context the branch ruleset should require: a skipped
  # surface-gated linter is OK (it contributed no signal), but the moment
  # clj-kondo, Splint or ESLint reports `failure`/`cancelled` the aggregator
  # goes red and blocks the merge.
  #
  # `if: always()` is mandatory — without it the aggregator would itself be
  # skipped whenever an upstream job skips, and a skipped required check
  # never satisfies the ruleset. The pass/fail decision reads
  # `needs.*.result`: `success` and `skipped` are acceptable; `failure`
  # and `cancelled` are not. The `detect` job is included in `needs:` so a
  # broken classifier (its own failure) is also caught.
  # ---------------------------------------------------------------------------
  lint-required:
    name: Lint required
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs:
      - detect
      - clj-kondo
      - splint
      - eslint
      - api-manifest
    steps:
      - name: Fail if any required lint job failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "::error::A required lint.yml job reported failure or cancelled — blocking merge."
          echo "needs results: ${{ join(needs.*.result, ', ') }}"
          exit 1

      - name: All required lint jobs passed or were skipped
        run: echo "All lint jobs that ran passed (skipped surface-gated linters are OK)."
