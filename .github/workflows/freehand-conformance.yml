name: freehand-conformance

# Gates for the two Freehand ledgers that have to stay honest: the
# executable-law addressing scheme, and the donor-deletion inventory.
#
# Freehand proves its interpreted/compiled + React/JVM/SSR parity row by row.
# Each law carries a permanent `FH-<AREA>-<NNN>` id and the index at
# spec/conformance/freehand/conformance-index.md binds that id to the canonical
# spec paragraph that owns it, the modes and hosts it binds, its fixture, and
# its status. An id is an address: if a row can cite a paragraph that does not
# exist, name a fixture that was never written, or reuse an id another row
# already holds, the scheme is decoration. This gate is what makes it load
# bearing.
#
# REQUIRED-CHECK SHAPE. The `pull_request` trigger is deliberately UNFILTERED
# and the single job is NOT surface-gated, so the `Freehand conformance index`
# status context is present on every PR and can be required by the branch
# ruleset without the phantom-pending trap a path-filtered workflow creates.
# There is no aggregator job because there is nothing to aggregate: one job,
# always present, ~30 seconds including the pip install.
#
# WHAT THIS JOB DOES NOT PROVE (rf2-49upn). The census reads FORMS, not text,
# and derives per row the lanes whose assertions actually reach that row's
# fixture — but it never runs a suite. So its green is the STATIC half of a
# row's claim (the proof exists, is reachable, and lives in a lane serving every
# cell the row names); the DYNAMIC half — that the proof PASSES — is the lane
# exit codes, and those live in `test.yml` (`jvm-freehand`, `cljs`,
# `cljs-browser`). A Python-only workflow cannot hold both halves.
#
# What binds them is the changed-surface classifier, not a fourth copy of the
# lanes here. `.github/scripts/report-changed-surfaces.sh` arms
# implementation_jvm + cljs_node_test + cljs_browser for the whole ledger — the
# fixtures root (rf2-drpa3.66) AND `conformance-index.md` (rf2-49upn) — so any
# edit that can change what a row CLAIMS schedules the lanes that EXECUTE it,
# on the same commit, under the one required `all-required-passed` aggregator.
# Before that arm an index-only PR passed here with all three lanes SKIPPED,
# which is exactly what the #6907 merged-PR audit flagged.
#
# Running the lanes inside this job instead was considered and declined: this
# workflow is unfiltered, so it would put a JVM suite, a Node suite and a
# Chromium run on EVERY pull request, and duplicate three jobs that are already
# required. The arm costs nothing on the common path (a row lands with its
# proof, and the proof already arms all three) and costs three lanes only on the
# index-only PR — the one case where the gap was real. The census states this
# condition in its own output: see `_binding_note` in the checker, printed under
# both `--verbose` and `--report`.
#
# The self-test runs BEFORE the live scan, in the repo-wide house style: the
# index is empty at establishment, and a validator that has only ever been run
# against an empty index has not been tested. The self-test drives one
# deliberately broken fixture index per defect shape and fails if any of them
# passes.
#
# THE DONOR INVENTORY rides the same job. spec/conformance/freehand/donor-
# inventory.md is what the absorption-completeness gate reads before the
# standalone re-frame.ui artifact is deleted, and a deletion gate that can
# silently shrink is worse than no gate — it produces a confident wrong answer
# at exactly the moment it matters. Its checker censuses live donor consumers
# across the whole working tree, which is why it belongs on this unfiltered job
# rather than a path-filtered one: a `re-frame.ui` require added anywhere in the
# repo is precisely what it is looking for. Stdlib Python, ~1 second.
#
# The job id and display name stay `index` / `Freehand conformance index` even
# though the job now proves two ledgers: that string is the status context the
# branch ruleset requires, and renaming it would silently drop the requirement.

on:
  push:
    branches: [main]
    paths:
      - 'spec/conformance/freehand/**'
      - 'implementation/freehand/test/**'   # the fixture tree the index cites
      - 'scripts/check_freehand_conformance_index.py'
      - 'scripts/check_donor_inventory.py'
      - 'scripts/check_doc_slugs.py'   # supplies the shared slug index
      - 'requirements.txt'
      - '.github/workflows/freehand-conformance.yml'
  # PR trigger is intentionally UNFILTERED (see REQUIRED-CHECK SHAPE above).
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: freehand-conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  index:
    name: Freehand conformance index
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      # The validator resolves a row's #anchor through the same slug index the
      # docs corpus uses (scripts/check_doc_slugs.py), which needs the pinned
      # pymdown-extensions. requirements.txt is the one pin.
      - name: Install doc toolchain
        run: pip install -r requirements.txt

      - name: Self-test the Freehand conformance-index validator
        run: python scripts/check_freehand_conformance_index.py --self-test --verbose

      - name: Validate the Freehand conformance index
        run: python scripts/check_freehand_conformance_index.py --verbose

      # Same order and the same reason: a coverage gate that has only ever run
      # against a ledger it already passes has not been tested.
      - name: Self-test the donor-inventory gate
        run: python scripts/check_donor_inventory.py --self-test --verbose

      - name: Validate the donor inventory
        run: python scripts/check_donor_inventory.py --ci --report
