name: freehand-conformance

# Gates for the two Freehand ledgers that have to stay honest: the live
# executable-law addressing scheme, and the archived donor inventory.
#
# Freehand proves its interpreted/compiled + React/JVM/SSR parity row by row.
# Each law carries a permanent `FH-<AREA>-<NNN>` id and the index at
# spec/conformance/freehand/conformance-index.md binds that id to the canonical
# spec paragraph that owns it, the modes and hosts it binds, its fixture, and
# its status. An id is an address: if a row can cite a paragraph that does not
# exist, name a fixture that was never written, or reuse an id another row
# already holds, the scheme is decoration. This gate is what makes it load
# bearing.
#
# REQUIRED-CHECK SHAPE. The `pull_request` trigger is deliberately UNFILTERED
# and the single job is NOT surface-gated, so the `Freehand conformance index`
# status context is present on every PR and CAN BE required by the branch
# ruleset without the phantom-pending trap a path-filtered workflow creates.
# Note the mood: can be. It is not — see NAMING at the end of this header — so
# the shape buys readiness, not a live gate.
# There is no aggregator job because there is nothing to aggregate: one job,
# always present, ~30 seconds including the pip install.
#
# WHAT THIS JOB DOES NOT PROVE (rf2-49upn). The census reads FORMS, not text,
# and derives per row the lanes whose assertions actually reach that row's
# fixture — but it never runs a suite. So its green is the STATIC half of a
# row's claim (the proof exists, is reachable, and lives in a lane serving every
# cell the row names); the DYNAMIC half — that the proof PASSES — is the lane
# exit codes, and those live in `test.yml` (`jvm-freehand`, `cljs`,
# `cljs-browser`). A Python-only workflow cannot hold both halves.
#
# What binds them is the changed-surface classifier, not a fourth copy of the
# lanes here. `.github/scripts/report-changed-surfaces.sh` arms
# implementation_jvm + cljs_node_test + cljs_browser for the whole ledger — the
# fixtures root (rf2-drpa3.66) AND `conformance-index.md` (rf2-49upn) — so any
# edit that can change what a row CLAIMS schedules the lanes that EXECUTE it,
# on the same commit, under the one required `all-required-passed` aggregator.
# Before that arm an index-only PR passed here with all three lanes SKIPPED,
# which is exactly what the #6907 merged-PR audit flagged.
#
# Running the lanes inside this job instead was considered and declined: this
# workflow is unfiltered, so it would put a JVM suite, a Node suite and a
# Chromium run on EVERY pull request, and duplicate three jobs that are already
# required. The arm costs nothing on the common path (a row lands with its
# proof, and the proof already arms all three) and costs three lanes only on the
# index-only PR — the one case where the gap was real. The census states this
# condition in its own output: see `_binding_note` in the checker, printed under
# both `--verbose` and `--report`.
#
# The self-test runs BEFORE the live scan, in the repo-wide house style: the
# index was empty at establishment, and a validator that has only ever been run
# against an empty index has not been tested. The self-test drives one
# deliberately broken fixture index per defect shape and fails if any of them
# passes.
#
# THE DONOR INVENTORY rides the same job, and is now an ARCHIVE.
# spec/conformance/freehand/donor-inventory.md was the work-ledger of the
# Freehand absorption programme; EP-0036 was withdrawn on 2026-07-30, so the
# file is a snapshot of where absorption stood on the day the programme stopped
# and `pending` records only that a row was undisposed then. Its checker was
# converted with it (rf2-lrtwj): the three arms that compared the ledger against
# the working tree — the donor-tree partition, the live-consumer census, the
# stale-row scan — are gone, because each enforced a rule about today's code
# through the historical statuses of a withdrawn programme. What runs here is a
# snapshot-integrity check that reads nothing but the ledger: no row deleted, no
# row added, and no pinned row's disposition, slice, status or description
# drifted. An archive that can quietly shrink or be edited is worse than no
# archive. Stdlib Python, well under a second.
#
# NAMING. The job id and display name stay `index` / `Freehand conformance
# index` even though the job proves two ledgers. That string is NOT a required
# status context. The branch ruleset on `main` requires exactly three — `All
# required checks passed` (test.yml), `Lint required` (lint.yml) and `Docs
# required` (docs.yml) — and this job can reach none of them, because `needs:`
# cannot span workflow files. So this gate is ADVISORY, held by the standing
# practice that a red PR gets fixed rather than merged. Keep the name stable
# regardless: it is the handle the PR rollup and TESTING.md use, and the string
# the ruleset would have to name if the context were ever required. Renaming it
# would not drop a requirement, because there is none to drop.

on:
  # BOTH triggers are intentionally UNFILTERED. The PR one for the
  # REQUIRED-CHECK SHAPE above; the push one because the index checker has no
  # filterable read universe (rf2-kx06s).
  #
  # `check_freehand_conformance_index.py` scans every `spec/**/*.md` for `FH-*`
  # citations and resolves each index citation against its target canonical
  # spec file, so deleting a cited anchor anywhere under `spec/` can red it. An
  # inclusive filter over that universe is the whole of `spec/`, and the honest
  # spelling of it is no filter at all: a direct push to main that can change
  # the checker's result always schedules the job. It is one ~30-second Python
  # job and it already runs unfiltered on every PR, so dropping the filter costs
  # main pushes nothing they were not already paying one merge earlier.
  #
  # The donor snapshot check no longer widens that universe — since rf2-lrtwj it
  # reads one file. Its census of the whole working tree, which is why the push
  # filter came off in the first place, went with the withdrawn programme. The
  # index checker alone still justifies the unfiltered trigger, so nothing here
  # changes.
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: freehand-conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  index:
    name: Freehand conformance index
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      # The validator resolves a row's #anchor through the same slug index the
      # docs corpus uses (scripts/check_doc_slugs.py), which needs the pinned
      # pymdown-extensions. requirements.txt is the one pin.
      - name: Install doc toolchain
        run: pip install -r requirements.txt

      - name: Self-test the Freehand conformance-index validator
        run: python scripts/check_freehand_conformance_index.py --self-test --verbose

      - name: Validate the Freehand conformance index
        run: python scripts/check_freehand_conformance_index.py --verbose

      # Same order and the same reason: a check that has only ever run against a
      # ledger it already passes has not been tested. Its fixtures drive one
      # deliberately mutated archive per defect shape — row removed, row added,
      # status flipped, disposition changed, description rewritten, identity
      # duplicated — and fail if any of them passes.
      - name: Self-test the donor-inventory snapshot check
        run: python scripts/check_donor_inventory.py --self-test --verbose

      # Prints the population it verified, so a green here is never a silent
      # `0 of 0`.
      - name: Check the archived donor-inventory snapshot
        run: python scripts/check_donor_inventory.py --ci
