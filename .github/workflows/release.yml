# Release workflow (rf2-r382; restructured for multi-artefact lockstep
# deploy in rf2-ace2 / rf2-w05l).
#
# # Topological deploy DAG
#
#   verify-version-lockstep ──► test ──► deploy-core
#                                         │
#                                         │   ── deploy-leaf: ONE matrix job,
#                                         │      11 values, all in parallel ──
#                                         ├── deploy-schemas
#                                         ├── deploy-reagent
#                                         ├── deploy-reagent-slim
#                                         ├── deploy-uix
#                                         ├── deploy-machines
#                                         ├── deploy-routing
#                                         ├── deploy-flows
#                                         ├── deploy-http
#                                         ├── deploy-ssr
#                                         ├── deploy-resources
#                                         └── deploy-epoch
#                                                  │
#                                                  ▼
#                                          deploy-ssr-ring
#                                                  │
#                                                  ▼
#                                          github-release
#
# Every per-feature artefact's *published* :deps depends only on core
# (`day8/re-frame2`) — with ONE exception, `day8/re-frame2-ssr-ring`,
# which also publishes a dependency on `day8/re-frame2-ssr` (see §The
# one inter-leaf edge below). Cross-feature references at runtime are
# otherwise wired through `re-frame.late-bind` per Spec 006 §Adapter
# shipping convention and the Conventions §Packaging conventions
# §Independence rule. The DAG above reflects that: once core has
# shipped, every INDEPENDENT leaf artefact is publishable on its own and
# they fan out in parallel, and the one DEPENDENT leaf ships in a stage
# of its own after them.
# Per rf2-lt4e (the seventh and final per-feature split per rf2-5vjj
# Strategy B) deploy-epoch slots in as a leaf alongside the existing
# six per-feature leaves (schemas, machines, routing, flows, http, ssr)
# plus the substrate-adapter leaves (reagent, uix per rf2-3yij;
# the helix leaf was removed at S7/W13, rf2-d6epb). The per-feature
# split set is now closed; further
# additions require a new Spec-ulation increment.
#
# # The one inter-leaf edge: ssr-ring depends on ssr (rf2-p4a93)
#
# implementation/ssr-ring/deps.edn declares TWO in-repo coordinates in
# its published :deps — day8/re-frame2 (../core) AND day8/re-frame2-ssr
# (../ssr) — and the Rewrite step turns BOTH into :mvn/version. So the
# pom this workflow publishes for day8/re-frame2-ssr-ring carries a hard
# dependency on a day8/re-frame2-ssr version that has to EXIST on
# Clojars. It is the only leaf that does.
#
# That edge is load-bearing on the DAG because Clojars has no yank. If
# ssr-ring published while the ssr leaf had failed, day8/re-frame2-ssr-ring
# <VERSION> would sit on Clojars permanently declaring a dependency that
# resolves to nothing; bump-and-supersede (§Failure recovery below) adds
# a good version but cannot remove the broken one, so a consumer pinning
# the original gets an unresolvable tree forever. And ssr-ring cannot
# notice from inside its own job: it installs ssr into the runner's
# ~/.m2, so it never asks Clojars whether ssr is there.
#
# The ordering is therefore STRUCTURAL, not conventional.
# `deploy-ssr-ring` is its own job with `needs: [deploy-core,
# deploy-leaf]`, and a `needs` edge onto a matrix job waits for EVERY
# value to SUCCEED. That buys exactly the invariant:
#
#   if the ssr leaf does not publish successfully, ssr-ring does not
#   publish at all.
#
# `needs: deploy-leaf` is deliberately STRONGER than the pom edge — it
# also blocks ssr-ring behind leaves it does not depend on (flows,
# epoch, …). That costs nothing. GitHub Actions cannot express an edge
# between two values of one matrix, so the choice was between depending
# on the whole matrix or hoisting a second job out of it; and under
# §Failure recovery ANY leaf failure is resolved by bumping VERSION and
# re-shipping every artefact, so a leaf skipped because a sibling failed
# was going to be superseded regardless. Erring toward "do not publish"
# is free here, and the failure it prevents is irreversible.
#
# Guarded mechanically by implementation/scripts/_release-dag-policy.test.cjs
# (`npm run test:script-policy`), which parses this file's job graph and
# fails if a leaf carrying a second in-repo coordinate is ever placed in
# the fail-fast:false matrix, or if ssr-ring loses its ordering edge.
#
# # re-frame.ui is NOT published (rf2-a32r7)
#
# implementation/ui/ (`re-frame.ui`) has no deploy leaf, no pre-deploy test
# and no release-notes row here, and no entry in the
# verify-version-lockstep.sh inventory. Mike ruled on 2026-07-22 that
# day8/re-frame2-ui is not to be published: it is donor-only code being
# absorbed into Freehand (EP-0036) and the standalone artefact is deleted
# at the F6e gate (rf2-drpa3.57). Its deps.edn carries no :clein/build, so
# the conditional inventory guard (rf2-qmhysc) correctly stays silent about
# it. Publishing it would be irreversible, so this absence is load-bearing:
# do not add a leaf back without a ruling that reverses 2026-07-22.
#
# # Lockstep versioning policy through 1.0
#
# Per the rf2-w05l decision: pre-1.0, every artefact ships at the same
# version, sourced from the repo-root VERSION file via :clein/build
# :version "../../VERSION" in each artefact's deps.edn. The
# `verify-version-lockstep` job enforces the contract before we touch
# Clojars. Independent versioning is revisited post-1.0 (rf2-w05l
# §Decision §1).
#
# # Failure recovery
#
# Clojars does not support yanking a published version. If the deploy
# DAG fails part-way through (e.g. core ships but deploy-schemas
# crashes), DO NOT attempt to re-run with the same tag — Clojars will
# 409 on the duplicate core upload and the workflow will appear stuck.
# Recovery procedure (per docs/release-process.md §Recovery):
#
#   1. Diagnose & fix the cause locally.
#   2. Bump VERSION in a release-recovery commit (e.g. 0.0.1.alpha →
#      0.0.1.alpha-1, or vX.Y.Z → vX.Y.Z+1).
#   3. Re-tag with the bumped VERSION.
#   4. Re-run; the workflow ships every artefact at the new version,
#      preserving the lockstep contract. The partial-release artefacts
#      from the failed run are tombstoned-by-supersession on the
#      consumer side: the next release ships every artefact at the
#      bumped version, so a consumer pinning the bumped version pulls a
#      coherent set.
#
# # Modeled on re-frame v1's continuous-deployment-workflow.yml
#
# Same shape: tag-push trigger, gated on the same checks the regular
# `tests.yml` runs (JVM, CLJS, elision probe). Each artefact's own
# directory carries its `:clein/build` descriptor; deploy is
# `clojure -M:clein deploy` from that directory, with the
# :local/root → :mvn/version rewrite happening on the throwaway runner
# checkout (see the Rewrite step in each per-artefact deploy job).
#
# # Secrets
#
# CLOJARS_USERNAME and CLOJARS_PASSWORD are configured at the
# repository level. Per re-frame v1 convention, CLOJARS_PASSWORD
# carries a Clojars deploy token (the username sees the token as the
# password) — neither is committed; both are GHA secrets.
#
# # First publish protocol
#
# Mike runs the first deploy manually after reviewing the workflow on a
# tagged commit. Subsequent releases run automatically on tag push.

name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

jobs:
  # ─────────────────────────────────────────────────────────────────
  # 1. Lockstep version contract gate (rf2-ace2 / rf2-w05l).
  #
  # Asserts every artefact's :clein/build :version points at the
  # repo-root VERSION file, and every non-core artefact references core
  # via {:local/root "../core"}. Fails fast if a hand-edit has broken
  # the lockstep contract.
  # ─────────────────────────────────────────────────────────────────
  verify-version-lockstep:
    name: Verify lockstep version contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Verify VERSION matches tag
        # Sanity check: the pushed tag must match the repo-root VERSION
        # file content (prefixed with `v`). Catches accidental tags.
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version="$(tr -d '[:space:]' < VERSION)"
          expected="v${version}"
          if [ "$tag" != "$expected" ]; then
            echo "::error::tag '$tag' does not match VERSION '$expected'"
            exit 1
          fi
          echo "tag $tag matches VERSION $expected — proceeding"

      - name: Verify lockstep version contract (rf2-ace2)
        run: ./.github/scripts/verify-version-lockstep.sh

  # ─────────────────────────────────────────────────────────────────
  # 2. Pre-release test gate. Same checks as the regular tests
  #    workflow; gates every deploy job below.
  # ─────────────────────────────────────────────────────────────────
  test:
    name: Pre-release test gate
    needs: verify-version-lockstep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: implementation/package-lock.json

      - name: Set up Clojure CLI
        run: "$GITHUB_WORKSPACE/.github/scripts/install-clojure-cli.sh"

      - name: Cache Maven / gitlibs
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: ${{ runner.os }}-clj-release-${{ hashFiles('implementation/**/deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-clj-release-
            ${{ runner.os }}-clj-

      - name: JVM tests (core artefact)
        working-directory: implementation/core
        run: clojure -M:test

      # The Reagent/UIx adapter :test aliases have no JVM-runnable
      # tests of their own (the adapter ns is :cljs-only). These steps are
      # classpath/deps probes — the empty case needs no `|| echo`
      # fallback because the cognitect test-runner returns 0 when there
      # are no matching test namespaces. A non-zero exit means a REAL
      # failure (a deps/classpath break) and MUST stop the release, so we
      # do not swallow it — mirrors the per-adapter probe jobs in
      # .github/workflows/test.yml (rf2-1s2mhh / follow-up rf2-xcyaei
      # finding 4).
      - name: JVM tests (reagent artefact, classpath probe)
        working-directory: implementation/adapters/reagent
        run: clojure -M:test

      # The reagent-slim artefact (rf2-5djt Stage 4, rf2-6hyy) ships a
      # JVM-runnable test namespace — reagent2.impl.component-test (the
      # component-shape detection contract). This is a REAL JVM surface,
      # NOT a skip-on-empty classpath probe, so the test-runner's non-zero
      # exit MUST stop the release — no `|| echo` fallback (mirrors the
      # `jvm-reagent-slim` job in .github/workflows/test.yml).
      - name: JVM tests (reagent-slim artefact)
        working-directory: implementation/adapters/reagent-slim
        run: clojure -M:test

      - name: JVM tests (uix artefact, classpath probe)
        working-directory: implementation/adapters/uix
        run: clojure -M:test

      # No `ui` pre-deploy step: re-frame.ui is not published (rf2-a32r7), so
      # nothing in this workflow deploys it and there is no release-blocking
      # obligation on its suite. The donor's JVM lane still runs on every PR
      # via the jvm-ui job in .github/workflows/test.yml.
      - name: JVM tests (schemas artefact)
        working-directory: implementation/schemas
        run: clojure -M:test

      - name: JVM tests (machines artefact)
        working-directory: implementation/machines
        run: clojure -M:test

      - name: JVM tests (routing artefact)
        working-directory: implementation/routing
        run: clojure -M:test

      - name: JVM tests (flows artefact)
        working-directory: implementation/flows
        run: clojure -M:test

      - name: JVM tests (http artefact)
        working-directory: implementation/http
        run: clojure -M:test

      - name: JVM tests (ssr artefact)
        working-directory: implementation/ssr
        run: clojure -M:test

      # rf2-qmhysc — ssr-ring + resources are publishable :clein/build
      # artefacts deployed by the matrix below, so their JVM suites MUST
      # gate the release alongside the other per-feature artefacts.
      # ssr-ring is the Ring/Pedestal host adapter (spins up a real Jetty
      # host on an ephemeral port in its e2e validator); resources is the
      # EP-0003 declarative server-state runtime (FSM + work-ledger +
      # managed-HTTP + invalidation/GC + routing/SSR integrations).
      - name: JVM tests (ssr-ring artefact)
        working-directory: implementation/ssr-ring
        run: clojure -M:test

      - name: JVM tests (resources artefact)
        working-directory: implementation/resources
        run: clojure -M:test

      - name: JVM tests (epoch artefact)
        working-directory: implementation/epoch
        run: clojure -M:test

      - name: npm install
        working-directory: implementation
        run: npm ci

      - name: CLJS tests (node-test)
        working-directory: implementation
        run: npm run test:cljs

      - name: CLJS production elision probe
        working-directory: implementation
        run: npm run test:elision

      - name: CLJS per-feature bundle isolation
        working-directory: implementation
        run: npm run test:bundle-isolation

      - name: CLJS Reagent Slim bundle isolation
        working-directory: implementation
        run: npm run test:reagent-slim:bundle-isolation

  # ─────────────────────────────────────────────────────────────────
  # 3. Deploy core. The lockstep root: every other deploy job depends
  #    on this one because their published poms reference
  #    `day8/re-frame2 {:mvn/version <VERSION>}` which the per-leaf
  #    rewrite step produces from this published version.
  # ─────────────────────────────────────────────────────────────────
  deploy-core:
    name: Deploy day8/re-frame2
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Clojure CLI
        run: "$GITHUB_WORKSPACE/.github/scripts/install-clojure-cli.sh"

      - name: Cache Maven / gitlibs
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: ${{ runner.os }}-clj-release-${{ hashFiles('implementation/**/deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-clj-release-
            ${{ runner.os }}-clj-

      - name: Read version
        id: version
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing version $version"

      - name: Deploy core (day8/re-frame2)
        working-directory: implementation/core
        env:
          CLOJARS_USERNAME: ${{ secrets.CLOJARS_USERNAME }}
          CLOJARS_PASSWORD: ${{ secrets.CLOJARS_PASSWORD }}
        run: clojure -M:clein deploy

  # ─────────────────────────────────────────────────────────────────
  # 4. Per-leaf deploys, fanned out via a single matrix-strategy job
  #    (rf2-i77u). All depend on deploy-core; none depend on each
  #    other (per Conventions §Packaging conventions §Independence
  #    rule). Matrix values run in parallel and `fail-fast: false`
  #    preserves the original behaviour: a single leaf failure does
  #    NOT halt sibling leaves — by design, since no value in THIS
  #    matrix appears in another value's published pom, so a
  #    partial-leaf-success is coherent (a consumer that pins schemas +
  #    core only is unaffected by a flows-deploy failure).
  #
  #    That premise is what makes `fail-fast: false` safe, so it has to
  #    stay true. The one leaf that DOES carry a published-pom edge to a
  #    sibling — ssr-ring → ssr — is deliberately NOT a value here; it
  #    is the `deploy-ssr-ring` job below, gated on this whole matrix
  #    succeeding (rf2-p4a93; see §The one inter-leaf edge at the top of
  #    this file). Do not move it back in, and do not add a value whose
  #    published :deps reference an in-repo artefact besides core: under
  #    `fail-fast: false` such a value can publish a coordinate that
  #    resolves to nothing while its sibling's deploy is red, and
  #    Clojars cannot undo that. _release-dag-policy.test.cjs enforces
  #    the split.
  #
  #    The github-release job depends on `deploy-leaf` (which waits for
  #    ALL matrix values to succeed) and on `deploy-ssr-ring`, so a
  #    partial deploy means no GitHub Release is cut and the next step
  #    is the recovery procedure documented at the top of this file.
  #
  #    Each matrix value:
  #      - re-installs core into the runner's local ~/.m2/repository so
  #        the leaf's pom dep on day8/re-frame2 ${{ version }} resolves
  #        without waiting for Clojars' index;
  #      - rewrites :local/root "../core" → :mvn/version "${VERSION}"
  #        in its own deps.edn (throwaway runner checkout, never
  #        committed) — the `local-root` axis carries the per-leaf
  #        relative path (substrate adapters live one level deeper, so
  #        they use "../../core");
  #      - deploys with `clojure -M:clein deploy`.
  # ─────────────────────────────────────────────────────────────────
  deploy-leaf:
    name: Deploy ${{ matrix.artefact }}
    needs: deploy-core
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - leaf: reagent
            artefact: day8/re-frame2-reagent
            directory: implementation/adapters/reagent
            local-root: ../../core
          - leaf: reagent-slim
            artefact: day8/reagent-slim
            directory: implementation/adapters/reagent-slim
            local-root: ../../core
          - leaf: uix
            artefact: day8/re-frame2-uix
            directory: implementation/adapters/uix
            local-root: ../../core
          - leaf: schemas
            artefact: day8/re-frame2-schemas
            directory: implementation/schemas
            local-root: ../core
          - leaf: machines
            artefact: day8/re-frame2-machines
            directory: implementation/machines
            local-root: ../core
          - leaf: routing
            artefact: day8/re-frame2-routing
            directory: implementation/routing
            local-root: ../core
          - leaf: flows
            artefact: day8/re-frame2-flows
            directory: implementation/flows
            local-root: ../core
          - leaf: http
            artefact: day8/re-frame2-http
            directory: implementation/http
            local-root: ../core
          - leaf: ssr
            artefact: day8/re-frame2-ssr
            directory: implementation/ssr
            local-root: ../core
          # NOTE — ssr-ring is NOT a value here. It is the one leaf whose
          # published :deps reference a SECOND in-repo artefact besides
          # core (day8/re-frame2-ssr, ../ssr, added by rf2-qmhysc), which
          # under `fail-fast: false` would let it publish an unresolvable
          # pom while the `ssr` value above is red. It lives in the
          # `deploy-ssr-ring` job below, ordered after this whole matrix
          # (rf2-p4a93).
          - leaf: resources
            artefact: day8/re-frame2-resources
            directory: implementation/resources
            local-root: ../core
          - leaf: epoch
            artefact: day8/re-frame2-epoch
            directory: implementation/epoch
            local-root: ../core
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Clojure CLI
        run: "$GITHUB_WORKSPACE/.github/scripts/install-clojure-cli.sh"

      - name: Cache Maven / gitlibs
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: ${{ runner.os }}-clj-release-${{ hashFiles('implementation/**/deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-clj-release-
            ${{ runner.os }}-clj-

      - name: Install core to runner ~/.m2
        # The leaf's pom dep on day8/re-frame2 ${{ needs.deploy-core.outputs.version }}
        # resolves from Maven Central / Clojars. Installing locally
        # first means the runner doesn't have to wait for Clojars'
        # index to refresh and avoids a window where deploy-core
        # succeeded but the artefact isn't yet discoverable. Local
        # install is cheap on top of the just-built jar in target/.
        working-directory: implementation/core
        run: clojure -M:clein install

      # rf2-ldkuk — the rewrite (and its fail-loud invariants) lives in
      # .github/scripts/rewrite-local-root-coord.sh, unit-tested via
      # implementation `npm run test:script-policy`
      # (scripts/_rewrite-local-root-coord.test.cjs).
      #
      # It matches the coordinate in CODE, ignoring EDN comments. The
      # previous inline version asserted a RAW substring count of 1, which
      # a prose comment quoting the same coordinate defeats — that is
      # precisely what made day8/reagent-slim unreleasable (its header
      # comment quotes `:local/root "../../core"`, so the count was 2 and
      # the step aborted). Counting only code keeps the invariant honest
      # instead of dependent on how the comments happen to be worded.
      #
      # ONE call per value: every leaf in this matrix has exactly one
      # in-repo coordinate (core). The leaf with a second one, ssr-ring,
      # is not in this matrix — see `deploy-ssr-ring` below, whose rewrite
      # step calls the script twice (rf2-p4a93).
      - name: Rewrite ${{ matrix.leaf }} :local/root → :mvn/version
        working-directory: ${{ matrix.directory }}
        env:
          VERSION: ${{ needs.deploy-core.outputs.version }}
          LOCAL_ROOT: ${{ matrix.local-root }}
        run: |
          set -euo pipefail
          "$GITHUB_WORKSPACE/.github/scripts/rewrite-local-root-coord.sh" "${LOCAL_ROOT}" "${VERSION}"
          grep "day8/re-frame2" deps.edn

      # ─────────────────────────────────────────────────────────────
      # reagent-slim publication-time ns rename (rf2-zvjme; extracted to
      # a source-controlled script per rf2-olo8rc).
      #
      # In-tree, the slim adapter ships at `re-frame.adapter.reagent-slim`
      # because the monorepo shadow-cljs build puts BOTH adapter source
      # trees on the same classpath — two namespaces with the same name
      # would clash. At publication time, downstream apps depend on
      # EXACTLY ONE of {day8/re-frame2-reagent, day8/reagent-slim} so the
      # adapter ns is single-source per app. Per the slim IMPL-SPEC §1.8
      # / §13.1 (and confirmed by the rf2-tba5e smoke-test findings),
      # the slim Maven artefact ships its adapter at the canonical
      # `re-frame.adapter.reagent` ns — so a downstream app's import line
      # is `(:require [re-frame.adapter.reagent :as ra])` regardless of
      # which adapter coord their deps.edn pins.
      #
      # The transform (mv reagent_slim.cljs → reagent.cljs + rewrite the
      # `(ns …)` form) and its fail-loud invariants now live in
      # .github/scripts/transform-reagent-slim-ns.sh, unit-tested via
      # implementation `npm run test:script-policy`
      # (scripts/_transform-reagent-slim-ns.test.cjs). The script runs on
      # the throwaway runner checkout before clein packages the jar; it
      # aborts (non-zero) if the source is missing, the destination
      # already exists, or the slim ns declaration is absent.
      # ─────────────────────────────────────────────────────────────
      - name: Rename adapter ns at publication (reagent-slim only)
        if: matrix.leaf == 'reagent-slim'
        working-directory: ${{ matrix.directory }}
        run: "$GITHUB_WORKSPACE/.github/scripts/transform-reagent-slim-ns.sh"

      # ─────────────────────────────────────────────────────────────
      # Pre-deploy package preflight (reagent-slim only; rf2-olo8rc).
      #
      # The transform above is the ONE release step where the published
      # artefact diverges from the tested tree — and nothing else verifies
      # the OUTPUT (jar ns set, pom dep set, consumer compile) before the
      # `clojure -M:clein deploy` below mutates Clojars, an irreversible
      # path (Clojars has no yank; recovery is bump-and-supersede).
      # test:reagent-slim:bundle-isolation runs off the monorepo classpath,
      # not the generated jar/pom, so it does NOT catch a bad publication
      # transform.
      #
      # This step builds the jar+pom from the renamed source via
      # `clojure -M:clein jar` (build only — NOT deploy), then asserts:
      #   - the jar CONTAINS re_frame/adapter/reagent.cljs (the canonical
      #     ns re-frame.adapter.reagent);
      #   - the jar does NOT contain reagent_slim (the slim ns is gone);
      #   - the generated pom has NO DIRECT day8/re-frame2-reagent dep and
      #     NO slim-owned DIRECT `reagent` dep. DIRECT-dep level ONLY:
      #     transitive reagent via day8/re-frame2 stays until core drops
      #     it, so a full-transitive absence assertion would be a false
      #     invariant today.
      #
      # A consumer-compile assertion (resolve [re-frame.adapter.reagent] +
      # [reagent2.core] from a temp project with day8/re-frame2-reagent
      # ABSENT) was scoped but the temp-project npm/shadow wiring is gnarly
      # on the runner; per the rf2-olo8rc fallback this step asserts
      # jar-content + pom-dep + ns-grep instead, which still catches every
      # failure the previous input-grep-only step missed.
      # ─────────────────────────────────────────────────────────────
      - name: Preflight — verify reagent-slim published package (reagent-slim only)
        if: matrix.leaf == 'reagent-slim'
        working-directory: ${{ matrix.directory }}
        run: "$GITHUB_WORKSPACE/.github/scripts/preflight-reagent-slim-package.sh"

      - name: Deploy ${{ matrix.leaf }} (${{ matrix.artefact }})
        working-directory: ${{ matrix.directory }}
        env:
          CLOJARS_USERNAME: ${{ secrets.CLOJARS_USERNAME }}
          CLOJARS_PASSWORD: ${{ secrets.CLOJARS_PASSWORD }}
        run: clojure -M:clein deploy

  # ─────────────────────────────────────────────────────────────────
  # 4b. Deploy ssr-ring — the ONE leaf with a published-pom edge to a
  #     sibling leaf, so it ships in a stage of its own AFTER the matrix
  #     (rf2-p4a93; the edge itself dates to rf2-qmhysc).
  #
  #     implementation/ssr-ring/deps.edn publishes a dependency on
  #     day8/re-frame2-ssr as well as day8/re-frame2, so this artefact's
  #     pom only resolves if the `ssr` matrix value above actually reached
  #     Clojars. `needs: deploy-leaf` waits for EVERY matrix value to
  #     SUCCEED, which is exactly what makes that true:
  #
  #       if the ssr leaf does not publish successfully, ssr-ring does
  #       not publish at all.
  #
  #     Keep this job OUT of the matrix. GitHub Actions cannot express an
  #     edge between two values of one matrix, and `fail-fast: false` up
  #     there means a red `ssr` value does not stop its siblings — so from
  #     inside the matrix this artefact could publish a coordinate that
  #     resolves to nothing, permanently, because Clojars has no yank. See
  #     §The one inter-leaf edge at the top of this file for the argument
  #     in full.
  #
  #     The single-value `matrix:` is not decoration. It keeps this leaf's
  #     identity (leaf / artefact / directory / local-root /
  #     extra-local-root) in the same declarative shape as the matrix
  #     above, which is what implementation/scripts/
  #     _rewrite-local-root-coord.test.cjs parses to prove every leaf's
  #     real deps.edn rewrites cleanly against the script. Flatten it and
  #     ssr-ring silently drops out of that fleet gate.
  # ─────────────────────────────────────────────────────────────────
  deploy-ssr-ring:
    name: Deploy ${{ matrix.artefact }}
    needs:
      - deploy-core
      - deploy-leaf
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - leaf: ssr-ring
            artefact: day8/re-frame2-ssr-ring
            directory: implementation/ssr-ring
            local-root: ../core
            extra-local-root: ../ssr
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Clojure CLI
        run: "$GITHUB_WORKSPACE/.github/scripts/install-clojure-cli.sh"

      - name: Cache Maven / gitlibs
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: ${{ runner.os }}-clj-release-${{ hashFiles('implementation/**/deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-clj-release-
            ${{ runner.os }}-clj-

      - name: Install core to runner ~/.m2
        # Same rationale as the matrix job's core install: skip the wait
        # on Clojars' index refresh for the coordinate deploy-core just
        # published.
        working-directory: implementation/core
        run: clojure -M:clein install

      # ssr-ring's published pom also depends on day8/re-frame2-ssr
      # ${{ needs.deploy-core.outputs.version }}. Because this job runs
      # only after `deploy-leaf` succeeded IN FULL, the `ssr` leaf has
      # already published that coordinate to Clojars by now, so this local
      # install is purely the index-latency shortcut the core install
      # above is — it is NOT what makes the dependency exist.
      #
      # Note what it does not do: resolving ssr from ~/.m2 means this job
      # never asks Clojars whether ssr is there, so the job cannot itself
      # detect a missing sibling. That detection is the `needs:` edge's
      # job. Keep the two together — drop the edge and this step turns
      # back into a mask, which is the rf2-p4a93 defect.
      - name: Install ssr to runner ~/.m2
        working-directory: implementation/ssr
        run: clojure -M:clein install

      # Two rewrites, one per in-repo coordinate — see the matrix job's
      # Rewrite step for what the script guarantees. ssr-ring is the only
      # leaf that needs the second call (rf2-qmhysc).
      - name: Rewrite ${{ matrix.leaf }} :local/root → :mvn/version
        working-directory: ${{ matrix.directory }}
        env:
          VERSION: ${{ needs.deploy-core.outputs.version }}
          LOCAL_ROOT: ${{ matrix.local-root }}
          EXTRA_LOCAL_ROOT: ${{ matrix.extra-local-root }}
        run: |
          set -euo pipefail
          "$GITHUB_WORKSPACE/.github/scripts/rewrite-local-root-coord.sh" "${LOCAL_ROOT}" "${VERSION}"
          "$GITHUB_WORKSPACE/.github/scripts/rewrite-local-root-coord.sh" "${EXTRA_LOCAL_ROOT}" "${VERSION}"
          grep "day8/re-frame2" deps.edn

      - name: Deploy ${{ matrix.leaf }} (${{ matrix.artefact }})
        working-directory: ${{ matrix.directory }}
        env:
          CLOJARS_USERNAME: ${{ secrets.CLOJARS_USERNAME }}
          CLOJARS_PASSWORD: ${{ secrets.CLOJARS_PASSWORD }}
        run: clojure -M:clein deploy

  # ─────────────────────────────────────────────────────────────────
  # 5. GitHub Release. Cuts only after every leaf has shipped —
  #    including the ssr-ring stage — so a partial deploy means no
  #    Release is created and the next step is the recovery procedure
  #    documented at the top of this file.
  # ─────────────────────────────────────────────────────────────────
  github-release:
    name: Create GitHub Release
    # A `needs` entry referencing a matrix job waits for ALL of its
    # matrix values to succeed, so `deploy-leaf` alone covers the eleven
    # independent leaves. `deploy-ssr-ring` is listed separately because
    # it is its own job (rf2-p4a93); without it here, a SKIPPED ssr-ring
    # stage would still cut a Release announcing the artefact.
    needs:
      - deploy-core
      - deploy-leaf
      - deploy-ssr-ring
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Create GitHub Release
        # Mirrors re-frame v1's release-notes pattern — minimal body
        # with a link back to the CHANGELOG. Mike updates CHANGELOG.md
        # in the same release commit before tagging.
        #
        # The CHANGELOG link is pinned to the TAG ref, not `main`. A
        # Maven version is immutable once Clojars has it, so the release
        # body must keep pointing at the CHANGELOG as it stood when that
        # version shipped; a `blob/main` link lets any later edit on main
        # silently rewrite the historical account of a shipped release.
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda  # v3.0.0
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            See [CHANGELOG.md](https://github.com/day8/re-frame2/blob/${{ github.ref_name }}/CHANGELOG.md) for release notes.

            Artefacts published to Clojars:
            - `day8/re-frame2` ${{ needs.deploy-core.outputs.version }}
            - `day8/re-frame2-reagent` ${{ needs.deploy-core.outputs.version }}
            - `day8/reagent-slim` ${{ needs.deploy-core.outputs.version }}
            - `day8/re-frame2-uix` ${{ needs.deploy-core.outputs.version }}
            - `day8/re-frame2-schemas` ${{ needs.deploy-core.outputs.version }}
            - `day8/re-frame2-machines` ${{ needs.deploy-core.outputs.version }}
            - `day8/re-frame2-routing` ${{ needs.deploy-core.outputs.version }}
            - `day8/re-frame2-flows` ${{ needs.deploy-core.outputs.version }}
            - `day8/re-frame2-http` ${{ needs.deploy-core.outputs.version }}
            - `day8/re-frame2-ssr` ${{ needs.deploy-core.outputs.version }}
            - `day8/re-frame2-ssr-ring` ${{ needs.deploy-core.outputs.version }}
            - `day8/re-frame2-resources` ${{ needs.deploy-core.outputs.version }}
            - `day8/re-frame2-epoch` ${{ needs.deploy-core.outputs.version }}
          draft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
