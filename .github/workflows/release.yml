# Release workflow: multi-artefact lockstep deploy.
#
# # Topological deploy DAG
#
#   verify-version-lockstep ──► test ──► deploy-core
#                                         │
#                                         │   ── deploy-leaf: ONE matrix job,
#                                         │      9 values, all in parallel ──
#                                         ├── deploy-schemas
#                                         ├── deploy-reagent
#                                         ├── deploy-uix
#                                         ├── deploy-machines
#                                         ├── deploy-routing
#                                         ├── deploy-flows
#                                         ├── deploy-http
#                                         ├── deploy-ssr
#                                         └── deploy-epoch
#                                                  │
#                         ┌────────────────────────┼────────────────────────┐
#                         ▼                        ▼                        ▼
#                  deploy-ssr-ring           deploy-fresco          deploy-resources
#                         └────────────────────────┼────────────────────────┘
#                                                  ▼
#                                          github-release
#
# Every per-feature artefact's *published* :deps depends only on core
# (`day8/re-frame2`) — with THREE exceptions: `day8/re-frame2-ssr-ring`
# and `day8/re-frame2-fresco` each also publish a dependency on
# `day8/re-frame2-ssr`, and `day8/re-frame2-resources` one on
# `day8/re-frame2-http`, its one read transport (see §The inter-leaf
# edges below). Cross-feature references at runtime are otherwise wired
# through `re-frame.late-bind` per Spec 006 §Adapter shipping convention
# and the Conventions §Packaging conventions §Independence rule. The DAG
# above reflects that: once core has shipped, every INDEPENDENT leaf
# artefact is publishable on its own and they fan out in parallel, and
# the three DEPENDENT leaves ship in stages of their own after them.
# The independent leaves are the per-feature artefacts (schemas,
# machines, routing, flows, http, ssr, epoch) plus the
# substrate-adapter leaves (reagent, uix). The per-feature
# split set is closed; an addition requires a new Spec-ulation increment.
#
# # The inter-leaf edges: ssr-ring and fresco depend on ssr, resources on http
#
# implementation/ssr-ring/deps.edn declares TWO in-repo coordinates in
# its published :deps — day8/re-frame2 (../core) AND day8/re-frame2-ssr
# (../ssr) — and the Rewrite step turns BOTH into :mvn/version. So the
# pom this workflow publishes for day8/re-frame2-ssr-ring carries a hard
# dependency on a day8/re-frame2-ssr version that has to EXIST on
# Clojars.
#
# implementation/fresco/deps.edn declares the SAME pair, for a
# different reason: `re-frame.fresco.server` hands its payload to the
# ssr artefact's own fail-closed validator and egress projection rather
# than re-spelling those helpers locally, so the packaging graph is the
# DAG fresco -> ssr -> core. Same shape, same hazard, same remedy.
#
# implementation/resources/deps.edn declares day8/re-frame2-http (../http)
# beside core, because managed HTTP is resources' one read transport and
# `re-frame.resources` requires `re-frame.http.managed`: the packaging graph
# is resources -> http -> core. Same shape again, with http in ssr's place.
#
# Those edges are load-bearing on the DAG because Clojars has no yank.
# If ssr-ring published while the ssr leaf had failed,
# day8/re-frame2-ssr-ring <VERSION> would sit on Clojars permanently
# declaring a dependency that resolves to nothing; bump-and-supersede
# (§Failure recovery below) adds a good version but cannot remove the
# broken one, so a consumer pinning the original gets an unresolvable
# tree forever. And no dependent leaf can notice from inside its own
# job: each installs its sibling (ssr or http) into the runner's ~/.m2,
# so it never asks Clojars whether that sibling is there.
#
# The ordering is therefore STRUCTURAL, not conventional.
# `deploy-ssr-ring`, `deploy-fresco` and `deploy-resources` are each
# their own job with `needs: [deploy-core, deploy-leaf]`, and a `needs`
# edge onto a matrix job waits for EVERY value to SUCCEED. That buys
# exactly the invariant:
#
#   if the ssr leaf does not publish successfully, neither ssr-ring nor
#   fresco publishes at all; if the http leaf does not, resources does
#   not.
#
# `needs: deploy-leaf` is deliberately STRONGER than the pom edge — it
# also blocks them behind leaves they do not depend on (flows, epoch,
# …). That costs nothing. GitHub Actions cannot express an edge
# between two values of one matrix, so the choice was between depending
# on the whole matrix or hoisting a second job out of it; and under
# §Failure recovery ANY leaf failure is resolved by bumping VERSION and
# re-shipping every artefact, so a leaf skipped because a sibling failed
# would be superseded regardless. Erring toward "do not publish"
# is free here, and the failure it prevents is irreversible.
#
# The three stages are SIBLINGS, not a chain: none of the three artefacts
# appears in another's published pom, so they run in parallel after the
# matrix.
#
# Guarded mechanically by implementation/scripts/_release-dag-policy.test.cjs
# (`npm run test:script-policy`), which parses this file's job graph and
# fails if a leaf carrying a second in-repo coordinate is ever placed in
# the fail-fast:false matrix, or if any stage loses its ordering edge.
#
# # Lockstep versioning policy through 1.0
#
# Pre-1.0, every artefact ships at the same version, sourced from the
# repo-root VERSION file via :clein/build :version "../../VERSION" in
# each artefact's deps.edn. The `verify-version-lockstep` job enforces
# the contract before we touch Clojars. Independent versioning is a
# post-1.0 question.
#
# # Failure recovery
#
# Clojars does not support yanking a published version. If the deploy
# DAG fails part-way through (e.g. core ships but deploy-schemas
# crashes), DO NOT attempt to re-run with the same tag — Clojars will
# 409 on the duplicate core upload and the workflow will appear stuck.
# Recovery procedure (per docs/release-process.md §Recovery):
#
#   1. Diagnose & fix the cause locally.
#   2. Bump VERSION in a release-recovery commit (e.g. 0.0.1.alpha →
#      0.0.1.alpha-1, or vX.Y.Z → vX.Y.Z+1).
#   3. Re-tag with the bumped VERSION.
#   4. Re-run; the workflow ships every artefact at the new version,
#      preserving the lockstep contract. The partial-release artefacts
#      from the failed run are tombstoned-by-supersession on the
#      consumer side: the next release ships every artefact at the
#      bumped version, so a consumer pinning the bumped version pulls a
#      coherent set.
#
# # Modeled on re-frame v1's continuous-deployment-workflow.yml
#
# Same shape: tag-push trigger, gated on the same checks the regular
# `test.yml` runs (JVM, CLJS, elision probe). Each artefact's own
# directory carries its `:clein/build` descriptor; deploy is
# `clojure -M:clein deploy` from that directory, with the
# :local/root → :mvn/version rewrite happening on the throwaway runner
# checkout (see the Rewrite step in each per-artefact deploy job).
#
# # Secrets
#
# CLOJARS_USERNAME and CLOJARS_PASSWORD are configured at the
# repository level. Per re-frame v1 convention, CLOJARS_PASSWORD
# carries a Clojars deploy token (the username sees the token as the
# password) — neither is committed; both are GHA secrets.
#
# # First publish protocol
#
# Mike runs the first deploy manually after reviewing the workflow on a
# tagged commit. Subsequent releases run automatically on tag push.

name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

jobs:
  # ─────────────────────────────────────────────────────────────────
  # 1. Lockstep version contract gate.
  #
  # Asserts every artefact's :clein/build :version points at the
  # repo-root VERSION file, and every non-core artefact references core
  # via {:local/root "../core"}. Fails fast if a hand-edit has broken
  # the lockstep contract.
  # ─────────────────────────────────────────────────────────────────
  verify-version-lockstep:
    name: Verify lockstep version contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Verify VERSION matches tag
        # Sanity check: the pushed tag must match the repo-root VERSION
        # file content (prefixed with `v`). Catches accidental tags.
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version="$(tr -d '[:space:]' < VERSION)"
          expected="v${version}"
          if [ "$tag" != "$expected" ]; then
            echo "::error::tag '$tag' does not match VERSION '$expected'"
            exit 1
          fi
          echo "tag $tag matches VERSION $expected — proceeding"

      - name: Verify lockstep version contract (rf2-ace2)
        run: ./.github/scripts/verify-version-lockstep.sh

  # ─────────────────────────────────────────────────────────────────
  # 2. Pre-release test gate. Same checks as the regular tests
  #    workflow; gates every deploy job below.
  # ─────────────────────────────────────────────────────────────────
  test:
    name: Pre-release test gate
    needs: verify-version-lockstep
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: implementation/package-lock.json

      - name: Set up Clojure CLI
        run: "$GITHUB_WORKSPACE/.github/scripts/install-clojure-cli.sh"

      - name: Cache Maven / gitlibs
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: ${{ runner.os }}-clj-release-${{ hashFiles('implementation/**/deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-clj-release-
            ${{ runner.os }}-clj-

      - name: JVM tests (core artefact)
        working-directory: implementation/core
        run: clojure -M:test

      # The Reagent adapter :test alias has no JVM-runnable tests of its
      # own (the adapter ns is :cljs-only), so it is a declared classpath/
      # deps probe (`--probe`) and exits 0 on zero tests. The UIx adapter
      # :test alias is NOT a probe: it carries two JVM-side guards and
      # takes the runner's test-count floor. Either way a non-zero exit
      # means a REAL failure (a failing guard or a deps/classpath break)
      # and MUST stop the release, so no `|| echo` fallback swallows it —
      # mirrors the `JVM implementation/adapters/reagent (test)` and
      # `JVM implementation/adapters/uix (test)` legs of test.yml's `jvm` job.
      - name: JVM tests (reagent artefact, classpath probe)
        working-directory: implementation/adapters/reagent
        run: clojure -M:test

      - name: JVM tests (uix artefact, classpath probe)
        working-directory: implementation/adapters/uix
        run: clojure -M:test

      - name: JVM tests (schemas artefact)
        working-directory: implementation/schemas
        run: clojure -M:test

      - name: JVM tests (machines artefact)
        working-directory: implementation/machines
        run: clojure -M:test

      - name: JVM tests (routing artefact)
        working-directory: implementation/routing
        run: clojure -M:test

      - name: JVM tests (flows artefact)
        working-directory: implementation/flows
        run: clojure -M:test

      - name: JVM tests (http artefact)
        working-directory: implementation/http
        run: clojure -M:test

      - name: JVM tests (ssr artefact)
        working-directory: implementation/ssr
        run: clojure -M:test

      # ssr-ring + resources are publishable :clein/build
      # artefacts deployed below, so their JVM suites MUST
      # gate the release alongside the other per-feature artefacts.
      # ssr-ring is the Ring/Pedestal host adapter (spins up a real Jetty
      # host on an ephemeral port in its e2e validator); resources is the
      # EP-0003 declarative server-state runtime (FSM + in-flight attempts +
      # managed-HTTP + invalidation/GC + routing/SSR integrations).
      - name: JVM tests (ssr-ring artefact)
        working-directory: implementation/ssr-ring
        run: clojure -M:test

      - name: JVM tests (resources artefact)
        working-directory: implementation/resources
        run: clojure -M:test

      - name: JVM tests (epoch artefact)
        working-directory: implementation/epoch
        run: clojure -M:test

      # What a consumer resolves, asked before anything below publishes:
      # every artefact is built as jar + POM the way the deploy jobs build it,
      # and each documented coordinate set must resolve each documented
      # require to exactly one classpath file. The suites above all run on
      # in-repo classpaths no consumer has, and Clojars has no yank.
      - name: Consumer classpath (documented sets resolve every documented require exactly once)
        run: "$GITHUB_WORKSPACE/.github/scripts/check-consumer-classpath.sh"

      - name: npm install
        working-directory: implementation
        run: npm ci

      - name: CLJS tests (node-test)
        working-directory: implementation
        run: npm run test:cljs

      - name: CLJS production elision probe
        working-directory: implementation
        run: npm run test:elision

      - name: CLJS per-feature bundle isolation
        working-directory: implementation
        run: npm run test:bundle-isolation

  # ─────────────────────────────────────────────────────────────────
  # 3. Deploy core. The lockstep root: every other deploy job depends
  #    on this one because their published poms reference
  #    `day8/re-frame2 {:mvn/version <VERSION>}` which the per-leaf
  #    rewrite step produces from this published version.
  # ─────────────────────────────────────────────────────────────────
  deploy-core:
    name: Deploy day8/re-frame2
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Clojure CLI
        run: "$GITHUB_WORKSPACE/.github/scripts/install-clojure-cli.sh"

      - name: Cache Maven / gitlibs
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: ${{ runner.os }}-clj-release-${{ hashFiles('implementation/**/deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-clj-release-
            ${{ runner.os }}-clj-

      - name: Read version
        id: version
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing version $version"

      - name: Deploy core (day8/re-frame2)
        working-directory: implementation/core
        env:
          CLOJARS_USERNAME: ${{ secrets.CLOJARS_USERNAME }}
          CLOJARS_PASSWORD: ${{ secrets.CLOJARS_PASSWORD }}
        run: clojure -M:clein deploy

  # ─────────────────────────────────────────────────────────────────
  # 4. Per-leaf deploys, fanned out via a single matrix-strategy job
  #    All depend on deploy-core; none depend on each
  #    other (per Conventions §Packaging conventions §Independence
  #    rule). Matrix values run in parallel and under `fail-fast: false`
  #    a single leaf failure does
  #    NOT halt sibling leaves — by design, since no value in THIS
  #    matrix appears in another value's published pom, so a
  #    partial-leaf-success is coherent (a consumer that pins schemas +
  #    core only is unaffected by a flows-deploy failure).
  #
  #    That premise is what makes `fail-fast: false` safe, so it has to
  #    stay true. The three leaves that DO carry a published-pom edge to
  #    a sibling — ssr-ring → ssr, fresco → ssr and resources → http — are
  #    deliberately NOT values here; they are the `deploy-ssr-ring`,
  #    `deploy-fresco` and `deploy-resources` jobs below, each gated on
  #    this whole matrix succeeding (see §The inter-leaf edges at the top
  #    of this file). Do not move any of them back in, and do not add a
  #    value whose published
  #    :deps reference an in-repo artefact besides core: under
  #    `fail-fast: false` such a value can publish a coordinate that
  #    resolves to nothing while its sibling's deploy is red, and
  #    Clojars cannot undo that. _release-dag-policy.test.cjs enforces
  #    the split.
  #
  #    The github-release job depends on `deploy-leaf` (which waits for
  #    ALL matrix values to succeed) and on all three post-matrix stages, so a
  #    partial deploy means no GitHub Release is cut and the next step
  #    is the recovery procedure documented at the top of this file.
  #
  #    Each matrix value:
  #      - re-installs core into the runner's local ~/.m2/repository so
  #        the leaf's pom dep on day8/re-frame2 ${{ version }} resolves
  #        without waiting for Clojars' index;
  #      - rewrites :local/root "../core" → :mvn/version "${VERSION}"
  #        in its own deps.edn (throwaway runner checkout, never
  #        committed) — the `local-root` axis carries the per-leaf
  #        relative path (substrate adapters live one level deeper, so
  #        they use "../../core");
  #      - deploys with `clojure -M:clein deploy`.
  # ─────────────────────────────────────────────────────────────────
  deploy-leaf:
    name: Deploy ${{ matrix.artefact }}
    needs: deploy-core
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - leaf: reagent
            artefact: day8/re-frame2-reagent
            directory: implementation/adapters/reagent
            local-root: ../../core
          - leaf: uix
            artefact: day8/re-frame2-uix
            directory: implementation/adapters/uix
            local-root: ../../core
          - leaf: schemas
            artefact: day8/re-frame2-schemas
            directory: implementation/schemas
            local-root: ../core
          - leaf: machines
            artefact: day8/re-frame2-machines
            directory: implementation/machines
            local-root: ../core
          - leaf: routing
            artefact: day8/re-frame2-routing
            directory: implementation/routing
            local-root: ../core
          - leaf: flows
            artefact: day8/re-frame2-flows
            directory: implementation/flows
            local-root: ../core
          - leaf: http
            artefact: day8/re-frame2-http
            directory: implementation/http
            local-root: ../core
          - leaf: ssr
            artefact: day8/re-frame2-ssr
            directory: implementation/ssr
            local-root: ../core
          # NOTE — ssr-ring, fresco and resources are NOT values here.
          # They are the three leaves whose published :deps reference a
          # SECOND in-repo artefact besides core (day8/re-frame2-ssr at
          # ../ssr for the first two, day8/re-frame2-http at ../http for
          # resources), which under `fail-fast: false` would let any of
          # them publish an unresolvable pom while its sibling's value
          # above is red. They live in the `deploy-ssr-ring`,
          # `deploy-fresco` and `deploy-resources` jobs below, each
          # ordered after this whole matrix.
          - leaf: epoch
            artefact: day8/re-frame2-epoch
            directory: implementation/epoch
            local-root: ../core
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Clojure CLI
        run: "$GITHUB_WORKSPACE/.github/scripts/install-clojure-cli.sh"

      - name: Cache Maven / gitlibs
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: ${{ runner.os }}-clj-release-${{ hashFiles('implementation/**/deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-clj-release-
            ${{ runner.os }}-clj-

      - name: Install core to runner ~/.m2
        # The leaf's pom dep on day8/re-frame2 ${{ needs.deploy-core.outputs.version }}
        # resolves from Maven Central / Clojars. Installing locally
        # first means the runner doesn't have to wait for Clojars'
        # index to refresh and avoids a window where deploy-core
        # succeeded but the artefact isn't yet discoverable. Local
        # install is cheap on top of the just-built jar in target/.
        working-directory: implementation/core
        run: clojure -M:clein install

      # The rewrite (and its fail-loud invariants) lives in
      # .github/scripts/rewrite-local-root-coord.sh, unit-tested via
      # implementation `npm run test:script-policy`
      # (scripts/_rewrite-local-root-coord.test.cjs).
      #
      # It matches the coordinate in CODE, ignoring EDN comments. A RAW
      # substring count of 1 would be defeated by a prose comment quoting
      # the same coordinate (`:local/root "../../core"`), so a raw count
      # would read 2 and the step would abort. Counting only code keeps the
      # invariant honest instead of dependent on how the comments happen to
      # be worded.
      #
      # ONE call per value: every leaf in this matrix has exactly one
      # in-repo coordinate (core). The three leaves with a second one,
      # ssr-ring, fresco and resources, are not in this matrix — see
      # `deploy-ssr-ring`, `deploy-fresco` and `deploy-resources` below,
      # whose rewrite steps call the script twice.
      - name: Rewrite ${{ matrix.leaf }} :local/root → :mvn/version
        working-directory: ${{ matrix.directory }}
        env:
          VERSION: ${{ needs.deploy-core.outputs.version }}
          LOCAL_ROOT: ${{ matrix.local-root }}
        run: |
          set -euo pipefail
          "$GITHUB_WORKSPACE/.github/scripts/rewrite-local-root-coord.sh" "${LOCAL_ROOT}" "${VERSION}"
          grep "day8/re-frame2" deps.edn

      - name: Deploy ${{ matrix.leaf }} (${{ matrix.artefact }})
        working-directory: ${{ matrix.directory }}
        env:
          CLOJARS_USERNAME: ${{ secrets.CLOJARS_USERNAME }}
          CLOJARS_PASSWORD: ${{ secrets.CLOJARS_PASSWORD }}
        run: clojure -M:clein deploy

  # ─────────────────────────────────────────────────────────────────
  # 4b. Deploy ssr-ring — one of the three leaves with a published-pom
  #     edge to a sibling leaf, so it ships in a stage of its own AFTER
  #     the matrix. Its sibling stages are `deploy-fresco` (4c) — same
  #     shape, same edge onto `ssr` — and `deploy-resources` (4d), whose
  #     edge runs onto `http`; the three run in parallel because none
  #     appears in another's published pom.
  #
  #     implementation/ssr-ring/deps.edn publishes a dependency on
  #     day8/re-frame2-ssr as well as day8/re-frame2, so this artefact's
  #     pom only resolves if the `ssr` matrix value above actually reached
  #     Clojars. `needs: deploy-leaf` waits for EVERY matrix value to
  #     SUCCEED, which is exactly what makes that true:
  #
  #       if the ssr leaf does not publish successfully, ssr-ring does
  #       not publish at all.
  #
  #     Keep this job OUT of the matrix. GitHub Actions cannot express an
  #     edge between two values of one matrix, and `fail-fast: false` up
  #     there means a red `ssr` value does not stop its siblings — so from
  #     inside the matrix this artefact could publish a coordinate that
  #     resolves to nothing, permanently, because Clojars has no yank. See
  #     §The inter-leaf edges at the top of this file for the argument
  #     in full.
  #
  #     The single-value `matrix:` is not decoration. It keeps this leaf's
  #     identity (leaf / artefact / directory / local-root /
  #     extra-local-root) in the same declarative shape as the matrix
  #     above, which is what implementation/scripts/
  #     _rewrite-local-root-coord.test.cjs parses to prove every leaf's
  #     real deps.edn rewrites cleanly against the script. Flatten it and
  #     ssr-ring silently drops out of that fleet gate.
  # ─────────────────────────────────────────────────────────────────
  deploy-ssr-ring:
    name: Deploy ${{ matrix.artefact }}
    needs:
      - deploy-core
      - deploy-leaf
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - leaf: ssr-ring
            artefact: day8/re-frame2-ssr-ring
            directory: implementation/ssr-ring
            local-root: ../core
            extra-local-root: ../ssr
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Clojure CLI
        run: "$GITHUB_WORKSPACE/.github/scripts/install-clojure-cli.sh"

      - name: Cache Maven / gitlibs
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: ${{ runner.os }}-clj-release-${{ hashFiles('implementation/**/deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-clj-release-
            ${{ runner.os }}-clj-

      - name: Install core to runner ~/.m2
        # Same rationale as the matrix job's core install: skip the wait
        # on Clojars' index refresh for the coordinate deploy-core just
        # published.
        working-directory: implementation/core
        run: clojure -M:clein install

      # ssr-ring's published pom also depends on day8/re-frame2-ssr
      # ${{ needs.deploy-core.outputs.version }}. Because this job runs
      # only after `deploy-leaf` succeeded IN FULL, the `ssr` leaf has
      # already published that coordinate to Clojars by now, so this local
      # install is purely the index-latency shortcut the core install
      # above is — it is NOT what makes the dependency exist.
      #
      # Note what it does not do: resolving ssr from ~/.m2 means this job
      # never asks Clojars whether ssr is there, so the job cannot itself
      # detect a missing sibling. That detection is the `needs:` edge's
      # job. Keep the two together — drop the edge and this step becomes
      # a mask over a missing sibling.
      #
      # POM FIDELITY OF THIS INSTALL. This is one of the clein
      # invocations in the workflow that run against an UN-REWRITTEN
      # deps.edn: the Rewrite step below edits ssr-ring's file, never
      # ssr's, so `implementation/ssr/deps.edn` still says
      # {:local/root "../core"} at this point. That is inert rather than
      # merely fail-safe. `clein install` is `clean` + `copy-src` + `b/jar` +
      # `b/install` and never calls `write-pom`, so it installs the JAR
      # ALONE — no sibling `.pom` in ~/.m2 and none inside the jar. The
      # locally-installed day8/re-frame2-ssr therefore declares no
      # dependencies at all; a pom-less local artefact resolves silently
      # and contributes nothing transitively. Nothing here needs it to:
      # ssr-ring names day8/re-frame2 as its OWN direct top-level
      # coordinate, separately rewritten and separately installed by the
      # core step above, so this job's classpath never walks an edge
      # through ssr's metadata.
      #
      # And the pom that consumers actually get is a different artefact
      # entirely — it is built by the `ssr` value of the deploy-leaf
      # matrix, whose Rewrite step runs BEFORE its clein deploy, so the
      # published day8/re-frame2-ssr pom carries
      # `day8/re-frame2 <VERSION>` correctly. Generating both poms from
      # this leaf shows it: un-rewritten prints "Skipping coordinate:
      # {:local/root …/core …}" and emits org.clojure/clojure only;
      # rewritten emits day8/re-frame2 at the release version.
      - name: Install ssr to runner ~/.m2
        working-directory: implementation/ssr
        run: clojure -M:clein install

      # Two rewrites, one per in-repo coordinate — see the matrix job's
      # Rewrite step for what the script guarantees. ssr-ring, fresco and
      # resources are the only leaves that need the second call.
      - name: Rewrite ${{ matrix.leaf }} :local/root → :mvn/version
        working-directory: ${{ matrix.directory }}
        env:
          VERSION: ${{ needs.deploy-core.outputs.version }}
          LOCAL_ROOT: ${{ matrix.local-root }}
          EXTRA_LOCAL_ROOT: ${{ matrix.extra-local-root }}
        run: |
          set -euo pipefail
          "$GITHUB_WORKSPACE/.github/scripts/rewrite-local-root-coord.sh" "${LOCAL_ROOT}" "${VERSION}"
          "$GITHUB_WORKSPACE/.github/scripts/rewrite-local-root-coord.sh" "${EXTRA_LOCAL_ROOT}" "${VERSION}"
          grep "day8/re-frame2" deps.edn

      - name: Deploy ${{ matrix.leaf }} (${{ matrix.artefact }})
        working-directory: ${{ matrix.directory }}
        env:
          CLOJARS_USERNAME: ${{ secrets.CLOJARS_USERNAME }}
          CLOJARS_PASSWORD: ${{ secrets.CLOJARS_PASSWORD }}
        run: clojure -M:clein deploy

  # ─────────────────────────────────────────────────────────────────
  # 4c. Deploy fresco — another leaf with a published-pom edge to a
  #     sibling leaf. Everything 4b says applies verbatim:
  #     implementation/fresco/deps.edn publishes day8/re-frame2 AND
  #     day8/re-frame2-ssr, so its pom only resolves if the `ssr` matrix
  #     value actually reached Clojars, and `needs: deploy-leaf` — which
  #     waits for EVERY matrix value to SUCCEED — is what makes that
  #     structural rather than conventional:
  #
  #       if the ssr leaf does not publish successfully, fresco does
  #       not publish at all.
  #
  #     A SEPARATE JOB rather than a second value of 4b's matrix. Two
  #     values of one matrix cannot be ordered against each other, and
  #     the workflow's posture is that a leaf which cannot be ordered
  #     does not go in a matrix beside the thing it might need. Nothing
  #     here needs ssr-ring and nothing there needs fresco, so the two
  #     stages are independent and run in parallel; keeping them apart
  #     costs one job and keeps each irreversible publish inside its own
  #     failure boundary.
  #
  #     The single-value `matrix:` is not decoration, for the same reason
  #     4b's is not: it keeps this leaf's identity (leaf / artefact /
  #     directory / local-root / extra-local-root) in the declarative
  #     shape that implementation/scripts/_rewrite-local-root-coord.test.cjs
  #     parses to prove the real deps.edn rewrites cleanly against the
  #     script, and that _release-dag-policy.test.cjs reads to discover
  #     what this workflow publishes.
  # ─────────────────────────────────────────────────────────────────
  deploy-fresco:
    name: Deploy ${{ matrix.artefact }}
    needs:
      - deploy-core
      - deploy-leaf
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - leaf: fresco
            artefact: day8/re-frame2-fresco
            directory: implementation/fresco
            local-root: ../core
            extra-local-root: ../ssr
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Clojure CLI
        run: "$GITHUB_WORKSPACE/.github/scripts/install-clojure-cli.sh"

      - name: Cache Maven / gitlibs
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: ${{ runner.os }}-clj-release-${{ hashFiles('implementation/**/deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-clj-release-
            ${{ runner.os }}-clj-

      - name: Install core to runner ~/.m2
        # Same rationale as the matrix job's core install: skip the wait
        # on Clojars' index refresh for the coordinate deploy-core just
        # published.
        working-directory: implementation/core
        run: clojure -M:clein install

      # The same index-latency shortcut, and the same non-property, as
      # deploy-ssr-ring's ssr install: resolving ssr from ~/.m2 means this
      # job never asks Clojars whether ssr is there, so the job cannot
      # itself detect a missing sibling. That detection is the `needs:`
      # edge's job — keep the two together. See the POM FIDELITY note in
      # 4b for why installing from an UN-REWRITTEN
      # implementation/ssr/deps.edn is inert here: `clein install` writes
      # no pom, and the pom consumers actually get is built by the `ssr`
      # value of the deploy-leaf matrix, after its own rewrite.
      - name: Install ssr to runner ~/.m2
        working-directory: implementation/ssr
        run: clojure -M:clein install

      # Two rewrites, one per in-repo coordinate — see the matrix job's
      # Rewrite step for what the script guarantees.
      - name: Rewrite ${{ matrix.leaf }} :local/root → :mvn/version
        working-directory: ${{ matrix.directory }}
        env:
          VERSION: ${{ needs.deploy-core.outputs.version }}
          LOCAL_ROOT: ${{ matrix.local-root }}
          EXTRA_LOCAL_ROOT: ${{ matrix.extra-local-root }}
        run: |
          set -euo pipefail
          "$GITHUB_WORKSPACE/.github/scripts/rewrite-local-root-coord.sh" "${LOCAL_ROOT}" "${VERSION}"
          "$GITHUB_WORKSPACE/.github/scripts/rewrite-local-root-coord.sh" "${EXTRA_LOCAL_ROOT}" "${VERSION}"
          grep "day8/re-frame2" deps.edn

      - name: Deploy ${{ matrix.leaf }} (${{ matrix.artefact }})
        working-directory: ${{ matrix.directory }}
        env:
          CLOJARS_USERNAME: ${{ secrets.CLOJARS_USERNAME }}
          CLOJARS_PASSWORD: ${{ secrets.CLOJARS_PASSWORD }}
        run: clojure -M:clein deploy

  # ─────────────────────────────────────────────────────────────────
  # 4d. Deploy resources — the leaf whose published-pom edge runs to
  #     http rather than ssr. implementation/resources/deps.edn
  #     publishes day8/re-frame2 AND day8/re-frame2-http, because managed
  #     HTTP is resources' one read transport, so its pom only resolves
  #     if the `http` matrix value actually reached Clojars. Everything
  #     4b says applies with http in ssr's place: `needs: deploy-leaf`,
  #     which waits for EVERY matrix value to SUCCEED, is what makes
  #     that structural rather than conventional:
  #
  #       if the http leaf does not publish successfully, resources does
  #       not publish at all.
  #
  #     The single-value `matrix:` is not decoration, for the same reason
  #     4b's is not: _rewrite-local-root-coord.test.cjs and
  #     _release-dag-policy.test.cjs both read this leaf's identity from
  #     it.
  # ─────────────────────────────────────────────────────────────────
  deploy-resources:
    name: Deploy ${{ matrix.artefact }}
    needs:
      - deploy-core
      - deploy-leaf
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - leaf: resources
            artefact: day8/re-frame2-resources
            directory: implementation/resources
            local-root: ../core
            extra-local-root: ../http
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Clojure CLI
        run: "$GITHUB_WORKSPACE/.github/scripts/install-clojure-cli.sh"

      - name: Cache Maven / gitlibs
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: ${{ runner.os }}-clj-release-${{ hashFiles('implementation/**/deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-clj-release-
            ${{ runner.os }}-clj-

      - name: Install core to runner ~/.m2
        # Same rationale as the matrix job's core install: skip the wait
        # on Clojars' index refresh for the coordinate deploy-core just
        # published.
        working-directory: implementation/core
        run: clojure -M:clein install

      # The same index-latency shortcut, and the same non-property, as
      # deploy-ssr-ring's ssr install, with http in ssr's place: resolving
      # http from ~/.m2 means this job never asks Clojars whether http is
      # there, so the job cannot itself detect a missing sibling. That
      # detection is the `needs:` edge's job — keep the two together. The
      # POM FIDELITY note in 4b applies too: `clein install` writes no pom,
      # and the pom consumers actually get is built by the `http` value of
      # the deploy-leaf matrix, after its own rewrite.
      - name: Install http to runner ~/.m2
        working-directory: implementation/http
        run: clojure -M:clein install

      # Two rewrites, one per in-repo coordinate — see the matrix job's
      # Rewrite step for what the script guarantees.
      - name: Rewrite ${{ matrix.leaf }} :local/root → :mvn/version
        working-directory: ${{ matrix.directory }}
        env:
          VERSION: ${{ needs.deploy-core.outputs.version }}
          LOCAL_ROOT: ${{ matrix.local-root }}
          EXTRA_LOCAL_ROOT: ${{ matrix.extra-local-root }}
        run: |
          set -euo pipefail
          "$GITHUB_WORKSPACE/.github/scripts/rewrite-local-root-coord.sh" "${LOCAL_ROOT}" "${VERSION}"
          "$GITHUB_WORKSPACE/.github/scripts/rewrite-local-root-coord.sh" "${EXTRA_LOCAL_ROOT}" "${VERSION}"
          grep "day8/re-frame2" deps.edn

      - name: Deploy ${{ matrix.leaf }} (${{ matrix.artefact }})
        working-directory: ${{ matrix.directory }}
        env:
          CLOJARS_USERNAME: ${{ secrets.CLOJARS_USERNAME }}
          CLOJARS_PASSWORD: ${{ secrets.CLOJARS_PASSWORD }}
        run: clojure -M:clein deploy

  # ─────────────────────────────────────────────────────────────────
  # 5. GitHub Release. Cuts only after every leaf has shipped —
  #    including all three post-matrix stages — so a partial deploy means no
  #    Release is created and the next step is the recovery procedure
  #    documented at the top of this file.
  # ─────────────────────────────────────────────────────────────────
  github-release:
    name: Create GitHub Release
    # A `needs` entry referencing a matrix job waits for ALL of its
    # matrix values to succeed, so `deploy-leaf` alone covers the nine
    # independent leaves. `deploy-ssr-ring`, `deploy-fresco` and
    # `deploy-resources` are listed separately because each is its own
    # job; without them here, a SKIPPED stage would still cut a
    # Release announcing the artefact.
    needs:
      - deploy-core
      - deploy-leaf
      - deploy-ssr-ring
      - deploy-fresco
      - deploy-resources
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Create GitHub Release
        # Mirrors re-frame v1's release-notes pattern — minimal body
        # with a link back to the CHANGELOG. Mike updates CHANGELOG.md
        # in the same release commit before tagging.
        #
        # The CHANGELOG link is pinned to the TAG ref, not `main`. A
        # Maven version is immutable once Clojars has it, so the release
        # body must keep pointing at the CHANGELOG as it stood when that
        # version shipped; a `blob/main` link lets any later edit on main
        # silently rewrite the historical account of a shipped release.
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda  # v3.0.0
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            See [CHANGELOG.md](https://github.com/day8/re-frame2/blob/${{ github.ref_name }}/CHANGELOG.md) for release notes.

            Artefacts published to Clojars:
            - `day8/re-frame2` ${{ needs.deploy-core.outputs.version }}
            - `day8/re-frame2-reagent` ${{ needs.deploy-core.outputs.version }}
            - `day8/re-frame2-uix` ${{ needs.deploy-core.outputs.version }}
            - `day8/re-frame2-schemas` ${{ needs.deploy-core.outputs.version }}
            - `day8/re-frame2-machines` ${{ needs.deploy-core.outputs.version }}
            - `day8/re-frame2-routing` ${{ needs.deploy-core.outputs.version }}
            - `day8/re-frame2-flows` ${{ needs.deploy-core.outputs.version }}
            - `day8/re-frame2-http` ${{ needs.deploy-core.outputs.version }}
            - `day8/re-frame2-ssr` ${{ needs.deploy-core.outputs.version }}
            - `day8/re-frame2-ssr-ring` ${{ needs.deploy-core.outputs.version }}
            - `day8/re-frame2-resources` ${{ needs.deploy-core.outputs.version }}
            - `day8/re-frame2-epoch` ${{ needs.deploy-core.outputs.version }}
            - `day8/re-frame2-fresco` ${{ needs.deploy-core.outputs.version }}
          draft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
