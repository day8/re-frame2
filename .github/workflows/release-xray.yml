# Release workflow for tools/xray/ (rf2-5aw5v.13).
#
# Publishes `day8/re-frame2-xray` to Clojars on a tag push of the
# form `xray-v[0-9]+.[0-9]+.[0-9]+*` (e.g. `xray-v0.0.1.alpha`).
#
# # Why a separate workflow from .github/workflows/release.yml
#
# The framework release workflow (release.yml) ships every artefact
# under implementation/* in one topologically-ordered deploy DAG.
# Xray is a *consumer* of the framework — published from tools/ — so
# it ships on its own cadence: a Xray-only fix doesn't warrant
# republishing twelve framework artefacts, and vice versa. The
# separate tag prefix (`xray-v…` vs `v…`) keeps the trigger paths
# disjoint so a framework release does not accidentally republish
# Xray and a Xray release does not accidentally republish core.
#
# # Lockstep versioning with the framework
#
# Per spec/Conventions.md §Packaging conventions (rf2-w05l), every
# published artefact ships at the same version, sourced from the
# repo-root VERSION file. tools/xray/deps.edn already declares
# `:clein/build :version "../../VERSION"` so clein picks up the
# lockstep version automatically. The version-check step below
# enforces that the pushed tag's version segment (everything after
# `xray-v`) matches the repo-root VERSION — a mismatched tag is
# refused before any deploy step runs.
#
# # :local/root → :mvn/version rewrite, and the hole in it
#
# tools/xray/deps.edn declares TEN in-repo runtime coordinates via
# `:local/root` for in-tree development — core, epoch, routing,
# flows, schemas, resources, machines, freehand, machines-viz and
# reagent-slim. The rewrite step below covers TWO of them (core and
# reagent-slim), and `clein pom` SILENTLY SKIPS every `:local/root`
# coordinate it is handed, so the other eight would simply be absent
# from the published pom. Run against the in-tree deps.edn today,
# `clein pom` prints ten `Skipping coordinate` lines and writes a pom
# carrying four third-party artefacts and nothing else.
#
# That gap is rf2-5dut1 and it is NOT closed here. What IS closed is
# the silence: the package-preflight step reads the GENERATED pom and
# REFUSES the deploy unless every coordinate the committed deps.edn
# declares at `:local/root` is present at the lockstep VERSION. So an
# `xray-v*` tag pushed today fails loudly with the eight named,
# rather than publishing an unusable pom to a registry that has no
# yank. See .github/scripts/preflight-xray-package.sh.
#
# Seven of the eight are a mechanical fix (a rewrite line here, an
# entry in verify-version-lockstep.sh's TOOLS_LOCAL_ROOTS). The
# eighth, `day8/re-frame2-freehand`, is an OPEN OPERATOR DECISION:
# implementation/freehand/deps.edn carries no `:clein/build`, on
# purpose — publication is EP-0036 F6 territory — so it cannot be
# pinned to any `:mvn/version` at all. Either Xray is not publishable
# until Freehand ships, or the Freehand edge moves to late-bind. Do
# not route around it by dropping the coordinate from the preflight.
#
# The rewrite is never committed.
#
# # Failure recovery
#
# Clojars does not support yanking. If `deploy-xray` fails after
# the artefact is published (e.g. network glitch on the upload
# acknowledgement), DO NOT re-run with the same tag — Clojars will
# 409. Bump VERSION (e.g. 0.0.1.alpha → 0.0.1.alpha-1), retag with
# the bumped value (`xray-v0.0.1.alpha-1`), and rerun. The new
# version supersedes the partial-state predecessor.
#
# # Secrets
#
# CLOJARS_USERNAME and CLOJARS_PASSWORD are configured at the
# repository level (per the framework release.yml convention).
# CLOJARS_PASSWORD is a Clojars deploy token; neither value is
# committed. Mike configures the secrets out-of-band — this
# workflow only references them.
#
# # First publish protocol
#
# Mike triggers the first deploy manually by pushing the tag once
# the secrets are wired. Subsequent releases run automatically on
# tag push.

name: release-xray

on:
  push:
    tags:
      - "xray-v[0-9]+.[0-9]+.[0-9]+*"

jobs:
  # ─────────────────────────────────────────────────────────────────
  # 1. Lockstep version contract gate. Fails fast on a mismatched tag
  #    or a hand-edited deps.edn that breaks the framework-wide
  #    lockstep (the shared script covers tools/xray/ per rf2-lwtke).
  # ─────────────────────────────────────────────────────────────────
  verify-version:
    name: Verify Xray tag matches lockstep VERSION
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Verify tag matches VERSION
        id: version
        # Tag form: `xray-v<VERSION>`. The version segment must equal
        # the repo-root VERSION file content. Catches accidental tags
        # (e.g. someone tagging `xray-v0.0.2` while VERSION still
        # reads 0.0.1.alpha) before any deploy step runs.
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version="$(tr -d '[:space:]' < VERSION)"
          expected="xray-v${version}"
          if [ "$tag" != "$expected" ]; then
            echo "::error::tag '$tag' does not match repo-root VERSION '$expected' (refusing publish — bump VERSION or fix the tag)"
            exit 1
          fi
          echo "tag $tag matches VERSION $expected — proceeding"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify framework-wide lockstep contract
        # Same script the framework release.yml + tests.yml run. Per
        # rf2-lwtke its `tools/` loop covers tools/xray/deps.edn, so
        # a hand-edited :mvn/version literal or a broken :version
        # reference fails the gate here before clein touches Clojars.
        run: ./.github/scripts/verify-version-lockstep.sh

  # ─────────────────────────────────────────────────────────────────
  # 2. Pre-release test gate for the Xray artefact. Runs the
  #    artefact's JVM tests; CLJS/browser tests for Xray already run
  #    in the regular tests workflow (the changed-surfaces classifier
  #    routes them through `story_xray_browser`).
  # ─────────────────────────────────────────────────────────────────
  test-xray:
    name: Xray pre-release test gate
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Clojure CLI
        run: "$GITHUB_WORKSPACE/.github/scripts/install-clojure-cli.sh"

      - name: Cache Maven / gitlibs
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: ${{ runner.os }}-clj-release-xray-${{ hashFiles('tools/xray/deps.edn', 'implementation/**/deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-clj-release-xray-
            ${{ runner.os }}-clj-

      - name: JVM tests (xray artefact)
        working-directory: tools/xray
        run: clojure -M:test

  # ─────────────────────────────────────────────────────────────────
  # 3. Deploy Xray. The lockstep root (day8/re-frame2 core) is NOT
  #    deployed here — Xray pins the framework version via the
  #    rewrite step, which assumes core is already on Clojars at the
  #    same lockstep VERSION (cut by the framework release.yml on
  #    the matching `v<VERSION>` tag).
  # ─────────────────────────────────────────────────────────────────
  deploy-xray:
    name: Deploy day8/re-frame2-xray
    needs: [verify-version, test-xray]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Clojure CLI
        run: "$GITHUB_WORKSPACE/.github/scripts/install-clojure-cli.sh"

      - name: Cache Maven / gitlibs
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: ${{ runner.os }}-clj-release-xray-${{ hashFiles('tools/xray/deps.edn', 'implementation/**/deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-clj-release-xray-
            ${{ runner.os }}-clj-

      # ─────────────────────────────────────────────────────────────
      # Rewrite :local/root → :mvn/version on the throwaway runner
      # checkout (never committed). The literal substring match +
      # python single-occurrence assertion is the same shape used by
      # the framework release.yml deploy-leaf job — fails loudly if
      # the source ever drifts.
      #
      # This list covers TWO of the TEN in-repo coordinates Xray's
      # deps.edn declares (rf2-5dut1 — see the header). It is NOT
      # extended here, because one of the eight it omits cannot be
      # rewritten at all until an operator ruling on Freehand, and a
      # partial extension would trade a loud failure for a quieter
      # one. The preflight step below is what makes the gap fatal
      # instead of invisible.
      # ─────────────────────────────────────────────────────────────
      - name: Rewrite Xray :local/root → :mvn/version
        working-directory: tools/xray
        env:
          VERSION: ${{ needs.verify-version.outputs.version }}
        run: |
          set -euo pipefail
          rewrite() {
            local before="$1"
            local after="$2"
            if ! grep -qF "${before}" deps.edn; then
              echo "::error::expected '${before}' substring not found in tools/xray/deps.edn"
              exit 1
            fi
            BEFORE="${before}" AFTER="${after}" \
              python3 -c 'import os, pathlib; p = pathlib.Path("deps.edn"); src = p.read_text(); before = os.environ["BEFORE"]; after = os.environ["AFTER"]; assert src.count(before) == 1, f"expected exactly one occurrence of {before!r}"; p.write_text(src.replace(before, after))'
            echo "Rewrote ${before} → ${after}"
          }
          rewrite ':local/root "../../implementation/core"'              ":mvn/version \"${VERSION}\""
          rewrite ':local/root "../../implementation/adapters/reagent-slim"' ":mvn/version \"${VERSION}\""
          echo "--- Rewritten dep coords:"
          grep -E "day8/(re-frame2|reagent-slim)" deps.edn

      # ─────────────────────────────────────────────────────────────
      # Package preflight (rf2-5dut1). Read the GENERATED pom and
      # refuse to deploy unless every coordinate the COMMITTED
      # deps.edn declares at :local/root is present at the lockstep
      # VERSION. `clein pom` skips :local/root coordinates silently,
      # so without this a partial rewrite ships a pom with holes in
      # it to a registry that has no yank.
      #
      # The required set is derived from deps.edn rather than listed
      # in the script — a hand-maintained roster drifting from
      # deps.edn is the exact defect this gate exists for. Mirrors
      # release-story.yml's preflight (rf2-wht9a).
      #
      # EXPECTED TO FAIL on the first tag push after it lands: eight
      # coordinates are unrewritten, one of them pending an operator
      # ruling. That refusal is the deliverable.
      # ─────────────────────────────────────────────────────────────
      - name: Preflight — Xray published package
        working-directory: tools/xray
        env:
          VERSION: ${{ needs.verify-version.outputs.version }}
        run: "$GITHUB_WORKSPACE/.github/scripts/preflight-xray-package.sh \"$VERSION\""

      - name: Deploy day8/re-frame2-xray
        working-directory: tools/xray
        env:
          CLOJARS_USERNAME: ${{ secrets.CLOJARS_USERNAME }}
          CLOJARS_PASSWORD: ${{ secrets.CLOJARS_PASSWORD }}
        run: clojure -M:clein deploy
