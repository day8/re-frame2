# Release workflow for tools/template/ (rf2-h0w5y · rf2-dolpf §3.1).
#
# Tags a git-coord release of `day8/re-frame2-template` on a tag push of
# the form `template-v[0-9]+.[0-9]+.[0-9]+*` (e.g. `template-v0.0.1.alpha`).
#
# # Distribution model: git-coord, NOT Clojars
#
# Per the template walkthrough Q2 lock (2026-05-12) and the rf2-dolpf
# epic, `day8/re-frame2-template` ships via git-coord — the tagged
# commit IS the artefact. Consumers resolve the template via deps-new's
# `:template io.github.day8/re-frame2-template[#<tag>]` form, which
# triggers deps-new's `auto-git-url` mechanism to clone the repo at the
# tag (or HEAD) before invoking the template's `data-fn` / `template-fn`
# / `post-process-fn` hooks.
#
# This workflow therefore:
#
#   - validates the pushed tag against the template's co-located
#     VERSION file (`tools/template/VERSION`);
#   - runs the template's JVM test suite as a pre-release gate;
#   - cuts a GitHub Release pointing at the tagged commit.
#
# No Clojars push step. No artefact upload step. The tagged commit IS
# the artefact; consumers retrieve it through git, not through Maven.
#
# # Why a separate workflow from release.yml + release-xray.yml
#
# `release.yml` (framework) and `release-xray.yml` (Xray) both ship
# Clojars artefacts under the framework-wide lockstep VERSION at the
# repo root. The template is the odd one out:
#
#   - It is **build-time only** — it never lands on a consumer's
#     runtime classpath (see `tools/template/spec/Principles.md` §P1).
#   - Its release cadence is **independent** — a template-only doc
#     polish or a new opt-in flag doesn't warrant republishing the
#     framework, and a framework patch release doesn't warrant
#     cutting a new template.
#   - Its **own** VERSION file (`tools/template/VERSION`) drives this
#     workflow; the framework-wide repo-root VERSION (`/VERSION`)
#     drives the framework + Xray workflows. The two version
#     sequences are decoupled.
#
# The separate tag prefix (`template-v…` vs `v…` vs `xray-v…`) keeps
# the trigger paths disjoint so a framework release does not
# accidentally republish the template and vice versa.
#
# # Lockstep with the framework
#
# The template's own VERSION evolves independently of the framework-
# wide VERSION; the in-template lockstep guard
# (`test/day8/re_frame2_template/version_lockstep_test.clj`) asserts
# the template's emitted `:rf2-version` matches the repo-root VERSION
# at the time the template is built. That guard runs in the test job
# below, so a template release at `template-v0.0.2` whose hooks.clj
# still points at a stale `:rf2-version` literal fails the gate
# BEFORE the GitHub Release is cut.
#
# # First publish protocol
#
# Mike pushes the first `template-v0.0.1.alpha` tag manually once the
# `day8/re-frame2-template` repo is split out (rf2-7jgkv / rf2-dolpf
# §4). Until then this workflow runs out of the `day8/re-frame2`
# monorepo on `tools/template/` changes — the tag still cuts a
# release, but the git-coord URL consumers use
# (`io.github.day8/re-frame2-template`) won't resolve until the split
# repo exists. The split is the rf2-7jgkv bead, downstream of this
# one.

name: release-template

on:
  push:
    tags:
      - "template-v[0-9]+.[0-9]+.[0-9]+*"

jobs:
  # ─────────────────────────────────────────────────────────────────
  # 1. Tag-vs-VERSION sanity check. The pushed tag's version segment
  #    (everything after `template-v`) must equal the template's
  #    co-located VERSION file content. Catches accidental tags (e.g.
  #    someone tagging `template-v0.0.2` while VERSION still reads
  #    0.0.1.alpha) before any test step runs.
  # ─────────────────────────────────────────────────────────────────
  verify-version:
    name: Verify template tag matches VERSION
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Verify tag matches tools/template/VERSION
        id: version
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version="$(tr -d '[:space:]' < tools/template/VERSION)"
          expected="template-v${version}"
          if [ "$tag" != "$expected" ]; then
            echo "::error::tag '$tag' does not match tools/template/VERSION '$expected' (refusing release — bump tools/template/VERSION or fix the tag)"
            exit 1
          fi
          echo "tag $tag matches tools/template/VERSION $expected — proceeding"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # ─────────────────────────────────────────────────────────────────
  # 2. Pre-release test gate. Runs the template's JVM test suite end-
  #    to-end (shape + static-parse framework-surface + behavioural
  #    emission + the rf2 / shadow / react pin-lockstep guards) AND the
  #    behavioural emitted-app tier. A drift in any of these blocks the
  #    release — the tagged commit must emit a shape that compiles,
  #    runs, and survives an `:advanced` release build.
  #
  #    rf2-8n4s71 #1 — SCOPE of this gate, stated honestly. The emitted-
  #    app tier (`emitted_test_run_test.clj`) rewrites the generated
  #    `day8/re-frame2*` `:mvn/version "0.0.1.alpha"` coords to monorepo
  #    `:local/root` paths BEFORE compiling. So this gate proves
  #    "generated code compiles + runs + survives :advanced against the
  #    in-repo framework source" — it does NOT prove "the emitted deps.edn
  #    coords RESOLVE". They cannot pre-split: the 0.0.1.alpha coords are
  #    unpublished (re-frame2 ships via git-coord, not Maven) and the
  #    `io.github.day8/re-frame2-template` git-coord does not resolve until
  #    the split repo exists (rf2-7jgkv). The GitHub Release body therefore
  #    carries a loud pre-split caveat (job 3 below) so a local-root-only
  #    release cannot be mistaken for a usable public scaffold. The
  #    published-coord resolve smoke (scaffold via
  #    `io.github.day8/re-frame2-template#<tag>` + `clojure -P` / `npm test`
  #    WITHOUT the :local/root rewrite) is a post-split gate —
  #    tools/template/spec/005-Repo-Split.md §3.2 / §3.4.
  #
  #    rf2-ek857f F1 — the emitted-app compile/run/release tier in
  #    `emitted_test_run_test.clj` defaults OFF (opt-in via
  #    RF2_TEMPLATE_RUN_EMITTED_TESTS=1) and needs a populated
  #    implementation/node_modules so the emitted bundle's React imports
  #    resolve. Without the Node + `npm ci` + env-var setup below, a
  #    `template-v…` tag would cut a GitHub Release while skipping the
  #    ONLY gate that compiles generated `:app` + `:test` builds, runs
  #    the generated tests, and checks the Reagent `:advanced` release
  #    bundle — i.e. it could publish a broken scaffold even though the
  #    PR/nightly template gates (test.yml / expensive-tests.yml) catch
  #    it. This job therefore mirrors that PR/nightly emitted-app setup
  #    so the release gate is at least as strong as the PR gate.
  # ─────────────────────────────────────────────────────────────────
  test-template:
    name: Template pre-release test gate
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Clojure CLI
        run: "$GITHUB_WORKSPACE/.github/scripts/install-clojure-cli.sh"

      # rf2-ek857f F1 — Node.js is required for the emitted-app smoke in
      # `emitted_test_run_test.clj` (compiles + runs the emitted
      # `events_test.cljs` and the Reagent `:advanced` release build via
      # `clojure -M:shadow`). Mirrors test.yml:jvm-tools-template /
      # expensive-tests.yml.
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: implementation/package-lock.json

      - name: Cache Maven / gitlibs
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: ${{ runner.os }}-clj-release-template-${{ hashFiles('tools/template/deps.edn', 'implementation/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-clj-release-template-
            ${{ runner.os }}-clj-

      # rf2-ek857f F1 — `npm ci` populates implementation/node_modules so
      # the emitted-app's compiled :node-test + :advanced :app bundles
      # resolve React at compile/run time. The emitted-test-run slice
      # symlinks (or NODE_PATHs to) this tree rather than `npm install`-ing
      # per substrate. Mirrors test.yml:1805 / expensive-tests.yml:125.
      - name: npm install (for emitted-app smoke)
        working-directory: implementation
        run: npm ci

      # rf2-qa5ty — the emitted-app tier's two Chromium proofs (SSR
      # DOM-adoption, emitted dev-page boot) need a browser BINARY; `npm ci`
      # only installs the playwright package. Without this step a
      # `template-v…` tag could cut a Release whose gate never loaded the
      # emitted `index.html` in any browser — precisely the page a consumer
      # of that Release opens first. Skipping is not acceptable in the
      # RELEASE gate, and with the browser provisioned an unlaunchable
      # Chromium now fails the job (`browser-proofs-required?` in
      # `emitted_test_run_test.clj`). `--with-deps` because the runner has
      # none of Chromium's shared libraries.
      - name: Install Playwright chromium (for the emitted browser proofs)
        working-directory: implementation
        run: npx playwright install --with-deps chromium || "$GITHUB_WORKSPACE/.github/scripts/playwright-install-failed.sh"

      # rf2-ek857f F1 — RF2_TEMPLATE_RUN_EMITTED_TESTS=1 flips the
      # behavioural emitted-app tier ON (default-off for the local fast
      # loop). The release gate MUST run it, or a tag could publish a
      # scaffold that fails to compile / run / release. Keep this env var
      # set; removing it regresses the gate to a fast-loop-only shape
      # check (release_gate_test.clj asserts this very step survives).
      - name: JVM tests + emitted-app smoke (template artefact)
        working-directory: tools/template
        env:
          RF2_TEMPLATE_RUN_EMITTED_TESTS: "1"
        run: clojure -M:test

  # ─────────────────────────────────────────────────────────────────
  # 3. GitHub Release. Cuts a Release object pointing at the tagged
  #    commit. No artefact upload — the tagged commit IS the artefact
  #    under git-coord distribution. Consumers resolve the template
  #    via deps-new's `:template io.github.day8/re-frame2-template#<tag>`
  #    form, which clones the repo at the tag.
  # ─────────────────────────────────────────────────────────────────
  github-release:
    name: Cut GitHub Release for template
    needs: [verify-version, test-template]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda  # v3.0.0
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            `day8/re-frame2-template` ${{ needs.verify-version.outputs.version }} — git-coord release.

            > [!WARNING]
            > **Pre-split release — not yet a usable public scaffold (rf2-8n4s71).**
            > This tag was cut from the `day8/re-frame2` monorepo before the
            > template repo split-out (rf2-7jgkv). The pre-release gate
            > compiles + runs the generated project only after rewriting the
            > emitted `day8/re-frame2*` dependency coords to monorepo
            > `:local/root` paths — it proves "generated code compiles", **not**
            > "the released template emits a project whose `deps.edn` coords
            > resolve". The emitted `:mvn/version "0.0.1.alpha"` framework
            > coords are **not published** (re-frame2 distributes via git-coord,
            > not Maven), and the `io.github.day8/re-frame2-template` git-coord
            > below does **not resolve** until the split repo exists. A real
            > consumer following the invocation below will fail during
            > dependency resolution before any scaffolded code runs. Do **not**
            > treat this release as a usable public scaffold. The published-coord
            > smoke that proves the shipped dependency surface is a post-split
            > gate (`tools/template/spec/005-Repo-Split.md` §3.2 / §3.4).

            Once the split repo exists, consumers resolve the template via
            deps-new at this tag:

            ```bash
            clojure -Tnew create \
                    :template io.github.day8/re-frame2-template#${{ github.ref_name }} \
                    :name acme/my-app
            ```

            See [`tools/template/README.md`](https://github.com/day8/re-frame2/blob/main/tools/template/README.md) for the full invocation surface and [`tools/template/spec/`](https://github.com/day8/re-frame2/tree/main/tools/template/spec) for the normative contract.
          draft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
