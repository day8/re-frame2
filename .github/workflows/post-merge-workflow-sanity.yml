# Post-merge workflow-edit sanity dispatcher.
#
# # Why this exists
#
# Workflow YAML files are scripts — typos or stale references stay
# silent until the workflow next fires. For cron-only workflows
# (`expensive-tests.yml` runs at 15:17 UTC daily) that's up to 24h of
# silent breakage per edit, and a bad edit fails every night until
# somebody reads the nightly: a rename that points a nightly step at an
# npm script that no longer exists would go unnoticed for as many nights
# as nobody looks, because nightly is the only thing that runs it.
#
# # What it does
#
# On every push to `main` that touches `.github/workflows/*.yml`,
# determine which workflow files changed and `workflow_dispatch` each
# one against `main` (excluding this canary itself + release tag
# workflows). The next cron tick is not the first verification of a
# workflow edit — the merge commit itself triggers it within minutes.
#
# # What it does NOT do
#
# - It does not block the merge. The merge already happened on `main`.
#   This workflow is a fast-feedback canary, not a gate. The mayor +
#   the dispatched worker still owe their own pre-merge verification;
#   this catches the silent-cron-only class of failure that the
#   pre-merge check cannot surface.
# - It does not run release workflows. `release.yml`, `release-xray.yml`,
#   `release-story.yml`, `release-machines-viz.yml` and
#   `template-release.yml` are tag-triggered and would publish artefacts
#   if dispatched against a non-release ref. Skipped via the EXCLUDE list
#   below. (None of them declares `workflow_dispatch:`, so the dispatch
#   guard further down would skip them anyway — the EXCLUDE entries are
#   the belt to that braces, and the publish is irreversible, so the list
#   is kept complete rather than relying on the second check alone.)
# - It does not run `test.yml` or `docs.yml` re-dispatched against
#   the merge commit — both already run on the same push event
#   (assuming their `paths` filters allow it). Re-dispatching would
#   duplicate work; instead we ONLY dispatch workflows that don't
#   already fire on push to main (= the cron-only / dispatch-only
#   ones — currently just `expensive-tests.yml`).
#
# # The EXCLUDE list
#
# Add a workflow path here when:
#   - it is tag-triggered and dispatching it would publish (release*).
#   - it already runs on push to main (test, docs, lint already do).
#   - it is THIS file (would infinite-loop).
#
# Add NOTHING ELSE. Cron-only / dispatch-only workflows are exactly
# what this canary exists to catch.

name: post-merge workflow sanity

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/*.yml'
  workflow_dispatch:

# A workflow-edit push may land alongside a follow-up push; keep the
# latest one (which has the latest workflow content) and cancel any
# in-progress dispatch loop from an older SHA.
concurrency:
  group: post-merge-workflow-sanity-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: write     # to call `gh workflow run`
  contents: read     # to read changed files

jobs:
  dispatch-affected-workflows:
    name: Dispatch affected workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # DEPTH 2 HOLDS HEAD^ AND NOTHING DEEPER, which is all the FALLBACK base
      # needs (a manual dispatch, or the all-zeros first push to a fresh ref).
      # The ACCEPTED base of a multi-commit push is arbitrarily deeper, so it is
      # FETCHED BY NAME in the step below rather than cloned up to —
      # portability.yml's `ai-tracking-ratchet` job is the worked precedent,
      # and it measured a fetch-depth: 0 clone of this history at 211 of its
      # 216 seconds.
      #
      # Depth 2 ALONE would make the base resolution below inert: on a push of
      # 2+ commits the accepted base would simply be absent, `git diff` would
      # fail on it, and a swallowed failure would report "No workflow files
      # changed in this push" over a push that changed several — fail-open, on
      # exactly the multi-commit pushes that are routine here. The depth and
      # the fetch are ONE decision; `_post-merge-sanity-base.test.cjs` pins them
      # together.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 2

      - name: Identify changed workflow files
        id: changed
        env:
          # Through `env:`, never interpolated into the run body, so the step
          # stays injection-safe whatever the event carries — portability.yml's
          # rule for this same context value.
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # Diff this push against its ACCEPTED base — the tip `main` pointed at
          # BEFORE the push. NOT HEAD^, which on a multi-commit push
          # is only this same push's second-to-last commit, so a workflow edited
          # in an earlier commit and untouched at the tip sits on both sides of
          # the diff and escapes.
          base="${PUSH_BEFORE:-}"
          if [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base=""
          fi
          # Fetch that ONE commit when the shallow checkout does not hold it.
          # Peeled to ^{commit} deliberately: `git rev-parse --verify` echoes any
          # 40-hex string back with exit 0 WITHOUT consulting the object store,
          # so an unpeeled check is not a reachability check at all.
          if [ -n "$base" ] && ! git rev-parse --verify --quiet "$base^{commit}" >/dev/null; then
            echo "base $base is deeper than this shallow clone; fetching that one commit."
            if ! git fetch --no-tags --no-recurse-submodules --depth=1 origin "$base"; then
              # FAIL LOUD, NOT FAIL OPEN. Only a force-push to `main` can get
              # here — `before` is then the discarded tip, reachable from no ref,
              # so no depth and no fetch can produce it. This canary GATES
              # NOTHING (the merge already happened; no required check consumes
              # its verdict), so a red costs one visible failure and blocks
              # nobody. Falling back to HEAD^ would silently miss a workflow
              # edited in an earlier commit of the push;
              # dispatching everything would spend the nightly matrix to answer
              # the question and leave no trace that the base resolution broke.
              echo "::error::post-merge workflow sanity cannot resolve the accepted base $base (force-push to main?). Refusing to report 'nothing changed' over a push this run cannot read."
              exit 1
            fi
          fi
          # No accepted base at all: a manual dispatch, or the first push to a
          # fresh ref. There is no earlier accepted state to have missed, so
          # HEAD^ loses nothing — and depth 2 holds it.
          if [ -z "$base" ]; then
            base="HEAD^"
          fi
          # List changed .github/workflows/*.yml files (basenames). NO `|| true`
          # here: it would convert a failed `git diff` — and `pipefail` with it —
          # into "nothing changed". Without it, `set -euo pipefail` reds any
          # residual failure, so this whole path is fail-closed.
          changed=$(git diff --name-only "$base" HEAD -- '.github/workflows/*.yml' \
            | xargs -I{} basename {})
          if [ -z "$changed" ]; then
            echo "No workflow files changed in this push."
            echo "files=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Newline-separate for the next step.
          echo "Changed workflow files:"
          echo "$changed"
          # Emit as a space-separated single-line value (simpler downstream).
          changed_oneline=$(echo "$changed" | tr '\n' ' ')
          echo "files=${changed_oneline}" >> "$GITHUB_OUTPUT"

      - name: Dispatch each affected workflow (excluding release + self + push-triggered)
        if: steps.changed.outputs.files != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # THE REF TO DISPATCH AGAINST — a BRANCH OR TAG NAME, never a commit
          # id. See the block above `gh workflow run` below for why, and for the
          # semantics of dispatching at the tip. Through `env:`, never
          # interpolated into the run body: the sibling step states that rule at
          # its own `env:` and `_post-merge-sanity-base.test.cjs` pins it there.
          DISPATCH_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # EXCLUDE list — see header comment for the policy.
          EXCLUDE=(
            "post-merge-workflow-sanity.yml"  # self
            "release.yml"                     # tag-triggered → publishes
            "release-xray.yml"                # tag-triggered → publishes
            "release-story.yml"               # tag-triggered → publishes
            "release-machines-viz.yml"        # tag-triggered → publishes
            "template-release.yml"            # tag-triggered → publishes
            "test.yml"                        # already runs on push
            "docs.yml"                        # already runs on push (paths-filtered)
            "lint.yml"                        # already runs on push (via PR-merge push)
            "portability.yml"                 # already runs on push to main
          )
          is_excluded() {
            local f="$1"
            for ex in "${EXCLUDE[@]}"; do
              if [ "$f" = "$ex" ]; then
                return 0
              fi
            done
            return 1
          }
          failed=0
          for f in ${{ steps.changed.outputs.files }}; do
            if is_excluded "$f"; then
              echo "skip (excluded): $f"
              continue
            fi
            # DELETED IN THIS PUSH. The diff reports a removed workflow as
            # changed. Without this guard it would still be skipped — but only as
            # a side effect of `grep` exiting non-zero on a file it cannot open,
            # which also puts `No such file or directory` on stderr and then
            # prints the WRONG reason ("no workflow_dispatch trigger") for the
            # right outcome. An accident is a poor thing to rest on when a
            # dispatch failure is fatal, so the skip is stated rather than
            # inferred.
            if [ ! -f ".github/workflows/$f" ]; then
              echo "skip (deleted in this push): $f"
              continue
            fi
            # Only dispatch if the workflow declares workflow_dispatch.
            if ! grep -q '^\s*workflow_dispatch:' ".github/workflows/$f"; then
              echo "skip (no workflow_dispatch trigger): $f"
              continue
            fi
            # --ref TAKES A BRANCH OR TAG NAME. The Actions "create a workflow
            # dispatch event" endpoint resolves `ref` in the ref namespace, so a
            # 40-character commit id — which is what `github.sha` always is —
            # cannot resolve and the call returns HTTP 422 "No ref found for:
            # <sha>". This is not a trade-off between two workable targets: a
            # merge commit id is not dispatchable at all.
            #
            # THE TOKEN IS NOT THE OBSTACLE, so a correct ref is all it takes.
            # Events triggered by `GITHUB_TOKEN` do not normally create workflow
            # runs — that is the recursion guard — but `workflow_dispatch` is one
            # of the two documented exceptions that "always create workflow
            # runs". So `actions: write` above plus a resolvable ref is the
            # complete set of conditions, and a reader who finds this canary
            # still silent should suspect the ref or the guards, never the token.
            # See docs.github.com/en/actions/concepts/security/github_token.
            #
            # The `github.sha` context value as the ref — an expression not
            # written out here, because Actions substitutes expressions
            # everywhere in a `run:` body, comments included — would fail on
            # every attempt, and a
            # swallowed failure would leave every run concluding `success`: a
            # dispatcher that never dispatches, green indefinitely.
            #
            # THE TIP, NOT THE MERGE COMMIT — deliberate. `github.ref_name` is
            # the branch this event is on (`main` for the push trigger; whatever
            # branch an operator chose under `workflow_dispatch`, which a literal
            # `main` would get wrong). Two workflow-editing merges landing close
            # together therefore share one dispatch of the later tip. That is the
            # right target for the question this canary asks — "does the edited
            # workflow still run?" — because the tip is exactly what the next
            # cron tick will use, and `concurrency: cancel-in-progress` above
            # already collapses back-to-back pushes onto the latest SHA.
            #
            # FAIL LOUD, NOT FAIL OPEN — the same call the base resolution makes
            # above, for the same reason. Nothing consumes this canary's verdict,
            # so a red costs one visible failure and blocks nobody, whereas a
            # green that means "we tried" reads to every reader as "it ran" and
            # would keep a broken dispatcher green indefinitely. Every ordinary reason
            # to skip is handled by the four guards above; what is left is
            # exceptional. Failures are counted rather than aborting the loop, so
            # one bad workflow cannot hide the fate of the others, and the
            # `dispatched:` line makes a success provable from the log whatever
            # `gh` prints for itself.
            echo "dispatching: $f (ref $DISPATCH_REF)"
            if gh workflow run "$f" --ref "$DISPATCH_REF"; then
              echo "dispatched: $f (ref $DISPATCH_REF)"
            else
              echo "::error::post-merge workflow sanity could not dispatch $f at $DISPATCH_REF. The 24h feedback gap this canary exists to close is still OPEN for that workflow — its next verification is the cron tick."
              failed=$((failed + 1))
            fi
          done
          if [ "$failed" -gt 0 ]; then
            echo "$failed dispatch(es) failed; see the annotations above."
            exit 1
          fi
