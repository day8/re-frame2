# Portability gate (rf2-1ppe4, child of the rf2-v6wyb portability EPIC).
#
# Root-cause LOCK for the portability scrub (rf2-q4sah, #2509). Fails the
# build if any TRACKED file reintroduces environment-specific hardcoding —
# the maintainer's username/home token, or a personal/home absolute path
# naming a real person (`/Users/<name>/`, `/home/<name>/`,
# `C:/Users/<name>/`). The detection + the deliberate-fixture allowlist
# live in the POSIX-sh script scripts/check-no-hardcoded-paths.sh; this
# workflow just runs it (plus a shellcheck of the script itself).
#
# The first job also shellchecks the CI-EXECUTED `.github/scripts/*.sh`
# tree (rf2-r4q98), from a derived roster rather than a list. Same idea as
# the per-gate shellcheck below, aimed at the rf2-ldkuk class: a script CI
# runs whose defects surface only on the runner.
#
# It also carries the tracked-`ai/` RATCHET (rf2-lsp1i) and the repo-wide
# view-lifetime vocabulary ratchet (rf2-5e8zv) — see those jobs below. The gates
# live together because each is the UPSTREAM lock for a leak class that would
# otherwise surface downstream: the 2026-07-18 incident was a force-added ai/
# dossier carrying a personal worktree path, which failed the portability gate
# ON MAIN and reddened every open PR; the view-lifetime ratchet likewise fires
# on the PR that reintroduces the excised vocabulary rather than after it lands.
# All are whole-tree, sub-second git invariants with identical trigger needs,
# so they share one workflow rather than spawning more.
#
# UNLIKE lint.yml / docs.yml no gate here has a surface-detect job: ANY tracked
# file can leak a personal path, force-add under ai/, or reintroduce the
# excised term, so the only correct surface is "the whole tree". The scripts are
# sub-second git invocations, so running them on every PR is cheap. They
# run on PRs (the gate), on push to main (so a direct-to-main edit is still
# caught), and via manual dispatch. Both trigger shapes matter to the
# ratchet specifically: it reads its base from HEAD^, which is the
# base-branch tip on a PR merge commit and the previous tip on a push, so
# the same one rule covers both without a second code path.
#
# NOTE for post-merge-workflow-sanity.yml: this workflow already runs on
# push to main, so it is on that canary's EXCLUDE list — re-dispatching it
# would only duplicate the push run.

name: portability

on:
  push:
    branches: [main]
    # Beads checkpoints (.beads-only pushes) are no-op runs that occupy
    # queue slots; skip them. Mixed code+beads pushes still run (a push is
    # skipped only when ALL changed files match). PRs stay unfiltered.
    paths-ignore:
      - '.beads/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: portability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  no-hardcoded-paths:
    name: No hardcoded personal/home paths
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      # shellcheck ships preinstalled on the ubuntu-latest runner image.
      # Lint the gate script itself so a future edit cannot introduce a
      # shell bug that silently weakens the gate.
      - name: Shellcheck the gate script
        run: shellcheck scripts/check-no-hardcoded-paths.sh

      # The script `git grep`s the tracked tree and exits non-zero with a
      # per-hit message on any violation. No `|| true` / continue-on-error:
      # a reintroduced personal path genuinely blocks the PR.
      - name: Run the portability gate
        run: sh scripts/check-no-hardcoded-paths.sh

      # rf2-r4q98 — the same precedent, extended to the scripts CI EXECUTES.
      # `.github/scripts/*.sh` were shellchecked by NOTHING, despite several
      # workflows running them. That is the rf2-ldkuk class: a defect in a
      # CI-executed script surfaces only on the runner. ldkuk itself committed
      # mode 100644 and died with "Permission denied" on CI while passing
      # locally, because Git Bash on Windows does not enforce the exec bit —
      # the maintainer's platform cannot reproduce it. A linter that runs on
      # the runner can.
      #
      # It lives in this job, as a STEP rather than a third job, for two
      # reasons: a step inherits this job's enforcement exactly, and shell
      # portability is what this workflow is for.
      #
      # The roster is DERIVED, not listed. Adding a script to .github/scripts/
      # covers it automatically — the drift failure this bead exists to fix
      # (its sibling half was a hardcoded roster that silently stopped
      # covering new entries). An EMPTY roster FAILS rather than passing
      # vacuously: a derivation that matches nothing has stopped being a
      # check, and a rename of the directory must red rather than go quiet.
      # The roster is printed so a shrinking one is visible in the log.
      #
      # SCOPE BOUND, stated rather than implied: this covers the CI-executed
      # `.github/scripts/` tree only. Four scripts under `scripts/` are not
      # yet shellcheck-clean (SC1003/SC2016/SC2018/SC2019/SC2034/SC3045), so
      # a whole-tree sweep would red today; that is a separate cleanup and is
      # NOT claimed as covered here.
      - name: Shellcheck the CI-executed .github/scripts shell scripts
        run: |
          set -eu
          roster=$(git ls-files '.github/scripts/*.sh')
          if [ -z "$roster" ]; then
            echo "shellcheck roster is EMPTY: .github/scripts/*.sh matched no tracked file." >&2
            echo "A derived roster that matches nothing has stopped checking anything," >&2
            echo "so this fails rather than passing vacuously. If the directory moved," >&2
            echo "update the pattern; if the scripts genuinely went, remove this step." >&2
            exit 1
          fi
          echo "Shellchecking:"
          printf '%s\n' "$roster"
          printf '%s\n' "$roster" | xargs shellcheck

      # rf2-rxkht — the worktree-removal guard, which stands between
      # `git worktree remove` and the mayor checkout's REAL node_modules. Its
      # failure mode is silent: a worker worktree junctions node_modules at
      # the mayor's real one, the removal follows the reparse point, the
      # target is emptied, and git still exits 0. That class has landed twice.
      #
      # It gets a lint AND a live proof, for the same reason the two gate
      # scripts above get one: a guard nobody has watched work is decoration.
      # The self-test builds a throwaway link over a dummy directory in a
      # temp dir, runs the real disarm against it, and requires BOTH the link
      # gone AND the target's entries all still there — it never touches a
      # real node_modules. On this runner `ln -s` yields a genuine POSIX
      # symlink, so the POSIX branch is the one proven here; the Windows
      # junction branch is proven by the .ps1 sibling's -SelfTest, which has
      # no runner and is run by hand on the maintainer's machine.
      - name: Shellcheck the worktree-removal guard
        run: shellcheck scripts/remove-worker-worktree.sh

      # The self-test SKIPS (exit 0) on a platform that cannot produce a link
      # to test against — correct there, vacuous here. `ln -s` always works on
      # this runner, so a SKIP means the test stopped testing and must red,
      # exactly as the empty roster above does.
      - name: Self-test the worktree-removal disarm
        run: |
          set -eu
          out=$(sh scripts/remove-worker-worktree.sh --self-test)
          printf '%s\n' "$out"
          if ! printf '%s\n' "$out" | grep -q '^SELF_TEST=PASSED'; then
            echo "The disarm self-test did not PASS. A SKIP certifies nothing on a" >&2
            echo "runner where 'ln -s' works, so this fails rather than passing vacuously." >&2
            exit 1
          fi

  ai-tracking-ratchet:
    name: No newly tracked files under ai/
    runs-on: ubuntu-latest
    steps:
      # THE BASE IS ONE NAMED COMMIT, so the checkout fetches TWO and the step
      # below fetches THAT ONE (rf2-uol6). This job used fetch-depth: 0 and spent
      # 211 of its 216 seconds cloning history it never walked — measured over
      # three runs (216 / 216 / 233s) against 14–16s for its two siblings, which
      # made it the most expensive job on every PR by more than 3x.
      #
      # WHAT THE GATE ACTUALLY NEEDS FROM HISTORY, measured rather than inferred
      # from the flag name: the base COMMIT OBJECT AND ITS TREE, and nothing
      # else. The script resolves the base and then runs `git ls-tree` on it; it
      # never walks an ancestor. A `git fetch --depth=1 origin <sha>` of a
      # 1200-commit-deep sha took 2.8s and made `ls-tree` succeed while that
      # commit's own PARENT stayed unresolvable — which is the proof that no
      # ancestry is required.
      #
      # THE BASE IS STILL THE EVENT'S ACCEPTED BASE, unchanged (rf2-ow7dz,
      # rf2-7hq4l) — resolved in the step below, NOT HEAD^:
      #   * push to main: github.event.before, the tip main pointed at before
      #     this push. On a MULTI-COMMIT push HEAD^ is only the second-to-last
      #     commit of this same push, so a path first tracked in an earlier
      #     commit and retained at the tip is present on both sides and escapes
      #     (the rf2-7hq4l defect). The accepted base can be arbitrarily deep —
      #     which is why it is FETCHED BY NAME rather than cloned up to.
      #   * pull_request: github.event.pull_request.base.sha, the base-branch
      #     tip — which equals the merge commit's first parent, so HEAD^ was
      #     already sound here; the base sha is passed explicitly so both event
      #     shapes share one contract instead of relying on HEAD^ by accident.
      #
      # WHY 2 AND NOT 1. workflow_dispatch carries no accepted base, so the
      # script falls back to its own HEAD^ default; depth 1 would make that
      # fallback unresolvable and red the manual run. Depth 2 holds HEAD^ for
      # one extra commit's worth of delta. This is also the depth
      # `_ai-tracking-ratchet.test.cjs` has always pinned.
      #
      # If the base cannot be resolved the script FAILS closed rather than
      # passing vacuously, so a fetch that misses the base reds — it does not
      # pass. That guard was NOT sound before this change: `git rev-parse
      # --verify --quiet <40-hex>` returns the sha with exit 0 even when the
      # object is absent, so an unfetched base sailed through and the gate
      # reported "END STATE reached" over a base it never read. rf2-uol6 measured
      # that false green and hardened the script; a shallower checkout is safe
      # only because it is now genuinely fail-closed.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 2

      # Same precedent as the gate above: lint the gate script itself so a
      # future edit cannot introduce a shell bug that silently weakens it.
      - name: Shellcheck the ratchet script
        run: shellcheck scripts/check-ai-tracking-ratchet.sh

      # Select the event's ACCEPTED base (rf2-7hq4l): the previous main tip for
      # a push, the PR base tip for a pull_request. A null `before` SHA (the
      # first push to a fresh ref) and every other event shape leave the ref
      # empty, so the script falls back to its own HEAD^ default. Context
      # values arrive via `env:` — never interpolated into the script body — so
      # the step is injection-safe regardless of what the event carries.
      #
      # ...and then FETCH that one commit if the depth-2 checkout above does not
      # already hold it (rf2-uol6). `--depth=1` brings down the commit and its
      # tree and stops; the ratchet needs no ancestor, and the existing shallow
      # boundary for HEAD is untouched (measured: HEAD^ still resolves after
      # this fetch). GitHub serves a reachable SHA to `git fetch` — the accepted
      # base is always an ancestor of a ref — and a fetch that fails leaves the
      # base unresolvable, which the script turns into a RED rather than a pass.
      - name: Resolve the accepted base
        id: base
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -eu
          case "$EVENT_NAME" in
            push)         base="$PUSH_BEFORE" ;;
            pull_request) base="$PR_BASE_SHA" ;;
            *)            base='' ;;
          esac
          if [ "$base" = '0000000000000000000000000000000000000000' ]; then
            base=''
          fi
          if [ -n "$base" ] && ! git rev-parse --verify --quiet "$base^{commit}" >/dev/null; then
            echo "base $base is deeper than this shallow clone; fetching that one commit."
            git fetch --no-tags --no-recurse-submodules --depth=1 origin "$base"
          fi
          echo "ref=$base" >> "$GITHUB_OUTPUT"

      # Fails when any path is tracked under ai/ that was NOT tracked at the
      # accepted base, naming every such path. Counts are irrelevant to the
      # decision, which is what makes it a ratchet rather than a ceiling: an
      # addition fails even after an earlier removal, and even when a swap
      # leaves the total unchanged. A decrease passes — S7 (rf2-vxgfnd.99.1)
      # removes the remaining trees and must never be blocked by this gate —
      # and the base tightens on its own, because it is read from the event.
      # Invoked via `sh` so the script needs no executable bit on the runner.
      - name: Run the tracked-ai/ ratchet
        env:
          AI_RATCHET_BASE_REF: ${{ steps.base.outputs.ref }}
        run: sh scripts/check-ai-tracking-ratchet.sh

  # The REPO-WIDE view-lifetime vocabulary ratchet (rf2-5e8zv, the excision epic
  # finale; renamed by rf2-p3zf).
  #
  # THIS GATE DOES NOT RETIRE WITH `implementation/ui/`, and the name it used to
  # carry — "No re-frame.ui view-lifetime residue" — argued that it did. The rule
  # has NO coupling to re-frame.ui, or to any substrate: read
  # `scripts/check_view_lifetime_residue.py` and the whole mechanism is
  # `git ls-files -z` over every tracked path with `_EXCLUDE_PREFIXES =
  # (".beads/",)`. No donor tree is named, scanned for, or scoped to. The rule is
  # "this word does not appear in this repository", full stop. EP-0038 HD-018
  # rules that on a win the public re-frame.freehand and re-frame.ui surfaces are
  # DELETED; a worker executing that deletion must NOT take this job with them.
  # It is precisely what stops the next substrate reintroducing the vocabulary
  # the excision removed — the case it is most needed for.
  #
  # Like the tracked-ai/ ratchet above this is a whole-tree, every-PR git
  # invariant with a ZERO baseline — the excision epic removed the view-lifetime
  # concept in full (the observation surface returns a HANDLE, Resources pin
  # liveness with an OWNER), and ANY tracked file can reintroduce its vocabulary,
  # so the only correct surface is the whole tree. The guard scans `git ls-files`
  # content AND paths for every lexical form (natural language
  # singular/plural/past/gerund, snake/camel/kebab identifiers, and file names),
  # excludes ONLY `.beads/**`, and carries no baseline, ceiling, or allowlist for
  # product files. It constructs its own forbidden token so the guard is never
  # its own violation, and ordinary words (release, please) plus the excision's
  # survivors (handle, owner, route, machine, ssr, app-event) are never flagged.
  view-lifetime-residue-ratchet:
    name: No retired view-lifetime vocabulary, repo-wide
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'

      # Prove the matcher discriminates (prose / snake / camel / filename
      # positives; release / please / survivor negatives, plus a meta-check that
      # the guard's own source carries no live occurrence) before trusting its
      # verdict on the tree.
      - name: Self-test the residue matcher
        run: python scripts/check_view_lifetime_residue.py --self-test --verbose

      - name: Scan the tracked tree for view-lifetime residue
        run: python scripts/check_view_lifetime_residue.py --verbose
