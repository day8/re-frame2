<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>re-frame2 testbed: ssr-hydration-mismatch</title>
  <style>
    body { font-family: sans-serif; margin: 0; }
    .rf2-testbed-shell { display: flex; width: fit-content; min-width: 100%; min-height: 100vh; }
    [data-rf-xray-host] { flex: 0 0 var(--rf-xray-inline-width, 420px); min-width: 320px; box-sizing: border-box; position: sticky; top: 0; right: 0; height: 100vh; overflow: hidden; border-left: 1px solid #2a2a2a; }
    #app { flex: 1; min-width: 0; padding: 2em; }
    h1 { margin-top: 0; }
  </style>
</head>
<body>
  <div class="rf2-testbed-shell">
  <!--
    Server-rendered markup in the shape `render-to-string` writes for the
    root view: no whitespace between elements, because a hydrating root
    reads every text node, and an indentation text node would be a
    divergence of its own.

    It diverges from the client in TEXT, at the first child of the root:
    the server painted "rendered on the server" where the client's root
    view renders "rendered on the client". React's hydration meets that
    text, recovers by re-rendering the root on the client, and calls the
    root's onRecoverableError — the adoption reporter, which emits
    :rf.ssr/hydration-mismatch (Spec 011 §Hydration-mismatch detection).
    The rest of the markup is what the server would paint before any
    hydration: `not-hydrated`, no mismatch yet, count 0.
  -->
  <div id="app"><div data-testid="ssr-hydration-mismatch" style="font-family:sans-serif;padding:1em"><p data-testid="render-origin">rendered on the server</p><h1>ssr-hydration-mismatch testbed</h1><div data-testid="not-hydrated" style="padding:0.25em;color:#700">not-hydrated</div><div data-testid="mismatch-banner-empty" style="color:#888">(no mismatch yet)</div><div data-testid="counter-panel" style="border:1px solid #aaa;padding:0.5em;margin:0.25em 0"><p>count=<span data-testid="count">0</span></p><button data-testid="inc">Inc</button></div></div></div>
    <aside data-rf-xray-host></aside>
  </div>
  <!--
    The hydration payload. `ssr/hydrate!` reads it from this script and
    seeds the frame before the hydrating render; the mismatch comes from
    the markup above, not from anything here.
  -->
  <script id="__rf_payload" type="application/edn">
{:rf/version     1
 :rf/frame-id    :rf/default
 :rf/app-db      {:count 0}}
  </script>
  <script src="main.js"></script>
</body>
</html>
