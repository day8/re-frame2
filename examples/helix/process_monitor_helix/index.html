<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>re-frame2 example: process-monitor (Helix · design-led)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1A1814">
  <meta name="description" content="re-frame2 worked example — examples for the modern Clojure framework.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="re-frame2 example: process-monitor (Helix · design-led)">
  <meta property="og:description" content="re-frame2 worked example — examples for the modern Clojure framework.">
  <meta property="og:image" content="_shared/img/og.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/svg+xml" href="_shared/img/favicon.svg">
  <link rel="stylesheet" href="_shared/css/style.css">
  <style>
    /* Per-example layout — process-monitor shell. Tokens come from
       _shared/css/style.css (--hx-* aliases for --ex-* tokens). */
    .pm-shell {
      min-height: 100vh;
      display: flex; flex-direction: column;
      background: var(--hx-bg);
    }
    .pm-shell-head {
      padding: 1.5em 2em 1em;
      border-bottom: 1px solid var(--hx-rule-strong);
      display: flex; flex-direction: column; gap: 1.2em;
    }
    .pm-brand { display: flex; align-items: baseline; gap: 0.2em; }
    .pm-prompt { color: var(--hx-green); font-family: var(--hx-mono);
                 font-weight: 700; font-size: 1.6rem; }
    .pm-shell-head h1 {
      font-family: var(--hx-mono);
      font-size: 1.6rem;
      margin: 0;
      letter-spacing: -0.01em;
    }
    .pm-shell-head h1::before { content: ''; }
    .pm-substrate {
      font-family: var(--hx-mono);
      color: var(--hx-ink-muted);
      font-size: 0.9rem;
    }

    .pm-tiles { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0.75em; }
    .pm-tile {
      background: var(--hx-bg-surface);
      border: 1px solid var(--hx-rule-strong);
      border-radius: 4px;
      padding: 0.6em 0.9em;
      font-family: var(--hx-mono);
    }
    .pm-tile-label {
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-size: 0.7rem;
      color: var(--hx-ink-muted);
      margin-bottom: 4px;
    }
    .pm-tile-value { font-size: 1.4rem; font-weight: 700; color: var(--hx-ink); }
    .pm-tile-good { border-left: 3px solid var(--hx-green); }
    .pm-tile-good .pm-tile-value { color: var(--hx-green); }
    .pm-tile-warn { border-left: 3px solid var(--hx-amber); }
    /* Warning value is TEXT on the light --hx-bg-surface tile — use the AA-safe
       deep amber (--hx-amber-deep), not decorative --hx-amber (sub-AA as text).
       The left border above stays decorative amber. (rf2-ihruwa) */
    .pm-tile-warn .pm-tile-value { color: var(--hx-amber-deep); }
    .pm-tile-bad  { border-left: 3px solid var(--hx-red); }
    .pm-tile-bad  .pm-tile-value { color: var(--hx-red); }

    .pm-grid {
      flex: 1;
      display: grid;
      grid-template-columns: minmax(380px, 1fr) 1.6fr;
      gap: 0;
      min-height: 0;
    }

    .pm-pane {
      display: flex; flex-direction: column;
      border-right: 1px solid var(--hx-rule-strong);
      min-width: 0;
    }
    .pm-pane:last-child { border-right: 0; }

    .pm-pane-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.9em 1.2em;
      border-bottom: 1px solid var(--hx-rule);
      background: var(--hx-bg-surface);
    }
    .pm-pane-head h3 {
      font-family: var(--hx-mono);
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: var(--hx-green);
      font-size: 0.78rem;
      margin: 0;
    }
    .pm-pane-head h3::before { content: ''; }
    .pm-pane-hint {
      font-family: var(--hx-mono);
      color: var(--hx-ink-faint);
      font-size: 0.74rem;
    }

    .pm-chips { display: flex; gap: 6px; }
    .pm-chip {
      font-family: var(--hx-mono);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 4px 10px;
      border: 1px solid var(--hx-rule-strong);
      background: transparent;
      color: var(--hx-ink-muted);
      cursor: pointer;
      border-radius: 2px;
      transition: color 100ms ease, border-color 100ms ease;
    }
    .pm-chip:hover { color: var(--hx-ink); border-color: var(--hx-ink-muted); }
    .pm-chip-info.is-on  { color: var(--hx-cyan);    border-color: var(--hx-cyan); }
    /* Active warn chip carries label TEXT + a state border on the light
       --hx-bg-surface pane-head — use AA-safe --hx-amber-deep so both the text
       (≥4.5:1) and the UI-component border (≥3:1) clear WCAG. (rf2-ihruwa) */
    .pm-chip-warn.is-on  { color: var(--hx-amber-deep); border-color: var(--hx-amber-deep); }
    .pm-chip-error.is-on { color: var(--hx-red);     border-color: var(--hx-red); }

    .pm-list {
      list-style: none; padding: 0; margin: 0;
      overflow-y: auto; flex: 1;
    }
    .pm-row {
      display: grid;
      grid-template-columns: 12px minmax(0,1fr) 70px 80px 56px 56px;
      gap: 8px; align-items: center;
      padding: 0.55em 1.2em;
      border-bottom: 1px solid var(--hx-rule);
      cursor: pointer;
      font-family: var(--hx-mono);
      font-size: 0.86rem;
      transition: background 80ms ease;
    }
    .pm-row:hover { background: var(--hx-bg-surface); }
    .pm-row.is-selected {
      background: var(--hx-bg-elevated);
      box-shadow: inset 3px 0 0 var(--hx-green);
    }
    .pm-row-name { color: var(--hx-ink); font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pm-row-pid  { color: var(--hx-ink-faint); }
    .pm-row-cpu, .pm-row-mem { color: var(--hx-ink-muted); text-align: right; }
    .pm-row-meter {
      height: 6px;
      background: var(--hx-rule);
      border-radius: 1px;
      overflow: hidden;
    }
    .pm-row-bar { height: 100%; background: var(--hx-green); transition: width 200ms ease; }
    .pm-row-warn .pm-row-bar { background: var(--hx-amber); }
    .pm-row-down .pm-row-bar { background: var(--hx-red); }

    .pm-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--hx-ink-faint);
      box-shadow: 0 0 6px currentColor;
    }
    .pm-dot-running { background: var(--hx-green); color: var(--hx-green); }
    .pm-dot-warn    { background: var(--hx-amber); color: var(--hx-amber); }
    .pm-dot-down    { background: var(--hx-red);   color: var(--hx-red); }

    .pm-loglist {
      list-style: none; padding: 0; margin: 0;
      overflow-y: auto; flex: 1;
      background: var(--hx-bg);
    }
    .pm-log {
      display: grid;
      grid-template-columns: 60px 80px 60px 1fr;
      gap: 10px;
      padding: 0.35em 1.2em;
      font-family: var(--hx-mono);
      font-size: 0.84rem;
      border-bottom: 1px dotted var(--hx-rule);
    }
    .pm-log-tick { color: var(--hx-ink-faint); }
    .pm-log-pid  { color: var(--hx-ink-muted); }
    .pm-log-level {
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .pm-log-level-info  { color: var(--hx-cyan); }
    .pm-log-level-warn  { color: var(--hx-amber-deep); }  /* warn log level is TEXT on paper — AA-safe deep amber (rf2-ihruwa) */
    .pm-log-level-error { color: var(--hx-red); }
    .pm-log-msg { color: var(--hx-ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* ── Responsive layout ──────────────────────────────────────────────
       The desktop composition above is the canonical two-pane shell. The
       breakpoints below give the design-led example a usable narrow-viewport
       path so it never produces document-level horizontal overflow at
       phone / tablet widths. Everything stays within the
       element box: panes stack, tiles wrap, and the fixed desktop row/log
       tracks collapse to auto-fit content rather than reserving fixed px. */

    /* Tablet and below: drop the two-column shell to a single stacked
       column so the minmax(380px, …) left pane no longer forces a floor
       wider than a narrow viewport. The right (log) pane moves below the
       process pane; the divider becomes a bottom rule. */
    @media (max-width: 900px) {
      .pm-grid {
        grid-template-columns: 1fr;
        grid-auto-rows: minmax(0, auto);
      }
      .pm-pane {
        border-right: 0;
        border-bottom: 1px solid var(--hx-rule-strong);
      }
      .pm-pane:last-child { border-bottom: 0; }
      /* Give each scroll pane a bounded height once stacked so neither
         pane monopolises the viewport. */
      .pm-list, .pm-loglist { max-height: 48vh; }
    }

    /* Narrow phones: wrap the summary tiles to as many equal columns as
         fit (min 8.5em each) instead of forcing five, tighten the shell-head
         padding, and collapse the fixed process/log row tracks so the
         flexible name/message column absorbs the remaining width. */
    @media (max-width: 560px) {
      .pm-shell-head { padding: 1.1em 1em 0.9em; }
      .pm-tiles {
        grid-template-columns: repeat(auto-fit, minmax(8.5em, 1fr));
      }
      .pm-pane-head { padding: 0.8em 1em; flex-wrap: wrap; gap: 0.5em; }
      .pm-row, .pm-log { padding-left: 1em; padding-right: 1em; }
      /* Process rows: explicit two-row template so the six DOM children
         (dot, name, pid, meter, cpu, mem) place deterministically. Row 1
         carries dot + name + pid + cpu + mem; the meter spans the full
         width on row 2. No fixed px tracks remain, so nothing forces the
         row wider than its container. */
      .pm-row {
        grid-template-columns: 12px minmax(0, 1fr) auto auto auto;
        grid-template-areas:
          "dot name pid cpu mem"
          "meter meter meter meter meter";
        column-gap: 8px;
        row-gap: 6px;
      }
      .pm-row > .pm-dot      { grid-area: dot; }
      .pm-row > .pm-row-name { grid-area: name; }
      .pm-row > .pm-row-pid  { grid-area: pid; }
      .pm-row > .pm-row-meter{ grid-area: meter; }
      .pm-row > .pm-row-cpu  { grid-area: cpu; }
      .pm-row > .pm-row-mem  { grid-area: mem; }
      /* Log rows: tick + level + message; the pid is dropped on narrow
         widths and the message keeps the flexible track. */
      .pm-log {
        grid-template-columns: auto auto minmax(0, 1fr);
        column-gap: 8px;
      }
      .pm-log-pid { display: none; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="main.js"></script>
</body>
</html>
