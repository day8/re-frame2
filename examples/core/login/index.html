  <!-- Xray's default launch (Ctrl+Shift+C) mounts INLINE into an
       app-provided layout host — it refuses with :missing-layout-host if the
       page has none, which is what this `[data-rf-xray-host]` aside supplies.
       `--rf-xray-inline-width` is the documented host-resize knob (see
       day8.re-frame2-xray.config/default-layout-host-css-var and
       spec/011-Launch-Modes.md §Resizing the inline host); the drag handle is
       auto-injected. This is the page BOTH login builds serve at `/`: the
       plain `:examples/login` build and the Story showcase
       `:examples/login-with-stories`, whose `#/stories` surface is the same
       page under a hash router and so is served by this very slot. -->
</head>
<body>
  <div class="rf2-testbed-shell">
    <main id="app"></main>
    <aside data-rf-xray-host></aside>
  </div>
  <script src="main.js"></script>
</body>
