<html lang="en">
<head>
  <meta charset="utf-8">
  <title>re-frame2 example: resources SSR + hydration</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1A1814">
  <meta name="description" content="re-frame2 worked example — declarative server-state SSR preload + hydration for the modern Clojure framework.">

  <meta property="og:description" content="re-frame2 worked example — declarative server-state SSR preload + hydration for the modern Clojure framework.">

<body>
  <!--
    The <div id="app"> below was "produced server-side" — this static
    index.html is the runnable companion to resources_ssr/core.cljc and
    stands in for what `handle-request` (:clj branch) emits when a real
    Clojure server is in front. The `<script id="__rf_payload">` block
    carries the serialised hydration payload.

    The load-bearing detail vs the plain `ssr/` example: the page's
    server-state rides `:rf/runtime-db` as a RESOURCE projection under
    `:rf.runtime/resources :entries`. Each entry is MAP-KEYED by its CEDN-1
    byte `key-id` — `(state/key-id [<scope> <resource-id> <canonical-params>])`,
    the string `"v[k::rf.scope/global k::articles/list m{}]"` below — and
    carries the canonical scoped key vector `[<scope> <resource-id>
    <canonical-params>]` as its own `:resource/key`. Byte key-id = storage
    identity (what public reads look up under); `:resource/key` = the scoped
    resource fact (what the reverse indexes and refetch plan re-key from). It
    is NOT an app-db value. This is exactly the shape
    `payload-policy/project-runtime-db` emits in `handle-request`: only the
    durable `:entries` are serialized; the `:tag-index` / `:owner-index` are
    EXCLUDED (recomputed from `:entries` on install — Spec 016 §SSR / §Restore
    part 5), `:current-work` is stripped on the wire, and host handles never
    serialize. On hydration the framework `:rf/hydrate` installs this projection
    into the client frame's runtime partition; the reconcile orphans the
    `[:ssr …]` SSR owner + recomputes the indexes. That leaves the entry
    renderable but held by nothing, so `run` then dispatches
    `:resources-ssr.app/page-opened` to take the client's own hold — which
    for this fresh entry is a cache hit: the owner attaches, the timers arm,
    and no request is issued.

    Freshness: this article list declares NO time-based staleness policy
    (`:articles/list` omits `:stale-after-ms`), so its entry never ages out on
    a timer and the baked `:stale-at` is nil. That keeps this offline fixture
    deterministically fresh indefinitely — no rebased clock, no rotting
    absolute deadline — with explicit invalidation as the real freshness
    authority. So the hydrated entry is fresh, the client's page-opened
    `ensure` fresh-skips, and no request leaves the browser — which is what
    lets this static fixture run with no server behind it.

    The `#app` subtree is the dev-build output of `rf/render-to-string` — the
    same string `handle-request` inlines, minus the `data-rf-render-hash`
    attribute (this offline stand-in bakes `:rf/render-hash nil` below, so
    neither the wire hash nor its DOM twin appears). In a dev build the reg-view
    REGISTRATION boundary stamps two annotations on every registered view's root
    DOM element (Spec 006 §Source-coord annotation / §View tagging contract,
    moved cross-host to the reg-view boundary by rf2-8vi4q): the
    `:pages/articles` view's `<div class="page">` root carries
    `data-rf2-source-coord="pages:articles:165:1"` (its `<ns>:<sym>:<line>:<col>`
    reg-view call site) and `data-rf-view=":pages/articles"`, so pair-shaped
    tooling can map the node back to its view. The client's dev render stamps
    the SAME two attributes, so this page hydrates as a clean ADOPTION rather
    than an attribute mismatch. `:app/root` renders `[(rf/view :pages/articles)]`
    — a callable head, not a DOM element — so it contributes no wrapper node and
    no annotation of its own. A production build (`goog.DEBUG=false` /
    `re-frame.debug=false`) elides the annotations on both hosts, so prod markup
    is attribute-free.
  -->
  <div id="app"><div class="page" data-rf2-source-coord="pages:articles:165:1" data-rf-view=":pages/articles"><h1>Recent articles</h1><ul data-testid="articles-list"><li data-testid="article-welcome">Welcome to re-frame2</li><li data-testid="article-resources">Server-state as resources</li></ul></div></div>
  <script id="__rf_payload" type="application/edn">
{:rf/version 1
 :rf/frame-id :rf/default
 :rf/app-db {}
 :rf/runtime-db
 {:rf.runtime/resources
  {:entries
   {"v[k::rf.scope/global k::articles/list m{}]"
    {:resource/key   [:rf.scope/global :articles/list {}]
     :resource/id    :articles/list
     :status         :loaded
     :data           [{:slug "welcome"   :title "Welcome to re-frame2"}
                      {:slug "resources" :title "Server-state as resources"}]
     :error          nil
     :loaded-at      1780752000000
     :stale-at       nil
     :invalidated-at nil
     :generation     1
     :active-owners  #{[:ssr :ssr/req-1 :ssr/nav-1]}
     :tags           #{[:article-list]}}}}}
 :rf/render-hash nil}
  </script>
  <script src="main.js"></script>
</body>
</html>
