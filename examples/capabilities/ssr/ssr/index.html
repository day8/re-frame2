<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>re-frame2 example: SSR + hydration</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1A1814">
  <meta name="description" content="re-frame2 worked example — examples for the modern Clojure framework.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="re-frame2 example: SSR + hydration">
  <meta property="og:description" content="re-frame2 worked example — examples for the modern Clojure framework.">
  <meta property="og:image" content="_shared/img/og.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/svg+xml" href="_shared/img/favicon.svg">
  <link rel="stylesheet" href="_shared/css/style.css">
</head>
<body>
  <!--
    The contents of <div id="app"> below were "produced server-side" — this
    static index.html is the runnable companion to ssr/core.cljc and stands
    in for what `handle-request` (in core.cljc, :clj branch) would emit if a
    real Clojure server were sitting in front. The corresponding
    `<script id="__rf_payload">` block immediately below carries the
    serialised frame state; the client `run` reads it, dispatches
    `:rf/hydrate` (replace-frame-state semantics, Spec 011), and renders
    against the now-seeded state.

    The #app subtree is the dev-build output of `ssr/render-to-string` — the
    same string `handle-request` inlines. In a dev build the reg-view REGISTRATION boundary stamps two
    annotations on every registered view's root DOM element (Spec 006
    §Source-coord annotation / §View tagging contract): the `:ssr.app/root` view's
    `<div class="page">` root carries
    `data-rf2-source-coord="ssr.app:root:245:1"` (its `<ns>:<sym>:<line>:<col>`
    reg-view call site) and `data-rf-view=":ssr.app/root"`, so pair-shaped
    tooling can map the node back to its view. The client's dev render stamps
    the SAME two attributes, so this page hydrates as a clean ADOPTION rather
    than an attribute mismatch. That `<line>` is a SNAPSHOT of the call site:
    move the `reg-view` in core.cljc and this page must be re-baked, or the
    adoption stops being clean. A production build (`goog.DEBUG=false` /
    `re-frame.debug=false`) elides the annotations on both hosts, so prod markup
    is attribute-free.

    Edit this markup so its text differs from what the client renders and the
    adopting root reports :rf.ssr/hydration-mismatch (Spec 011
    §Hydration-mismatch detection): React re-renders the part it could not
    adopt. An attribute-only edit is not reported; React's development
    console.error is the only signal for it.
  -->
  <div id="app"><div class="page" data-rf2-source-coord="ssr.app:root:245:1" data-rf-view=":ssr.app/root"><h1>Recent articles</h1><button class="toggle-bodies" data-testid="toggle-bodies">Hide bodies</button><ul data-testid="articles-list"><li><h3>Article A</h3><p class="body" data-testid="article-body">Body A</p></li><li><h3>Article B</h3><p class="body" data-testid="article-body">Body B</p></li></ul></div></div>
  <script id="__rf_payload" type="application/edn">
{:rf/version 1
 :rf/app-db {:articles [{:id "a" :title "Article A" :body "Body A"}
                        {:id "b" :title "Article B" :body "Body B"}]}
 :rf/runtime-db {:rf.runtime/routing {:current {:route-id :ssr.app/articles :params {}}}}}
  </script>
  <script src="main.js"></script>
</body>
</html>
