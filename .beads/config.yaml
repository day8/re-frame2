# Beads Configuration File
# This file configures default behavior for all bd commands in this repository
# All settings can also be set via environment variables (BD_* prefix)
# or overridden with command-line flags

# Issue prefix for this repository (used by bd init)
# If not set, bd init will auto-detect from directory name
# Example: issue-prefix: "myproject" creates issues like "myproject-1", "myproject-2", etc.
#
# PINNED (rf2-cchlf). Every bead id in this repo is `rf2-*` — in the tracker,
# in commit messages, in PR titles and in spec cross-references. The live value
# has until now existed ONLY in the Dolt database, so a rebuild from the
# git-tracked .beads/issues.jsonl (the documented bd bootstrap fallback and our
# accepted recovery floor, rf2-4l67v) would auto-detect the prefix from the
# DIRECTORY name and come up "re-frame2". Pinning it here makes the recovery
# path reproduce the ids we already have. Do not change this value.
issue-prefix: "rf2"
sync:
    remote: "https://github.com/day8/re-frame2-beads.git"

# Custom issue statuses (status.custom) — DELIBERATELY NONE (rf2-gtynf).
#
# Exactly like issue-prefix above, status.custom lives ONLY in the Dolt database
# and never in this file. So a fresh clone bootstrapping from the tracked
# .beads/issues.jsonl has no custom statuses, and `bd bootstrap --yes` REJECTS
# any exported row that carries one:
#   Bootstrap failed: import from JSONL: validation failed for <id>: invalid status: in_review
# That broke the recovery floor (rf2-4l67v) once already, via `in_review`: a
# status whose workflow class was [unspecified], so every class-driven view
# skipped it and eight beads sat invisible for ~7 weeks before being closed.
#
# RULE: a custom status must be bootstrap-safe, and none is introduced without a
# producer, a consumer/sweep, and an exit transition. Until a review state has
# all three, review-gated beads stay `open` with a label, where `bd ready` keeps
# them visible. Every bead is either visible or closed.
#
# WARNING: `bd config unset status.custom` does NOT retire a status. It reports
# "Unset status.custom" and `bd config get` then reads "(not set)", but
# `bd statuses` still lists the status and beads can still be moved into it. The
# clearing that actually takes is the empty assignment:
#   bd config set status.custom ""

# Use no-db mode: JSONL-only, no Dolt database
# When true, bd will use .beads/issues.jsonl as the source of truth
# no-db: false

# Enable JSON output by default
# json: false

# Feedback title formatting for mutating commands (create/update/close/dep/edit)
# 0 = hide titles, N > 0 = truncate to N characters
# output:
#   title-length: 255

# Default actor for audit trails (overridden by BEADS_ACTOR or --actor)
# actor: ""

# Export events (audit trail) to .beads/events.jsonl on each flush/sync
# When enabled, new events are appended incrementally using a high-water mark.
# Use 'bd export --events' to trigger manually regardless of this setting.
# events-export: false

# Multi-repo configuration (experimental - bd-307)
# Allows hydrating from multiple repositories and routing writes to the correct database
# repos:
#   primary: "."  # Primary repo (where this database lives)
#   additional:   # Additional repos to hydrate from (read-only)
#     - ~/beads-planning  # Personal planning repo
#     - ~/work-planning   # Work planning repo

# JSONL backup (periodic export for off-machine recovery)
# Auto-enabled when a git remote exists. Override explicitly:
# backup:
#   enabled: false     # Disable auto-backup entirely
#   interval: 15m      # Minimum time between auto-exports
#   git-push: false    # Disable git push (export locally only)
#   git-repo: ""       # Separate git repo for backups (default: project repo)

# Integration settings (access with 'bd config get/set')
# These are stored in the database, not in this file:
# - jira.url
# - jira.project
# - linear.url
# - linear.api-key
# - github.org
# - github.repo
